<style>:root{--brown:#7B4B2A;--brown-dk:#5E3920;--green:#2E7D4F;--green-dk:#226040;--cream:#FBF7F2;--sand:#F1E8DD;--ink:#2B2320;--muted:#6B5F58;--line:#E3D7C9;--gold:#C9A227;--night:#141010;--night2:#1f1816;--red:#B23A3A}

label{display:block;font-weight:700;margin:12px 0 4px;color:var(--brown-dk)}
input[type=text],input[type=email],input[type=date],select{width:100%;padding:.7rem .8rem;border:2px solid var(--line);border-radius:10px;font-size:1rem;font-family:inherit;background:#fff;color:var(--ink)}

<script>const SCENES=[{"id": "h1_1", "ch": 1, "chTitle": "Why This Matters", "ref": "DFPS Universal HT Prevention Training", "title": "The Brooks Family", "narr": "Welcome to Benevolent House. This is the Universal Human Trafficking Prevention Training, built on the curriculum the Texas Department of Family and Protective Services wrote for every residential provider and caregiver in Texas. It meets the human trafficking requirement for Texas Child-Centered Care. Over the next two hours you will spend time with one Benevolent House foster family. Denise and Marcus Brooks have three children in their care: Mia, who is five, Jayden, who is ten, and Destiny, who is fifteen. Three ages, three very different conversations. By the end, you will be able to name the different types of trafficking, explain what makes children in foster care vulnerable to traffickers, name at least three ways to build a child's resilience, and talk with a child of any age about staying safe. The names in this course are fictional. What you learn is real, and it is happening in Texas."}, {"id": "h1_2", "ch": 1, "chTitle": "Why This Matters", "ref": "Self-care", "title": "Before we begin", "narr": "Human trafficking is a hard subject. It can be shocking, and it is hard to accept that it happens in our own communities, sometimes to children we know. As you go through this training, you may hear things that make you uncomfortable. That is normal. If you feel more than discomfort, if you start to feel angry or upset, pause the course. Step away, get some water, take a few slow breaths, and come back when you are ready. Your place is saved. If something here brings up your own history, please reach out to your case manager or someone you trust. Taking care of yourself is part of taking care of the children in your home. One more thing before we start: at the end there is a short knowledge check from the state's curriculum, eleven questions. You need nine correct to earn your certificate, and you can try again if you need to."}, {"id": "h2_1", "ch": 2, "chTitle": "Trafficking or Smuggling?", "ref": "Slides 8 to 11", "title": "Two different crimes", "narr": "Denise is watching the evening news when a story comes on about people found in a tractor-trailer near San Antonio. The reporter calls it trafficking. Is it? People often mix up human trafficking and human smuggling, and the news is one of the biggest sources of the confusion. They are two different crimes, and the words are not interchangeable. Smuggling is a crime against a nation's border. It is about transportation: bringing people into the country while deliberately getting around immigration law, or moving and hiding people who are already here without legal status. You may remember June of 2022, when fifty-one people who had been smuggled from Mexico, Guatemala, and Honduras were found dead in an abandoned trailer in San Antonio. That was smuggling. Trafficking is a crime against a person. It is about exploitation, using someone for sex or labor. And the two can overlap. A person who was smuggled can also be trafficked, before the trip, during it, or after they arrive."}, {"id": "h2_2", "ch": 2, "chTitle": "Trafficking or Smuggling?", "ref": "Slide 10", "title": "Force, fraud, or coercion", "narr": "Trafficking has two main forms. Sex trafficking is when a commercial sex act is exchanged for something of value. That value is often not money. It can be a meal, a ride, or a safe place to sleep for the night. Labor trafficking is when someone is made to work or provide services, without fair pay, through force, fraud, or coercion. Force means physical abuse, sexual assault, or locking someone in. Fraud means false promises, withheld wages, or a job that is not what was advertised. Coercion means threats, psychological manipulation, or taking away someone's identification documents. Here is the rule to remember. For adults, both sex trafficking and labor trafficking require force, fraud, or coercion. For labor trafficking, force, fraud, or coercion must be present, no matter how old the victim is. Children can work legally, in movies, in commercials, in a family business. But for sex trafficking, if the person is under eighteen, they are a victim, whether or not force, fraud, or coercion is present. A child cannot consent to being sold."}, {"id": "h2_3", "ch": 2, "chTitle": "Trafficking or Smuggling?", "ref": "Slide 12", "title": "Faces of human trafficking", "narr": "Now you will watch a short video that the state's curriculum uses to introduce trafficking. Survivors describe what happened to them in their own words. As you watch, notice who the traffickers were, how each survivor was controlled, and why they did not simply leave or ask for help. Some things the trainers want you to take from it: there is no single profile of a trafficking victim. Victims are boys and girls, men and women, citizens and immigrants, from poor families and comfortable ones. Traffickers can be anyone, including a husband, a parent, or an employer. Control can be physical or emotional, and it often includes threats against a victim's family. Freedom of movement does not mean freedom of choice. A person can walk to the store and still not be free to leave. And most victims do not call themselves victims, which is why the adults around them need to know the signs."}, {"id": "h3_1", "ch": 3, "chTitle": "Many Faces of Trafficking", "ref": "Slides 13 and 14", "title": "Types of labor trafficking", "narr": "Polaris, the organization that runs the National Human Trafficking Hotline, has identified twenty-five types of trafficking in the United States, by setting: escort services, illicit massage businesses, bars and cantinas, domestic work, restaurants, construction, agriculture, traveling sales crews, hotels, carnivals, health care, and more. Some are labor trafficking, some are sex trafficking, and some are both. The state's curriculum focuses on five widely accepted types of labor trafficking, and a victim may live through more than one. Forced criminality is when a trafficker makes the victim commit crimes, like theft, selling drugs, or recruiting other victims. Involuntary servitude is when someone believes they took a real job, then finds they are trapped by threats of harm. Peonage is labor bound by debt or a system of convict labor. Debt bondage is when a person works to pay off a debt that never ends, because the trafficker keeps charging for rent, food, even a toothbrush. And slavery is complete control by another person."}, {"id": "h3_2", "ch": 3, "chTitle": "Many Faces of Trafficking", "ref": "Slide 15", "title": "Types of sex trafficking", "narr": "There are also different types of sex trafficking. No-broker trafficking, sometimes called survival sex, is when a young person trades their body directly for basic needs, like food, a place to stay, or clothing. There is no third person, but it is still trafficking when the person is a minor. Third-party trafficking is when someone controls the victim and arranges the encounters. Professionals have moved away from the word pimp, because popular culture has made it sound glamorous. A common third-party trafficker is the Romeo, also called the boyfriend or lover-boy trafficker. Romeo traffickers are patient. They make the victim feel loved, seen, and wanted, promise to take care of everything, and build a loyalty that keeps the victim from leaving. Gang trafficking treats people as a product, like drugs or weapons. Organized crime runs trafficking as a structured business, through brothels, massage parlors, and webcam operations. And familial trafficking is when a family member exploits a child for something of value, very often to pay for that adult's addiction."}, {"id": "h4_1", "ch": 4, "chTitle": "What Traffickers Look For", "ref": "Slides 16 to 18", "title": "Everyone has vulnerabilities", "narr": "What makes one child more open to a trafficker's manipulation than another? Every adult taking this training shares two things. We all have vulnerabilities. And we have enough life experience to recognize when something is too good to be true. Children do not have that experience yet. Traffickers are charming, patient, and very good listeners. They listen to what a young person says, and to what they do not say, and they find the need. Then they offer to fill it. What they usually offer is the illusion of love, belonging, safety, and acceptance. Anyone of any background can be targeted. But some experiences raise the risk: childhood abuse or neglect, especially sexual abuse. Involvement in foster care or juvenile justice. Homelessness or couch surfing. Surviving violence. Being LGBTQ and lacking family support. Being a migrant worker or undocumented. Poverty. Substance use, either the young person's or a caregiver's. In familial trafficking, research shows the most common motive is the adult's need for drugs."}, {"id": "h4_2", "ch": 4, "chTitle": "What Traffickers Look For", "ref": "Slide 19", "title": "The making of a girl", "narr": "The next video in the state's curriculum is called The Making of a Girl. A survivor describes, step by step, how her life prepared her for the night she met her trafficker. As you watch, listen for what made her vulnerable, what kind of trafficker he was, and exactly what he said and did to use those vulnerabilities. Here is what the trainers point out. She was twelve. Her mother was a single parent who was struggling. Sexual abuse had become normal to her. She had tried to tell someone at school, and no one really heard her. Then a good-looking man with a nice car told her she was pretty. For the first time in a long time, someone noticed her. He asked about her hopes and dreams. When he learned her father was not around, he said he could be a daddy to her. That is a third-party, Romeo trafficker using a parental figure strategy. By the end, she felt this was the best she was ever going to get."}, {"id": "h4_3", "ch": 4, "chTitle": "What Traffickers Look For", "ref": "Slides 20 to 23", "title": "Why foster care raises the risk", "narr": "Involvement in the child welfare system is on every trafficking red-flag list. That includes Destiny, Jayden, and Mia. Here is why. The most common risk factor of all is childhood abuse and neglect. Abuse can push a young person to run away, and a child on the street is exposed. Some survivors of sexual abuse sell sex to try to regain control over their own bodies. Abuse also leads to risky coping, like drugs or alcohol, and to high-risk relationships. Then the system itself adds risk. Children come into care because of abuse that was found, abuse that was never found, and the loss of their bond with a parent. Foster care cannot fully replace that bond, no matter how loving the home. Multiple placements mean new schools, new rules, and new adults, and each move deepens the sense of instability. Some children run, and the top reasons Texas youth give are wanting to be on their own, anger at the system, and disliking placement rules. And some youth normalize unhealthy relationships because it is all they have ever known."}, {"id": "h5_1", "ch": 5, "chTitle": "Traffickers, Recruiters, and Buyers", "ref": "Slides 24 to 26", "title": "Who are they?", "narr": "Traffickers are as diverse as the people they exploit. They are individuals and business owners, gang members, intimate partners, farm and restaurant owners, executives, and parents. Many people find it hard to believe that women traffic, but they do. In familial trafficking, research has found the most common trafficker is the child's biological mother. A recruiter's job is to find victims. Recruiters look for young people with low self-esteem, a history of abuse, a history of running away, or unsupervised internet access, and they look where youth are unsupervised: malls, parks, bus stops, youth shelters, and online. Under the law, a recruiter is guilty of trafficking even if they never sell anyone. Buyers drive the demand. They are ordinary men and women, a coworker, a doctor, a pastor, a neighbor. Many tell themselves it is a victimless crime. It is never victimless. Trafficking is a business of supply and demand, with victims as the supply, buyers as the demand, and traffickers in the middle. The next video, from the organization Unbound Now, walks through real Texas cases."}, {"id": "h5_2", "ch": 5, "chTitle": "Traffickers, Recruiters, and Buyers", "ref": "Slides 27 to 31", "title": "How it happens", "narr": "Trafficking is not one event. It unfolds over time, and the steps blur together. Polaris describes the pattern this way: target the victim, gain trust, meet needs, isolate, exploit, and maintain control. It is all about relationships. A trafficker may pose as a boyfriend or girlfriend, a parent figure, a friend, or an employer with a great job offer. In peer recruitment, a friend who is already in the life brings someone else in. In familial trafficking, the abuser is both protector and predator, and the grooming happens through the ordinary process of a child growing up and attaching to family. Successful grooming ends with the victim cooperating in their own exploitation and believing they chose it. Once a trafficker has control, they keep it with the tactics on the Power and Control Wheel: intimidation, emotional abuse, physical and sexual violence, isolation, financial control, threats against family, and technology. This is why victims rarely see themselves as victims. They believe they are in a relationship."}, {"id": "h5_3", "ch": 5, "chTitle": "Traffickers, Recruiters, and Buyers", "ref": "Slides 32 to 34", "title": "Anywhere and everywhere", "narr": "Technology has changed trafficking. Traffickers find and groom victims through social media, games, and messaging apps. They use phones to track where a victim is and to control them with threats to share pictures. They advertise, arrange meetings, and move money, all on a phone. Some create child sexual abuse material, photos, videos, and live streams, as both a means of control and a source of income, and this is especially common in familial trafficking. A trafficker, a victim, and a buyer can be in three different places, even three different countries. So where is trafficking happening? Anywhere and everywhere. In small rural towns, where isolation and limited services keep victims unseen. In big cities, where victims are hidden in the crowd. In clubs, parties, truck stops, hotels, cafes, cars, churches, online, and in a child's own home. For the rest of this course, we turn from understanding the problem to preventing it, and the good news is that most of prevention is what good caregivers already do."}, {"id": "h6_1", "ch": 6, "chTitle": "Building Resilience", "ref": "Slides 35 to 37", "title": "Survivor-centered, trauma-informed", "narr": "There are three levels of prevention. Primary prevention keeps a child from ever being trafficked. Secondary prevention stops trafficking that has already started. Tertiary prevention keeps a survivor from being trafficked again. Whatever the level, two principles guide everything. Be survivor-centered: value the whole person, find out what they want and need, and include their voice in decisions. A teenage mother leaving her trafficker may care most about keeping her baby, a safe bed, and food, not what the professionals think comes first. Meeting her needs weakens the trafficker's hold. Be trauma-informed: meet the child where they are, calmly. On a hard day, that can sound like, what can we do today? Then think about Maslow's hierarchy of needs. Food, water, sleep, and safety have to come before belonging, confidence, and growth. As caregivers, Denise and Marcus own that bottom layer. When those needs are met reliably, a child has less reason to look for someone else to meet them, and becomes far less attractive to a trafficker."}, {"id": "h6_2", "ch": 6, "chTitle": "Building Resilience", "ref": "Slides 38 to 40", "title": "PACEs: relationships and resources", "narr": "You may have heard of ACEs, adverse childhood experiences such as abuse, neglect, and household chaos, which raise the risk of lifelong health problems. Researchers then found that protective and compensatory experiences, called PACEs, can soften the effect of a high ACE score. There are ten. Five are relationships: a parent or caregiver's unconditional love, a best friend, volunteering or helping others, a mentor outside the family, and being active in a social group. Five are resources: a clean, safe home with enough food, chances to learn, sports or physical activity, a hobby, and routines with fair rules at home. Relationships tell a child they are valued. Resources let them build skills and an identity beyond what happened to them. Relationships and resources strengthen resiliency and reduce the likelihood of further abuse or neglect, and children with high PACEs are less attractive to traffickers. So Marcus signs Jayden up for soccer, Denise helps Destiny find a volunteer spot at the animal shelter, and Mia gets a bedtime routine she can count on."}, {"id": "h7_1", "ch": 7, "chTitle": "Talking With Kids", "ref": "Slide 41", "title": "Mia, age five", "narr": "Prevention conversations look different at every age. For children from birth to six, like Mia, start with a trusting relationship and a secure attachment. There is a difference between a place being safe and a child feeling safe there. Teach body safety using the correct names for body parts, so a child can tell you clearly if something happens. Role play can help: what would you do if someone tried to touch you here? Model boundaries, and let children set their own. Do not make Mia hug or kiss a relative at the holiday party if she does not want to. That teaches her that her body belongs to her. Be careful with telling children only to say no and run, because many children are taught to obey adults, and that is a lot of pressure. Practice self-care like brushing teeth and bathing, which builds self-respect. When she says something is not fair, validate the feeling and help her handle it. And teach that there are no set roles for boys and girls, because traffickers can be any gender, age, or race."}, {"id": "h7_2", "ch": 7, "chTitle": "Talking With Kids", "ref": "Slide 42", "title": "Jayden, age ten", "narr": "Research shows the most common age for entering trafficking is fourteen, and service providers have children as young as ten on their caseloads. So with children seven to twelve, like Jayden, start talking about the signs. If anyone, a relative, a friend, or a stranger, asks him to keep a secret, that is a red flag. A surprise, like a birthday present, is different from a secret. Explain that some people will want something from him, and promises of gifts or love that seem too good to be true are a reason to talk to a trusted adult. Move from naming body parts to puberty and healthy friendships: respect, kindness, and the courage to say no. Teach internet and gaming safety now, openly and on purpose: keep personal information private, know the difference between online friends and real friends, and know who to tell when a stranger reaches out, because it will happen. Talk about positive and negative peer pressure. And teach fair labor: chores and an allowance, or a visit to your workplace, show that work should be safe and fairly paid."}, {"id": "h7_3", "ch": 7, "chTitle": "Talking With Kids", "ref": "Slide 43", "title": "Destiny, age fifteen", "narr": "Teens from thirteen to eighteen, like Destiny, are building independence, so the conversations change. Keep talking about manipulation, especially an adult who romances them with love, gifts, and promises of money. Talk about her friends' relationships, which often opens the door to her own. When she gets her first job, talk about fair wages, her right to quit, and the signs of labor trafficking. Continue internet safety, now including sextortion: someone gets a sexual picture, then demands money or more pictures to keep it from being shared. Make sure she knows she can come to you, and that she will not be in trouble for asking for help. Support a healthy body image, because confidence protects against false flattery. Talk about healthy relationships: open communication, respect, time for her own interests, no violence, no fear, and consent for anything sexual. No one should ever ask her to prove her love. Teach money skills like budgeting, saving, and the difference between checking and savings, because easy money is one of a trafficker's best lures. And keep helping her with peer pressure. If something does not feel right, it usually is not."}, {"id": "h7_4", "ch": 7, "chTitle": "Talking With Kids", "ref": "Slides 44 and 45", "title": "How to talk, and teachable moments", "narr": "At every age, the most important thing is a trusting, safe place for questions, so a child comes to you instead of a peer or someone who means them harm. Talk about exploitation in simple terms: what it feels like to be taken advantage of, and what to do about it. Build protective factors: self-worth, future goals, and celebrating progress. Use a strengths-based approach. A young survivor who is called manipulative is also a strong self-advocate, and that skill can be channeled toward her goals. Use relatable language. Leave words like coercion and power and control wheel for training rooms. And look for everyday teachable moments, which teach more than any lecture. When Mia takes Jayden's half of a cookie, Jayden learns his feelings are valid and Mia learns she damaged a relationship. When Jayden mentions a new gaming friend called Shadow Ninja, Denise talks about the difference between Shadow Ninja and his friend Sam from kindergarten. And when Destiny describes a friend's boyfriend backing her against a wall after the game, that is a conversation about dating violence and how to be a good friend."}, {"id": "h8_1", "ch": 8, "chTitle": "When a Child Tells You", "ref": "Slide 46", "title": "Handling an outcry", "narr": "When a child trusts you, you may be the person they choose to tell. That is an honor. Out of everyone in their life, they chose you. Here is how to respond. Support the child and never blame them. Blame can make a child doubt what happened and stop asking for help. Find a private, comfortable place where no one can overhear. Stay calm, supportive, and non-judgmental, and watch your face and body language, because they speak too. Listen actively with phrases like, help me understand, or, tell me more. Do not assume, and ask follow-up questions only when you need to understand. Remember your role is caregiver, not investigator. You need enough to keep the child safe and make the report. Afterward, write down exactly what the child said, in their own words, even if they did not use the correct terms. And do not make promises you cannot keep, including keeping it a secret. Tell the child honestly that you have to report it, and that you will be with them through what comes next."}, {"id": "h8_2", "ch": 8, "chTitle": "When a Child Tells You", "ref": "Slides 47 and 48", "title": "Reporting and next steps", "narr": "After an outcry of abuse, you must report it. Follow the Minimum Standards, your contract, and Benevolent House procedures. Call the Texas Abuse Hotline, DFPS Statewide Intake, at 1-800-252-5400, yourself, right away. Then notify Benevolent House at any hour. If a child is in immediate danger, call 911. A good rule of thumb: if the child is about to leave your care and be back around the person who hurt them, call 911. Throughout this course you have heard how dangerous it is when a child goes missing. If any child in your care is missing, follow your runaway plan and the Benevolent House serious incident procedures, and report it. Your handouts include the state's Prevention and Awareness Resource Guide, a guide to talking with youth about trafficking, a guide to handling disclosures, a mandatory reporting sheet, and the DFPS Runaway Prevention Resource Guide. Children with a history of abuse and neglect are at greater risk. We want them to know that we see them, hear them, and believe in them, from the time they are little until the day they leave our care."}, {"id": "h8_3", "ch": 8, "chTitle": "When a Child Tells You", "ref": "Slides 48 to 51", "title": "Your handouts and your questions", "narr": "Before the knowledge check, take a few minutes with your handouts. Open each one. The Prevention and Awareness Resource Guide has age-by-age ideas you can use this week. The guide to talking with youth gives you words for hard conversations. The disclosure and mandatory reporting sheets are worth printing and keeping near the phone. And the Runaway Prevention Resource Guide will help you plan with any child who has run before. Then tell us how this training went for you, and write down any question you still have. Your trainer for this course is Haddie Mashburn, a Benevolent House trainer who completed the state's train-the-trainer course. Your answers are saved with your training record, and Benevolent House will follow up on your questions. Any opinions shared in this course are the trainer's own and do not necessarily represent the Department of Family and Protective Services. Thank you for the work you do. The children in your home are safer because you took the time to learn this."}];
const QUIZ=[{"q": "Which of the following statements is true?", "a": ["Trafficking and smuggling can be used interchangeably", "Smuggling always precedes trafficking", "Trafficking and smuggling are distinct criminal activities, and the terms are not interchangeable", "None of the above"], "k": 2, "ref": "Chapter 2"}, {"q": "Regardless of the age of the victim, force, fraud, or coercion must be present for which type of trafficking?", "a": ["Sex trafficking", "Sex and labor trafficking", "Labor trafficking", "Human trafficking"], "k": 2, "ref": "Chapter 2"}, {"q": "Which type of trafficking involves someone who uses violence, force, or love as the main tactic to control their victims?", "a": ["3rd party trafficking", "Labor trafficking", "Gang trafficking", "Organized crime"], "k": 0, "ref": "Chapter 3"}, {"q": "Which of the following is not a common vulnerability for trafficking?", "a": ["Homelessness or unstable living situation", "Survivors of violence", "Caregivers with substance abuse issues", "Strong social supports"], "k": 3, "ref": "Chapter 4"}, {"q": "Children and youth with a history of involvement with child welfare or the juvenile justice system are at greater risk of being trafficked. Which of the following is one reason for this?", "a": ["The most common risk factor is childhood abuse and neglect", "Children often fall through the cracks of these systems", "Children and youth in juvenile detention are safe from traffickers", "None of the above"], "k": 0, "ref": "Chapter 4"}, {"q": "Involvement with the child welfare system itself can create risk for trafficking. Which of the following are risk factors created by child welfare involvement?", "a": ["Multiple placements", "Normalized unhealthy, high-risk relationships", "Both A and B", "None of the above"], "k": 2, "ref": "Chapter 4"}, {"q": "Which of the following are ways providers and caregivers can increase resiliency in children and youth?", "a": ["Allow the child or youth to spend time with their best friend", "Allow the child or youth to volunteer in their community", "Keep the child or youth away from anyone the caregivers do not know", "All of the above", "Both A and B"], "k": 4, "ref": "Chapter 6"}, {"q": "Which words best complete the sentence: ____ and ____ strengthen resiliency and reduce the likelihood of being victim to abuse and neglect.", "a": ["Hope and dreams", "Relationships and resources", "Hope and relationships", "Resources and dreams"], "k": 1, "ref": "Chapter 6"}, {"q": "Prevention efforts for sex trafficking regarding internet and social media safety should be overt and intentional with what age group(s)?", "a": ["0 to 7 years old", "8 to 12 years old", "13 to 18 years old", "Both B and C"], "k": 3, "ref": "Chapter 7"}, {"q": "Which of the following is necessary when talking with children and youth regarding sex trafficking?", "a": ["Creating a trusting and safe place for questions", "Having diagrams and examples to illustrate the process of trafficking", "Using videos on the dangers of sex trafficking", "None of the above"], "k": 0, "ref": "Chapter 7"}, {"q": "True or false: One way to implement human trafficking prevention with the children you serve is through everyday teachable moments.", "a": ["True", "False"], "k": 0, "ref": "Chapter 7"}];
const ACK="I completed the Universal Human Trafficking Prevention Training. I received the course handouts, including the DFPS Prevention and Awareness Resource Guide and the Runaway Prevention Resource Guide. I understand the types of trafficking, the vulnerabilities traffickers use, how child welfare involvement can increase risk, ways to build resilience and protective factors, how to talk with children of different ages, and that I must report suspected abuse, neglect, or trafficking right away to the Texas Abuse Hotline at 1-800-252-5400 and to Benevolent House.";
const COURSE={"title": "Universal Human Trafficking Prevention Training", "code": "HT", "renewMonths": 12, "hours": 2, "trainer": "Haddie Mashburn", "letters": true, "basis": "DFPS Universal Human Trafficking Prevention Training: A Foundation for Texas Residential Providers and Caregivers (Version 1.0, 2024), delivered by a DFPS-trained Benevolent House trainer", "subtitle": "Universal Human Trafficking Prevention", "hero": "The Brooks Family", "blurb": "Spend time with one Benevolent House foster family and three children, ages five, ten and fifteen. Learn how trafficking works, why children in foster care are targeted, and what you can do at every age to keep them safe. About two hours with the videos, activities and knowledge check. Narrated, with captions. Stop any time; your place is saved.", "heroImg": "s_h1_1", "qrefImg": "s_h8_2", "qrefChip": "Before the Knowledge Check", "seal": "BENEVOLENT<br>HOUSE<br>HT<br>CERTIFIED", "passMark": 9, "chapters": [["Why This Matters", "1"], ["Trafficking or Smuggling?", "2"], ["Many Faces of Trafficking", "3"], ["What Traffickers Look For", "4"], ["Traffickers, Recruiters, and Buyers", "5"], ["Building Resilience", "6"], ["Talking With Kids", "7"], ["When a Child Tells You", "8"], ["Certified", "9"]], "icons": {"1": "\ud83c\udfe0", "2": "\u2696\ufe0f", "3": "\ud83e\udde9", "4": "\ud83d\udd0d", "5": "\ud83d\udcf1", "6": "\ud83c\udf31", "7": "\ud83d\udcac", "8": "\ud83e\udd1d", "9": "\ud83c\udfc5"}, "covers": ["Types of trafficking", "Vulnerabilities and the child welfare system", "Traffickers, recruiters, buyers and the grooming process", "Resilience and protective factors (PACEs)", "Age-appropriate conversations, birth to 18", "Handling an outcry and reporting"], "roles": ["Foster Caregiver", "Kinship Caregiver", "Adoptive Parent", "Foster and Adoptive Caregiver", "Staff", "Contracted Provider"], "openers": {}, "qrefHtml": "<h3>Trafficking or smuggling</h3><p><b>Smuggling</b> is a crime against a border: moving people into or within the country in violation of immigration law. <b>Trafficking</b> is a crime against a person: exploitation for sex or labor. A smuggled person can also be trafficked.</p>\n<h3>Force, fraud, or coercion</h3><ul><li><b>Labor trafficking:</b> force, fraud, or coercion must be present, at any age.</li><li><b>Sex trafficking:</b> anyone under 18 is a victim, with or without force, fraud, or coercion.</li></ul>\n<h3>Types</h3><p><b>Labor:</b> forced criminality, involuntary servitude, peonage, debt bondage, slavery. <b>Sex:</b> no broker (survival sex), third party (including the Romeo or boyfriend trafficker), gang, organized crime, familial.</p>\n<h3>The process</h3><p>Target the victim, gain trust, meet needs, isolate, exploit, maintain control. Victims usually believe they are in a relationship.</p>\n<h3>Why children in foster care are at higher risk</h3><p>Childhood abuse and neglect (the most common risk factor), loss of attachment, multiple placements, running away, and normalized high-risk relationships.</p>\n<h3>Build resilience: relationships and resources (PACEs)</h3><p><b>Relationships:</b> unconditional love, a best friend, volunteering, a mentor, a social group. <b>Resources:</b> a clean, safe home with enough food, chances to learn, sports, a hobby, routines and fair rules.</p>\n<h3>By age</h3><ul><li><b>0 to 6:</b> trust, correct body-part names, body boundaries, self-care, fairness, no fixed gender roles.</li><li><b>7 to 12:</b> secrets versus surprises, too-good-to-be-true offers, healthy friendships, internet and gaming safety, peer pressure, fair work.</li><li><b>13 to 18:</b> manipulation and romance, sextortion, healthy relationships and consent, dating violence, money skills, fair wages, peer pressure.</li></ul>\n<h3>When a child tells you</h3><p>Stay calm and private. Do not blame. Listen (\"tell me more\"). Write down their exact words. Do not promise secrecy. Then call the <b>Texas Abuse Hotline, 1-800-252-5400</b>, yourself, right away, and notify Benevolent House at any hour: office (214) 774-4871. Call <b>911</b> if a child is in immediate danger. National Human Trafficking Hotline: 1-888-373-7888, or text 233733.</p>\n<p class=\"small\">Opinions shared by the trainer are their own and do not necessarily represent DFPS.</p><h3>Your handouts</h3><ul>\n<li><a href=\"assets/handouts/ht-prevention-resource-guide.pdf\" target=\"_blank\" style=\"color:var(--green-dk,#2E6B47);font-weight:700\">HT Prevention and Awareness Resource Guide</a></li>\n<li><a href=\"assets/handouts/how-to-talk-to-youth.pdf\" target=\"_blank\" style=\"color:var(--green-dk,#2E6B47);font-weight:700\">How to Talk to Youth About Human Trafficking</a></li>\n<li><a href=\"assets/handouts/handling-disclosures.pdf\" target=\"_blank\" style=\"color:var(--green-dk,#2E6B47);font-weight:700\">Handling Child Abuse Disclosures</a></li>\n<li><a href=\"assets/handouts/mandatory-reporting.pdf\" target=\"_blank\" style=\"color:var(--green-dk,#2E6B47);font-weight:700\">Mandatory Reporting</a></li>\n<li><a href=\"assets/handouts/runaway-prevention-guide.pdf\" target=\"_blank\" style=\"color:var(--green-dk,#2E6B47);font-weight:700\">DFPS Runaway Prevention Resource Guide</a></li>\n<li><a href=\"assets/handouts/ht-slides-handout.pdf\" target=\"_blank\" style=\"color:var(--green-dk,#2E6B47);font-weight:700\">DFPS slide handout</a></li></ul>"};
</script>
<script>/* Universal Human Trafficking Prevention: interactions keyed by scene id. */

"h2_3":{type:"watch",k:"Watch: Faces of Human Trafficking",q:"About 6 minutes. Survivors describe trafficking in their own words.",

 debrief:["What stood out to you?","What surprised you?","What questions do you have now? You do not need the answers yet."],
 points:["There is no single profile of a victim: male, female, citizens and immigrants, from any background","Traffickers can be anyone, including a husband, parent, or employer","Control can be physical or emotional, and families are often threatened","Freedom of movement does not equal freedom of choice","Victims usually do not see themselves as victims","Communities need medical, mental health, housing, and education supports for survivors"]},
"h3_1":{type:"stages",k:"Name the type of labor trafficking",q:"Match each situation to the type of labor trafficking.",

 fb:"A victim may experience more than one type at once. For every type of labor trafficking, force, fraud, or coercion is present."},
"h3_2":{type:"choice",k:"The Romeo trafficker",q:"Which type of trafficking involves someone who uses violence, force, or love as the main tactic to control the victim?",
 a:[["Third-party trafficking",1,"Yes. Third-party traffickers control the victim and arrange the encounters. The Romeo or boyfriend trafficker uses love; others use violence."],["Labor trafficking",0,"Not this one. The question describes someone brokering sexual encounters."],["Gang trafficking",0,"Gangs treat people as a commodity, but the controlling partner who uses love is the third-party, Romeo trafficker."],["Organized crime",0,"Organized crime runs trafficking as a structured business, like brothels or webcam operations."]]},
"h4_1":{type:"multi",k:"Common vulnerabilities",q:"Check every common vulnerability for trafficking.",
 items:[["Childhood abuse or neglect, especially sexual abuse",1],["Involvement in foster care or juvenile justice",1],["Homelessness or couch surfing",1],["A caregiver with a substance use problem",1],["Strong social supports",0],["Being LGBTQ without family support",1],["Poverty",1],["Being part of a racial or ethnic minority group",1],["Growing up in a community exposed to intergenerational trauma",1]],

"h4_2":{type:"watch",k:"Watch: The Making of a Girl",warn:"This survivor describes sexual abuse, a strip club, and rape. Pause or step away whenever you need to.",q:"About 5 minutes. A survivor describes meeting her trafficker. Listen for what made her vulnerable.",

 points:["She was 12, and her single mother was struggling","Sexual abuse had become normal to her","She tried to tell someone at school, and no one heard her","He told her she was pretty and asked about her dreams","When he learned her father was absent, he offered to be her daddy: a third-party, Romeo trafficker","By the end she felt it was the best she would ever get, and she could not leave"]},
"h4_3":{type:"multi",k:"Risks the system creates",q:"Involvement with the child welfare system can itself create risk. Check each one.",
 items:[["Multiple placements, which deepen instability",1],["Normalizing unhealthy, high-risk relationships",1],["Running away out of anger at the system or dislike of placement rules",1],["Losing the bond with a parent that foster care cannot fully replace",1],["Having a caseworker",0]],
 fb:"Both multiple placements and normalized high-risk relationships are risks the system can create, along with running away and the loss of attachment. The most common risk factor of all is childhood abuse and neglect."},
"h5_1":{type:"watch",k:"Watch: Traffickers and Buyers",q:"About 6 minutes, from Unbound Now. It walks through real Texas cases.",

"h5_2":{type:"stages",k:"Put the process in order",q:"Trafficking unfolds over time. Choose the step number for each stage.",

 items:[["Isolate",3],["Gain trust",1],["Maintain control",5],["Target the victim",0],["Exploit",4],["Meet needs",2]],

"h5_3":{type:"choice",k:"Where is it happening?",q:"Where does human trafficking happen?",

 if(Date.now()<due.getTime()-90*864e5)return x;const hist=(x.history||[]).filter(h=>h.iso!==x.done.iso).concat([{date:x.done.date,iso:x.done.iso,score:x.done.score}]);return{seen:{},badges:{},answers:{},rate:x.rate,history:hist,renewDue:due.toISOString(),_ts:Date.now()}}

async function adoptUser(u){if(!u)return;let remote=null;try{const r=await BHC.getProgress(COURSE.code);remote=r&&r.state}catch(e){}
 let local=(S.user&&S.user.email&&S.user.email.toLowerCase()===u.email.toLowerCase())?S:null;
 remote=renewState(remote);local=renewState(local);
 const rs=stateScore(remote),ls=stateScore(local);
 let pick=!remote?local:!local?remote:rs>ls?remote:ls>rs?local:((remote._ts||0)>=(local._ts||0)?remote:local);
 S=Object.assign({seen:{},badges:{},answers:{}},pick||{});S.user=u;window.__bhNeedProfile=null;save();try{BHC.retryCompletions()}catch(e){}try{BHC.visit()}catch(e){}renderHome()}
async function cloudBoot(){if(!window.BHC||!BHC.available()){window.__bhChecked=true;if(S.user&&S.user.cloud){S={seen:{},badges:{},answers:{}};renderHome()}return}
 let p;try{p=await BHC.profile()}catch(e){window.__bhChecked=true;renderHome();return}window.__bhChecked=true;
 if(!p){if(S.user&&S.user.cloud){S={seen:{},badges:{},answers:{}};try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}renderHome();return}
 if(!p.full_name||!p.home_label){window.__bhNeedProfile=p;if(S.user&&S.user.cloud)S.user=null;renderHome();return}await adoptUser(BHC.asUser(p))}

let AU=null,curSpans=[],curChars=[],curTotal=0;
function stopAudio(){if(AU){try{AU.pause()}catch(e){}AU=null}}
function setupAudio(src,text){
 const sents=text.match(/[^.!?]+[.!?]+["']?/g)||[text];const cap=$("#cap");cap.innerHTML=sents.map(s=>`<span>${esc(s.trim())} </span>`).join("");
 curSpans=$$("#cap span");curChars=sents.map(s=>s.length);curTotal=curChars.reduce((a,b)=>a+b,0);
 const a=new Audio(src);AU=a;a.preload="auto";a.playbackRate=S.rate||1;const btn=$("#play"),pi=$("#pi");
 btn.onclick=()=>{if(a.paused){a.play().catch(()=>{});btn.textContent="❚❚"}else{a.pause();btn.textContent="▶"}};
 a.ontimeupdate=()=>{if(AU!==a)return;const f=a.currentTime/(a.duration||1);pi.style.width=(f*100)+"%";let acc=0,i=0;for(;i<curChars.length;i++){acc+=curChars[i];if(acc/curTotal>f)break}curSpans.forEach((s,j)=>s.classList.toggle("on",j<=i))};
 a.onended=()=>{if(AU!==a)return;btn.textContent="↻";curSpans.forEach(s=>s.classList.add("on"));S.heard=S.heard||{};S.heard[CUR.id]=1;save();gate()};
 a.onerror=()=>{if(AU!==a)return;curSpans.forEach(s=>s.classList.add("on"));btn.textContent="▶";toast("Narration could not be loaded on this connection. Read the caption, then continue.");S.heard=S.heard||{};S.heard[CUR.id]=1;gate()};
 a.play().then(()=>{btn.textContent="❚❚"}).catch(()=>{btn.textContent="▶"})}

 if(it.type==="wordbank"){el.querySelectorAll(".wb button").forEach(b=>b.onclick=()=>b.classList.toggle("sel"));el.querySelector("#chk").onclick=()=>{const ok=Array.from(el.querySelectorAll(".wb")).every(w=>w.querySelector("button.sel"));if(!ok){toast("Pick at least one word in each box");return}el.querySelector(".fb-final").classList.remove("hidden");el.querySelectorAll(".wb button,#chk").forEach(x=>x.disabled=true);markDone(CUR.id)}}
 if(it.type==="calendar"){el.querySelectorAll(".cal div").forEach(d=>{d.onclick=()=>d.classList.toggle("sel");d.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();d.classList.toggle("sel")}}});el.querySelector("#chk").onclick=()=>{const sel=Array.from(el.querySelectorAll(".cal div.sel")).map(d=>+d.dataset.j);const want=it.expect;const same=sel.length===want.length&&want.every(x=>sel.includes(x));el.querySelectorAll(".cal div").forEach(d=>d.classList.toggle("exp",want.includes(+d.dataset.j)));el.querySelector(".fb-final").classList.remove("hidden");if(!same){toast("The gold-outlined months are the due dates. Match them and check again.");return}el.querySelectorAll(".cal div,#chk").forEach(x=>x.style.pointerEvents="none");el.querySelector("#chk").disabled=true;markDone(CUR.id)}}
 if(it.type==="wheel"){const rows=el.querySelectorAll(".wheel");rows.forEach(r=>{const j=+r.dataset.j;r.querySelectorAll("button").forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===it.items[j][1];r.querySelectorAll("button").forEach(x=>{x.disabled=true;if(+x.dataset.k===it.items[j][1])x.classList.add("ok")});if(!ok)b.classList.add("bad");r.dataset.done=1;if(Array.from(rows).every(x=>x.dataset.done)){el.querySelector(".fb-final").classList.remove("hidden");markDone(CUR.id)}})})}
 if(it.type==="respite"){const steps=el.querySelectorAll(".rstep");steps.forEach((st,si)=>{st.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{const ok=o.dataset.ok==="1";const fb=st.querySelector(".fb");fb.classList.remove("hidden");if(ok){o.classList.add("right");fb.className="fb";fb.textContent=it.steps[si].fb;st.querySelectorAll(".opt").forEach(x=>x.disabled=true);if(steps[si+1])steps[si+1].classList.remove("hidden");else{const p=el.querySelector("#pay");p.classList.remove("hidden");p.textContent=it.pay;el.querySelector(".fb-final").classList.remove("hidden");markDone(CUR.id)}}else{o.classList.add("wrong");o.disabled=true;fb.className="fb bad";fb.textContent="Not that one. Try again."}})})}
}

let LA=null;

function dialogHTML(){if(!CUR.dialog||!CUR.dialog.length)return"";return `<div class="dialog"><div class="k">Voices from the home</div>${CUR.dialog.map((l,n)=>`<div class="line"><button class="play" aria-label="Play this line" onclick="playLine(${n},this)">\u25B6</button><div><b>${esc(l[0])}</b><span>${esc(l[1])}</span></div></div>`).join("")}<p class="hint" style="color:var(--muted);margin:8px 0 0">Tap a line to hear it in the speaker's voice, or <a href="#" onclick="playAll();return false">play the whole conversation</a>. The narration above is what counts toward completion.</p></div>`}
function playLine(n,btn,cb){stopLine();if(AU&&!AU.paused){AU.pause();const pb=$("#play");if(pb)pb.textContent="\u25B6"}const a=new Audio(`assets/d_${CUR.id}_${n+1}.mp3`);LA=a;a.playbackRate=S.rate||1;if(btn)btn.textContent="\u275A\u275A";a.onended=()=>{if(LA!==a)return;LA=null;if(btn)btn.textContent="\u25B6";if(cb)cb()};a.onerror=()=>{if(btn)btn.textContent="\u25B6";toast("This clip could not be loaded on this connection.")};a.play().catch(()=>{if(btn)btn.textContent="\u25B6"})}

/* ---------- Quick Reference, quiz, ack, cert ---------- */
function renderQuickRef(){
 $("#v-qref").innerHTML=`<div class="scene"><div class="hero"><span class="chip">${COURSE.qrefChip?esc(COURSE.qrefChip):`Chapter ${CH.length} · ${esc(CH[CH.length-1][0])}`}</span><span class="ref">Quick Reference</span><img src="assets/${COURSE.qrefImg||"s_9_1"}.jpg" alt=""><div class="title"><small>Your Quick Reference</small><h1>Keep this in your binder</h1></div></div>
 <div class="qref" id="qrefBody">${COURSE.qrefHtml||`<h3>What we ask of you</h3><ul><li>Use TST-FC every day: routines, pre-teaching, staying neutral, time-in, and signals of safety.</li><li>Build the Managing Emotions Guide with the child and keep it up to date.</li><li>Take the child to every appointment and keep a record of each service.</li><li>Tell your case manager right away if a service is denied, delayed, or cannot be found.</li><li>Support Normalcy and approved contact with parents, siblings, and relatives.</li><li>Tell your case manager when a child names a relative or another person who matters to them.</li><li>Come to Service Plan meetings and share what you see at home.</li><li>Keep your training current. It keeps your home credentialed.</li></ul>
 <h3>The calendar</h3><table class="t"><tr><th></th><th>Basic</th><th>Mental &amp; Behavioral Health</th></tr><tr><td>Service Plan review</td><td>At least every 6 months</td><td>At least every 90 days</td></tr><tr><td>CANS 3.0 (over age 3)</td><td>Every 12 months</td><td>Every 90 days</td></tr><tr><td>Written plan for hard moments</td><td>Managing Emotions Guide</td><td>Managing Emotions Guide and a safety and crisis plan</td></tr><tr><td>When the child leaves</td><td>Discharge plan in the Service Plan</td><td>Aftercare plan and six months of follow-up</td></tr></table>
 <h3>What you can count on from Benevolent House</h3><ul><li>A case manager who visits every month and coaches you in the model.</li><li>On-call staff 24 hours a day, 7 days a week.</li><li>Up to 7 days of paid Intermittent Alternate Care per child each fiscal year. Ask at least 10 days ahead when you can.</li><li>For kinship caregivers: help with verification and benefits, and meetings on evenings and weekends.</li></ul>
 <h3>Call your case manager or the on-call line right away when</h3><ul><li>A child is in crisis, is hurt, or is missing. For a life-threatening emergency or a missing child, call 911 first, then on-call.</li><li>There is a serious incident or you use an emergency behavior intervention.</li><li>You have any concern that a child is being recruited or trafficked. Texas Abuse Hotline 1-800-252-5400.</li><li>Something changes in your household.</li></ul><h3>Kinship and re-credentialing</h3><ul><li>Kinship aftercare: weekly the first month, then twice a month, for six months, plus a support group.</li><li>Your home is re-credentialed every 12 months, in the month of the original credential.</li></ul><p class="small">Benevolent House office: (214) 774-4871. The full T3C Service Delivery Addendum: <a href="addendum.pdf" target="_blank" style="color:var(--green-dk)">open or download it here</a>. It is also in your foster home binder and available from your case manager at any time.</p>`}</div>
 <div class="nav noprint"><button class="btn ghost" onclick="window.print()">Print this page</button><span class="sp"></span><button class="btn gold" onclick="renderQuiz()">Start the Knowledge Check</button></div></div>`;show("qref")}
let attempt=0;
function renderQuiz(){attempt++;let h=`<div class="panel"><div class="k">Knowledge Check</div><h2>${QUIZ.length===10?"Ten":QUIZ.length===11?"Eleven":QUIZ.length} questions. ${({7:"Seven",8:"Eight",9:"Nine"})[COURSE.passMark||8]||(COURSE.passMark||8)} to pass. Attempt ${attempt}.</h2><p class="lead">Take your time. If you score below the passing mark, you will see which items to review and can try again.</p>`;
 QUIZ.forEach((x,i)=>{h+=`<div style="margin:14px 0;padding-top:10px;border-top:1px solid var(--line)"><b>${i+1}. ${esc(x.q)}</b>${x.a.map((a,j)=>`<label style="font-weight:400;display:flex;gap:8px;align-items:flex-start;margin:6px 0;color:var(--ink)"><input type="radio" name="q${i}" value="${j}" style="margin-top:4px"> <span>${COURSE.letters?"ABCDE"[j]+". ":""}${esc(a)}</span></label>`).join("")}</div>`});
 h+=`<p><button class="btn" onclick="gradeQuiz()">Submit answers</button></p></div>`;$("#v-quiz").innerHTML=h;show("quiz")}
let RESULT=null;
function gradeQuiz(){let ans=[],score=0,missed=[];for(let i=0;i<QUIZ.length;i++){const r=document.querySelector(`input[name=q${i}]:checked`);if(!r){toast("Please answer question "+(i+1));return}const v=+r.value;ans.push("abcde"[v]);if(v===QUIZ[i].k)score++;else missed.push(i)}
 const pass=score>=(COURSE.passMark||8);const detail=QUIZ.map((q,i)=>`Q${i+1} ${q.q} | Answered: ${q.a["abcde".indexOf(ans[i])]} | ${ans[i]==="abcde"[q.k]?"Correct":"Incorrect; correct answer: "+q.a[q.k]}`).join("\n");RESULT={score,answers:ans.join(""),detail,pass,attempt,picks:ans.slice()};
 let h=`<div class="panel" style="text-align:center"><div class="k">Knowledge Check</div><p class="score ${pass?"":"fail"}">${score} / ${QUIZ.length}</p><p>${pass?"<b>You passed.</b> One more step: the Acknowledgment.":"<b>Not yet.</b> Review the items below and take the check again. A retake is expected and is never held against you."}</p></div>`;
 if(missed.length){h+=`<div class="panel"><div class="k">Items to review</div>${missed.map(i=>`<p><b>${i+1}. ${esc(QUIZ[i].q)}</b><br>Correct answer: ${COURSE.letters?"ABCDE"[QUIZ[i].k]+". ":""}${esc(QUIZ[i].a[QUIZ[i].k])}${COURSE.letters&&/\b(A|B|C)\b and|above/.test(QUIZ[i].a[QUIZ[i].k])?` <span class="small">(${QUIZ[i].a.map((o,j)=>"ABCDE"[j]+". "+esc(o)).slice(0,QUIZ[i].k).join("; ")})</span>`:""} <span style="background:var(--sand);border-radius:6px;padding:.1rem .4rem;font-size:.8rem">${esc(QUIZ[i].ref)}</span></p>`).join("")}</div>`}
 h+=`<div class="nav">${pass?`<button class="btn gold" onclick="renderAck()">Continue to Acknowledgment</button>`:`<button class="btn" onclick="renderQuiz()">Retake the Knowledge Check</button> <button class="btn ghost" onclick="renderHome()">Review the chapters</button>`}</div>`;
 $("#v-quiz").innerHTML=h;show("quiz")}
function renderAck(){$("#v-ack").innerHTML=`<div class="panel"><div class="k">Acknowledgment</div><p style="font-size:1.08rem">${esc(ACK)}</p><div class="row"><div><label>Type your full name</label><input type="text" id="aName" value="${esc(S.user.name)}"></div><div><label>Date</label><input type="text" id="aDate" value="${fmtDate(new Date())}" readonly></div></div><label>Sign with your finger or mouse</label><canvas class="sig" id="sigPad" aria-label="Signature pad"></canvas><p><button class="btn ghost sm" style="color:var(--brown);border-color:var(--brown);background:#fff" onclick="clearSig()">Clear signature</button> <button class="btn ghost sm" style="color:var(--brown);border-color:var(--brown);background:#fff" onclick="typedSig()">I cannot draw: use my typed name</button></p><label style="font-weight:400"><input type="checkbox" id="aAgree"> I agree to the statement above and confirm that I completed this training myself.</label><p><button class="btn gold" id="ackSubmit" onclick="finish()">Submit and get my certificate</button></p></div>`;show("ack");initSig()}
let sigCtx,sigDrawn=false;
function initSig(){const c=$("#sigPad");c.width=c.offsetWidth*2;c.height=320;sigCtx=c.getContext("2d");sigCtx.scale(2,2);sigCtx.lineWidth=2.2;sigCtx.lineCap="round";sigCtx.strokeStyle="#1b2a4a";let d=false;const pos=e=>{const r=c.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return[p.clientX-r.left,p.clientY-r.top]};
 const st=e=>{d=true;const[x,y]=pos(e);sigCtx.beginPath();sigCtx.moveTo(x,y);e.preventDefault()},mv=e=>{if(!d)return;const[x,y]=pos(e);sigCtx.lineTo(x,y);sigCtx.stroke();sigDrawn=true;e.preventDefault()},en=()=>{d=false};
 c.addEventListener("mousedown",st);c.addEventListener("mousemove",mv);window.addEventListener("mouseup",en);c.addEventListener("touchstart",st,{passive:false});c.addEventListener("touchmove",mv,{passive:false});c.addEventListener("touchend",en)}
function typedSig(){const n=$("#aName").value.trim();if(!n){toast("Type your name first");return}clearSig();sigCtx.font="italic 34px Georgia, serif";sigCtx.fillStyle="#1b2a4a";sigCtx.fillText(n,16,90);sigDrawn=true;toast("Typed signature applied")}
function clearSig(){const c=$("#sigPad");sigCtx.clearRect(0,0,c.width,c.height);sigDrawn=false}
let finishing=false;
async function finish(){if(finishing)return;const n=$("#aName").value.trim();if(!n){toast("Please type your name");return}if(!sigDrawn){toast("Please sign in the box");return}if(!$("#aAgree").checked){toast("Please check the agreement box");return}
 finishing=true;const b=$("#ackSubmit");b.disabled=true;b.textContent="Submitting...";const now=new Date();const sig=$("#sigPad").toDataURL("image/png");
 const rec={title:COURSE.title,code:COURSE.code,score:RESULT.score,pass:"Pass",date:fmtDate(now),time:fmtTime(now),hours:COURSE.hours,answers:"Attempt "+RESULT.attempt+" ("+RESULT.score+" of "+QUIZ.length+")\n"+(RESULT.detail||RESULT.answers)+reflectText(),ack:ACK+" Signed by "+n,sig:sig,trainer:COURSE.trainer};
 const ok=await logToForms(rec);try{if(S.user&&S.user.cloud)await BHC.addCompletion({code:COURSE.code,title:COURSE.title,hours:COURSE.hours,score:RESULT.score,total:QUIZ.length,attempt:RESULT.attempt||1,answers:{reflect:S.reflect||null,picks:RESULT.picks||null,items:(RESULT.picks||[]).map((x,i)=>{const q=QUIZ[i];return{q:q.q,a:q.a["abcde".indexOf(x)]||"",ok:x==="abcde"[q.k],right:q.a[q.k]}})},ack:ACK+" Signed by "+n,completed_at:now.toISOString()});BHC.log("course_done",COURSE.code)}catch(e){}S.done={date:fmtDate(now),score:RESULT.score,name:n,sig:sig,iso:now.toISOString(),picks:RESULT.picks||null,attempt:RESULT.attempt||1};S.badges[CH.length]=1;save();finishing=false;renderCert(n,now,sig,ok)}
async function logToForms(r){const fd=new FormData();fd.append("formID",JOTFORM_ID);fd.append("q3_q3_textbox1",S.user.name);fd.append("q4_q4_email2",S.user.email);fd.append("q5_q5_textbox3",S.user.home||"");fd.append("q6_q6_dropdown4",S.user.role);fd.append("q8_q8_textbox6",r.title);fd.append("q9_q9_textbox7",r.code);fd.append("q11_q11_number9",r.score);fd.append("q12_q12_dropdown10",r.pass);fd.append("q13_q13_textbox11",r.date);fd.append("q14_q14_textbox12",r.time);fd.append("q15_q15_number13",r.hours);fd.append("q16_q16_textarea14",r.answers);fd.append("q17_q17_textarea15",r.ack);fd.append("q18_q18_textarea16",r.sig);fd.append("q20_q20_textbox18",r.trainer);fd.append("q21_q21_textbox19",PORTAL_VERSION);
 try{await fetch(JOTFORM_SUBMIT_URL,{method:"POST",body:fd,mode:"no-cors"});return true}catch(e){try{const q=JSON.parse(localStorage.getItem(KEY+"_queue")||"[]");q.push({r,u:S.user});localStorage.setItem(KEY+"_queue",JSON.stringify(q))}catch(x){}return false}}
function renderCert(name,now,sig,ok){$("#v-cert").innerHTML=`<p class="noprint hint" style="margin:14px 0">${ok?"Your completion record has been sent to Benevolent House.":"Your record is saved on this device and will be sent when you are back online. Please also tell your case manager you finished."} Print or save this certificate for your records.</p>
 <div id="cert"><img class="logo" src="bh-logo.png" alt=""><div style="font-weight:700;color:var(--brown);font-size:1.2rem">Benevolent House</div><div class="small">Foster Care and Adoption</div><h1>Certificate of Completion</h1><p>This certifies that</p><div class="name">${esc(name)}</div><p>${esc(S.user.role)}${S.user.home?" · "+esc(S.user.home):""}</p><p>has completed</p><p style="font-size:1.25rem;font-weight:700;color:var(--brown)">${esc(COURSE.title)}</p><p>Training code ${esc(COURSE.code)} · ${COURSE.hours} training ${COURSE.hours===1?"hour":"hours"} · Knowledge Check ${RESULT.score} of ${QUIZ.length}<br>${fmtDate(now)}</p>
 <div class="covers"><b>This training covered</b><p>${esc((COURSE.covers||CH.filter(c=>+c[1]<CH.length).map(c=>c[0])).join(" · "))}</p>${COURSE.basis?`<p class="small">Built on ${esc(COURSE.basis)}</p>`:""}</div><div class="sigs"><div>${/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(sig||"")?`<img src="${sig}" alt="">`:""}<b>${esc(name)}</b>Participant</div><div style="padding-top:56px"><b>${esc(COURSE.trainer)}</b>Trainer of Record (electronic record on file)</div></div><div class="seal">${COURSE.seal||"BENEVOLENT<br>HOUSE<br>T3C<br>CERTIFIED"}</div>
 <p class="small" style="margin-top:26px">Knowledge Check and signed Acknowledgment on file with Benevolent House.</p></div>
 <div class="nav noprint" style="justify-content:center"><button class="btn" onclick="window.print()">Print or save as PDF</button> <button class="btn ghost" onclick="renderQuizRecord()">Print my Knowledge Check</button> <button class="btn ghost" onclick="renderHome()">Back to chapters</button></div>`;show("cert")}
function renderQuizRecord(){const picks=(RESULT&&RESULT.picks)||(S.done&&S.done.picks);if(!picks){toast("No Knowledge Check record is saved on this device");return}const n=S.done?S.done.name:(S.user&&S.user.name)||"";const d=S.done?S.done.date:fmtDate(new Date());let h=`<div id="cert" style="text-align:left"><img class="logo" src="bh-logo.png" alt="" style="float:right;width:56px"><div style="font-weight:700;color:var(--brown);font-size:1.1rem">Benevolent House</div><h1 style="font-size:1.4rem;margin:.3rem 0">Knowledge Check Record</h1><p>${esc(COURSE.title)} · Training code ${esc(COURSE.code)}<br><b>${esc(n)}</b>${S.user&&S.user.home?" · "+esc(S.user.home):""} · ${esc(d)} · Attempt ${(S.done&&S.done.attempt)||(RESULT&&RESULT.attempt)||1} · Score <b>${(S.done?S.done.score:RESULT.score)} of ${QUIZ.length}</b> (${(COURSE.passMark||8)} to pass)</p><ol style="padding-left:1.2rem">`;QUIZ.forEach((q,i)=>{const p="abcde".indexOf(picks[i]);const ok=p===q.k;h+=`<li style="margin:.5rem 0"><div>${esc(q.q)}</div><div style="color:${ok?"var(--green-dk)":"var(--red)"}">${ok?"✓":"✗"} Answered: ${COURSE.letters&&p>=0?"ABCDE"[p]+". ":""}${esc(q.a[p]||"")}</div>${ok?"":`<div class="small">Correct answer: ${COURSE.letters?"ABCDE"[q.k]+". ":""}${esc(q.a[q.k])}</div>`}</li>`});h+=`</ol><p class="small">Graded automatically by the Benevolent House Training Portal. Record on file with Benevolent House.</p></div><div class="nav noprint" style="justify-content:center"><button class="btn" onclick="window.print()">Print or save as PDF</button> <button class="btn ghost" onclick="showSavedCert()">Back to certificate</button></div>`;$("#v-cert").innerHTML=h;show("cert")}

function showSavedCert(){if(!S.done){renderQuickRef();return}RESULT=RESULT||{score:S.done.score};renderCert(S.done.name,new Date(S.done.iso),S.done.sig,true)}
function overallPct(){const n=SCENES.length+2;let d=SCENES.filter(s=>S.seen[s.id]&&S.answers[s.id]!==undefined||S.seen[s.id]&&!(INTER[s.id]||{}).type||S.seen[s.id]&&(INTER[s.id]||{}).type==="none").length;d=Math.max(d,Object.keys(S.answers||{}).length);if(S.done)d=n;else if(S.ackReady)d=n-1;return Math.min(100,Math.round(d/n*100))}
function progBar(){const p=overallPct();return `<div class="course-prog" aria-label="Course progress ${p} percent"><i style="width:${p}%"></i><span>${p}% complete</span></div>`}

window.addEventListener("online",async()=>{try{const q=JSON.parse(localStorage.getItem(KEY+"_queue")||"[]");if(!q.length)return;localStorage.removeItem(KEY+"_queue");const u=S.user;for(const it of q){S.user=it.u;await logToForms(it.r)}S.user=u}catch(e){}});
window.addEventListener("resize",()=>{if($("#v-ack")&&!$("#v-ack").classList.contains("hidden")&&!sigDrawn)initSig()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&document.activeElement&&["uName","uEmail","uHome"].includes(document.activeElement.id))signIn()});
$("#homeBtn").onclick=renderHome;renderHome();cloudBoot();
