<header class="top"><div class="wrap topbar"><img src="../bh-logo.png" alt="Benevolent House"><div class="brand">Benevolent House<small>Staff Dashboard</small></div><span class="spacer"></span><span class="who"><span class="chip" id="who">Not signed in</span><button class="signout noprint hidden" id="hdrOut">Sign out</button></span><a class="btn ghost sm noprint" href="../">Portal home</a></div></header>
<main class="wrap"><section id="view"></section><p id="actNotice" class="small muted noprint" hidden style="text-align:center;margin:28px 0 12px">Activity in the Staff Dashboard, including sign-ins, time in use and changes to records, is recorded.</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
const fmt=d=>d?new Date(d).toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"}):"";
const fmtShort=d=>d?new Date(d).toLocaleDateString("en-US",{month:"2-digit",day:"2-digit",year:"numeric"}):"";
const CAT=window.CATALOG||[];
let QUESTIONS=[];let ME=null,PEOPLE=[],COMPS=[],LEGACY=[],ACT=[],filter="",homeFilter="",stFilter="current",listFilter="",sel=null;

function dueOf(c,comp){return comp?window.BH_DUE(c,comp.completed_at):c.cycle==="quarter"?window.BH_DUE(c,null):null}
const nm=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," ");
const typeOf=p=>p.caregiver_type||"Foster Caregiver";
function catFor(p){const m=latestBy(p.id);const known=new Set(CAT.map(c=>c.code));
 return CAT.filter(c=>window.BH_FOR(c,typeOf(p))||m[c.code]).concat(Object.values(m).filter(r=>!known.has(r.course_code)).map(r=>({code:r.course_code,title:r.course_title||r.course_code,hours:r.hours,freq:"Earlier record",renew:0,group:"Other"})))}
function statusOf(c,comp){

 `${q.prev_note?`<p class="small muted" style="margin:0 0 6px">Earlier answer: ${esc(q.prev_note)}</p>`:""}${q.edited?`<p class="small muted" style="margin:0 0 6px">The caregiver changed this question after it was first sent.</p>`:""}<form class="noprint" data-qform="${esc(q.id)}" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0"><input type="text" maxlength="300" id="qn_${esc(q.id)}" placeholder="How it was answered, e.g., emailed the handouts 11/14" aria-label="How this question was answered" style="flex:1 1 260px;padding:.55rem .7rem;border:1px solid #8A7B70;border-radius:8px;min-height:44px"><button type="submit" class="btn sm" data-qans="${esc(q.id)}" style="min-height:44px">Mark answered</button></form>`}</article>`}
function qRerender(after){const y=window.scrollY;after();window.scrollTo(0,y);const t=document.querySelector("[data-qform] input")||document.querySelector("#view h1");if(t){if(t.tagName==="H1")t.setAttribute("tabindex","-1");t.focus({preventScroll:true})}}
function wireQs(after){document.querySelectorAll("[data-qp]").forEach(a=>a.onclick=e=>{e.preventDefault();renderPerson(a.dataset.qp)});
 document.querySelectorAll("[data-qform]").forEach(f=>f.onsubmit=async e=>{e.preventDefault();const id=+f.dataset.qform;const b=f.querySelector("button");if(b.disabled)return;const n=($("#qn_"+id)||{}).value||"";b.disabled=true;const{data,error}=await BHC.client().rpc("answer_question",{p_id:id,p_note:n.trim()||null});b.disabled=false;if(error){toast("Could not save: "+error.message);return}BHC.log("question_answered",String(id));await loadQuestions();toast(data?"Marked answered":"Already marked answered");qRerender(after)});
 document.querySelectorAll("[data-qreopen]").forEach(a=>a.onclick=async e=>{e.preventDefault();if(!confirm("Put this question back on the unanswered list? The answer note will be kept in the history."))return;const{error}=await BHC.client().rpc("reopen_question",{p_id:+a.dataset.qreopen});if(error){toast("Could not reopen: "+error.message);return}await loadQuestions();toast("Reopened");qRerender(after)})}
async function showQuestions(){await loadQuestions();renderQuestions()}
function renderQuestions(){const open=openQs(),done=QUESTIONS.filter(q=>q.answered_at);
 let h=nav("questions")+`<h1>Caregiver questions</h1><p class="lead">Questions caregivers type in a training. The leadership team gets an email when a new one comes in; replying to that email goes straight to the caregiver. Mark each one answered here so everyone can see it was handled. Families do not see this page.</p>`;
 h+=open.length?open.map(q=>qCard(q,true)).join(""):`<div class="card muted">No unanswered questions right now.</div>`;
 if(done.length)h+=`<details style="margin-top:14px"><summary><b>Answered (${done.length})</b></summary>${done.map(q=>qCard(q,true)).join("")}</details>`;
 $("#view").innerHTML=h;wireNav();wireQs(renderQuestions)}
async function loadApproved(){const{data,error}=await BHC.client().from("approved_people").select("*").order("home_label");if(error)throw error;APPROVED=data||[]}
let pFilter="",pShowOff=false;
function renderPeople(){
 const signed=new Set(PEOPLE.map(p=>(p.email||"").toLowerCase()));
 const rows=APPROVED.filter(a=>(LEAD()||a.access!=="leadership")&&(pShowOff||a.active)&&(!pFilter||((a.email+" "+(a.full_name||"")+" "+(a.home_label||"")).toLowerCase().includes(pFilter))));
 const offN=APPROVED.filter(a=>!a.active&&(LEAD()||a.access!=="leadership")).length;
 let h=nav("people")+`<h1>Approved people</h1><p class="lead">Only people on this list can use the portal, and each person's access comes from this list. Turning someone off locks them out of every record right away, including their own; their completed trainings stay on file for inspections.</p>
 <div class="bar"><input id="pq" type="search" placeholder="Search by email, name or home" value="${esc(pFilter)}" aria-label="Search approved people"><label class="small" style="display:flex;gap:8px;align-items:center;margin:0;font-weight:400;white-space:nowrap"><input type="checkbox" id="poff" ${pShowOff?"checked":""}> Show turned-off (${offN})</label>${can("manage_families")?`<button class="btn sm" id="padd">Add a person</button>`:""}</div>
 <div class="tscroll"><table class="hometable"><thead><tr><th>Name</th><th>Home</th><th>Access</th><th>Sign-in</th><th class="noprint"></th></tr></thead><tbody>${rows.map(a=>`<tr><td data-l="Name"><b>${esc(a.full_name||"(no name yet)")}</b><br><span class="small muted">${esc(a.email)}</span></td><td data-l="Home">${esc(a.home_label||"")}${isHomeRow(a)?"<br>"+stPill(a.standing):""}</td><td data-l="Access">${esc((v=>v.charAt(0).toUpperCase()+v.slice(1))(LEAD()?a.access:(a.access==="caregiver"?"caregiver":"staff")))}${a.access==="staff"&&LEAD()?`<br><span class="small muted">${(a.permissions||[]).map(x=>esc((PERM_LABELS[x]||x).replace(" (coming)",""))).join(", ")||"No switches on"}</span>`:""}</td><td data-l="Sign-in">${a.active?(signed.has(a.email)?`<span class="pill ok">Signed in before</span>`:`<span class="pill none">Not signed in yet</span>`):`<span class="pill over">Turned off</span>`}</td><td class="noprint">${can("manage_families")&&(LEAD()||a.access!=="leadership")?`<button class="btn ghost sm" data-edit="${esc(a.email)}">Edit</button>`:""}</td></tr>`).join("")}</tbody></table></div>
 <p class="small muted">${rows.length} shown. Emails from the BH tracker's Email Distribution List were loaded on November 9, 2026. The full name on each email connects that person's earlier training records, so enter it exactly as it appears on their training record.</p>`;
 $("#view").innerHTML=h;wireNav();
 $("#pq").oninput=e=>{pFilter=e.target.value.toLowerCase();const pos=e.target.selectionStart;renderPeople();const q=$("#pq");q.focus();q.setSelectionRange(pos,pos)};
 $("#poff").onchange=e=>{pShowOff=e.target.checked;renderPeople()};
 $("#padd")&&($("#padd").onclick=()=>editPerson(null));
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editPerson(APPROVED.find(a=>a.email===b.dataset.edit)))}
function editPerson(a){const isNew=!a;a=a||{email:"",full_name:"",home_label:"",caregiver_type:"Foster Caregiver",access:"caregiver",active:true,permissions:[],notes:"",standing:"Applicant"};const lead=ME.role==="leadership";
 $("#view").innerHTML=nav("people")+`<h1>${isNew?"Add a person":"Edit "+esc(a.email)}</h1><div class="card form">
 <div class="row2"><div><label for="ae">Email</label><input id="ae" type="email" value="${esc(a.email)}" ${isNew?"":"disabled"}></div><div><label for="an">Full name</label><input id="an" type="text" value="${esc(a.full_name||"")}" placeholder="Filled in when they first sign in, if left blank"></div></div>
 <div class="row2"><div><label for="ah">Foster home or staff role</label><input id="ah" type="text" value="${esc(a.home_label||"")}" placeholder="e.g., Johnson, Mark & Lisa"></div><div><label for="at">Type</label><select id="at">${TYPES.map(t=>`<option ${t===a.caregiver_type?"selected":""}>${t}</option>`).join("")}</select></div></div>
 ${lead?`<label for="aa">Access level</label><select id="aa">${["caregiver","staff","leadership"].map(r=>`<option ${r===a.access?"selected":""}>${r}</option>`).join("")}</select>
 <div id="permBox" style="${a.access==="staff"?"":"display:none"}"><label>Permission switches</label>${Object.entries(PERM_LABELS).map(([k,v])=>`<label style="display:flex;gap:8px;align-items:center;font-weight:400;margin:6px 0"><input type="checkbox" class="perm" value="${k}" ${(a.permissions||[]).includes(k)?"checked":""} style="width:auto"> ${esc(v)}</label>`).join("")}</div>`:a.email&&a.email===(ME._email||"").toLowerCase()?`<p class="small muted">Access level: ${esc(a.access)}.</p>`:`<label for="aa">Access level</label><select id="aa">${["caregiver","staff"].map(r=>`<option ${r===a.access?"selected":""}>${r}</option>`).join("")}</select>`}
 ${isNew?`<div id="stBox"><label for="ast">Home status</label><select id="ast">${STANDINGS.filter(x=>x==="Applicant"||x==="Active").map(x=>`<option ${x===a.standing?"selected":""}>${x}</option>`).join("")}</select><p class="small muted" style="margin:4px 0 0">If this person joins a home already on the list, they take that home's status.</p></div>`:isHomeRow(a)?`<p class="small" style="margin:12px 0 0">Home status: ${stPill(a.standing)} since ${esc(fmtYmd(a.standing_since))}. <a href="#" id="toHomes">Change it on the Homes page</a>, so both caregivers move together.</p>`:""}
 <label for="ano">Notes (optional, no child information)</label><input id="ano" type="text" maxlength="300" value="${esc(a.notes||"")}">
 <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="aact" ${a.active?"checked":""} ${!lead&&a.email&&a.email===(ME._email||"").toLowerCase()?"disabled":""} style="width:auto"> Portal access on</label>
 <p style="margin-top:14px"><button class="btn" id="asave">Save</button> <button class="btn ghost" id="acancel">Cancel</button></p></div>`;
 wireNav();$("#acancel").onclick=renderPeople;$("#toHomes")&&($("#toHomes").onclick=e=>{e.preventDefault();hTab=(a.standing==="Withdrawn"||a.standing==="Closed")?"Closed":(a.standing||"Active");renderHomes()});
 const stVis=()=>{const bx=$("#stBox");if(!bx)return;const acc=$("#aa")?$("#aa").value:a.access;bx.style.display=acc==="caregiver"&&$("#at").value!=="Contracted Provider"&&$("#at").value!=="Staff"?"":"none"};stVis();$("#at").addEventListener("change",stVis);$("#aa")&&$("#aa").addEventListener("change",stVis);
 $("#aa")&&($("#aa").onchange=e=>{$("#permBox").style.display=e.target.value==="staff"?"":"none"});
 $("#asave").onclick=async()=>{const email=(isNew?$("#ae").value:a.email).trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast("Enter a valid email");return}
  const row={full_name:$("#an").value.trim()||null,home_label:$("#ah").value.trim()||null,caregiver_type:$("#at").value,notes:$("#ano").value.trim()||null,active:$("#aact").checked};
  if(!lead&&$("#aa"))row.access=$("#aa").value;
  if(lead){row.access=$("#aa").value;row.permissions=row.access==="staff"?[...document.querySelectorAll(".perm:checked")].map(x=>x.value):[]}
  if(lead&&email===(ME._email||"").toLowerCase()&&(row.access!=="leadership"||!row.active)){toast("You cannot remove your own leadership access");return}
  let res;if(isNew){row.email=email;if(!lead)row.access=row.access||"caregiver";
   if((row.access||"caregiver")==="caregiver"&&row.caregiver_type!=="Contracted Provider"&&row.caregiver_type!=="Staff"){const same=APPROVED.find(x=>isHomeRow(x)&&row.home_label&&x.home_label===row.home_label);
    if(same&&!["Withdrawn","Closed"].includes(same.standing)){row.standing=same.standing||"Active";row.standing_since=same.standing_since;row.adoption_motivated=!!same.adoption_motivated}else row.standing=$("#ast")?$("#ast").value:"Applicant"}res=await BHC.client().from("approved_people").insert(row)}else res=await BHC.client().from("approved_people").update(row).eq("email",email);
  if(res.error){toast(/duplicate|unique/i.test(res.error.message)?"That email is already on the list":"Could not save: "+res.error.message);return}
  BHC.log(isNew?"approve_add":"approve_edit",email);await loadApproved();await load().catch(()=>{});toast("Saved");renderPeople()}}

/* ---------- BH sites and logins (leadership only; no passwords) ---------- */
let SITES=[];const SITE_CATS=["Families and licensing","State and contracts","Training and certification","Website and tech","BHA","Other"];
async function renderSites(){$("#view").innerHTML=nav("sites")+`<div class="card">Loading…</div>`;wireNav();
 const{data,error}=await BHC.client().from("bh_sites").select("*").order("name");if(error){$("#view").innerHTML=nav("sites")+`<div class="card">Could not load: ${esc(error.message)}</div>`;wireNav();return}SITES=data||[];
 const cats=SITE_CATS.concat([...new Set(SITES.map(x=>x.cat||"Other"))].filter(c=>!SITE_CATS.includes(c)));
 let h=nav("sites")+`<h1>BH sites and logins</h1><p class="lead">The websites Benevolent House uses, who signs in, and how. Only leadership can see this page. Keep passwords in your password manager, not here.</p><div class="bar"><button class="btn sm" id="sadd">Add a site</button></div>`;
 cats.forEach(c=>{const rows=SITES.filter(x=>(x.cat||"Other")===c);if(!rows.length)return;h+=`<h2>${esc(c)}</h2><div class="tscroll"><table><thead><tr><th>Site</th><th>Used for</th><th>Sign-in</th><th>Who</th><th>Notes</th><th class="noprint"></th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`:esc(x.name)}</b></td><td>${esc(x.use)}</td><td class="small">${esc(x.login)}</td><td class="small">${esc(x.who)}</td><td class="small">${esc(x.notes)}</td><td class="noprint"><button class="btn ghost sm" data-site="${esc(x.id)}">Edit</button></td></tr>`).join("")}</tbody></table></div>`});
 $("#view").innerHTML=h;wireNav();$("#sadd").onclick=()=>editSite(null);document.querySelectorAll("[data-site]").forEach(b=>b.onclick=()=>editSite(SITES.find(x=>x.id===b.dataset.site)))}
function editSite(x){const isNew=!x;x=x||{name:"",cat:"Other",url:"",login:"",use:"",who:"",notes:""};
 const f=(id,l,v,ph)=>`<label for="${id}">${l}</label><input id="${id}" type="text" value="${esc(v||"")}" placeholder="${esc(ph||"")}">`;
 $("#view").innerHTML=nav("sites")+`<h1>${isNew?"Add a site":"Edit "+esc(x.name)}</h1><div class="card"><div class="row2"><div>${f("sn","Site name",x.name)}</div><div><label for="sc">Category</label><select id="sc">${(SITE_CATS.includes(x.cat||"Other")?SITE_CATS:SITE_CATS.concat([x.cat])).map(c=>`<option ${c===(x.cat||"Other")?"selected":""}>${esc(c)}</option>`).join("")}</select></div></div>
 ${f("su","Web address",x.url,"https://")}${f("sl","How you sign in (username or account, never the password)",x.login)}${f("se","Used for",x.use)}${f("sw","Who has access",x.who)}${f("so","Notes",x.notes)}
 <p style="margin-top:14px"><button class="btn" id="ssave">Save</button> <button class="btn ghost" id="scancel">Cancel</button>${isNew?"":` <button class="btn ghost" id="sdel" style="float:right">Delete</button>`}</p></div>`;
 wireNav();$("#scancel").onclick=renderSites;
 $("#ssave").onclick=async()=>{const row={name:$("#sn").value.trim(),cat:$("#sc").value,url:$("#su").value.trim(),login:$("#sl").value.trim(),use:$("#se").value.trim(),who:$("#sw").value.trim(),notes:$("#so").value.trim()};
  if(!row.name){toast("Enter the site name");return}if(row.url&&!/^https?:\/\//i.test(row.url))row.url="https://"+row.url;if(/password|pwd|passcode|pw:/i.test(row.login+" "+row.notes+" "+row.use)&&!confirm2()){return}
  const b=$("#ssave");b.disabled=true;const res=isNew?await BHC.client().from("bh_sites").insert(row):await BHC.client().from("bh_sites").update(row).eq("id",x.id);b.disabled=false;
  if(res.error){toast("Could not save: "+res.error.message);return}BHC.log("site_edit",row.name);toast("Saved");renderSites()};
 $("#sdel")&&($("#sdel").onclick=async()=>{if(!confirmRemove("site:"+x.id))return;const{error}=await BHC.client().from("bh_sites").delete().eq("id",x.id);if(error){toast("Could not delete: "+error.message);return}BHC.log("site_delete",x.name);toast("Deleted");renderSites()})}
let pwWarned=0;function confirm2(){if(Date.now()-pwWarned<6000)return true;pwWarned=Date.now();toast("Please do not save passwords here. Press Save again if this is not a password.");return false}
let idleT=null;function idle(){clearTimeout(idleT);idleT=setTimeout(async()=>{await BHC.signOut();location.reload()},30*60*1000)}
["click","keydown","mousemove","touchstart"].forEach(ev=>document.addEventListener(ev,idle,{passive:true}));
async function start(u){
 let p;try{p=await BHC.profile(true)}catch(e){}
 if(!p){$("#view").innerHTML=`<div class="card"><h1>This page is for Benevolent House staff</h1><p>Your email is not set up for the admin page. Your own trainings are on the <a href="../">portal home</a>.</p><p><button class="btn ghost sm" id="so">Sign out</button></p></div>`;$("#so").onclick=async()=>{await BHC.signOut();location.reload()};return}
 ME=p;try{const r=await BHC.client().rpc("my_permissions");PERMS=r.data||[]}catch(e){PERMS=[]}
 $("#who").textContent=(p.full_name||p._email);$("#hdrOut").classList.remove("hidden");$("#hdrOut").onclick=async()=>{await BHC.signOut();location.reload()};
 if(!(can("view_training")||can("manage_families"))){$("#view").innerHTML=`<div class="card"><h1>This page is for Benevolent House staff</h1><p>You are signed in as ${esc(p.full_name||p._email)}. Your own trainings and certificates are on the <a href="../">portal home</a>.</p><p><button class="btn ghost sm" id="so">Sign out</button></p></div>`;$("#so").onclick=async()=>{await BHC.signOut();location.reload()};return}
 idle();try{BHC.visit()}catch(e){}$("#view").innerHTML=`<div class="card">Loading…</div>`;
 try{await Promise.all([can("view_training")?load():Promise.resolve(),loadApproved(),loadQuestions()])}catch(e){$("#view").innerHTML=`<div class="card">Could not load records: ${esc(e.message||e)}</div>`;return}
 BHC.log("open_admin","");startBeats();const an=$("#actNotice");if(an)an.hidden=false;renderToday()}

(async function(){
 if(!window.BHC||!BHC.available()){$("#view").innerHTML=`<div class="card">The admin page needs an internet connection. Please check your connection and refresh.</div>`;return}
 const s=await BHC.session();
 if(s){start();return}
 $("#view").innerHTML=`<h1>Staff Dashboard</h1><p class="lead">Sign in with your Benevolent House email to see every caregiver's training records.</p><div class="card" id="host"></div>`;
 BHSignIn($("#host"),()=>start(),{roles:["Staff","Foster Caregiver","Kinship Caregiver","Adoptive Parent","Foster and Adoptive Caregiver","Contracted Provider"]});
})();
