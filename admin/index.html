<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benevolent House Training Admin</title>
<meta name="robots" content="noindex">
<style>
:root{--brown:#7B4B2A;--brown-dk:#5E3920;--green:#2E7D4F;--green-dk:#226040;--cream:#FBF7F2;--sand:#F1E8DD;--ink:#2B2320;--muted:#6B5F58;--line:#E3D7C9;--red:#B23A3A;--amber:#9A6A00;--amber-bg:#FFF4D6;--red-bg:#FBE9E7;--green-bg:#E3F3E9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}
a{color:var(--green)}
button,input,select{font-family:inherit;font-size:1rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:0;border-radius:9px;padding:.65rem 1.05rem;font-weight:700;background:var(--green);color:#fff;cursor:pointer}
.btn:hover{background:var(--green-dk)}.btn.ghost{background:#fff;color:var(--brown);border:2px solid var(--brown)}.btn.ghost:hover{background:var(--sand)}
.btn.sm{padding:.4rem .7rem;font-size:.88rem;border-radius:7px}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,tr:focus-visible{outline:3px solid var(--brown);outline-offset:2px}
header.top{background:#fff;border-bottom:4px solid var(--brown)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.topbar img{height:48px}.brand{font-weight:700;color:var(--brown);font-size:1.1rem;line-height:1.1}.brand small{display:block;color:var(--muted);font-weight:400;font-size:.8rem;margin-top:3px}
.spacer{flex:1}.chip{background:var(--sand);border-radius:999px;padding:.3rem .8rem;font-size:.88rem;color:var(--brown-dk)}
main{padding-block:24px 60px}
h1{font-size:1.7rem;color:var(--brown);margin:.2rem 0 .4rem;line-height:1.2}
h2{font-size:1.25rem;color:var(--brown);margin:1.4rem 0 .5rem}
.lead{color:var(--muted);margin:0 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:12px 0}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:14px 0}
@media(max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile b{display:block;font-size:1.7rem;color:var(--brown);font-variant-numeric:tabular-nums}.tile span{color:var(--muted);font-size:.88rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.bar input,.bar select{padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:0}
.bar input{flex:1 1 220px}
.tscroll{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:#FCFAF7;position:sticky;top:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:#FCF8F2}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:.15rem .6rem;font-size:.75rem;font-weight:700;white-space:nowrap}
.ok{background:var(--green-bg);color:var(--green-dk)}.due{background:var(--amber-bg);color:var(--amber)}.over{background:var(--red-bg);color:var(--red)}.none{background:var(--sand);color:var(--brown-dk)}.self{background:#EAF0FB;color:#2B4C8C}
.muted{color:var(--muted)}.small{font-size:.86rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.row2{grid-template-columns:1fr}}
label{display:block;font-weight:600;margin:10px 0 4px}
.card input,.card select{width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:8px;background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.hidden{display:none!important}
.printhead{display:none}
#cert{background:#fff;max-width:980px;margin:0 auto;padding:14px;border:3px solid var(--brown);aspect-ratio:11/8.5}
#cert .c-in{border:1.5px solid #C9A227;height:100%;padding:34px 48px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%,#FBF7F2,#fff 60%)}
#cert .c-logo{height:74px}#cert .c-org{font-family:Georgia,serif;font-size:1.45rem;color:var(--brown);font-weight:700;margin-top:4px}#cert .c-tag{font-size:.8rem;letter-spacing:.06em;color:var(--muted);font-style:italic}
#cert .c-title{font-family:Georgia,serif;font-size:2.5rem;color:var(--brown);margin:18px 0 6px;letter-spacing:.02em}#cert .c-small{margin:6px 0;color:var(--muted);font-size:1rem}
#cert .c-name{font-family:Georgia,serif;font-size:2.3rem;color:var(--ink);border-bottom:1.5px solid #C9A227;padding:0 40px 6px;margin:4px 0 8px}
#cert .c-course{font-size:1.45rem;font-weight:700;color:var(--green-dk);max-width:760px}#cert .c-meta{margin:10px 0 0;color:var(--ink)}
#cert .c-sigs{display:flex;gap:70px;justify-content:center;margin-top:34px}#cert .c-sigs div{min-width:240px;font-size:.85rem;color:var(--muted)}#cert .c-sigs span{display:block;font-family:Georgia,serif;font-size:1.05rem;color:var(--ink);min-height:1.4em}#cert .c-sigs b{display:block;border-top:1px solid var(--ink);margin:4px 0}
#cert .c-foot{margin-top:22px;font-size:.75rem;color:var(--muted)}
.printdoc{display:none}
.pd-head{display:flex;align-items:center;gap:14px;border-bottom:3px solid #7B4B2A;padding-bottom:10px}.pd-head img{height:56px}.pd-org{font-family:Georgia,serif;font-size:20px;color:#7B4B2A;font-weight:700}.pd-addr{font-size:10.5px;color:#6B5F58}.pd-title{margin-left:auto;font-family:Georgia,serif;font-size:19px;color:#2B2320}
.pd-info{width:100%;margin:12px 0;border-collapse:collapse}.pd-info td{border:1px solid #E3D7C9;padding:6px 8px;font-size:12px;font-weight:700}.pd-info span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#6B5F58;font-weight:400}
.pd-log{width:100%;border-collapse:collapse;font-size:11px}.pd-log th{background:#F1E8DD!important;color:#5E3920;text-transform:uppercase;font-size:9px;letter-spacing:.05em;padding:6px;border:1px solid #E3D7C9;-webkit-print-color-adjust:exact;print-color-adjust:exact}.pd-log td{padding:5px 6px;border:1px solid #E3D7C9}.pd-log .r{text-align:right}.pd-log tr.missing td,.pd-log td.late{color:#9A2F1F}.pd-log td.late{font-weight:700}.pd-log tfoot td{font-weight:700;background:#FBF7F2}
.pd-sign{display:flex;gap:40px;margin-top:34px;font-size:10.5px;color:#6B5F58}.pd-sign div{flex:1}.pd-sign div:last-child{flex:0 0 160px}.pd-sign b{display:block;border-top:1px solid #2B2320;margin-bottom:3px}.pd-foot{font-size:9.5px;color:#6B5F58;margin-top:14px}
@media print{
 header.top,.noprint,.bar,.toast{display:none!important}
 body{background:#fff;font-size:12px}main{padding:0}.wrap{max-width:none;padding:0}
 .card,.tscroll{border:0;padding:0;margin:0}.printhead{display:block;margin-bottom:10px}
 th{background:#fff;position:static}table{font-size:11px}thead{display:table-header-group}tr{page-break-inside:avoid}
 html,body{background:#fff!important}.printdoc{display:block}.screenonly{display:none}
 #cert{border:3px solid #7B4B2A;max-width:none;aspect-ratio:auto;height:7.1in;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@page{margin:.5in}
</style>
</head>
<body>
<header class="top"><div class="wrap topbar"><img src="../bh-logo.png" alt="Benevolent House"><div class="brand">Benevolent House<small>Training Admin</small></div><span class="spacer"></span><span class="chip" id="who">Not signed in</span><a class="btn ghost sm noprint" href="../">Portal home</a></div></header>
<main class="wrap"><section id="view"></section></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../catalog.js"></script>
<script src="../vendor/supabase-2.117.3.js"></script>
<script src="../bh-cloud.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
const fmt=d=>d?new Date(d).toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"}):"";
const fmtShort=d=>d?new Date(d).toLocaleDateString("en-US",{month:"2-digit",day:"2-digit",year:"numeric"}):"";
const CAT=window.CATALOG||[];
let ME=null,PEOPLE=[],COMPS=[],LEGACY=[],ACT=[],filter="",homeFilter="",sel=null;

function dueOf(c,comp){return comp?window.BH_DUE(c,comp.completed_at):c.cycle==="quarter"?window.BH_DUE(c,null):null}
const nm=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," ");
const typeOf=p=>p.caregiver_type||"Foster Caregiver";
function catFor(p){const m=latestBy(p.id);const known=new Set(CAT.map(c=>c.code));
 return CAT.filter(c=>window.BH_FOR(c,typeOf(p))||m[c.code]).concat(Object.values(m).filter(r=>!known.has(r.course_code)).map(r=>({code:r.course_code,title:r.course_title||r.course_code,hours:r.hours,freq:"Earlier record",renew:0,group:"Other"})))}
function statusOf(c,comp){
 if(!comp&&c.cycle!=="quarter")return c.req?{k:"none",t:"Not yet completed"}:{k:"",t:""};
 const due=dueOf(c,comp);if(!due)return{k:"ok",t:"Complete"};
 const days=(due-Date.now())/864e5;if(days<0)return{k:"over",t:"Past due"};if(days<=BH_WINDOW(c))return{k:"due",t:"Due in "+Math.ceil(days)+" days"};if(!comp)return{k:"none",t:"Due by "+fmtShort(due)};return{k:"ok",t:"Current"}}
function latestBy(userId){const m={};COMPS.filter(r=>r.user_id===userId&&!r.voided).forEach(r=>{if(!m[r.course_code]||new Date(r.completed_at)>new Date(m[r.course_code].completed_at))m[r.course_code]=r});return m}
function summary(p){const m=latestBy(p.id);let done=0,due=0,over=0,missing=0;catFor(p).forEach(c=>{const r=m[c.code];if(!r&&!(c.req&&window.BH_FOR(c,typeOf(p))))return;const s=statusOf(c,r).k;if(s==="ok")done++;else if(s==="due")due++;else if(s==="over")over++;else if(s==="none")missing++});return{done,due,over,missing,last:Object.values(m).sort((a,b)=>new Date(b.completed_at)-new Date(a.completed_at))[0]}}

async function all(q){let out=[],i=0;for(;;){const{data,error}=await q().range(i,i+999);if(error)throw error;out=out.concat(data||[]);if(!data||data.length<1000)return out;i+=1000}}
async function load(){const c=BHC.client();const since=new Date(Date.now()-120*864e5).toISOString();
 const[p,r,l,a,ap]=await Promise.all([all(()=>c.from("profiles").select("id,email,full_name,home_label,caregiver_type,role,created_at").order("full_name").order("id")),
  all(()=>c.from("completions").select("id,user_id,course_code,course_title,hours,completed_at,score,total,attempt,answers,source,verified_by,acknowledgment,trainer,voided,edits,file_path").order("completed_at",{ascending:false}).order("id")),
  all(()=>c.from("legacy_training").select("id,person_name,home_label,course_code,course_title,completed_on,hours,source,trainer,voided,edits").order("id")).catch(()=>[]),
  all(()=>c.from("access_log").select("actor,action,target,at").in("action",["sign_in","visit","course_done"]).gte("at",since).order("at",{ascending:false}).order("id",{ascending:false})).catch(()=>[]),
  c.from("approved_people").select("*").order("home_label")]);
 PEOPLE=p;COMPS=r;LEGACY=l;ACT=a;if(!ap.error)APPROVED=ap.data||[];
 /* earlier records from the BH tracker and Drive: matched to a signed-in person by name, otherwise listed on their own */
 /* matched on the name staff set on the approved list for that sign-in email, the same rule the database uses */
 const apName={},nameCount={};APPROVED.forEach(x=>{if(x.active&&x.full_name){const k=nm(x.full_name);nameCount[k]=(nameCount[k]||0)+1}});APPROVED.forEach(x=>{if(x.active&&x.full_name&&nameCount[nm(x.full_name)]===1)apName[x.email]=nm(x.full_name)});const byName={},dup=new Set();
 PEOPLE.forEach(x=>{const k=apName[(x.email||"").toLowerCase()];if(!k)return;if(byName[k])dup.add(k);byName[k]=x});dup.forEach(k=>delete byName[k]);const extra={};
 LEGACY.forEach(L=>{let who=byName[nm(L.person_name)];if(!who){const k="legacy:"+nm(L.person_name);who=extra[k]=extra[k]||{id:k,email:"",full_name:L.person_name,home_label:L.home_label,caregiver_type:"",role:"not signed in yet",legacy:true}}
  COMPS.push({id:"L"+L.id,legacyId:L.id,user_id:who.id,course_code:L.course_code,course_title:L.course_title,hours:L.hours,completed_at:L.completed_on+"T12:00:00",source:"record",trainer:L.trainer||null,record_src:L.source,verified_by:"record",legacy:true,voided:!!L.voided,edits:L.edits||[]})});
 PEOPLE=PEOPLE.concat(Object.values(extra)).sort((a,b)=>nm(a.full_name).localeCompare(nm(b.full_name)))}
function activity(id){const ev=ACT.filter(x=>x.actor===id);const t0=new Date();t0.setHours(0,0,0,0);t0.setDate(t0.getDate()-6);const wk=t0.getTime();const days=new Set(ev.filter(x=>new Date(x.at)>wk).map(x=>new Date(x.at).toDateString()));return{last:ev[0]?ev[0].at:null,week:days.size,ev}}
const fmtWhen=d=>d?new Date(d).toLocaleString("en-US",{month:"2-digit",day:"2-digit",year:"numeric",hour:"numeric",minute:"2-digit"}):"";
const whoName=id=>{const x=PEOPLE.find(p=>p.id===id);return x?(x.full_name||x.email):"Staff"};


/* T3C rollout: each active caregiver on the approved list, and whether they finished the two online T3C trainings in the portal */
const T3C_CODES=[["T3C-PP","T3C Policy and Procedure"],["HT","Universal Human Trafficking"]],T3C_SINCE="2026-11-09";
/* a second email for the same caregiver (alias_of) counts toward that caregiver, not as another person */
function t3cRows(){return APPROVED.filter(a=>a.active&&a.access==="caregiver"&&!a.alias_of).map(a=>{const mails=[a.email].concat(APPROVED.filter(x=>x.alias_of===a.email).map(x=>x.email));const ps=PEOPLE.filter(x=>mails.includes((x.email||"").toLowerCase()));const ids=ps.map(x=>x.id);const p=ps[0];
 const got=T3C_CODES.map(([c])=>{if(!p)return null;const r=COMPS.filter(x=>ids.includes(x.user_id)&&x.course_code===c&&!x.voided&&!x.legacy&&x.completed_at>=T3C_SINCE).sort((x,y)=>y.completed_at.localeCompare(x.completed_at))[0];return r?r.completed_at:null});
 return{a,p,got,done:got.every(Boolean)}}).sort((x,y)=>(x.done-y.done)||(x.a.home_label||"").localeCompare(y.a.home_label||""))}
function t3cPanel(){if(!APPROVED.length)return "";const R=t3cRows();const done=R.filter(r=>r.done).length;const open=R.filter(r=>!r.done);
 return `<div class="card" id="t3cCard"><h2 style="margin-top:0">T3C trainings due Tuesday, November 17</h2><p class="muted" style="margin-top:0">Every active caregiver completes both online trainings in the portal: ${T3C_CODES.map(x=>x[1]).join(" and ")}. Earlier human trafficking records do not count here, because the T3C credential calls for the DFPS Universal course.</p>
 <div class="tiles"><div class="tile"><b>${done} of ${R.length}</b><span>caregivers finished both</span></div><div class="tile"><b>${R.filter(r=>r.p).length}</b><span>have signed in</span></div><div class="tile"><b>${open.length}</b><span>still to finish</span></div></div>
 <details ${open.length?"open":""}><summary><b>See each caregiver</b></summary><div class="tscroll"><table><thead><tr><th>Caregiver</th><th>Home</th><th>Signed in</th>${T3C_CODES.map(x=>`<th>${esc(x[1])}</th>`).join("")}</tr></thead><tbody>${R.map(r=>`<tr><td><b>${esc(r.a.full_name||r.a.email)}</b><br><span class="small muted">${esc(r.a.email)}</span></td><td>${esc(r.a.home_label||"")}</td><td>${r.p?"Yes":`<span class="muted">Not yet</span>`}</td>${r.got.map(g=>`<td class="num">${g?`<span class="pill ok">${esc(fmtShort(g))}</span>`:`<span class="pill none">Not done</span>`}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
 ${open.length?`<p><button class="btn ghost sm noprint" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(open.map(r=>r.a.email).join("; ")))}).then(()=>{this.textContent='Copied ${open.length} emails'})">Copy the emails of those not finished</button> <span class="small muted">Paste into BCC for a reminder.</span></p>`:""}</details></div>`}
function renderList(){
 const homes=[...new Set(PEOPLE.map(p=>p.home_label).filter(Boolean))].sort();
 const rows=PEOPLE.filter(p=>(!homeFilter||p.home_label===homeFilter)&&(!filter||(p.full_name+" "+p.email+" "+(p.home_label||"")).toLowerCase().includes(filter)));
 const S=rows.map(p=>({p,s:summary(p)}));
 const tot={people:rows.length,over:S.filter(x=>x.s.over).length,due:S.filter(x=>x.s.due).length,missing:S.filter(x=>x.s.missing).length};
 let h=nav("records")+`<h1>Training records</h1><p class="lead">Every caregiver and staff member, what is complete, what is coming due, and when they were last in the portal. Earlier records from the BH tracker and Drive are included. Click a name for that person's training log.</p>
 <div class="tiles"><div class="tile"><b>${tot.people}</b><span>people shown</span></div><div class="tile"><b>${rows.filter(p=>activity(p.id).week).length}</b><span>in the portal this week</span></div><div class="tile"><b>${tot.over}</b><span>with a past-due training</span></div><div class="tile"><b>${tot.due}</b><span>with one due within 90 days</span></div><div class="tile"><b>${tot.missing}</b><span>missing a required training</span></div></div>
 <div class="bar"><input id="q" type="search" placeholder="Search by name, email or home" value="${esc(filter)}" aria-label="Search"><select id="hf" aria-label="Filter by home"><option value="">All homes</option>${homes.map(x=>`<option ${x===homeFilter?"selected":""}>${esc(x)}</option>`).join("")}</select>${homeFilter&&can("print_records")?`<button class="btn ghost sm" id="homeLog">Print this home's logs</button>`:""}</div>`;
 if(!PEOPLE.length)h+=`<div class="card"><b>No one has signed in yet.</b><p class="muted">When caregivers sign in at the portal, they appear here automatically with their completed trainings.</p></div>`;
 else h+=`<div class="tscroll"><table><thead><tr><th>Name</th><th>Home</th><th>Type</th><th>Required trainings</th><th>Most recent</th><th>Last active</th><th>Days active this week</th></tr></thead><tbody>${S.map(({p,s})=>`<tr class="click" tabindex="0" data-id="${esc(p.id)}"><td><b>${esc(p.full_name||"(no name yet)")}</b><br><span class="small muted">${esc(p.email)}</span></td><td>${esc(p.home_label||"")}</td><td>${esc(p.caregiver_type||"")}</td><td>${s.over?`<span class="pill over">${s.over} past due</span> `:""}${s.due?`<span class="pill due">${s.due} due soon</span> `:""}${s.missing?`<span class="pill none">${s.missing} not done</span> `:""}${!s.over&&!s.due&&!s.missing?`<span class="pill ok">All current</span>`:""}</td><td class="num">${s.last?esc(fmtShort(s.last.completed_at))+`<br><span class="small muted">${esc(s.last.course_code)}</span>`:"<span class='muted'>None</span>"}</td>${(()=>{const a=activity(p.id);return `<td class="num">${p.legacy?`<span class="muted">Not signed in yet</span>`:a.last?esc(fmtWhen(a.last)):`<span class="muted">No visits yet</span>`}</td><td class="num">${p.legacy?"":esc(a.week)}</td>`})()}</tr>`).join("")}</tbody></table></div>`;
 h=h.replace('<div class="tiles">',t3cPanel()+'<div class="tiles">');
 $("#view").innerHTML=h;wireNav();
 $("#q")&&($("#q").oninput=e=>{filter=e.target.value.toLowerCase();const pos=e.target.selectionStart;renderList();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)});
 $("#hf")&&($("#hf").onchange=e=>{homeFilter=e.target.value;renderList()});
 $("#homeLog")&&($("#homeLog").onclick=()=>renderHomeLogs(homeFilter));
 document.querySelectorAll("tr.click").forEach(tr=>{const go=()=>renderPerson(tr.dataset.id);tr.onclick=go;tr.onkeydown=e=>{if(e.key==="Enter")go()}})}

function howOf(r){if(r.source==="portal")return "Portal course"+(r.score!=null?` (${esc(r.score)}/${esc(r.total||"")})`:"");if(r.source==="record")return "BH record";const base=r.source==="upload"?"Certificate":r.source==="live"?"Recorded":"Backfill";return base+(!r.verified_by?` <span class="pill self">Self-reported</span>`:` <span class="pill ok">Verified</span>`)}
const canFix=p=>can("record_trainings")&&p.id!==ME.id&&!p.legacy&&(ME.role==="leadership"||p.role==="caregiver");
const canFixRec=(p,r)=>r&&(r.legacy?can("record_trainings")&&p.id!==ME.id:canFix(p));

 <p class="small muted">${rows.length} shown. Emails from the BH tracker's Email Distribution List were loaded on November 9, 2026. The full name on each email connects that person's earlier training records, so enter it exactly as it appears on their training record.</p>`;
 $("#view").innerHTML=h;wireNav();
 $("#pq").oninput=e=>{pFilter=e.target.value.toLowerCase();const pos=e.target.selectionStart;renderPeople();const q=$("#pq");q.focus();q.setSelectionRange(pos,pos)};
 $("#poff").onchange=e=>{pShowOff=e.target.checked;renderPeople()};
 $("#padd")&&($("#padd").onclick=()=>editPerson(null));
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editPerson(APPROVED.find(a=>a.email===b.dataset.edit)))}
function editPerson(a){const isNew=!a;a=a||{email:"",full_name:"",home_label:"",caregiver_type:"Foster Caregiver",access:"caregiver",active:true,permissions:[],notes:""};const lead=ME.role==="leadership";
 $("#view").innerHTML=nav("people")+`<h1>${isNew?"Add a person":"Edit "+esc(a.email)}</h1><div class="card">
 <div class="row2"><div><label for="ae">Email</label><input id="ae" type="email" value="${esc(a.email)}" ${isNew?"":"disabled"}></div><div><label for="an">Full name</label><input id="an" type="text" value="${esc(a.full_name||"")}" placeholder="Filled in when they first sign in, if left blank"></div></div>
 <div class="row2"><div><label for="ah">Foster home or staff role</label><input id="ah" type="text" value="${esc(a.home_label||"")}" placeholder="e.g., Johnson, Mark & Lisa"></div><div><label for="at">Type</label><select id="at">${TYPES.map(t=>`<option ${t===a.caregiver_type?"selected":""}>${t}</option>`).join("")}</select></div></div>
 ${lead?`<label for="aa">Access level</label><select id="aa">${["caregiver","staff","leadership"].map(r=>`<option ${r===a.access?"selected":""}>${r}</option>`).join("")}</select>
 <div id="permBox" style="${a.access==="staff"?"":"display:none"}"><label>Permission switches</label>${Object.entries(PERM_LABELS).map(([k,v])=>`<label style="display:flex;gap:8px;align-items:center;font-weight:400;margin:6px 0"><input type="checkbox" class="perm" value="${k}" ${(a.permissions||[]).includes(k)?"checked":""} style="width:auto"> ${esc(v)}</label>`).join("")}</div>`:`<p class="small muted">Access level: caregiver. Only leadership can approve staff.</p>`}
 <label for="ano">Notes (optional, no child information)</label><input id="ano" type="text" maxlength="300" value="${esc(a.notes||"")}">
 <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="aact" ${a.active?"checked":""} style="width:auto"> Active (can use the portal)</label>
 <p style="margin-top:14px"><button class="btn" id="asave">Save</button> <button class="btn ghost" id="acancel">Cancel</button></p></div>`;
 wireNav();$("#acancel").onclick=renderPeople;
 $("#aa")&&($("#aa").onchange=e=>{$("#permBox").style.display=e.target.value==="staff"?"":"none"});
 $("#asave").onclick=async()=>{const email=(isNew?$("#ae").value:a.email).trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast("Enter a valid email");return}
  const row={full_name:$("#an").value.trim()||null,home_label:$("#ah").value.trim()||null,caregiver_type:$("#at").value,notes:$("#ano").value.trim()||null,active:$("#aact").checked};
  if(lead){row.access=$("#aa").value;row.permissions=row.access==="staff"?[...document.querySelectorAll(".perm:checked")].map(x=>x.value):[]}
  if(lead&&email===(ME._email||"").toLowerCase()&&(row.access!=="leadership"||!row.active)){toast("You cannot remove your own leadership access");return}
  let res;if(isNew){row.email=email;if(!lead)row.access="caregiver";res=await BHC.client().from("approved_people").insert(row)}else res=await BHC.client().from("approved_people").update(row).eq("email",email);
  if(res.error){toast(/duplicate|unique/i.test(res.error.message)?"That email is already on the list":"Could not save: "+res.error.message);return}
  BHC.log(isNew?"approve_add":"approve_edit",email);await loadApproved();await load().catch(()=>{});toast("Saved");renderPeople()}}

/* ---------- BH sites and logins (leadership only; no passwords) ---------- */
let SITES=[];const SITE_CATS=["Families and licensing","State and contracts","Training and certification","Website and tech","BHA","Other"];
async function renderSites(){$("#view").innerHTML=nav("sites")+`<div class="card">Loading…</div>`;wireNav();
 const{data,error}=await BHC.client().from("bh_sites").select("*").order("name");if(error){$("#view").innerHTML=nav("sites")+`<div class="card">Could not load: ${esc(error.message)}</div>`;wireNav();return}SITES=data||[];
 const cats=SITE_CATS.concat([...new Set(SITES.map(x=>x.cat||"Other"))].filter(c=>!SITE_CATS.includes(c)));
 let h=nav("sites")+`<h1>BH sites and logins</h1><p class="lead">The websites Benevolent House uses, who signs in, and how. Only leadership can see this page. Keep passwords in your password manager, not here.</p><div class="bar"><button class="btn sm" id="sadd">Add a site</button></div>`;
 cats.forEach(c=>{const rows=SITES.filter(x=>(x.cat||"Other")===c);if(!rows.length)return;h+=`<h2>${esc(c)}</h2><div class="tscroll"><table><thead><tr><th>Site</th><th>Used for</th><th>Sign-in</th><th>Who</th><th>Notes</th><th class="noprint"></th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`:esc(x.name)}</b></td><td>${esc(x.use)}</td><td class="small">${esc(x.login)}</td><td class="small">${esc(x.who)}</td><td class="small">${esc(x.notes)}</td><td class="noprint"><button class="btn ghost sm" data-site="${esc(x.id)}">Edit</button></td></tr>`).join("")}</tbody></table></div>`});
 $("#view").innerHTML=h;wireNav();$("#sadd").onclick=()=>editSite(null);document.querySelectorAll("[data-site]").forEach(b=>b.onclick=()=>editSite(SITES.find(x=>x.id===b.dataset.site)))}
function editSite(x){const isNew=!x;x=x||{name:"",cat:"Other",url:"",login:"",use:"",who:"",notes:""};
 const f=(id,l,v,ph)=>`<label for="${id}">${l}</label><input id="${id}" type="text" value="${esc(v||"")}" placeholder="${esc(ph||"")}">`;
 $("#view").innerHTML=nav("sites")+`<h1>${isNew?"Add a site":"Edit "+esc(x.name)}</h1><div class="card"><div class="row2"><div>${f("sn","Site name",x.name)}</div><div><label for="sc">Category</label><select id="sc">${(SITE_CATS.includes(x.cat||"Other")?SITE_CATS:SITE_CATS.concat([x.cat])).map(c=>`<option ${c===(x.cat||"Other")?"selected":""}>${esc(c)}</option>`).join("")}</select></div></div>
 ${f("su","Web address",x.url,"https://")}${f("sl","How you sign in (username or account, never the password)",x.login)}${f("se","Used for",x.use)}${f("sw","Who has access",x.who)}${f("so","Notes",x.notes)}
 <p style="margin-top:14px"><button class="btn" id="ssave">Save</button> <button class="btn ghost" id="scancel">Cancel</button>${isNew?"":` <button class="btn ghost" id="sdel" style="float:right">Delete</button>`}</p></div>`;
 wireNav();$("#scancel").onclick=renderSites;
 $("#ssave").onclick=async()=>{const row={name:$("#sn").value.trim(),cat:$("#sc").value,url:$("#su").value.trim(),login:$("#sl").value.trim(),use:$("#se").value.trim(),who:$("#sw").value.trim(),notes:$("#so").value.trim()};
  if(!row.name){toast("Enter the site name");return}if(row.url&&!/^https?:\/\//i.test(row.url))row.url="https://"+row.url;if(/password|pwd|passcode|pw:/i.test(row.login+" "+row.notes+" "+row.use)&&!confirm2()){return}
  const b=$("#ssave");b.disabled=true;const res=isNew?await BHC.client().from("bh_sites").insert(row):await BHC.client().from("bh_sites").update(row).eq("id",x.id);b.disabled=false;
  if(res.error){toast("Could not save: "+res.error.message);return}BHC.log("site_edit",row.name);toast("Saved");renderSites()};
 $("#sdel")&&($("#sdel").onclick=async()=>{if(!confirmRemove("site:"+x.id))return;const{error}=await BHC.client().from("bh_sites").delete().eq("id",x.id);if(error){toast("Could not delete: "+error.message);return}BHC.log("site_delete",x.name);toast("Deleted");renderSites()})}
let pwWarned=0;function confirm2(){if(Date.now()-pwWarned<6000)return true;pwWarned=Date.now();toast("Please do not save passwords here. Press Save again if this is not a password.");return false}
let idleT=null;function idle(){clearTimeout(idleT);idleT=setTimeout(async()=>{await BHC.signOut();location.reload()},30*60*1000)}
["click","keydown","mousemove","touchstart"].forEach(ev=>document.addEventListener(ev,idle,{passive:true}));
async function start(u){
 let p;try{p=await BHC.profile(true)}catch(e){}
 if(!p){$("#view").innerHTML=`<div class="card"><h1>This page is for Benevolent House staff</h1><p>Your email is not set up for the admin page. Your own trainings are on the <a href="../">portal home</a>.</p><p><button class="btn ghost sm" id="so">Sign out</button></p></div>`;$("#so").onclick=async()=>{await BHC.signOut();location.reload()};return}
 ME=p;try{const r=await BHC.client().rpc("my_permissions");PERMS=r.data||[]}catch(e){PERMS=[]}
 $("#who").textContent=(p.full_name||p._email)+" · "+p.role;
 if(!(can("view_training")||can("manage_families"))){$("#view").innerHTML=`<div class="card"><h1>This page is for Benevolent House staff</h1><p>You are signed in as ${esc(p.full_name||p._email)}. Your own trainings and certificates are on the <a href="../">portal home</a>.</p><p><button class="btn ghost sm" id="so">Sign out</button></p></div>`;$("#so").onclick=async()=>{await BHC.signOut();location.reload()};return}
 idle();try{BHC.visit()}catch(e){}$("#view").innerHTML=`<div class="card">Loading…</div>`;
 try{await Promise.all([can("view_training")?load():Promise.resolve(),loadApproved()])}catch(e){$("#view").innerHTML=`<div class="card">Could not load records: ${esc(e.message||e)}</div>`;return}
 BHC.log("open_admin","");can("view_training")?renderList():renderPeople()}

(async function(){
 if(!window.BHC||!BHC.available()){$("#view").innerHTML=`<div class="card">The admin page needs an internet connection. Please check your connection and refresh.</div>`;return}
 const s=await BHC.session();
 if(s){start();return}
 $("#view").innerHTML=`<h1>Training Admin</h1><p class="lead">Sign in with your Benevolent House email to see every caregiver's training records.</p><div class="card" id="host"></div>`;
 BHSignIn($("#host"),()=>start(),{roles:["Staff","Foster Caregiver","Kinship Caregiver","Adoptive Parent","Foster and Adoptive Caregiver","Contracted Provider"]});
})();
</script>
