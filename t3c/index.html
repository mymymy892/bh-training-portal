<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T3C at Benevolent House</title><meta name="robots" content="noindex">
<style>:root{--brown:#7B4B2A;--brown-dk:#5E3920;--green:#2E7D4F;--green-dk:#226040;--cream:#FBF7F2;--sand:#F1E8DD;--ink:#2B2320;--muted:#6B5F58;--line:#E3D7C9;--gold:#C9A227;--night:#141010;--night2:#1f1816;--red:#B23A3A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:#f5efe8;font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:1rem;cursor:pointer}
a{color:#f3d98b}
.hidden{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(20,16,16,.82);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08)}
.top .wrap{display:flex;align-items:center;gap:12px;padding:8px 16px}
.top img{height:38px}
.top .brand{font-weight:700;color:#fff;font-size:.95rem;line-height:1.1}.top .brand small{display:block;font-weight:400;color:#bdb0a6;font-size:.72rem}
.top .sp{flex:1}
.top .user{font-size:.8rem;color:#e8dccf;background:rgba(255,255,255,.08);border-radius:999px;padding:.3rem .8rem;max-width:50vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:.5rem;border:0;border-radius:12px;padding:.85rem 1.3rem;font-weight:700;background:var(--green);color:#fff;transition:transform .12s,background .15s,box-shadow .15s;box-shadow:0 8px 24px rgba(46,125,79,.35)}
.btn:hover{background:var(--green-dk);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.18)}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn.gold{background:var(--gold);color:#2b1d00;box-shadow:0 8px 24px rgba(201,162,39,.3)}
.btn.sm{padding:.5rem .9rem;font-size:.88rem;border-radius:9px}
/* home / map */
.hero-home{position:relative;border-radius:22px;overflow:hidden;margin:18px 0;min-height:360px;display:flex;align-items:flex-end}
.hero-home img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.03);animation:kb 30s ease-in-out infinite alternate}
.hero-home:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,16,.1) 0%,rgba(20,16,16,.35) 45%,rgba(20,16,16,.92) 100%)}
.hero-home .t{position:relative;z-index:2;padding:30px 30px 28px;max-width:720px}
.hero-home small{display:block;color:#f3d98b;letter-spacing:.16em;text-transform:uppercase;font-size:.72rem;margin-bottom:8px}
.hero-home h1{margin:0 0 10px;font-size:clamp(1.8rem,4.5vw,3rem);line-height:1.05;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.hero-home p{margin:0 0 16px;color:#e8dccf;font-size:1.05rem;max-width:560px}
@keyframes kb{from{transform:scale(1.03) translate(0,0)}to{transform:scale(1.1) translate(-1.5%,-1%)}}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:10px 0 40px}
.ch{position:relative;border-radius:16px;overflow:hidden;background:var(--night2);border:1px solid rgba(255,255,255,.08);min-height:170px;cursor:pointer;transition:transform .15s,border-color .15s}
.ch:hover{transform:translateY(-3px);border-color:rgba(243,217,139,.5)}
.ch img{width:100%;height:110px;object-fit:cover;display:block;filter:saturate(.9)}
.ch .b{padding:10px 12px 12px}
.ch .n{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#f3d98b}
.ch h3{margin:2px 0 4px;font-size:1rem;color:#fff}
.ch .m{font-size:.78rem;color:#bdb0a6}
.ch .ring{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--gold) var(--p,0%),rgba(255,255,255,.18) 0);display:flex;align-items:center;justify-content:center}
.ch .ring i{width:28px;height:28px;border-radius:50%;background:var(--night2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.68rem;color:#fff}
.ch.done .ring{background:var(--green)}.ch.done .ring i{background:var(--green);color:#fff}
.ch.locked{opacity:.55}
.sec{margin:26px 0 8px;display:flex;align-items:baseline;gap:10px}
.sec h2{margin:0;font-size:1.25rem;color:#fff}.sec span{color:#bdb0a6;font-size:.85rem}
/* scene */
.scene{margin:12px 0 40px}
.hero{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:18px;background:#000}
.hero img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04);animation:kb 28s ease-in-out infinite alternate}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3) 0%,rgba(0,0,0,0) 40%,rgba(20,16,16,.85) 100%)}
.chip{position:absolute;top:14px;left:14px;z-index:2;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:.35rem .85rem;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase}
.ref{position:absolute;top:14px;right:14px;z-index:2;background:var(--gold);color:#2b1d00;border-radius:8px;padding:.3rem .65rem;font-weight:700;font-size:.76rem}
.title{position:absolute;left:22px;bottom:18px;z-index:2;max-width:85%}
.hero .chip{max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{display:block;color:#f3d98b;letter-spacing:.14em;text-transform:uppercase;font-size:.7rem;margin-bottom:4px}
.title h1{margin:0;font-size:clamp(1.3rem,3.6vw,2.3rem);line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.55)}
.cap{margin:0;padding:18px 6px 6px;font-size:1.12rem;line-height:1.6;color:#f5efe8;min-height:60px}
.cap span{opacity:.32;transition:opacity .25s}.cap span.on{opacity:1}
.bar{display:flex;align-items:center;gap:12px;padding:8px 6px 14px}
.play{width:54px;height:54px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:1.2rem;flex:none;box-shadow:0 6px 20px rgba(46,125,79,.5)}
.prog{flex:1;height:6px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--gold)}
.speed{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:.3rem .55rem;font-size:.78rem}
/* interaction panel */
.panel{background:#fff;color:var(--ink);border-radius:18px;padding:22px 22px 20px;margin:6px 0 16px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.panel h2{margin:0 0 6px;color:var(--brown);font-size:1.25rem}
.panel .lead{margin:0 0 12px;color:var(--muted)}
.panel .k{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--green-dk);font-weight:700;margin-bottom:4px}
.opt{display:block;width:100%;text-align:left;background:var(--cream);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--ink);transition:border-color .12s,transform .12s}
.opt:hover{border-color:var(--brown);transform:translateX(2px)}
.opt.right{border-color:var(--green);background:#E3F3E9}
.opt.wrong{border-color:var(--red);background:#FCECEC}
.opt:disabled{cursor:default;transform:none}
.fb{margin-top:10px;padding:12px 14px;border-radius:10px;background:#F3FAF5;border-left:5px solid var(--green);font-size:.98rem}
.fb.bad{background:#FCF1F1;border-color:var(--red)}
.fb.neutral{background:var(--sand);border-color:var(--brown)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:.45rem .9rem;color:var(--ink)}
.chips button.sel{border-color:var(--brown);background:var(--sand)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.bin{border:2px dashed var(--line);border-radius:12px;padding:10px;min-height:84px;cursor:pointer;background:#fff}
.bin:hover{border-color:var(--brown)}
.bin h4{margin:0 0 6px;font-size:.85rem;color:var(--brown)}
.bin .c{display:inline-block;background:var(--sand);border-radius:999px;padding:.2rem .6rem;margin:3px;font-size:.82rem}
.bin .c.ok{background:#E3F3E9}.bin .c.bad{background:#FCECEC}
.checks label{display:flex;gap:10px;align-items:flex-start;background:var(--cream);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer;font-weight:400}
.checks label.ok{border-color:var(--green);background:#E3F3E9}.checks label.miss{border-color:var(--gold);background:#FFF7DD}.checks label.bad{border-color:var(--red);background:#FCECEC}
.checks input{margin-top:5px}
table.t{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
table.t th,table.t td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--sand);color:var(--brown-dk)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:10px 0}
.card3{perspective:900px;min-height:160px;cursor:pointer}
.card3 .in{position:relative;width:100%;height:100%;min-height:160px;transition:transform .5s;transform-style:preserve-3d}
.card3.on .in{transform:rotateY(180deg)}
.card3 .f,.card3 .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:center;text-align:center}
.card3 .f{background:var(--brown);color:#fff;font-weight:700}
.card3 .b{background:#fff;border:2px solid var(--green);transform:rotateY(180deg);font-size:.86rem;line-height:1.35;overflow:auto}
.stage-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--cream);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.stage-row select{padding:.45rem;border-radius:8px;border:2px solid var(--line);font-family:inherit}
.stage-row.ok{border-color:var(--green)}.stage-row.bad{border-color:var(--red)}
.wordbank{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.wb{background:var(--cream);border:2px solid var(--line);border-radius:12px;padding:10px}
.wb h4{margin:0 0 6px;color:var(--brown);font-size:.9rem}
.wb button{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:.4rem .6rem;margin:4px 0;font-size:.86rem;color:var(--ink)}
.wb button.sel{border-color:var(--green);background:#E3F3E9}
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:8px 0}
.cal div{aspect-ratio:1;border:1.5px solid var(--line);border-radius:7px;font-size:.68rem;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;color:var(--muted)}
.cal div.sel{background:var(--green);color:#fff;border-color:var(--green)}
.cal div.exp{box-shadow:inset 0 0 0 2px var(--gold)}
.wheel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
.wheel button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-size:.88rem;color:var(--ink)}
.wheel button.sel{border-color:var(--brown);background:var(--sand)}
.wheel button.ok{border-color:var(--green);background:#E3F3E9}.wheel button.bad{border-color:var(--red);background:#FCECEC}
.payline{background:var(--sand);border-radius:12px;padding:12px 14px;margin:10px 0;font-family:ui-monospace,Menlo,monospace;font-size:.9rem}
.nav{display:flex;align-items:center;gap:10px;margin:6px 0 30px}.nav .sp{flex:1}
.hint{color:#bdb0a6;font-size:.85rem}
/* badges / cert */
.badge-pop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px}
.badge-pop .bx{background:#fff;color:var(--ink);border-radius:22px;padding:30px 28px;text-align:center;max-width:380px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.badge-pop .ic{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d98b,var(--gold) 60%,#8a6a10);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;box-shadow:0 10px 30px rgba(201,162,39,.5)}
.badge-pop h3{margin:4px 0;color:var(--brown)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.badges span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:.35rem .8rem;font-size:.82rem}
.badges span.got{background:rgba(201,162,39,.2);border-color:var(--gold)}
label{display:block;font-weight:700;margin:12px 0 4px;color:var(--brown-dk)}
input[type=text],input[type=email],input[type=date],select{width:100%;padding:.7rem .8rem;border:2px solid var(--line);border-radius:10px;font-size:1rem;font-family:inherit;background:#fff;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sig{border:2px solid var(--line);border-radius:10px;background:#fff;touch-action:none;width:100%;height:160px;display:block}
.score{font-size:2.6rem;font-weight:700;color:var(--green);margin:0}.score.fail{color:var(--red)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);padding:.7rem 1.1rem;border-radius:10px;z-index:70;font-size:.95rem;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1}
#cert{background:#fff;color:var(--ink);border:10px double var(--brown);padding:34px 40px 130px;max-width:820px;margin:16px auto;text-align:center;position:relative}
#cert img.logo{height:76px}
#cert h1{font-size:2rem;color:var(--brown);margin:12px 0 4px}
#cert .name{font-size:1.7rem;font-weight:700;color:var(--green-dk);margin:14px 0 4px;border-bottom:2px solid var(--line);display:inline-block;padding:0 30px 4px}
#cert .seal{position:absolute;right:28px;bottom:22px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d98b,var(--gold) 60%,#8a6a10);display:flex;align-items:center;justify-content:center;color:#2b1d00;font-size:.6rem;font-weight:700;text-align:center;line-height:1.1;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#cert .sigs{display:flex;justify-content:space-around;margin-top:30px;gap:20px;flex-wrap:wrap}
#cert .sigs div{min-width:200px;font-size:.9rem}
#cert .sigs img{height:50px;display:block;margin:0 auto 2px}
#cert .sigs div b{display:block;border-top:1px solid var(--ink);padding-top:6px}
.small{font-size:.85rem;color:var(--muted)}
.qref{background:#fff;color:var(--ink);border-radius:14px;padding:20px 22px}
.qref h3{color:var(--green-dk);margin:12px 0 4px;font-size:1rem}.qref ul{margin:4px 0;padding-left:1.2rem}
@media print{.top,.nav,.bar,.hero,.noprint,.cap{display:none!important}html,body{background:#fff;color:#000}.panel,.qref,#cert{box-shadow:none}#cert{margin:0;max-width:none}}
@media(max-width:640px){.nav{flex-wrap:wrap}.nav .hint{flex-basis:100%;order:-1;text-align:center}.nav .btn{padding:.7rem .9rem}.hero .chip{max-width:62%;font-size:.72rem;padding:.3rem .6rem}.ref{font-size:.72rem;padding:.25rem .5rem}.title small,.ch .n{font-size:.75rem}.ch .ring i{font-size:.72rem}.stage-row{grid-template-columns:1fr}.top .user{max-width:44vw}.top .brand small{display:none}.top img{height:32px}.top .user{max-width:34vw}.row{grid-template-columns:1fr}.panel{padding:16px}.cal{grid-template-columns:repeat(6,1fr)}.title{left:14px;bottom:12px}.cap{font-size:1.02rem}.hero-home .t{padding:20px 18px}}
</style></head><body>
<header class="top"><div class="wrap"><img src="bh-logo.png" alt="" onerror="this.style.display='none'"><div class="brand">Benevolent House<small>T3C Policy and Procedure Training</small></div><span class="sp"></span><span class="user" id="user"></span><button class="btn ghost sm" id="homeBtn">Chapters</button></div></header>
<main class="wrap"><section id="v-home"></section><section id="v-scene" class="hidden"></section><section id="v-qref" class="hidden"></section><section id="v-quiz" class="hidden"></section><section id="v-ack" class="hidden"></section><section id="v-cert" class="hidden"></section></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>const SCENES=[{"id": "1_1", "ch": 1, "chTitle": "The Call", "ref": "T3C-1", "title": "The Carter Family", "img": "s1_a", "narr": "Welcome to Benevolent House. I'll be your guide for the next two hours. You are about to follow the Carter family through one placement: the phone call, the first night, the hard evening, the meeting where a plan comes together, and the day a child goes home. At every step, you will see what Texas Child-Centered Care asks of you, and what Benevolent House promises you in return. You can pause any time. Your place is saved. Let's begin."}, {"id": "1_2", "ch": 1, "chTitle": "The Call", "ref": "T3C-4", "title": "9:40 on a Tuesday night", "narr": "It is 9:40 on a Tuesday night. Ms. Reyes, a Benevolent House case manager, is on call. The phone rings. A caseworker has a nine-year-old girl named Jada who needs a home tonight. Jada has a diagnosis, she is in therapy, and she has had a hard year. Ms. Reyes opens the referral and starts the checklist. Not every child can be placed with every family. Before Jada can come to the Carters, certain things have to be true."}, {"id": "1_3", "ch": 1, "chTitle": "The Call", "ref": "T3C-1, T3C-4", "title": "What T3C changes, and what it does not", "narr": "Texas is replacing the old service levels with Service Packages, matched to what each child needs. Minimum Standards do not change. The Benevolent House Policy and Operations Manual does not change. The way Benevolent House stands behind its families does not change. What is added is the T3C Service Delivery Addendum, thirteen short policies, and for a child served under T3C, the addendum controls. Benevolent House holds the credential for two packages and one add-on. Tap each one."}, {"id": "1_4", "ch": 1, "chTitle": "The Call", "ref": "T3C-2 A", "title": "Before she arrives", "narr": "Ms. Reyes calls Denise Carter. Jada is coming, and before she is through the door, Denise needs three things: what tends to set off Jada's alarm, the early signs that it is starting, and what has helped her calm before. Ms. Reyes has them from the referral and from Jada's last caregiver. Listen to the call, then sort what you heard."}, {"id": "2_1", "ch": 2, "chTitle": "The First Night", "ref": "T3C-2", "title": "At the door", "narr": "Jada stands in the doorway holding a backpack and a rabbit that has seen better days. Denise kneels so their eyes are level. She does not ask questions. She says: I'm Denise. Your room is ready, and nobody here is going to be surprised by anything. Trauma Systems Therapy for Foster Care is not a program Benevolent House adds on. It is the way this house works. It starts here, at the door.", "img": "s1_b"}, {"id": "2_2", "ch": 2, "chTitle": "The First Night", "ref": "T3C-2 B", "title": "The four stages", "narr": "TST-FC gives every adult in the home the same map. A child moves through four stages: regulating, which Jada calls calm; revving, which she calls getting upset; re-experiencing, which she calls alarm is on; and reconstituting, which she calls coming back. Each stage asks something different of you. Read the five moments and choose the stage for each one."}, {"id": "2_3", "ch": 2, "chTitle": "The First Night", "ref": "T3C-2 E", "title": "Bedtime", "narr": "It is 8:30. Denise says it is time to head upstairs. Jada does not move. Her shoulders come up. Her voice gets small and sharp at the same time. Marcus looks at Denise. This is the first hard moment, and how the Carters handle it will teach Jada what kind of house this is. What do you do?"}, {"id": "2_4", "ch": 2, "chTitle": "The First Night", "ref": "T3C-2, T3C-3", "title": "The Managing Emotions Guide", "narr": "The next morning, Denise and Jada sit at the table with a blank page. This is the Managing Emotions Guide, and the rule is simple: Jada's words, not ours. What does calm feel like? What does getting upset look like? What helps when the alarm is on? What tells you that you are coming back? Build Jada's guide with her. Choose her words for each stage."}, {"id": "2_5", "ch": 2, "chTitle": "The First Night", "ref": "T3C-3", "title": "Explaining it to a child", "narr": "Within the first weeks, Ms. Reyes sits with Jada and reads What Helps Me Feel Safe, a one-page guide written for children. Big feelings are your body's alarm. The grown-ups in this house have a plan. You can say what helps and what does not. Say those three lines out loud, the way you would say them to a child in your home. Then choose the explanation that fits a nine-year-old."}, {"id": "3_1", "ch": 3, "chTitle": "The Plan", "ref": "T3C-8", "title": "Who is at the table", "narr": "The Service Plan meeting is in two weeks. Who should be there? Jada, of course, in a way that fits a nine-year-old. Denise and Marcus. Ms. Reyes. The therapist. The caseworker. Jada's teacher has asked to join by phone. And Jada mentioned an aunt. Build the invitation list, and notice which name needs the caseworker's approval before anyone reaches out."}, {"id": "3_2", "ch": 3, "chTitle": "The Plan", "ref": "T3C-5 A", "title": "The calendar you should know by heart", "narr": "Jada is in the Mental and Behavioral Health package. That sets her calendar: a CANS assessment and a Service Plan review at least every ninety days. A child in the Basic package has a review every six months and a CANS every twelve months. Tap the months when Jada's reviews are due, and then see where a Basic child's dates would fall."}, {"id": "3_3", "ch": 3, "chTitle": "The Plan", "ref": "T3C-5 E", "title": "Denied", "narr": "Five weeks in, the letter comes. STAR Health has denied the authorization for Jada's weekly therapy. Denise reads it twice. The next Service Plan review is seven weeks away. What does she do?"}, {"id": "3_4", "ch": 3, "chTitle": "The Plan", "ref": "T3C-8", "title": "Aunt Pruitt", "narr": "In the car on the way home from school, Jada says: My aunt used to do my hair on Saturdays. I wish I could see her. Denise does not know this aunt, and Jada's file does not mention her. Jada is watching Denise's face in the mirror. What do you do?"}, {"id": "3_5", "ch": 3, "chTitle": "The Plan", "ref": "T3C-5 F", "title": "When the alarm is on at 2 a.m.", "narr": "Every child in the Mental and Behavioral Health package has a written safety and crisis plan tied to the four stages. It is shared with you, the therapist, and on-call staff, and it is reviewed at each ninety-day review and after any serious incident. Benevolent House answers twenty-four hours a day. For each situation, tap who you call first."}, {"id": "4_1", "ch": 4, "chTitle": "Credentialed", "ref": "T3C-10", "title": "The Carters' anniversary month", "narr": "Every twelve months, in the month a home was first credentialed, Ms. Reyes sits down with the Carters' file: the last four quarterly evaluations, the training record including the four quarterly TST-FC sessions, and how the children in the home have done. A home is credentialed in addition to being verified. Keeping your training current is the single most important thing you control. Build the Carters' checklist."}, {"id": "5_1", "ch": 5, "chTitle": "Weekend Off", "ref": "T3C-12", "title": "Denise needs a weekend", "narr": "Four months in, Denise is tired in the way that sleep does not fix. Marcus says what she has been thinking: ask about respite. Under T3C, Benevolent House pays for planned alternate care, up to seven days per child each fiscal year, and both families are paid for the same days. Walk through the request with Denise: when to ask, which home, what goes with Jada, and what the payment looks like."}, {"id": "6_1", "ch": 6, "chTitle": "Kinship", "ref": "T3C-11", "title": "Gloria gets the call", "narr": "Across town, Gloria Webb is sixty-one and had no plan to raise another child. Her grandson Micah is six, and tonight he needs her. Kinship caregivers step in for a child they already love, often with no notice. Benevolent House adapts to Gloria, not the other way around: someone at her home promptly, a written list of each verification step with target dates, evening and weekend meetings, help with benefits, and a number she can call at any hour."}, {"id": "6_2", "ch": 6, "chTitle": "Kinship", "ref": "T3C-9, T3C-11", "title": "Micah goes home for good", "narr": "Fourteen months later, at the end of March, Micah's placement with Gloria becomes permanent. Benevolent House does not disappear. For six months, a kinship support staff member checks in weekly for the first month, then twice a month, and Gloria joins a kinship support group. Build Gloria's six-month aftercare calendar."}, {"id": "8_1", "ch": 7, "chTitle": "Safety", "ref": "T3C-13", "title": "A friend who sends gift cards", "narr": "That spring, the Carters also welcome Tre, who is fourteen, under the Mental and Behavioral Health package. One evening Tre mentions an online friend, older, who sends him gift cards and wants to meet. Denise feels the floor tilt. Any concern that a child is being recruited or trafficked is reported immediately to the Texas Abuse Hotline and the caseworker, and handled as a serious incident. What do you do first?"}, {"id": "7_1", "ch": 8, "chTitle": "Going Home", "ref": "T3C-6, T3C-7", "title": "The review where things change", "narr": "At Tre's third ninety-day review, the team sees it: he no longer needs the Mental and Behavioral Health level of support. The Program Director notifies the caseworker, and when the SSCC or DFPS agrees, here is what T3C makes possible: Tre moves to the Basic package and stays exactly where he is, in the Carters' home. No child is moved because a number of months has passed."}, {"id": "7_2", "ch": 8, "chTitle": "Going Home", "ref": "T3C-9", "title": "Leaving with a plan", "narr": "Months later, Jada is going to live with her aunt. Every child leaving the Mental and Behavioral Health package leaves with an Aftercare plan: contacts for the service coordinator and the aftercare case manager, referrals, her Managing Emotions Guide and the strategies that have worked, her education portfolio, her first appointments. For six months, the aftercare case manager checks in twice a month. Check off what has to be in Jada's plan."}, {"id": "9_1", "ch": 9, "chTitle": "Certified", "ref": "Quick Reference", "title": "Your Quick Reference", "narr": "You have walked with the Carters and with Gloria from the first call to the last goodbye. Here is the Quick Reference you earned along the way. Print it for your binder. Then the Knowledge Check: ten questions, eight to pass, and you can try again. After that, your acknowledgment, your certificate, and your record at Benevolent House."}];
const QUIZ=[{"q": "Under T3C, the Treatment Model Benevolent House uses for every child is:", "a": ["A level system with points", "Trauma Systems Therapy for Foster Care", "Chosen by each foster home"], "k": 1, "ref": "T3C-2"}, {"q": "A child in the Mental & Behavioral Health Support Services Package has a Service Plan review at least every:", "a": ["90 days", "Six months", "12 months"], "k": 0, "ref": "T3C-5"}, {"q": "A child over age 3 in the Basic package receives a CANS 3.0 Assessment at least every:", "a": ["90 days", "Six months", "12 months"], "k": 2, "ref": "T3C-5"}, {"q": "The Managing Emotions Guide is built:", "a": ["By the case manager alone", "By the caregiver and the child together", "Only after a serious incident"], "k": 1, "ref": "T3C-3"}, {"q": "When a service in the Service Plan is denied or cannot be found, the caregiver:", "a": ["Waits for the next Service Plan review", "Tells the case manager right away", "Stops asking for the service"], "k": 1, "ref": "T3C-5"}, {"q": "A child in the Mental & Behavioral Health package who no longer needs that level of service:", "a": ["Must move to a new home", "Can move to the Basic package and stay in the same home", "Is discharged from Benevolent House"], "k": 1, "ref": "T3C-6"}, {"q": "A foster family home is re-credentialed for T3C:", "a": ["Every 12 months", "Every five years", "Only when a problem comes up"], "k": 0, "ref": "T3C-10"}, {"q": "When a caregiver uses approved paid Intermittent Alternate Care:", "a": ["Only the caregiver providing the care is paid", "The two families settle payment between themselves", "Both caregivers are paid by Benevolent House for the same days"], "k": 2, "ref": "T3C-12"}, {"q": "After a child leaves the Mental & Behavioral Health package, aftercare follow-up continues for:", "a": ["30 days", "Six months", "There is no follow-up"], "k": 1, "ref": "T3C-9"}, {"q": "A child tells you about an aunt the child would like to see. You:", "a": ["Arrange a visit yourself that weekend", "Tell the case manager, who shares it with the caseworker", "Tell the child that contact is not allowed"], "k": 1, "ref": "T3C-8"}];
const ACK="I attended the T3C Policy and Procedure Training. I received the T3C Service Delivery Addendum and the Caregiver Quick Reference, I had the opportunity to ask questions, and I agree to follow these policies and procedures.";
const COURSE={"title": "T3C Policy and Procedure Training (Core Session)", "code": "T3C-PP", "hours": 2, "trainer": "Tanya Orr, LCPAA", "openers": {"1_1": "v_1", "2_1": "v_2", "3_1": "v_3", "4_1": "v_4", "5_1": "v_5", "6_1": "v_6", "8_1": "v_7", "7_1": "v_8", "9_1": "v_9"}};
</script>
<script>/* Interactions keyed by scene id. type: choice | multi | sort | flip | stages | wordbank | calendar | wheel | respite | none */
const INTER = {
"1_1":{type:"none"},
"1_2":{type:"multi",k:"Before Jada can be placed",q:"Which of these has to be true before Jada is placed with the Carters? Check all that apply.",
 items:[["The package fits Jada's needs and strengths, shown by the CANS (when done), the Application for Placement, and the team's judgment",1],["A pre-placement visit happened when it was appropriate, and it went well",1],["The Carters' home holds the credential for Jada's package",1],["The Program Director approved the admission, consulting the Treatment Director for Mental & Behavioral Health",1],["Jada has been in care for at least 30 days",0],["The Carters have a spare bedroom with a window facing the street",0]],
 fb:"Four things, all from Policy T3C-4: the package fits, the visit happened when appropriate, the home holds the credential, and the Program Director approved. Nothing about how long a child has been in care, and nothing about which way a window faces."},
"1_3":{type:"flip",k:"The packages",cards:[["T3C Basic Foster Family Home Support Services","A trauma-informed foster home with community-based services, routine therapy as the Service Planning team decides, and coordination of medical, dental, educational, and behavioral health care."],["Mental & Behavioral Health Support Services","For a child who has, or is being evaluated for, an emotional, conduct, or behavioral disorder and needs routine clinical support such as therapy, education, or medication."],["Kinship Caregiver Support Services Add-On","Added support for a relative or fictive kin caregiver whose home Benevolent House has verified. It sits on top of the child's primary package."]],
 then:{q:"Jada has a diagnosis and routine therapy. Which package is she in?",a:["Basic","Mental & Behavioral Health","Kinship Add-On"],k:1,fb:"Mental & Behavioral Health. A home serving that package also holds the Basic credential, so Jada could later step down without moving."}},
"1_4":{type:"sort",k:"What Ms. Reyes told Denise",q:"Tap a note, then tap where it belongs.",
 bins:[["trig","Known triggers"],["warn","Early warning signs"],["help","What helps"]],
 items:[["Raised voices, especially from a man","trig"],["Being told to hurry","trig"],["She goes quiet and pulls her sleeves over her hands","warn"],["She starts counting under her breath","warn"],["A warm washcloth and a chair by the window","help"],["Being told what happens next, before it happens","help"]],
 fb:"Policy T3C-2 A: before or at placement, the case manager tells you the child's known triggers, early warning signs, and what has helped before. You now have Jada's."},
"2_1":{type:"choice",k:"The way this house works",q:"Denise did not ask Jada questions at the door. Why does that fit TST-FC?",
 a:[["Because questions are rude in Texas",0,"Not quite. It is about the alarm, not manners."],["Because a child at the door is likely revving: the alarm is close. Predictability and signals of safety come first; questions can wait.",1,"Yes. Predictability, pre-teaching, and staying neutral are what Benevolent House asks of caregivers every day (T3C-2 E)."],["Because the caseworker handles all questions",0,"The caseworker is not the point. Jada's alarm is."]]},
"2_2":{type:"stages",k:"Five moments, four stages",q:"For each moment, choose the stage.",
 stages:["Calm (regulating)","Getting upset (revving)","Alarm is on (re-experiencing)","Coming back (reconstituting)"],
 items:[["Jada hums while coloring and asks what's for dinner",0],["Her shoulders rise and her answers get short when Marcus says it's time to go",1],["She is screaming that she hates it here and does not seem to hear Denise",2],["Her breathing slows; she asks for the washcloth and leans on the chair",3],["She lines up her shoes exactly and checks the door twice",1]],
 fb:"Each stage asks something different: keep calm predictable, catch revving early with pre-teaching, stay neutral and safe when the alarm is on, and welcome coming back with no lecture."},
"2_3":{type:"choice",k:"Bedtime",q:"What do you do?",
 a:[["Say 'Upstairs, now. I'm counting to three.'",0,"Counting adds pressure to a child who is already revving. Her alarm goes off, and the first night teaches her this house pushes. Try again."],["Sit on the bottom step, a little apart from her, and say: 'Upstairs is new. I'll walk up with you and show you where the light switch is. Two minutes, then we go.'",1,"That is the model: name what you see, stay neutral, pre-teach what happens next, and offer time-in rather than isolation. Jada's shoulders come down. She goes up with Denise."],["Send her to her room to calm down on her own",0,"Isolation repeats what many children in care have already lived. Benevolent House does not use punishment that shames or isolates (T3C-2 E). Try again."]],retry:true},
"2_4":{type:"wordbank",k:"Jada's Managing Emotions Guide",q:"Choose Jada's own words for each stage. There is no single right set; the rule is that they are hers.",
 groups:[["Calm feels like","Humming","My rabbit next to me","Knowing what's next"],["Getting upset looks like","Sleeves over my hands","Counting","Going quiet"],["When the alarm is on, help me by","Warm washcloth","Chair by the window","Talk soft, don't touch"],["I'm coming back when","I ask for juice","I can look at you","I want to finish my picture"]],
 fb:"Built with the child, in the child's words, kept where she chose, updated at every review, and reviewed after any serious incident and updated when that review shows a new trigger or a strategy that did not work (T3C-2, T3C-3). This guide travels with Jada if she ever changes homes."},
"2_5":{type:"choice",k:"Explain it to a child",q:"Which explanation is closest to how Benevolent House talks to a 9-year-old about the model?",
 a:[["'You have a trauma-based dysregulation pattern that we will address with a four-phase intervention.'",0,"That is the adult version. For ages 5 to 11 we use simple words."],["'Big feelings are your body's alarm. The grown-ups here have a plan to help, and you helped write it. You can always tell us what helps and what doesn't.'",1,"That is it. Ages 5 through 11: big feelings are the body's alarm, the adults have a plan, the child helps build the guide (T3C-3 A)."],["'Just try to behave and we won't have any problems.'",0,"That makes the alarm the child's fault. It is not."]]},
"3_1":{type:"multi",k:"The invitation list",q:"Who gets invited to Jada's Service Plan meeting? Check everyone who should be included.",
 items:[["Jada, in a way that fits her age",1],["Denise and Marcus Carter",1],["Ms. Reyes, the case manager",1],["Jada's therapist",1],["The SSCC or DFPS caseworker",1],["Jada's teacher, by phone, once the caseworker confirms she may be included",1],["Jada's aunt, after the caseworker confirms she may safely be contacted",1],["Jada's aunt, right away, since Jada asked",0]],
 fb:"Everyone who matters is invited in the way that works for them: in person, by phone, or by video (T3C-8 B). The one rule: the caseworker confirms who may safely be contacted first. The aunt is in, once approved. Everyone invited, how they were invited, and who took part is written in the Service Plan."},
"3_2":{type:"calendar",k:"Jada's calendar",q:"Jada was placed in January. Tap the months when her CANS and Service Plan review are due this year (Mental & Behavioral Health: every 90 days).",
 months:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],expect:[3,6,9],
 fb:"April, July, October: every 90 days from a January placement. A child in the Basic package would have a review in July (6 months) and a CANS the following January (12 months). The Kinship Add-On follows the child's primary package."},
"3_3":{type:"choice",k:"Denied",q:"What does Denise do?",
 a:[["Wait and raise it at the next Service Plan review in seven weeks",0,"Seven weeks without therapy for a child in the Mental & Behavioral Health package. Nobody waits for a review. Try again."],["Call Ms. Reyes today",1,"Right. Ms. Reyes documents the request, the denial and reason, and the status of any appeal, notifies the caseworker within 3 business days, and looks for community resources. If the service still cannot be found, the Program Director makes sure it is provided (T3C-5 E)."],["Pay for a private therapist herself",0,"Generous, but it leaves the record silent and the plan unfixed. Call first. Try again."]],retry:true},
"3_4":{type:"choice",k:"Aunt Pruitt",q:"What do you do?",
 a:[["Arrange a visit yourself this Saturday",0,"Even a kind visit has to be approved by the caseworker first. Court orders and the visitation plan come first. Try again."],["Say: 'Thank you for telling me. I'll let Ms. Reyes know, and she'll talk with your caseworker about it.' Then tell Ms. Reyes.",1,"That is Policy T3C-8. Ms. Reyes records the aunt in the Family and Support Network section of the Service Plan, shares her with the caseworker promptly, no later than the next monthly visit, and records the date. If contact is approved, the aunt is invited to the next meeting."],["Tell Jada that contact with family isn't allowed",0,"It may well be allowed. Only the caseworker decides, and Jada deserves the honest answer: 'I'll find out.' Try again."]],retry:true},
"3_5":{type:"wheel",k:"Who do you call first?",q:"For each situation, tap who you call first.",
 who:["Case manager or on-call line","911, then on-call","Texas Abuse Hotline, then caseworker and on-call","Wait for the monthly visit"],
 items:[["Jada is in the alarm stage and has locked herself in the bathroom; she is not hurt",0],["Jada has cut her hand badly and it will not stop bleeding",1],["Jada discloses that an adult touched her",2],["Jada's school wants a new tutoring schedule",3],["Jada did not come home from the bus and no one knows where she is",1]],
 fb:"Benevolent House answers 24 hours a day. For a child in the Mental & Behavioral Health package, a case manager or above responds in person, by phone, or by video (T3C-5 A). Life-threatening emergencies and a missing child go to 911 first, then on-call. Any abuse or trafficking concern goes to the Texas Abuse Hotline, 1-800-252-5400, and the caseworker, and is handled as a serious incident."},
"4_1":{type:"multi",k:"The Carters' checklist",q:"Check everything that keeps the Carters' Basic and Mental & Behavioral Health credentials current.",
 items:[["Verification in good standing, with training, background checks, and home documents current",1],["Each caregiver completed the 8-hour TST-FC training and passed the Final Knowledge Check",1],["Each caregiver is current on the four quarterly TST-FC sessions",1],["Each caregiver completed this T3C policy training",1],["Each caregiver completed the Universal Human Trafficking Prevention Training",1],["The most recent quarterly evaluation shows the caregiver understands and uses the Treatment Model",1],["For Mental & Behavioral Health: verified for treatment services, plus emergency behavior intervention, suicide prevention, and psychotropic medication training",1],["For Mental & Behavioral Health: able to take part in therapy, attend multiple meetings, and respond immediately",1],["A letter of recommendation from a neighbor",0],["Five years of fostering experience",0]],
 fb:"All eight are from Policy T3C-10 A. A home that does not yet meet one gets a written list and help finishing it. Every 12 months the credential is reviewed; a move, a household change, a lapsed training, a corrective action plan, or an investigation finding means the credential is reviewed at the next quarterly evaluation. Keeping your training current is the piece you control."},
"5_1":{type:"respite",k:"The respite request",q:"Walk through Denise's request.",
 steps:[
  {q:"Denise wants a long weekend, Thursday evening through Monday evening, starting the 20th. When should she ask Ms. Reyes?",a:["The day before","At least 10 days ahead when she can, so by the 10th","Only at the monthly visit"],k:1,fb:"At least 10 days ahead whenever possible. The case manager approves and notifies the caseworker (T3C-12)."},
  {q:"Which home can care for Jada?",a:["Any licensed daycare","Denise's sister, who is not a Benevolent House home","A verified Benevolent House home whose caregivers completed TST-FC and that is verified for treatment services"],k:2,fb:"For a Mental & Behavioral Health child, the alternate home is verified for treatment services and its caregivers are TST-FC trained."},
  {q:"What goes with Jada for the weekend?",a:["Just her clothes and medication","Her Managing Emotions Guide, her safety and crisis plan, her medication and medical information, and her schedule","Nothing; the other family will figure it out"],k:1,fb:"The alternate caregiver gets everything they need to keep Jada's world predictable."}],
 pay:"Thursday evening through Monday evening: 4 days (more than 72 hours, so it counts as paid Intermittent Alternate Care)\nAlternate home (the Nguyens): 4 days at Jada's package rate ... PAID\nThe Carters: 4 days at Jada's package rate ............ PAID\nJada's paid respite days used this fiscal year: 4 of 7",
 fb:"Both families are paid for the same days, on the regular payment date, up to 7 days per child each fiscal year (September through August). Exceptions: the 7 days are used up, the stay is 72 hours or less, or the child was moved from the home because of an investigation, a safety plan, or a caregiver's request for discharge; in those cases the caregiver providing the care is still paid."},
"6_1":{type:"sort",k:"What Gloria can count on",q:"Sort each item: something Benevolent House does for a kinship caregiver, or not part of kinship support.",
 bins:[["yes","Benevolent House does this"],["no","Not part of kinship support"]],
 items:[["Meets her at her home promptly after the referral","yes"],["Gives her a written list of every verification step with who helps and target dates","yes"],["Schedules training and meetings on evenings and weekends","yes"],["Helps her apply for the state and federal benefits she may qualify for","yes"],["Gives her the 24-hour on-call number at the first visit","yes"],["Writes a kinship support plan with her and reviews it every monthly visit","yes"],["Requires her to attend a weekday 9 a.m. class at the office","no"],["Leaves her to complete the home study on her own","no"]],
 fb:"Policy T3C-11: Benevolent House adapts to the caregiver. Verification help, benefits help, evening and weekend availability, a support plan reviewed monthly, and a 24-hour response."},
"6_2":{type:"calendar",k:"Gloria's aftercare",q:"Micah's placement became permanent in March. Tap every month that has aftercare contact (weekly the first month, then twice a month, for 6 months).",
 months:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],expect:[3,4,5,6,7,8],
 fb:"April through September: weekly in April, then twice a month through September, plus a kinship support group. Every contact and attempt goes in the aftercare contact log, and a copy goes to the caseworker at the end of each month (T3C-9)."},
"7_1":{type:"choice",k:"What happens to Tre?",q:"Tre no longer needs the Mental & Behavioral Health level of support. What happens?",
 a:[["He must move to a new home that only holds the Basic credential",0,"No. The Carters hold both credentials for exactly this reason."],["He moves to the Basic package and stays in the Carters' home",1,"Yes. The Program Director notifies the caseworker, and when the SSCC or DFPS agrees, Tre moves to the Basic package in the same home. The tracker records the change with the date and reason, and Tre does not pack a bag (T3C-6 C, T3C-5 D)."],["He is discharged from Benevolent House",0,"No. Needing less support is a success, not a discharge."]]},
"7_2":{type:"multi",k:"Jada's aftercare plan",q:"Check everything that belongs in Jada's Aftercare Services Plan.",
 items:[["Name and contact information for the STAR Health Service Coordinator, when one is assigned",1],["Name and contact information for the Aftercare Case Manager",1],["Referrals for continued services",1],["Her Managing Emotions Guide and the strategies that have worked",1],["Jada's Education Portfolio",1],["Her first appointments after the move",1],["A copy to the aunt, the caseworker, and Jada when appropriate",1],["A schedule of twice-monthly contacts for six months",1],["A deposit for the aunt's rent",0]],
 fb:"The plan is written on the Aftercare Services Plan or within the Service Plan, planning starts at admission, and contacts continue twice a month for six consecutive months with every one logged (T3C-9)."},
"8_1":{type:"choice",k:"What do you do first?",q:"Tre mentions an older online friend who sends gift cards and wants to meet. What do you do first?",
 a:[["Take his phone and tell him he's grounded",0,"Taking the phone ends the conversation and the information. Tre needs to keep talking to you. Try again."],["Stay calm, thank him for telling you, keep him talking, and as soon as you can, call the Texas Abuse Hotline and the caseworker, and call on-call so it is handled as a serious incident",1,"Right. Any concern that a child is being recruited or trafficked is reported immediately to the Texas Abuse Hotline (1-800-252-5400) and the caseworker, and handled as a serious incident (T3C-13). Youth 12 and older are taught how recruitment happens online, and how to get help, including the National Human Trafficking Hotline at 1-888-373-7888 or text 233733."],["Decide it is probably nothing and keep an eye on it",0,"Gift cards from an older stranger who wants to meet is the textbook pattern. Report it. Try again."]],retry:true},
"9_1":{type:"none"}
};
</script>

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function chProgress(ch){const sc=scenesOf(ch);let d=sc.filter(s=>S.seen[s.id]).length,n=sc.length;if(ch===CH.length){n+=1;d+=S.done?1:0}return[d,n]}

/* ---------- user ---------- */

 $("#user").textContent=userLabel();

 if(!S.user){h+=`<div class="panel"><div class="k">Before you begin</div><h2>Tell us who you are</h2><div class="row"><div><label>Full name</label><input type="text" id="uName" placeholder="First and last name"></div><div><label>Email</label><input type="email" id="uEmail" placeholder="you@example.com"></div></div><div class="row"><div><label>Foster home or staff role</label><input type="text" id="uHome" placeholder="e.g., Johnson Home, or Case Manager"></div><div><label>I am a</label><select id="uRole">${(COURSE.roles||["Foster Caregiver","Kinship Caregiver","Adoptive Parent","Foster and Adoptive Caregiver","Staff","Contracted Provider"]).map(r=>`<option>${r}</option>`).join("")}</select></div></div><p><button class="btn" onclick="signIn()">Continue</button></p><p class="small">Your name and completion record are kept by Benevolent House for licensing and training records. No child information is ever entered here. All names in this course are fictional.</p></div>`}

  CH.forEach(([name,c])=>{const ch=+c;let[d,n]=chProgress(ch);const first=scenesOf(ch)[0];const un=chUnlocked(ch);const final=ch===CH.length;const pct=Math.round(d/n*100);const img=first?(first.img||('s_'+first.id)):(COURSE.qrefImg||"s_9_1");const go=S.done&&final?`showSavedCert()`:first?`openChapter(${ch})`:`renderQuickRef()`;
   h+=`<div class="ch ${d>=n?"done":""} ${un?"":"locked"}" tabindex="0" role="button" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" onclick="${un?go:`toast('Finish the chapter before this one first')`}"><img src="assets/${img}.jpg" alt=""><div class="ring" style="--p:${pct}%"><i>${d>=n?"✓":d+"/"+n}</i></div><div class="b"><div class="n">Chapter ${ch}</div><h3>${name}</h3><div class="m">${first?n+" scene"+(n>1?"s":""):""}${final?(first?" · ":"")+"Quick Reference, Knowledge Check, certificate":""}</div></div></div>`});
  h+=`</div><p class="hint">Signed in as ${esc(S.user.name)}. <a href="#" onclick="signOut();return false">Not you?</a></p>`}

 if(!n||!e||!hm){toast("Please fill in your name, email, and home or role");return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){toast("Please enter a valid email address");return}

function resume(){const next=SCENES.find(s=>!S.seen[s.id]);if(!next){renderQuickRef();return}openScene(next.id)}

/* ---------- audio ---------- */
let AU=null,curSpans=[],curChars=[],curTotal=0;
function stopAudio(){if(AU){try{AU.pause()}catch(e){}AU=null}}
function setupAudio(src,text){
 const sents=text.match(/[^.!?]+[.!?]+["']?/g)||[text];const cap=$("#cap");cap.innerHTML=sents.map(s=>`<span>${esc(s.trim())} </span>`).join("");
 curSpans=$$("#cap span");curChars=sents.map(s=>s.length);curTotal=curChars.reduce((a,b)=>a+b,0);
 const a=new Audio(src);AU=a;a.preload="auto";a.playbackRate=S.rate||1;const btn=$("#play"),pi=$("#pi");
 btn.onclick=()=>{if(a.paused){a.play().catch(()=>{});btn.textContent="❚❚"}else{a.pause();btn.textContent="▶"}};
 a.ontimeupdate=()=>{if(AU!==a)return;const f=a.currentTime/(a.duration||1);pi.style.width=(f*100)+"%";let acc=0,i=0;for(;i<curChars.length;i++){acc+=curChars[i];if(acc/curTotal>f)break}curSpans.forEach((s,j)=>s.classList.toggle("on",j<=i))};
 a.onended=()=>{if(AU!==a)return;btn.textContent="↻";curSpans.forEach(s=>s.classList.add("on"));S.heard=S.heard||{};S.heard[CUR.id]=1;save();gate()};
 a.onerror=()=>{if(AU!==a)return;curSpans.forEach(s=>s.classList.add("on"));btn.textContent="▶";toast("Narration could not be loaded on this connection. Read the caption, then continue.");S.heard=S.heard||{};S.heard[CUR.id]=1;gate()};
 a.play().then(()=>{btn.textContent="❚❚"}).catch(()=>{btn.textContent="▶"})}
function setRate(){S.rate=S.rate===1.25?1:1.25;save();if(AU)AU.playbackRate=S.rate;$("#rate").textContent=(S.rate||1)+"×"}

/* ---------- scene ---------- */
let CUR=null;
function openScene(id){const _s=SCENES.find(s=>s.id===id);if(_s&&!chUnlocked(_s.ch)){toast("Finish the chapter before this one first");renderHome();return}CUR=_s;const i=SCENES.indexOf(CUR);const img=CUR.img||("s_"+CUR.id);const inter=INTER[CUR.id]||{type:"none"};
 const vid=(COURSE.openers||{})[CUR.id];const media=vid?`<video src="assets/${vid}.mp4" poster="assets/${img}.jpg" preload="metadata" autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover;display:block"></video>`:`<img src="assets/${img}.jpg" alt="">`;
 $("#v-scene").innerHTML=`<div class="scene"><div class="hero"><span class="chip">Chapter ${CUR.ch} · ${esc(CUR.chTitle)}</span><span class="ref">${esc(CUR.ref)}</span>${media}<div class="title"><small>Scene ${i+1} of ${SCENES.length}</small><h1>${esc(CUR.title)}</h1></div></div>
 <p class="cap" id="cap"></p><div class="bar"><button class="play" id="play" aria-label="Play or pause">▶</button><div class="prog"><i id="pi"></i></div><button class="speed" id="rate" onclick="setRate()">${(S.rate||1)}×</button></div>
 <div id="inter"></div>
 <div class="nav"><button class="btn ghost" onclick="prevScene()" ${i===0?"disabled":""}>Back</button><button class="btn ghost sm" onclick="renderHome()">Chapters</button><span class="sp"></span><span class="hint" id="gateTxt"></span><button class="btn" id="next" onclick="nextScene()" disabled>${i===SCENES.length-1?"Quick Reference":"Continue"}</button></div></div>`;
 show("scene");renderInter(inter);setupAudio("assets/n_"+CUR.id+".mp3",CUR.narr);gate()}
function gate(){const inter=INTER[CUR.id]||{type:"none"};const heard=(S.heard||{})[CUR.id];const done=inter.type==="none"||S.answers[CUR.id];
 const b=$("#next"),t=$("#gateTxt");if(!b)return;if(!heard){b.disabled=true;t.textContent="Listen to the scene to continue";return}if(!done){b.disabled=true;t.textContent="Complete the activity to continue";return}b.disabled=false;t.textContent=""}
function markDone(id){S.answers[id]=1;save();gate()}
function nextScene(){S.seen[CUR.id]=1;save();const i=SCENES.indexOf(CUR);const ch=CUR.ch;const last=scenesOf(ch).slice(-1)[0];
 if(last.id===CUR.id&&!S.badges[ch]&&ch!==CH.length){S.badges[ch]=1;save();showBadge(ch,()=>{i===SCENES.length-1?renderQuickRef():openScene(SCENES[i+1].id)});return}
 i===SCENES.length-1?renderQuickRef():openScene(SCENES[i+1].id)}
function prevScene(){const i=SCENES.indexOf(CUR);if(i>0)openScene(SCENES[i-1].id)}
function showBadge(ch,cb){const name=CH[ch-1][0];const d=document.createElement("div");d.className="badge-pop";d.innerHTML=`<div class="bx"><div class="ic">${BADGE_ICON[ch]}</div><div class="small">Badge earned</div><h3>${esc(name)}</h3><p>Chapter ${ch} complete. ${Object.keys(S.badges).length} of ${CH.length}.</p><button class="btn">Keep going</button></div>`;document.body.appendChild(d);d.querySelector("button").onclick=()=>{d.remove();cb()}}

/* ---------- interactions ---------- */
function renderInter(it){const el=$("#inter");const done=S.answers[CUR.id];
 if(it.type==="none"){el.innerHTML="";return}
 let h=`<div class="panel"><div class="k">${esc(it.k||"Your turn")}</div>`;
 if(it.type==="choice")h+=choiceHTML(it,"c");
 else if(it.type==="multi")h+=multiHTML(it);
 else if(it.type==="sort")h+=sortHTML(it);
 else if(it.type==="flip")h+=`<div class="cards">${it.cards.map(c=>`<div class="card3" tabindex="0"><div class="in"><div class="f">${esc(c[0])}</div><div class="b">${esc(c[1])}</div></div></div>`).join("")}</div><p class="hint" style="color:var(--muted)">Tap each card to turn it over, then answer below.</p>`+choiceHTML({q:it.then.q,a:it.then.a.map((a,j)=>[a,j===it.then.k?1:0,j===it.then.k?it.then.fb:"Not quite. Turn the cards again."])},"c");
 else if(it.type==="stages")h+=stagesHTML(it);
 else if(it.type==="wordbank")h+=wordbankHTML(it);
 else if(it.type==="calendar")h+=calHTML(it);
 else if(it.type==="wheel")h+=wheelHTML(it);
 else if(it.type==="respite")h+=respiteHTML(it);
 h+=`</div>`;el.innerHTML=h;wire(it,el);if(done){el.querySelectorAll("button,input,select").forEach(x=>x.disabled=true);const f=el.querySelector(".fb-final");if(f)f.classList.remove("hidden");const ro=el.querySelector('.opt[data-ok="1"]');if(ro){ro.classList.add("right");const cf=el.querySelector("#cfb");if(cf){cf.classList.remove("hidden");const src=it.type==="flip"?it.then.fb:(it.a?it.a[+ro.dataset.j][2]:"");cf.textContent=src}}replayDone(it,el);const note=document.createElement("p");note.className="hint";note.style.color="var(--muted)";note.textContent="You completed this activity earlier.";el.querySelector(".panel").appendChild(note)}}
function replayDone(it,el){try{
 if(it.type==="sort"){el.querySelectorAll(".chips button").forEach(c=>{const bn=el.querySelector(`.bin[data-bin="${c.dataset.bin}"]`);const s=document.createElement("span");s.className="c ok";s.textContent=c.textContent+" ✓";bn.appendChild(s);c.remove()})}
 if(it.type==="multi"){el.querySelectorAll(".checks label").forEach(l=>{const i=l.querySelector("input");const want=it.items[+i.dataset.j][1]===1;i.checked=want;if(want)l.classList.add("ok")})}
 if(it.type==="stages"){el.querySelectorAll(".stage-row").forEach(r=>{r.querySelector("select").value=String(it.items[+r.dataset.j][1]);r.classList.add("ok")})}
 if(it.type==="wheel"){el.querySelectorAll(".wheel").forEach(r=>{r.querySelectorAll("button").forEach(b=>{if(+b.dataset.k===it.items[+r.dataset.j][1])b.classList.add("ok")})})}
 const f=el.querySelector(".fb-final");if(f)f.classList.remove("hidden")}catch(x){}}
function choiceHTML(it,cls){return `<h2>${esc(it.q)}</h2>${it.a.map((a,j)=>`<button class="opt" data-j="${j}" data-ok="${a[1]}">${esc(a[0])}</button>`).join("")}<div class="fb hidden" id="cfb"></div>`}
function multiHTML(it){return `<h2>${esc(it.q)}</h2><div class="checks">${it.items.map((x,j)=>`<label><input type="checkbox" data-j="${j}"> <span>${esc(x[0])}</span></label>`).join("")}</div><p><button class="btn sm" id="chk">Check my answers</button></p><div class="fb hidden fb-final">${esc(it.fb)}</div>${it.then?`<div id="then" class="hidden" style="margin-top:14px">`+choiceHTML({q:it.then.q,a:it.then.a.map((a,j)=>[a,j===it.then.k?1:0,j===it.then.k?it.then.fb:"Not quite. Look at the policy again."])},"c")+`</div>`:""}`}
function sortHTML(it){return `<h2>${esc(it.q)}</h2><div class="chips">${it.items.map((x,j)=>`<button data-j="${j}" data-bin="${x[1]}">${esc(x[0])}</button>`).join("")}</div><div class="bins">${it.bins.map(b=>`<div class="bin" data-bin="${b[0]}" tabindex="0"><h4>${esc(b[1])}</h4></div>`).join("")}</div><div class="fb hidden fb-final">${esc(it.fb)}</div>`}
function stagesHTML(it){return `<h2>${esc(it.q)}</h2>${it.items.map((x,j)=>`<div class="stage-row" data-j="${j}"><div>${esc(x[0])}</div><select data-j="${j}"><option value="">Choose a stage</option>${it.stages.map((s,k)=>`<option value="${k}">${esc(s)}</option>`).join("")}</select></div>`).join("")}<p><button class="btn sm" id="chk">Check</button></p><div class="fb hidden fb-final">${esc(it.fb)}</div>`}
function wordbankHTML(it){return `<h2>${esc(it.q)}</h2><div class="wordbank">${it.groups.map((g,gi)=>`<div class="wb" data-g="${gi}"><h4>${esc(g[0])}</h4>${g.slice(1).map(w=>`<button>${esc(w)}</button>`).join("")}</div>`).join("")}</div><p class="hint" style="color:var(--muted)">Pick at least one in each box.</p><p><button class="btn sm" id="chk">Save Jada's guide</button></p><div class="fb hidden fb-final">${esc(it.fb)}</div>`}
function calHTML(it){return `<h2>${esc(it.q)}</h2><div class="cal">${it.months.map((m,j)=>`<div data-j="${j}" tabindex="0" role="button">${m}</div>`).join("")}</div><p><button class="btn sm" id="chk">Check</button></p><div class="fb hidden fb-final">${esc(it.fb)}</div>`}
function wheelHTML(it){return `<h2>${esc(it.q)}</h2>${it.items.map((x,j)=>`<div style="margin:12px 0"><b>${esc(x[0])}</b><div class="wheel" data-j="${j}">${it.who.map((w,k)=>`<button data-k="${k}">${esc(w)}</button>`).join("")}</div></div>`).join("")}<div class="fb hidden fb-final">${esc(it.fb)}</div>`}
function respiteHTML(it){return `<h2>${esc(it.q)}</h2><div id="rsteps">${it.steps.map((s,si)=>`<div class="rstep ${si?"hidden":""}" data-si="${si}"><p><b>Step ${si+1}.</b> ${esc(s.q)}</p>${s.a.map((a,j)=>`<button class="opt" data-ok="${j===s.k?1:0}">${esc(a)}</button>`).join("")}<div class="fb hidden"></div></div>`).join("")}</div><div class="payline hidden" id="pay"></div><div class="fb hidden fb-final">${esc(it.fb)}</div>`}
function wire(it,el){
 el.querySelectorAll(".card3").forEach(c=>{const t=()=>c.classList.toggle("on");c.onclick=t;c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();t()}}});
 if(it.type==="choice"||it.type==="flip"){const opts=el.querySelectorAll(".opt");const src=it.type==="flip"?it.then.a.map((a,j)=>[a,j===it.then.k?1:0,j===it.then.k?it.then.fb:"Not quite. Turn the cards again."]):it.a;
  opts.forEach(o=>o.onclick=()=>{const ok=o.dataset.ok==="1";const j=+o.dataset.j;const fb=el.querySelector("#cfb");fb.classList.remove("hidden");fb.className="fb "+(ok?"":"bad");fb.textContent=src[j][2];
   if(ok){o.classList.add("right");opts.forEach(x=>x.disabled=true);markDone(CUR.id)}else{o.classList.add("wrong");if(!it.retry&&it.type!=="flip"){opts.forEach(x=>x.disabled=true);opts.forEach(x=>{if(x.dataset.ok==="1")x.classList.add("right")});markDone(CUR.id)}else{o.disabled=true}}})}
 if(it.type==="multi"){el.querySelector("#chk").onclick=()=>{let okAll=true;el.querySelectorAll(".checks label").forEach(l=>{const j=+l.querySelector("input").dataset.j;const want=it.items[j][1]===1;const got=l.querySelector("input").checked;l.classList.remove("ok","miss","bad");if(want&&got)l.classList.add("ok");else if(want&&!got){l.classList.add("miss");okAll=false}else if(!want&&got){l.classList.add("bad");okAll=false}});el.querySelector(".fb-final").classList.remove("hidden");if(!okAll){toast("Gold = you missed it, red = not a requirement. Adjust and check again.");return}el.querySelectorAll("input,#chk").forEach(x=>x.disabled=true);if(it.then){const th=el.querySelector("#then");th.classList.remove("hidden");const src=it.then.a.map((a,j)=>[a,j===it.then.k?1:0,j===it.then.k?it.then.fb:"Not quite. Look at the policy again."]);th.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{const ok=o.dataset.ok==="1";const fb=th.querySelector("#cfb");fb.classList.remove("hidden");fb.className="fb "+(ok?"":"bad");fb.textContent=src[+o.dataset.j][2];if(ok){o.classList.add("right");th.querySelectorAll(".opt").forEach(x=>x.disabled=true);markDone(CUR.id)}else{o.classList.add("wrong");o.disabled=true}})}else markDone(CUR.id)}}
 if(it.type==="sort"){let sel=null;const chips=el.querySelectorAll(".chips button");chips.forEach(c=>c.onclick=()=>{chips.forEach(x=>x.classList.remove("sel"));c.classList.add("sel");sel=c});
  el.querySelectorAll(".bin").forEach(bn=>{const drop=()=>{if(!sel){toast("Tap an item first");return}const ok=sel.dataset.bin===bn.dataset.bin;const c=document.createElement("span");c.className="c "+(ok?"ok":"bad");c.textContent=sel.textContent+(ok?" ✓":" ✗");bn.appendChild(c);if(!ok){const r=el.querySelector(`.bin[data-bin="${sel.dataset.bin}"]`);const c2=document.createElement("span");c2.className="c ok";c2.textContent=sel.textContent+" (belongs here)";r.appendChild(c2)}sel.remove();sel=null;if(!el.querySelectorAll(".chips button").length){el.querySelector(".fb-final").classList.remove("hidden");markDone(CUR.id)}};bn.onclick=drop;bn.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();drop()}}})}
 if(it.type==="stages"){el.querySelector("#chk").onclick=()=>{let ok=true;el.querySelectorAll(".stage-row").forEach(r=>{const j=+r.dataset.j;const v=r.querySelector("select").value;r.classList.remove("ok","bad");if(v===""){ok=false;r.classList.add("bad");return}if(+v===it.items[j][1])r.classList.add("ok");else{r.classList.add("bad");ok=false}});if(!ok){toast("Answer every row, then fix any red rows");return}el.querySelector(".fb-final").classList.remove("hidden");el.querySelectorAll("select,#chk").forEach(x=>x.disabled=true);markDone(CUR.id)}}
 if(it.type==="wordbank"){el.querySelectorAll(".wb button").forEach(b=>b.onclick=()=>b.classList.toggle("sel"));el.querySelector("#chk").onclick=()=>{const ok=Array.from(el.querySelectorAll(".wb")).every(w=>w.querySelector("button.sel"));if(!ok){toast("Pick at least one word in each box");return}el.querySelector(".fb-final").classList.remove("hidden");el.querySelectorAll(".wb button,#chk").forEach(x=>x.disabled=true);markDone(CUR.id)}}
 if(it.type==="calendar"){el.querySelectorAll(".cal div").forEach(d=>{d.onclick=()=>d.classList.toggle("sel");d.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();d.classList.toggle("sel")}}});el.querySelector("#chk").onclick=()=>{const sel=Array.from(el.querySelectorAll(".cal div.sel")).map(d=>+d.dataset.j);const want=it.expect;const same=sel.length===want.length&&want.every(x=>sel.includes(x));el.querySelectorAll(".cal div").forEach(d=>d.classList.toggle("exp",want.includes(+d.dataset.j)));el.querySelector(".fb-final").classList.remove("hidden");if(!same){toast("The gold-outlined months are the due dates. Match them and check again.");return}el.querySelectorAll(".cal div,#chk").forEach(x=>x.style.pointerEvents="none");el.querySelector("#chk").disabled=true;markDone(CUR.id)}}
 if(it.type==="wheel"){const rows=el.querySelectorAll(".wheel");rows.forEach(r=>{const j=+r.dataset.j;r.querySelectorAll("button").forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===it.items[j][1];r.querySelectorAll("button").forEach(x=>{x.disabled=true;if(+x.dataset.k===it.items[j][1])x.classList.add("ok")});if(!ok)b.classList.add("bad");r.dataset.done=1;if(Array.from(rows).every(x=>x.dataset.done)){el.querySelector(".fb-final").classList.remove("hidden");markDone(CUR.id)}})})}
 if(it.type==="respite"){const steps=el.querySelectorAll(".rstep");steps.forEach((st,si)=>{st.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{const ok=o.dataset.ok==="1";const fb=st.querySelector(".fb");fb.classList.remove("hidden");if(ok){o.classList.add("right");fb.className="fb";fb.textContent=it.steps[si].fb;st.querySelectorAll(".opt").forEach(x=>x.disabled=true);if(steps[si+1])steps[si+1].classList.remove("hidden");else{const p=el.querySelector("#pay");p.classList.remove("hidden");p.textContent=it.pay;el.querySelector(".fb-final").classList.remove("hidden");markDone(CUR.id)}}else{o.classList.add("wrong");o.disabled=true;fb.className="fb bad";fb.textContent="Not that one. Try again."}})})}
}

/* ---------- Quick Reference, quiz, ack, cert ---------- */
function renderQuickRef(){
 $("#v-qref").innerHTML=`<div class="scene"><div class="hero"><span class="chip">Chapter ${CH.length} · ${esc(CH[CH.length-1][0])}</span><span class="ref">Quick Reference</span><img src="assets/${COURSE.qrefImg||"s_9_1"}.jpg" alt=""><div class="title"><small>Your Quick Reference</small><h1>Keep this in your binder</h1></div></div>
 <div class="qref" id="qrefBody">${COURSE.qrefHtml||`<h3>What we ask of you</h3><ul><li>Use TST-FC every day: routines, pre-teaching, staying neutral, time-in, and signals of safety.</li><li>Build the Managing Emotions Guide with the child and keep it up to date.</li><li>Take the child to every appointment and keep a record of each service.</li><li>Tell your case manager right away if a service is denied, delayed, or cannot be found.</li><li>Support Normalcy and approved contact with parents, siblings, and relatives.</li><li>Tell your case manager when a child names a relative or another person who matters to them.</li><li>Come to Service Plan meetings and share what you see at home.</li><li>Keep your training current. It keeps your home credentialed.</li></ul>
 <h3>The calendar</h3><table class="t"><tr><th></th><th>Basic</th><th>Mental &amp; Behavioral Health</th></tr><tr><td>Service Plan review</td><td>At least every 6 months</td><td>At least every 90 days</td></tr><tr><td>CANS 3.0 (over age 3)</td><td>Every 12 months</td><td>Every 90 days</td></tr><tr><td>Written plan for hard moments</td><td>Managing Emotions Guide</td><td>Managing Emotions Guide and a safety and crisis plan</td></tr><tr><td>When the child leaves</td><td>Discharge plan in the Service Plan</td><td>Aftercare plan and six months of follow-up</td></tr></table>
 <h3>What you can count on from Benevolent House</h3><ul><li>A case manager who visits every month and coaches you in the model.</li><li>On-call staff 24 hours a day, 7 days a week.</li><li>Up to 7 days of paid Intermittent Alternate Care per child each fiscal year. Ask at least 10 days ahead when you can.</li><li>For kinship caregivers: help with verification and benefits, and meetings on evenings and weekends.</li></ul>
 <h3>Call your case manager or the on-call line right away when</h3><ul><li>A child is in crisis, is hurt, or is missing. For a life-threatening emergency or a missing child, call 911 first, then on-call.</li><li>There is a serious incident or you use an emergency behavior intervention.</li><li>You have any concern that a child is being recruited or trafficked. Texas Abuse Hotline 1-800-252-5400.</li><li>Something changes in your household.</li></ul><h3>Kinship and re-credentialing</h3><ul><li>Kinship aftercare: weekly the first month, then twice a month, for six months, plus a support group.</li><li>Your home is re-credentialed every 12 months, in the month of the original credential.</li></ul><p class="small">Benevolent House office: (214) 774-4871. The full T3C Service Delivery Addendum: <a href="addendum.pdf" target="_blank" style="color:var(--green-dk)">open or download it here</a>. It is also in your foster home binder and available from your case manager at any time.</p>`}</div>
 <div class="nav noprint"><button class="btn ghost" onclick="window.print()">Print this page</button><span class="sp"></span><button class="btn gold" onclick="renderQuiz()">Start the Knowledge Check</button></div></div>`;show("qref")}
let attempt=0;
function renderQuiz(){attempt++;let h=`<div class="panel"><div class="k">Knowledge Check</div><h2>Ten questions. ${(COURSE.passMark||8)===8?"Eight":(COURSE.passMark||8)===7?"Seven":(COURSE.passMark||8)} to pass. Attempt ${attempt}.</h2><p class="lead">Take your time. If you score below the passing mark, you will see which items to review and can try again.</p>`;
 QUIZ.forEach((x,i)=>{h+=`<div style="margin:14px 0;padding-top:10px;border-top:1px solid var(--line)"><b>${i+1}. ${esc(x.q)}</b>${x.a.map((a,j)=>`<label style="font-weight:400;display:flex;gap:8px;align-items:flex-start;margin:6px 0;color:var(--ink)"><input type="radio" name="q${i}" value="${j}" style="margin-top:4px"> <span>${esc(a)}</span></label>`).join("")}</div>`});
 h+=`<p><button class="btn" onclick="gradeQuiz()">Submit answers</button></p></div>`;$("#v-quiz").innerHTML=h;show("quiz")}
let RESULT=null;
function gradeQuiz(){let ans=[],score=0,missed=[];for(let i=0;i<QUIZ.length;i++){const r=document.querySelector(`input[name=q${i}]:checked`);if(!r){toast("Please answer question "+(i+1));return}const v=+r.value;ans.push("abc"[v]);if(v===QUIZ[i].k)score++;else missed.push(i)}
 const pass=score>=(COURSE.passMark||8);RESULT={score,answers:ans.join(""),pass,attempt};
 let h=`<div class="panel" style="text-align:center"><div class="k">Knowledge Check</div><p class="score ${pass?"":"fail"}">${score} / ${QUIZ.length}</p><p>${pass?"<b>You passed.</b> One more step: the Acknowledgment.":"<b>Not yet.</b> Review the items below and take the check again. A retake is expected and is never held against you."}</p></div>`;
 if(missed.length){h+=`<div class="panel"><div class="k">Items to review</div>${missed.map(i=>`<p><b>${i+1}. ${esc(QUIZ[i].q)}</b><br>Correct answer: ${esc(QUIZ[i].a[QUIZ[i].k])} <span style="background:var(--sand);border-radius:6px;padding:.1rem .4rem;font-size:.8rem">${esc(QUIZ[i].ref)}</span></p>`).join("")}</div>`}
 h+=`<div class="nav">${pass?`<button class="btn gold" onclick="renderAck()">Continue to Acknowledgment</button>`:`<button class="btn" onclick="renderQuiz()">Retake the Knowledge Check</button> <button class="btn ghost" onclick="renderHome()">Review the chapters</button>`}</div>`;
 $("#v-quiz").innerHTML=h;show("quiz")}
function renderAck(){$("#v-ack").innerHTML=`<div class="panel"><div class="k">Acknowledgment</div><p style="font-size:1.08rem">${esc(ACK)}</p><div class="row"><div><label>Type your full name</label><input type="text" id="aName" value="${esc(S.user.name)}"></div><div><label>Date</label><input type="text" id="aDate" value="${fmtDate(new Date())}" readonly></div></div><label>Sign with your finger or mouse</label><canvas class="sig" id="sigPad" aria-label="Signature pad"></canvas><p><button class="btn ghost sm" style="color:var(--brown);border-color:var(--brown);background:#fff" onclick="clearSig()">Clear signature</button> <button class="btn ghost sm" style="color:var(--brown);border-color:var(--brown);background:#fff" onclick="typedSig()">I cannot draw: use my typed name</button></p><label style="font-weight:400"><input type="checkbox" id="aAgree"> I agree to the statement above and confirm that I completed this training myself.</label><p><button class="btn gold" id="ackSubmit" onclick="finish()">Submit and get my certificate</button></p></div>`;show("ack");initSig()}
let sigCtx,sigDrawn=false;
function initSig(){const c=$("#sigPad");c.width=c.offsetWidth*2;c.height=320;sigCtx=c.getContext("2d");sigCtx.scale(2,2);sigCtx.lineWidth=2.2;sigCtx.lineCap="round";sigCtx.strokeStyle="#1b2a4a";let d=false;const pos=e=>{const r=c.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return[p.clientX-r.left,p.clientY-r.top]};
 const st=e=>{d=true;const[x,y]=pos(e);sigCtx.beginPath();sigCtx.moveTo(x,y);e.preventDefault()},mv=e=>{if(!d)return;const[x,y]=pos(e);sigCtx.lineTo(x,y);sigCtx.stroke();sigDrawn=true;e.preventDefault()},en=()=>{d=false};
 c.addEventListener("mousedown",st);c.addEventListener("mousemove",mv);window.addEventListener("mouseup",en);c.addEventListener("touchstart",st,{passive:false});c.addEventListener("touchmove",mv,{passive:false});c.addEventListener("touchend",en)}
function typedSig(){const n=$("#aName").value.trim();if(!n){toast("Type your name first");return}clearSig();sigCtx.font="italic 34px Georgia, serif";sigCtx.fillStyle="#1b2a4a";sigCtx.fillText(n,16,90);sigDrawn=true;toast("Typed signature applied")}
function clearSig(){const c=$("#sigPad");sigCtx.clearRect(0,0,c.width,c.height);sigDrawn=false}
let finishing=false;
async function finish(){if(finishing)return;const n=$("#aName").value.trim();if(!n){toast("Please type your name");return}if(!sigDrawn){toast("Please sign in the box");return}if(!$("#aAgree").checked){toast("Please check the agreement box");return}
 finishing=true;const b=$("#ackSubmit");b.disabled=true;b.textContent="Submitting...";const now=new Date();const sig=$("#sigPad").toDataURL("image/png");
 const rec={title:COURSE.title,code:COURSE.code,score:RESULT.score,pass:"Pass",date:fmtDate(now),time:fmtTime(now),hours:COURSE.hours,answers:"Attempt "+RESULT.attempt+": "+RESULT.answers,ack:ACK+" Signed by "+n,sig:sig,trainer:COURSE.trainer};
 const ok=await logToForms(rec);S.done={date:fmtDate(now),score:RESULT.score,name:n,sig:sig,iso:now.toISOString()};S.badges[CH.length]=1;save();finishing=false;renderCert(n,now,sig,ok)}
async function logToForms(r){const fd=new FormData();fd.append("formID",JOTFORM_ID);fd.append("q3_q3_textbox1",S.user.name);fd.append("q4_q4_email2",S.user.email);fd.append("q5_q5_textbox3",S.user.home||"");fd.append("q6_q6_dropdown4",S.user.role);fd.append("q8_q8_textbox6",r.title);fd.append("q9_q9_textbox7",r.code);fd.append("q11_q11_number9",r.score);fd.append("q12_q12_dropdown10",r.pass);fd.append("q13_q13_textbox11",r.date);fd.append("q14_q14_textbox12",r.time);fd.append("q15_q15_number13",r.hours);fd.append("q16_q16_textarea14",r.answers);fd.append("q17_q17_textarea15",r.ack);fd.append("q18_q18_textarea16",r.sig);fd.append("q20_q20_textbox18",r.trainer);fd.append("q21_q21_textbox19",PORTAL_VERSION);
 try{await fetch(JOTFORM_SUBMIT_URL,{method:"POST",body:fd,mode:"no-cors"});return true}catch(e){try{const q=JSON.parse(localStorage.getItem(KEY+"_queue")||"[]");q.push({r,u:S.user});localStorage.setItem(KEY+"_queue",JSON.stringify(q))}catch(x){}return false}}
function renderCert(name,now,sig,ok){$("#v-cert").innerHTML=`<p class="noprint hint" style="margin:14px 0">${ok?"Your completion record has been sent to Benevolent House.":"Your record is saved on this device and will be sent when you are back online. Please also tell your case manager you finished."} Print or save this certificate for your records.</p>
 <div id="cert"><img class="logo" src="bh-logo.png" alt=""><div style="font-weight:700;color:var(--brown);font-size:1.2rem">Benevolent House</div><div class="small">Foster Care and Adoption</div><h1>Certificate of Completion</h1><p>This certifies that</p><div class="name">${esc(name)}</div><p>${esc(S.user.role)}${S.user.home?" · "+esc(S.user.home):""}</p><p>has completed</p><p style="font-size:1.25rem;font-weight:700;color:var(--brown)">${esc(COURSE.title)}</p><p>Training code ${esc(COURSE.code)} · ${COURSE.hours} training ${COURSE.hours===1?"hour":"hours"} · Knowledge Check ${RESULT.score} of ${QUIZ.length}<br>${fmtDate(now)}</p>
 <div class="sigs"><div><img src="${sig}" alt=""><b>${esc(name)}</b>Participant</div><div style="padding-top:56px"><b>${esc(COURSE.trainer)}</b>Trainer of Record (electronic record on file)</div></div><div class="seal">${COURSE.seal||"BENEVOLENT<br>HOUSE<br>T3C<br>CERTIFIED"}</div>
 <p class="small" style="margin-top:26px">Self-paced narrated course with Knowledge Check and signed Acknowledgment. Record on file with Benevolent House. Version ${PORTAL_VERSION}.</p></div>
 <div class="nav noprint" style="justify-content:center"><button class="btn" onclick="window.print()">Print or save as PDF</button> <button class="btn ghost" onclick="renderHome()">Back to chapters</button></div>`;show("cert")}

function showSavedCert(){if(!S.done){renderQuickRef();return}RESULT=RESULT||{score:S.done.score};renderCert(S.done.name,new Date(S.done.iso),S.done.sig,true)}
/* ---------- init ---------- */
window.addEventListener("online",async()=>{try{const q=JSON.parse(localStorage.getItem(KEY+"_queue")||"[]");if(!q.length)return;localStorage.removeItem(KEY+"_queue");const u=S.user;for(const it of q){S.user=it.u;await logToForms(it.r)}S.user=u}catch(e){}});
window.addEventListener("resize",()=>{if($("#v-ack")&&!$("#v-ack").classList.contains("hidden")&&!sigDrawn)initSig()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&document.activeElement&&["uName","uEmail","uHome"].includes(document.activeElement.id))signIn()});
$("#homeBtn").onclick=renderHome;renderHome();
</script>
</body></html>
