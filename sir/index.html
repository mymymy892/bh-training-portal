<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serious Incident Reporting</title><meta name="robots" content="noindex"><!-- rev-2026-11-07b -->
<style>:root{--brown:#7B4B2A;--brown-dk:#5E3920;--green:#2E7D4F;--green-dk:#226040;--cream:#FBF7F2;--sand:#F1E8DD;--ink:#2B2320;--muted:#6B5F58;--line:#E3D7C9;--gold:#C9A227;--night:#141010;--night2:#1f1816;--red:#B23A3A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:#f5efe8;font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}

.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(20,16,16,.82);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08)}

.top .brand{font-weight:700;color:#fff;font-size:.95rem;line-height:1.1}.top .brand small{display:block;font-weight:400;color:#bdb0a6;font-size:.72rem}
.top .sp{flex:1}
.top .user{font-size:.8rem;color:#e8dccf;background:rgba(255,255,255,.08);border-radius:999px;padding:.3rem .8rem;max-width:50vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:.5rem;border:0;border-radius:12px;padding:.85rem 1.3rem;font-weight:700;background:var(--green);color:#fff;transition:transform .12s,background .15s,box-shadow .15s;box-shadow:0 8px 24px rgba(46,125,79,.35)}
.btn:hover{background:var(--green-dk);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.18)}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn.gold{background:var(--gold);color:#2b1d00;box-shadow:0 8px 24px rgba(201,162,39,.3)}
.btn.sm{padding:.5rem .9rem;font-size:.88rem;border-radius:9px}
/* home / map */
.hero-home{position:relative;border-radius:22px;overflow:hidden;margin:18px 0;min-height:360px;display:flex;align-items:flex-end}
.hero-home img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.03);animation:kb 30s ease-in-out infinite alternate}
.hero-home:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,16,.1) 0%,rgba(20,16,16,.35) 45%,rgba(20,16,16,.92) 100%)}
.hero-home .t{position:relative;z-index:2;padding:30px 30px 28px;max-width:720px}
.hero-home small{display:block;color:#f3d98b;letter-spacing:.16em;text-transform:uppercase;font-size:.72rem;margin-bottom:8px}
.hero-home h1{margin:0 0 10px;font-size:clamp(1.8rem,4.5vw,3rem);line-height:1.05;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.hero-home p{margin:0 0 16px;color:#e8dccf;font-size:1.05rem;max-width:560px}
@keyframes kb{from{transform:scale(1.03) translate(0,0)}to{transform:scale(1.1) translate(-1.5%,-1%)}}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:10px 0 40px}
.ch{position:relative;border-radius:16px;overflow:hidden;background:var(--night2);border:1px solid rgba(255,255,255,.08);min-height:170px;cursor:pointer;transition:transform .15s,border-color .15s}

.ch .n{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#f3d98b}
.ch h3{margin:2px 0 4px;font-size:1rem;color:#fff}

.ch .ring{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--gold) var(--p,0%),rgba(255,255,255,.18) 0);display:flex;align-items:center;justify-content:center}
.ch .ring i{width:28px;height:28px;border-radius:50%;background:var(--night2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.68rem;color:#fff}
.ch.done .ring{background:var(--green)}.ch.done .ring i{background:var(--green);color:#fff}
.ch.locked{opacity:.55}
.sec{margin:26px 0 8px;display:flex;align-items:baseline;gap:10px}

.chip{position:absolute;top:14px;left:14px;z-index:2;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:.35rem .85rem;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase}
.ref{position:absolute;top:14px;right:14px;z-index:2;background:var(--gold);color:#2b1d00;border-radius:8px;padding:.3rem .65rem;font-weight:700;font-size:.76rem}
.title{position:absolute;left:22px;bottom:18px;z-index:2;max-width:85%}
.hero .chip{max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{display:block;color:#f3d98b;letter-spacing:.14em;text-transform:uppercase;font-size:.7rem;margin-bottom:4px}
.title h1{margin:0;font-size:clamp(1.3rem,3.6vw,2.3rem);line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.55)}

.cap span{opacity:.32;transition:opacity .25s}.cap span.on{opacity:1}
.bar{display:flex;align-items:center;gap:12px;padding:8px 6px 14px}

.prog{flex:1;height:6px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--gold)}
.speed{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:.3rem .55rem;font-size:.78rem}

.panel{background:#fff;color:var(--ink);border-radius:18px;padding:22px 22px 20px;margin:6px 0 16px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.panel h2{margin:0 0 6px;color:var(--brown);font-size:1.25rem}
.panel .lead{margin:0 0 12px;color:var(--muted)}
.panel .k{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--green-dk);font-weight:700;margin-bottom:4px}
.opt{display:block;width:100%;text-align:left;background:var(--cream);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--ink);transition:border-color .12s,transform .12s}
.opt:hover{border-color:var(--brown);transform:translateX(2px)}
.opt.right{border-color:var(--green);background:#E3F3E9}
.opt.wrong{border-color:var(--red);background:#FCECEC}

.fb{margin-top:10px;padding:12px 14px;border-radius:10px;background:#F3FAF5;border-left:5px solid var(--green);font-size:.98rem}
.fb.bad{background:#FCF1F1;border-color:var(--red)}

.chips button.sel{border-color:var(--brown);background:var(--sand)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.bin{border:2px dashed var(--line);border-radius:12px;padding:10px;min-height:84px;cursor:pointer;background:#fff}
.bin:hover{border-color:var(--brown)}
.bin h4{margin:0 0 6px;font-size:.85rem;color:var(--brown)}
.bin .c{display:inline-block;background:var(--sand);border-radius:999px;padding:.2rem .6rem;margin:3px;font-size:.82rem}
.bin .c.ok{background:#E3F3E9}.bin .c.bad{background:#FCECEC}
.checks label{display:flex;gap:10px;align-items:flex-start;background:var(--cream);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer;font-weight:400}
.checks label.ok{border-color:var(--green);background:#E3F3E9}.checks label.miss{border-color:var(--gold);background:#FFF7DD}.checks label.bad{border-color:var(--red);background:#FCECEC}
.checks input{margin-top:5px}
table.t{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
table.t th,table.t td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--sand);color:var(--brown-dk)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:10px 0}
.card3{perspective:900px;min-height:160px;cursor:pointer}
.card3 .in{position:relative;width:100%;height:100%;min-height:160px;transition:transform .5s;transform-style:preserve-3d}

.stage-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--cream);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}

.stage-row.ok{border-color:var(--green)}.stage-row.bad{border-color:var(--red)}
.wordbank{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}

.cal div.sel{background:var(--green);color:#fff;border-color:var(--green)}

.wheel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
.wheel button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-size:.88rem;color:var(--ink)}
.wheel button.sel{border-color:var(--brown);background:var(--sand)}
.wheel button.ok{border-color:var(--green);background:#E3F3E9}.wheel button.bad{border-color:var(--red);background:#FCECEC}

.hint{color:#bdb0a6;font-size:.85rem}

.badges span.got{background:rgba(201,162,39,.2);border-color:var(--gold)}
label{display:block;font-weight:700;margin:12px 0 4px;color:var(--brown-dk)}
input[type=text],input[type=email],input[type=date],select{width:100%;padding:.7rem .8rem;border:2px solid var(--line);border-radius:10px;font-size:1rem;font-family:inherit;background:#fff;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sig{border:2px solid var(--line);border-radius:10px;background:#fff;touch-action:none;width:100%;height:160px;display:block}
.score{font-size:2.6rem;font-weight:700;color:var(--green);margin:0}.score.fail{color:var(--red)}

.toast.show{opacity:1}
#cert{background:#fff;color:var(--ink);border:10px double var(--brown);padding:34px 40px 130px;max-width:820px;margin:16px auto;text-align:center;position:relative}
#cert img.logo{height:76px}

#cert .seal{position:absolute;right:28px;bottom:22px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d98b,var(--gold) 60%,#8a6a10);display:flex;align-items:center;justify-content:center;color:#2b1d00;font-size:.6rem;font-weight:700;text-align:center;line-height:1.1;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#cert .sigs{display:flex;justify-content:space-around;margin-top:30px;gap:20px;flex-wrap:wrap}

#cert .sigs img{height:50px;display:block;margin:0 auto 2px}
#cert .sigs div b{display:block;border-top:1px solid var(--ink);padding-top:6px}
.small{font-size:.85rem;color:var(--muted)}
.qref{background:#fff;color:var(--ink);border-radius:14px;padding:20px 22px}
.qref h3{color:var(--green-dk);margin:12px 0 4px;font-size:1rem}.qref ul{margin:4px 0;padding-left:1.2rem}
@media print{.top,.nav,.bar,.hero,.noprint,.cap{display:none!important}html,body{background:#fff;color:#000}.panel,.qref,#cert{box-shadow:none}#cert{margin:0;max-width:none}}
@media(max-width:640px){.nav{flex-wrap:wrap}.nav .hint{flex-basis:100%;order:-1;text-align:center}.nav .btn{padding:.7rem .9rem}.hero .chip{max-width:62%;font-size:.72rem;padding:.3rem .6rem}.ref{font-size:.72rem;padding:.25rem .5rem}.title small,.ch .n{font-size:.75rem}.ch .ring i{font-size:.72rem}.stage-row{grid-template-columns:1fr}.top .user{max-width:44vw}.top .brand small{display:none}.top img{height:32px}.top .user{max-width:34vw}.row{grid-template-columns:1fr}.panel{padding:16px}.cal{grid-template-columns:repeat(6,1fr)}.title{left:14px;bottom:12px}.cap{font-size:1.02rem}.hero-home .t{padding:20px 18px}}

.course-prog{position:relative;height:10px;background:var(--sand);border-radius:6px;margin:4px 0 14px;overflow:visible}.course-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:6px;transition:width .4s}.course-prog span{position:absolute;right:0;top:12px;font-size:.72rem;color:var(--muted)}
.scene .course-prog{margin:10px 0 2px}

<script>const SCENES=[{"id": "r1_1", "ch": 1, "chTitle": "One Week", "ref": "TAC 749.503", "title": "The Delgado Family", "narr": "Welcome to Benevolent House. This is Serious Incident Reporting, and for the next ninety minutes you will spend one week with the Delgado family. Marisol and Ray Delgado have two children in their care: Kayla, who is fourteen, and Theo, who is eight. Nothing about this week is unusual. A scraped elbow. A fight at the park. A teenager who walks out the door. A child who says something at bedtime that changes everything. In each moment, you will decide the same four things a caregiver decides every time: Is this serious? Who do I tell? How fast? And what do I write down? The rules come from the Texas Minimum Standards, section 749.503, from the state's Form 2990, and from Benevolent House's own procedures. The names are fictional. The decisions are real. Let's begin."}, {"id": "r1_2", "ch": 1, "chTitle": "One Week", "ref": "TAC 749.503", "title": "What makes it serious", "narr": "Here is the definition you will use all week. A serious incident is any event that could threaten the health, safety, or well-being of a child in care, or that brings in emergency services or outside authorities. Put simply: an unexpected event that is urgent, disruptive, or potentially harmful, even if nobody is hurt. That last part matters. An injury is not what makes an incident serious. The potential for harm is. A runaway who comes back in twenty minutes is still a runaway. A restraint that is allowed under policy is still a restraint. And not everything is serious. A scraped knee from play, an argument between siblings with no physical contact, a child refusing to do homework: those go in the progress notes, and you tell your case manager, but they are not formal reports. When you are not sure, Benevolent House's rule is short. Report it, or ask. Never guess silently. Sort these before the week starts."}, {"id": "r2_1", "ch": 2, "chTitle": "Monday: The Scooter", "ref": "Scenario 3", "title": "The scraped elbow", "narr": "Monday after school. Theo is riding his scooter in the driveway, takes the turn too fast, and goes down. He scrapes his elbow. Marisol cleans it with soap and water, puts on a bandage, and Theo is back on the scooter in five minutes. By dinner there is no swelling, no bruising, nothing but a bandage he is proud of. Marisol has a decision. Is this a serious incident report, or is it something else?"}, {"id": "r2_2", "ch": 2, "chTitle": "Monday: The Scooter", "ref": "Scenario 3", "title": "Tuesday morning", "narr": "Tuesday morning, Theo will not straighten his arm. The elbow is swollen and warm. Marisol takes him to urgent care, where an x-ray shows a small fracture, and he leaves in a splint. Nothing about Marisol's care on Monday was wrong. But the situation changed, and the rule changed with it. An injury that needs professional medical treatment is a serious incident. The clock starts now, at the moment she learns it. What does Marisol do?"}, {"id": "r3_1", "ch": 3, "chTitle": "Tuesday: The Park", "ref": "Scenario 1", "title": "The push", "narr": "Tuesday evening, Ray takes Kayla and Theo to the park with another Benevolent House family. Two of the children start arguing. One pushes the other, who falls face first. Bloody nose, and the child says their head hurts. Ray separates the children, sits the injured child down, pinches the nose, and gets ice from the other parent's cooler. The bleeding stops. The head still hurts. This one is serious, and more than one person needs to know. Ray has one phone and a few minutes. Who does he notify?"}, {"id": "r3_2", "ch": 3, "chTitle": "Tuesday: The Park", "ref": "How to report", "title": "Three steps", "narr": "Reporting is three steps, always in the same order. Step one: immediate notification. Call or message your case manager, the on-call administrator, or the case manager supervisor as soon as the incident happens or you discover it. If it involves abuse or neglect, you also call the Texas Abuse Hotline yourself, right away. Step two: complete the documentation. That is the Serious Incident Report, Form 2990, or the form Benevolent House gives you. Who, what, where, when, what you did, who you told. Step three: submit it within twenty-four hours, to your Benevolent House contact, so the agency can send it on to Licensing, the caseworker, and the SSCC as its protocol requires. Do not hold a report for more details. Write what you know, submit it, and follow up. Ray's evening has eight moves in it. Put each one in its step."}, {"id": "r4_1", "ch": 4, "chTitle": "Wednesday: 9:45 p.m.", "ref": "Scenario 2", "title": "The empty room", "narr": "Wednesday night. Kayla had a phone call with her mother that ended badly. At 9:45, Marisol checks on her and the room is empty. The window is closed, the front door is unlocked. Ray drives the block while Marisol calls Kayla's phone. At 10:05, Kayla walks back in. She went to the park at the end of the street to cool off. She is not hurt, and she is not in trouble. Marisol is relieved, and then she has a question. Kayla was gone for twenty minutes. Does this count?"}, {"id": "r4_2", "ch": 4, "chTitle": "Wednesday: 9:45 p.m.", "ref": "Timeframes", "title": "When the child is missing", "narr": "When a child is not where they should be, the rule depends on the child's age and on what you know. Benevolent House comes first, every time, immediately: call the on-call line the moment you know a child is gone. Then the Minimum Standards set the outside clocks. A child under six who is off the premises and still missing: law enforcement immediately, and Licensing within two hours of that call. A child six to twelve: law enforcement within two hours of knowing the child is off the premises and still missing, and Licensing within two hours of that call. A child thirteen or older: law enforcement and Licensing no later than six hours after the absence is discovered, if the child is still missing. And at any age, if you believe the child was taken, does not intend to come back, or has ever been identified as a trafficking victim, it is immediate. A child who comes back before those clocks run out, like Kayla, is not a Licensing report, but it is still a call to Benevolent House right away and a written record within twenty-four hours. The clocks are the longest anyone may wait. They are never a reason to wait. For each situation, tap who is called first."}, {"id": "r5_1", "ch": 5, "chTitle": "Thursday: The Outcry", "ref": "Abuse or neglect", "title": "At bedtime", "narr": "Thursday night, Marisol is tucking Theo in. Out of nowhere, he says that at his last house, a grown-up used to hit him with a belt when he wet the bed, and he asks if that will happen here. Marisol tells him no, never, and that he is safe. She sits with him until he is asleep. Then she walks into the hallway and stands there. What Theo said is an allegation of abuse. It does not matter that it happened somewhere else, or a while ago, or that she is not sure of the details. There is one rule for abuse and neglect, and it has no exceptions: it is reported immediately, to the Texas Abuse Hotline, by the person who heard it. What does Marisol do first?"}, {"id": "r5_2", "ch": 5, "chTitle": "Thursday: The Outcry", "ref": "Who is responsible", "title": "Everyone who knows", "narr": "The next morning Ray asks whether he should call too, since Marisol already did. Here is how responsibility works. If you witness, discover, or are told about a serious incident, you are responsible for reporting it, even if you believe someone else already has. Foster parents report to the agency and, when it is abuse or neglect, directly to DFPS. Case managers report and document in real time. Support staff tell their supervisor immediately. Administrators make sure the full report is completed and sent. Telling a supervisor does not transfer your duty. The most common reporting mistake is a single sentence: I thought someone else was going to report it. Flip each card to see who does what, then answer Ray's question."}, {"id": "r6_1", "ch": 6, "chTitle": "Friday: Writing It Down", "ref": "Form 2990", "title": "Only what happened", "narr": "Friday, Marisol sits down to write the week. Form 2990 is the state's Serious Incident Report. It asks for the date and time, the people involved, the location, a description of what happened, the actions you took, the notifications you made, and any corrective or preventive steps, with your name and signature at the bottom. The description is where reports go wrong. Write what you saw and heard, in order, without opinions. Not: the child was being defiant. Instead: the child refused a directive to go to her room. Not: he was acting crazy. Instead: he was pacing, shouting, and threw a book across the room. Your report will be read by people who were not there. Give them facts they can picture. Sort these sentences."}, {"id": "r6_2", "ch": 6, "chTitle": "Friday: Writing It Down", "ref": "Form 2990", "title": "Nothing left blank", "narr": "Two more mistakes to avoid. First, forgetting the notifications. Every report must say who you told, when, and how: the time of the call, the name of the person, and whether it was a phone call or an email. Second, leaving out what happened afterward. Did the child see a doctor? Was there a debriefing? Did supervision change? Documentation is your protection and your voice in any review that follows. Fill in every required field. If you need more room, add a page. Keep a copy. Marisol has a list of things she could put in Theo's report. Which belong?"}, {"id": "r7_1", "ch": 7, "chTitle": "Saturday: The Clock", "ref": "Timeframes", "title": "How fast", "narr": "Saturday is quiet, so this is the day to learn the clock. Three speeds. Immediately, as soon as it is known: any allegation of abuse, neglect, or exploitation, including by another child; a suicide attempt; a child missing under suspicious circumstances; and, under Benevolent House policy, a weapon found in the home. As soon as possible and no later than two hours: a child's death, with law enforcement called within the first hour. As soon as possible and no later than twenty-four hours: nearly everything else. A substantial injury or critical illness that needs medical treatment or hospitalization. An arrest, or police responding to something that could lead to charges. A restraint not in the child's plan. An evacuation of the home. A suicide threat with a plan. Behavior that puts the child or others at serious risk. One more rule sits over all of these: the clock starts when the incident occurs or when you discover it, not when you told someone at Benevolent House. For each incident, choose the speed."}, {"id": "r7_2", "ch": 7, "chTitle": "Saturday: The Clock", "ref": "Timeframes", "title": "When the clock starts", "narr": "One scenario to test the rule. On Thursday afternoon, a child told Ray that she had thought about hurting herself and had a plan. Ray talked with her, she calmed down, and he decided to mention it at the next home visit, which is Tuesday. Nobody was notified. By Saturday, she seems fine. What should have happened?"}, {"id": "r8_1", "ch": 8, "chTitle": "After the Report", "ref": "Follow-up", "title": "What happens next", "narr": "Sunday. The week is over, and three reports are in. Here is what may follow. DFPS or Licensing may open an investigation. The SSCC may ask for more documentation or review the case. Licensing may call you with questions. Benevolent House may do its own safety review. None of that is a sign you did something wrong. A timely, factual report is what lets the agency respond with confidence, and it becomes part of the licensing file, contract reviews, and safety planning. Your role does not end when you submit. Be available for questions, cooperate with any investigation, and keep documenting what changes afterward. One last question for the Delgados' week."}];
const QUIZ=[{"q": "Which of these is a serious incident that must be reported?", "a": ["A child needs stitches after falling from a bunk bed", "A child refuses to do homework and slams his door", "A scraped knee cleaned and bandaged at home with no further problem"], "k": 0, "ref": "TAC 749.503"}, {"q": "For most serious incidents (not abuse or neglect), the written report must be submitted within:", "a": ["72 hours", "24 hours", "The next scheduled home visit"], "k": 1, "ref": "Timeframes"}, {"q": "A serious incident report must always include:", "a": ["Who was involved, what happened, and when and where it occurred", "The caregiver's opinion of why the child behaved that way", "A summary of the child's school grades"], "k": 0, "ref": "Form 2990"}, {"q": "True or false: only supervisors and administrators are responsible for reporting serious incidents.", "a": ["True", "False"], "k": 1, "ref": "Who is responsible"}, {"q": "Form 2990 is used for:", "a": ["Documenting and reporting serious incidents involving a child in care", "Requesting respite care", "Recording monthly training hours"], "k": 0, "ref": "Form 2990"}, {"q": "A child leaves the home without permission at 10:00 p.m. and returns on her own at 10:20 p.m., unharmed. What do you do?", "a": ["Nothing; the child returned quickly", "Notify Benevolent House immediately and complete the incident documentation within 24 hours", "Mention it at the next home visit"], "k": 1, "ref": "Scenario 2"}, {"q": "If you are not sure whether something counts as a serious incident, you should:", "a": ["Wait and see whether it happens again", "Report it, or ask your case manager or the on-call administrator right away", "Decide on your own and keep it in your notes"], "k": 1, "ref": "When in doubt"}, {"q": "Which of these is NOT a required part of serious incident documentation?", "a": ["Who was notified, when, and how", "A summary of the child's school grades", "Immediate actions taken"], "k": 1, "ref": "Form 2990"}, {"q": "An allegation of abuse or neglect must be reported immediately to:", "a": ["The Texas Abuse Hotline (1-800-252-5400 or txabusehotline.org), then Benevolent House, the child's caseworker, and law enforcement if appropriate", "Only your case manager, who will decide whether to call the hotline", "The biological parents"], "k": 0, "ref": "Abuse or neglect"}, {"q": "A foster parent mentions during a home visit that a child threatened to hurt herself two days ago, with a plan, and no one was notified. What should have happened?", "a": ["Nothing; the child did not act on it", "Benevolent House should have been notified the same day, and the report submitted within 24 hours counted from when the child made the threat", "The foster parent should have waited to see if it happened again"], "k": 1, "ref": "Scenario"}];
const ACK="I completed the Serious Incident Reporting Training. I received the Serious Incident Reporting Quick Reference, I understand what a serious incident is, who must be notified, the reporting timeframes, and the documentation Benevolent House requires, and I agree to report serious incidents in accordance with Benevolent House policy and Texas Minimum Standards.";
const COURSE={"title": "Serious Incident Reporting Training", "code": "SIR", "renewMonths": 12, "hours": 1.5, "trainer": "Tanya Orr, LCPAA", "basis": "26 TAC 749.503 (as amended November 2024), HHSC Form 2990, and Benevolent House serious incident procedures", "subtitle": "Serious Incident Reporting", "hero": "One Week at the Delgados'", "blurb": "Spend one week with a Benevolent House foster family and decide, moment by moment, what is serious, who to tell, how fast, and what to write down. About ninety minutes with the activities and knowledge check. Narrated, with captions. Stop any time; your place is saved.", "heroImg": "s_r1_1", "qrefImg": "s_r8_1", "seal": "BENEVOLENT<br>HOUSE<br>SIR<br>CERTIFIED", "passMark": 7, "chapters": [["One Week", "1"], ["Monday: The Scooter", "2"], ["Tuesday: The Park", "3"], ["Wednesday: 9:45 p.m.", "4"], ["Thursday: The Outcry", "5"], ["Friday: Writing It Down", "6"], ["Saturday: The Clock", "7"], ["After the Report", "8"], ["Certified", "9"]], "icons": {"1": "\ud83c\udfe0", "2": "\ud83d\udef4", "3": "\ud83c\udf33", "4": "\ud83c\udf19", "5": "\ud83d\udecf\ufe0f", "6": "\ud83d\udcdd", "7": "\u23f1\ufe0f", "8": "\ud83d\udcec", "9": "\ud83c\udfc5"}, "roles": ["Foster Caregiver", "Kinship Caregiver", "Adoptive Parent", "Foster and Adoptive Caregiver", "Staff", "Contracted Provider"], "openers": {"r1_1": "v_r1", "r2_1": "v_r2", "r3_1": "v_r3", "r4_1": "v_r4", "r5_1": "v_r5", "r6_1": "v_r6", "r7_1": "v_r7", "r8_1": "v_r8"}, "qrefHtml": "<h3>What is a serious incident?</h3><p>Any event that may threaten the health, safety, or well-being of a child in care, or that involves emergency services or outside authorities, even if no one is hurt (TAC 749.503). Examples: allegations of abuse or neglect; injuries needing medical treatment; runaways or AWOL, even if the child returns quickly; hospitalizations, medical or psychiatric; use of restraint or seclusion; law enforcement or EMS involvement; a child causing or threatening serious harm; major property damage or safety threats.</p><p><b>Not a serious incident</b> (document in progress notes and tell your case manager): a minor injury treated at home, a behavioral outburst with no injury or threat, sibling arguments with no physical contact, refusing directions. <b>When in doubt, report it or ask.</b></p>\n<h3>When to report (26 TAC 749.503, as amended 2024)</h3><table class=\"t\"><tr><th>Incident</th><th>Report by</th></tr><tr><td>Any allegation or sign of abuse, neglect, or exploitation, including by another child in the home</td><td>Immediately, as soon as aware: Texas Abuse Hotline, then Benevolent House</td></tr><tr><td>Suicide attempt</td><td>Immediately, as soon as aware</td></tr><tr><td>Child missing with signs of abduction, a trafficking history, or reason to believe the child will not return</td><td>Immediately: law enforcement, Benevolent House, Licensing</td></tr><tr><td>Child under 6 missing from the premises</td><td>Law enforcement immediately; Licensing within 2 hours of that call</td></tr><tr><td>Child 6 to 12 missing from the premises</td><td>Law enforcement within 2 hours if still missing; Licensing within 2 hours of that call</td></tr><tr><td>Child 13 or older missing</td><td>Within 6 hours of discovery if still missing</td></tr><tr><td>Child returns before the deadline</td><td>Tell Benevolent House right away; document the absence within 24 hours</td></tr><tr><td>Child's death</td><td>Law enforcement within 1 hour; Licensing and parents as soon as possible, no later than 2 hours</td></tr><tr><td>Substantial injury or critical illness needing medical treatment or hospitalization; arrest or a police response that could lead to charges; fire, flood, or anything that makes the home unsafe; disaster closing the home; communicable disease; allegation of a prohibited or improper restraint</td><td>As soon as possible, no later than 24 hours</td></tr><tr><td>Benevolent House additions: suicide threat with a plan; weapon found in the home; psychiatric hospitalization; damage to the home; law enforcement contact that is not an emergency; child moved for safety; transport in violation of safety rules; media coverage; legal action</td><td>As soon as possible, no later than 24 hours, to Benevolent House</td></tr></table><p class=\"small\">The clock starts when the incident occurs or is discovered, not when you told someone at Benevolent House. Benevolent House is told right away about every incident on this list.</p>\n<h3>Who to notify</h3><ol><li>Benevolent House, at any hour: office (214) 774-4871; after hours, Ms. Mashburn (Case Manager Supervisor) at (214) 774-4871 or Ms. Orr (Executive Director) at (214) 774-4871.</li><li>For abuse or neglect: the Texas Abuse Hotline yourself, before anything else, 1-800-252-5400 or <a href=\"https://www.txabusehotline.org\" target=\"_blank\" style=\"color:var(--green-dk)\">txabusehotline.org</a>. Do not wait for a supervisor.</li><li>Law enforcement or 911 for a missing child or an emergency.</li><li>Licensing, the child's caseworker, and the SSCC are notified through Benevolent House under agency protocol.</li></ol>\n<h3>Who is responsible</h3><p>Anyone who witnesses, discovers, or is told about a serious incident, even if you think someone else already has. Telling a supervisor does not transfer the duty.</p>\n<h3>Form 2990, Serious Incident Report</h3><ul><li>Date, time, and location; names of everyone involved; what happened, step by step, in factual language; immediate actions taken; who was notified, when, and how; corrective or preventive measures; follow-up or resolution; your name and signature.</li><li>Quote the child's words. No opinions, labels, or guesses about motive. Fill every required field; add pages if needed; keep a copy.</li><li>Submit within 24 hours to your Benevolent House contact. The form is available from the agency and at hhs.texas.gov (search Form 2990).</li></ul>\n<h3>After you report</h3><p>DFPS, Licensing, or the SSCC may investigate or ask for more. Stay available, cooperate, and keep documenting what changes.</p>"};
</script>

"r1_2":{type:"sort",k:"Serious, or document and tell?",q:"Tap an event, then tap where it belongs.",
 bins:[["ser","Call Benevolent House right away"],["doc","Document in progress notes and tell your case manager"]],
 items:[["A child needs stitches after falling from a bunk bed","ser"],["Two siblings argue about the remote; no one touches anyone","doc"],["A child is missing for twenty minutes and comes back on her own","ser"],["Police come to the house because a neighbor called about shouting","ser"],["A child refuses to do homework and slams his door","doc"],["A caregiver uses a physical hold that is allowed under agency policy","ser"],["A scraped knee from the playground, cleaned and bandaged at home","doc"],["A child says an adult at a previous home hurt him","ser"]],
 fb:"The test is potential for harm or the involvement of outside authorities, not whether anyone was hurt. A child who leaves without permission is called in even when she returns quickly; Benevolent House decides whether the Minimum Standards also require a Licensing report. Approved restraints count. An outcry of abuse always counts. The three everyday events go in the progress notes, with a heads-up to your case manager, and you keep watching for a pattern."},
"r2_1":{type:"choice",k:"Monday's decision",q:"Theo scraped his elbow, it was cleaned and bandaged at home, and he needed no medical care. What does Marisol do?",
 a:[["Call the Texas Abuse Hotline and complete Form 2990 within 24 hours",0,"No. Nothing here involves abuse, neglect, or professional medical treatment. The hotline is not the place for a scraped elbow."],["Write it in Theo's progress notes with the time, what she did, and how he was afterward, and let the case manager know",1,"Yes. A minor injury treated at home is not a serious incident. It is still documented, with the response and the outcome, and the case manager is told as a courtesy. Keep watching it."],["Nothing. Kids fall off scooters",0,"Not quite. It is not reportable, but it is documented. If it worsens, that note is the beginning of the record."]]},
"r2_2":{type:"multi",k:"Tuesday's change",q:"The elbow is fractured and Theo is in a splint. Check everything Marisol does now.",
 items:[["Notify Benevolent House (her case manager or the on-call administrator) right away",1],["Complete Form 2990 and submit it within 24 hours of learning about the fracture",1],["Include Monday's fall and home care in the report, with the time she first noticed the swelling",1],["Wait until the follow-up appointment to see how it heals before reporting",0],["Call the Texas Abuse Hotline, because every injury goes to the hotline",0],["Keep a copy of the report for her own file",1]],
 fb:"An injury that requires professional medical treatment is a serious incident, and the 24-hour clock starts when it is discovered. The report tells the whole story: the fall, the home care, when the swelling appeared, the visit, the splint. The hotline is for abuse, neglect, and exploitation; an accident with proper care goes to Benevolent House, which notifies Licensing and the caseworker under its protocol."},
"r3_1":{type:"multi",k:"Who Ray notifies",q:"A child at the park has a bloody nose and head pain after being pushed. Check everyone who must be notified.",
 items:[["Benevolent House: his case manager, the on-call administrator, or the case manager supervisor, immediately",1],["The child's assigned caseworker, through Benevolent House per agency protocol",1],["Licensing, through Benevolent House's Form 2990 process within 24 hours",1],["The other child's biological parents, tonight, by text",0],["A medical provider, if the head pain continues or any sign of injury appears (good practice, and the visit goes in the report)",1],["The Texas Abuse Hotline, if anything about the incident suggests abuse or neglect by a caregiver or another child",1]],
 fb:"Serious incidents go to both internal and external contacts: Benevolent House first, and through the agency's process, Licensing and the caseworker. Head pain after a fall is watched closely and seen by a provider if it continues. If any detail points to abuse or neglect, the hotline is called immediately. Contacting another child's biological family is never part of incident reporting."},
"r3_2":{type:"stages",k:"Three steps, eight moves",q:"For each of Ray's moves, choose the step it belongs to.",
 stages:["Step 1: Immediate notification","Step 2: Complete the documentation","Step 3: Submit within 24 hours"],
 items:[["Calls the on-call administrator from the park at 7:10 p.m.",0],["Writes the names of every child and adult who was present",1],["Describes the argument, the push, the fall, and the nosebleed in order",1],["Lists the first aid he gave and the time the bleeding stopped",1],["Sends the completed Form 2990 to his case manager before 7:10 p.m. the next day",2],["Records that he called the on-call line at 7:10 p.m. and who answered",1],["Keeps a copy of the submitted report in the family's file",2],["Texts the case manager supervisor the same night so two people know",0]],
 fb:"Notify first, from where you are. Write it down second: who, what, where, when, what you did, who you told. Submit third, within 24 hours, and keep a copy. Do not hold a report for details you do not have yet; write what you know and follow up."},
"r4_1":{type:"choice",k:"Twenty minutes",q:"Kayla left without permission at some point before 9:45 and returned at 10:05, unharmed. Is this a serious incident?",
 a:[["No. She was back in twenty minutes, nobody was hurt, and she is fourteen",0,"The length of time and the outcome do not decide it. A child who leaves without permission is a runaway or AWOL incident, even if she comes back quickly."],["Yes. It is an unauthorized absence. Marisol notifies Benevolent House right away and documents, within 24 hours, the time Kayla was found missing, the time she returned, what the family did, and what Kayla said",1,"Correct. Benevolent House is called immediately for every unauthorized absence. Because Kayla returned before the Minimum Standards' time frame, this one is documented within 24 hours rather than reported to Licensing as a serious incident (26 TAC 749.503(c)). Benevolent House makes that call, not the caregiver."],["Only if it happens again",0,"A pattern matters later. The first time is already reportable."]]},
"r4_2":{type:"wheel",k:"Who is called first?",q:"For each situation, tap who is called first.",
 who:["Benevolent House immediately, then law enforcement within the state time frame (immediately if anything is suspicious)","Benevolent House right away; document the absence within 24 hours","Texas Abuse Hotline, immediately, then Benevolent House","911 for the emergency, then on-call"],
 items:[["Theo, eight, has been missing from the backyard and the family has searched everywhere",0],["Kayla, fourteen, left after an argument and came back twenty minutes later",1],["Kayla's bed is empty, her window is open, and a stranger's car was seen on the street",0],["Kayla says a relative's boyfriend touched her during a visit",2],["Theo has swallowed something from under the sink and is vomiting",3]],
 fb:"Minimum standard 749.503: a child under 6 who is off the premises and missing means law enforcement immediately; ages 6 to 12, law enforcement within 2 hours of determining the child is missing; 13 and older, within 6 hours of discovery; any sign of abduction, a trafficking history, or that the child will not return means immediately at any age. Licensing is notified within the same windows. A child who returns before the deadline is documented within 24 hours, and Benevolent House is always told right away. An outcry goes to the Texas Abuse Hotline, 1-800-252-5400 or txabusehotline.org, by the person who heard it. A medical emergency is 911 first."},
"r5_1":{type:"choice",k:"The first call",q:"Theo has just said an adult at his last home hit him with a belt. Marisol believes him. What does she do first?",
 a:[["Call her case manager in the morning and let the agency decide whether it is an allegation",0,"No. Abuse and neglect are reported immediately, and the duty belongs to the person who heard it. Waiting for a supervisor is the mistake this training exists to prevent."],["Call the Texas Abuse Hotline, 1-800-252-5400, or report at txabusehotline.org, now. Then notify Benevolent House's on-call line tonight. Then complete Form 2990 within 24 hours",1,"Yes. Immediately, to DFPS, by Marisol herself. Then Benevolent House, then the written report. It does not matter that it happened at another home or some time ago."],["Ask Theo more questions first so the report is complete",0,"No. Comfort him, keep him safe, and write down exactly what he said in his words. Questioning is for the investigators. Report what you heard."]]},
"r5_2":{type:"flip",k:"Who reports",cards:[["Foster parents","Report directly to Benevolent House, and for abuse or neglect, directly to DFPS at 1-800-252-5400 or txabusehotline.org. Telling the agency does not replace the hotline call."],["Case managers","Report and document in real time."],["Support and direct care staff","Notify a supervisor immediately. For abuse or neglect, also report to DFPS yourself."],["Administrators and supervisors","Make sure the full report is completed and submitted to every required party: Licensing, the caseworker, and the SSCC under agency protocol. The Program Director or Executive Director is notified of critical incidents."]],
 then:{q:"Ray asks: Marisol already called the hotline last night. Does he need to do anything?",a:["No. One call per household is enough, and the duty was hers because she heard it","Yes. He was told about the incident, so he is responsible too. He confirms with Marisol that the hotline and Benevolent House were called, adds what he knows to the report, and if he could not confirm the report was made, he makes it himself","Yes. He should wait and tell the case manager at Tuesday's home visit"],k:1,fb:"Anyone who witnesses, discovers, or is told about a serious incident is responsible for reporting it, even if they think someone else already has. Responsibility is not delegated. Ray confirms the report was made and adds what he knows; if he cannot confirm it, he makes the report himself."}},
"r6_1":{type:"sort",k:"Facts, or opinions?",q:"Tap a sentence, then tap where it belongs in a Form 2990 narrative.",
 bins:[["fact","Belongs in the report"],["op","Rewrite it"]],
 items:[["Kayla was being disrespectful and dramatic","op"],["At 9:45 p.m. I found Kayla's room empty; the front door was unlocked","fact"],["Theo was acting crazy at bedtime","op"],["Theo said, 'At my old house they hit me with a belt when I wet the bed'","fact"],["The other boy is always starting fights","op"],["At about 6:50 p.m. one child pushed the other, who fell forward and hit his face on the ground","fact"],["I think she just wanted attention","op"],["I called the on-call line at 10:08 p.m. and spoke with Ms. Reyes","fact"]],
 fb:"Report what you saw, heard, and did, in order, with times. Quote the child's words when you can. Opinions, labels, and guesses about motive do not belong in the narrative; the people reading it were not there and need facts they can picture."},
"r6_2":{type:"multi",k:"Theo's report",q:"Check everything that belongs in Theo's Form 2990.",
 items:[["Date and time Theo made the statement, and where",1],["Theo's exact words, as closely as Marisol can recall them",1],["The time of the hotline call and who she spoke with",1],["The time she notified Benevolent House and the name of the person she spoke with",1],["Marisol's opinion of Theo's previous foster parents",0],["A summary of Theo's school grades this semester",0],["Follow-up: Theo's case manager is arranging a visit and a therapy check-in",1],["Marisol's name and signature",1]],
 fb:"Who, what, when, where, what you did, who you told and when, and what follows. Every required field filled in. Opinions and unrelated history stay out."},
"r7_1":{type:"stages",k:"Three speeds",q:"For each incident, choose the reporting speed.",
 stages:["Immediately, as soon as you are aware","As soon as possible, no later than 2 hours","As soon as possible, no later than 24 hours"],
 items:[["A child says a caregiver hit her",0],["A child is hospitalized overnight after an asthma attack",2],["A child attempts suicide",0],["A child's death",1],["A child is arrested",2],["A caregiver is alleged to have used a hold that is not allowed",2],["A child is missing and there are signs of foul play",0],["The family evacuates for a gas leak",2],["A child threatens suicide and has a plan (Benevolent House rule)",2],["Another child in the home is reported to have abused a foster child",0]],
 fb:"Immediately: abuse, neglect, or exploitation by anyone, including another child; a suicide attempt; a child missing under suspicious circumstances. Two hours: a child's death, with law enforcement within the first hour. Twenty-four hours: hospitalization for a substantial injury or critical illness, arrests, improper restraint allegations, a home made unsafe or evacuated, communicable disease, and Benevolent House's own additions such as a suicide threat with a plan and a weapon found in the home. The timeframe is the latest you may report, never a target."},
"r7_2":{type:"choice",k:"Thursday to Tuesday",q:"A child told Ray on Thursday that she had a plan to hurt herself. He planned to mention it at Tuesday's home visit. What should have happened?",
 a:[["Nothing more. She calmed down and is fine now",0,"A suicide threat with a plan is a serious incident whether or not the child acted on it."],["Ray should have notified Benevolent House the same day, called 911 if the child was in immediate danger, and the report should have been submitted within 24 hours of Thursday afternoon, counted from when she told him, not from the home visit",1,"Yes. Notify the same day, and the 24 hours run from the moment the incident occurred or was discovered. If the child had acted on the plan, an attempt is reported immediately. Waiting for a scheduled visit is a delay, and delays can result in regulatory violations."],["He should have reported it at the home visit, since that is when the case manager is there",0,"The clock does not wait for the visit. It started on Thursday afternoon."]]},
"r8_1":{type:"multi",k:"After the report",q:"Which of these may happen after a report is submitted, and what is the caregiver's job?",
 items:[["DFPS or Licensing may open an investigation",1],["The SSCC may ask for more documentation or review the case",1],["Benevolent House may do its own safety review",1],["The caregiver's job is finished once the form is submitted",0],["The caregiver stays available for questions and cooperates with any investigation",1],["The caregiver keeps documenting changes, follow-up services, and new concerns",1]],
 fb:"Follow-up is normal and is not a sign you did something wrong. Your report becomes part of the licensing file, contract reviews, and safety planning, and your role continues: answer questions, cooperate, and keep writing things down."}
};
</script>
<script>/* ===== Benevolent House course engine ===== */
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const PORTAL_VERSION="2.0 (Nov 2026)";const JOTFORM_ID="263097317610052";const JOTFORM_SUBMIT_URL="https://submit.jotform.com/submit/"+JOTFORM_ID;
const KEY="bh_course_"+(typeof COURSE!=="undefined"?COURSE.code.replace(/[^A-Za-z0-9]/g,"_"):"t3c")+"_v2";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(){try{S._ts=Date.now();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}try{if(S.user&&S.user.cloud&&window.BHC)BHC.putProgress(COURSE.code,S)}catch(e){}}
let S=load();S.seen=S.seen||{};S.badges=S.badges||{};S.answers=S.answers||{};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
function show(id){$$("main>section").forEach(s=>s.classList.add("hidden"));$("#v-"+id).classList.remove("hidden");window.scrollTo({top:0});stopAudio();if(typeof stopLine==="function")stopLine()}
function fmtDate(d){return d.toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"})}
function fmtTime(d){return d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}
const CH=(typeof COURSE!=="undefined"&&COURSE.chapters)||[["The Call","1"],["The First Night","2"],["The Plan","3"],["Credentialed","4"],["Weekend Off","5"],["Kinship","6"],["Safety","7"],["Going Home","8"],["Certified","9"]];
const BADGE_ICON=(typeof COURSE!=="undefined"&&COURSE.icons)||{1:"📞",2:"🌙",3:"🗂️",4:"🏠",5:"☕",6:"🧓",7:"🛡️",8:"🎈",9:"🏅"};
function scenesOf(ch){return SCENES.filter(s=>s.ch===ch)}
function chProgress(ch){const sc=scenesOf(ch);let d=sc.filter(s=>S.seen[s.id]).length,n=sc.length;if(ch===CH.length){n+=1;d+=S.done?1:0}return[d,n]}
function chUnlocked(ch){if(ch===1)return true;const[d,n]=chProgress(ch-1);return n?d>=n:true}

/* ---------- user ---------- */
function userLabel(){return S.user?S.user.name+(S.user.home?" · "+S.user.home:""):"Not signed in"}
function renderHome(){
 $("#user").textContent=userLabel();
 let h=`<div class="hero-home"><img src="assets/${COURSE.heroImg||"s1_a"}.jpg" alt=""><div class="t"><small>Benevolent House · ${esc(COURSE.subtitle||"T3C Policy and Procedure Training")}</small><h1>${esc(COURSE.hero||"The Carter Family")}</h1><p>${esc(COURSE.blurb||"Follow one family through a placement and learn what Texas Child-Centered Care asks of you at each step. About two hours. Narrated, with captions. Stop any time; your place is saved.")}</p>${S.user?(S.done?`<button class="btn gold" onclick="showSavedCert()">View my certificate</button> <button class="btn ghost" onclick="openChapter(1)">Review the course</button>`:`<button class="btn gold" onclick="resume()">${Object.keys(S.seen).length?"Continue where I left off":"Begin Chapter 1"}</button>`):""}</div></div>`;
 if(!S.user&&window.BHC&&BHC.available()){h+=`<div class="panel" id="bhsHost"></div>`}
 else if(!S.user){h+=`<div class="panel"><div class="k">Before you begin</div><h2>Tell us who you are</h2><div class="row"><div><label>Full name</label><input type="text" id="uName" placeholder="First and last name"></div><div><label>Email</label><input type="email" id="uEmail" placeholder="you@example.com"></div></div><div class="row"><div><label>Foster home or staff role</label><input type="text" id="uHome" placeholder="e.g., Johnson Home, or Case Manager"></div><div><label>I am a</label><select id="uRole">${(COURSE.roles||["Foster Caregiver","Kinship Caregiver","Adoptive Parent","Foster and Adoptive Caregiver","Staff","Contracted Provider"]).map(r=>`<option>${r}</option>`).join("")}</select></div></div><p><button class="btn" onclick="signIn()">Continue</button></p><p class="small">Your name and completion record are kept by Benevolent House for licensing and training records. No child information is ever entered here. All names in this course are fictional.</p></div>`}
 else{
  const got=Object.keys(S.badges).length;
  if(S.renewDue&&!S.done)h+=`<div class="panel"><div class="k">Time to renew</div><p>This training is due again by <b>${esc(fmtDate(new Date(S.renewDue)))}</b>. Your progress has started over for this year. Your earlier certificate stays on your training log.</p></div>`;
  h+=progBar();h+=`<div class="sec"><h2>Your chapters</h2><span>${got} of ${CH.length} badges earned</span></div><div class="badges">${CH.map(([n,c])=>`<span class="${S.badges[c]?"got":""}">${BADGE_ICON[c]} ${n}</span>`).join("")}</div><div class="chapters">`;
  CH.forEach(([name,c])=>{const ch=+c;let[d,n]=chProgress(ch);const first=scenesOf(ch)[0];const un=chUnlocked(ch);const final=ch===CH.length;const pct=Math.round(d/n*100);const img=first?(first.img||('s_'+first.id)):(COURSE.qrefImg||"s_9_1");const go=S.done&&final?`showSavedCert()`:first?`openChapter(${ch})`:`renderQuickRef()`;
   h+=`<div class="ch ${d>=n?"done":""} ${un?"":"locked"}" tabindex="0" role="button" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" onclick="${un?go:`toast('Finish the chapter before this one first')`}"><img src="assets/${img}.jpg" alt=""><div class="ring" style="--p:${pct}%"><i>${d>=n?"✓":d+"/"+n}</i></div><div class="b"><div class="n">Chapter ${ch}</div><h3>${name}</h3><div class="m">${first?n+" scene"+(n>1?"s":""):""}${final?(first?" · ":"")+"Quick Reference, Knowledge Check, certificate":""}</div></div></div>`});
  h+=`</div><p class="hint">Signed in as ${esc(S.user.name)}. <a href="#" onclick="signOut();return false">Not you?</a></p>`}
 $("#v-home").innerHTML=h;show("home");if(!S.user&&$("#bhsHost"))BHSignIn($("#bhsHost"),adoptUser,{roles:COURSE.roles})}
function signIn(){const n=$("#uName").value.trim(),e=$("#uEmail").value.trim(),hm=$("#uHome").value.trim(),r=$("#uRole").value;
 if(!n||!e||!hm){toast("Please fill in your name, email, and home or role");return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){toast("Please enter a valid email address");return}
 S.user={name:n,email:e,home:hm,role:r};save();renderHome()}
function signOut(){const wasCloud=S.user&&S.user.cloud;if(wasCloud&&window.BHC){BHC.flush(COURSE.code);BHC.signOut();S={seen:{},badges:{},answers:{}};try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}renderHome();return}S.user=null;save();renderHome()}
function stateScore(x){return x?Object.keys(x.seen||{}).length+Object.keys(x.answers||{}).length+(x.done?1000:0):0}
async function adoptUser(u){if(!u)return;let remote=null;try{const r=await BHC.getProgress(COURSE.code);remote=r&&r.state}catch(e){}
 const local=(S.user&&S.user.email&&S.user.email.toLowerCase()===u.email.toLowerCase())?S:null;
 let pick=remote&&stateScore(remote)>=stateScore(local)?remote:(local||{});
 S=Object.assign({seen:{},badges:{},answers:{}},pick);S.user=u;renewCheck();save();renderHome()}
function renewCheck(){const m=(typeof COURSE!=="undefined"&&COURSE.renewMonths)||0;if(!m||!S.done||!S.done.iso)return;const due=new Date(S.done.iso);due.setMonth(due.getMonth()+m);
 if(Date.now()>=due.getTime()-90*864e5){S.history=(S.history||[]).concat([{date:S.done.date,iso:S.done.iso,score:S.done.score}]);const keep={user:S.user,rate:S.rate,history:S.history};S=Object.assign({seen:{},badges:{},answers:{}},keep);S.renewDue=due.toISOString()}}
async function cloudBoot(){if(!window.BHC||!BHC.available())return;const p=await BHC.profile();if(!p){if(S.user&&S.user.cloud){S={seen:{},badges:{},answers:{}};try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}renderHome()}return}
 if(!p.full_name||!p.home_label){S.user=null;renderHome();return}await adoptUser(BHC.asUser(p))}
function resume(){const next=SCENES.find(s=>!S.seen[s.id]);if(!next){renderQuickRef();return}openScene(next.id)}
function openChapter(ch){const first=scenesOf(ch).find(s=>!S.seen[s.id])||scenesOf(ch)[0];openScene(first.id)}

/* ---------- audio ---------- */
let AU=null,curSpans=[],curChars=[],curTotal=0;
function stopAudio(){if(AU){try{AU.pause()}catch(e){}AU=null}}
function setupAudio(src,text){
 const sents=text.match(/[^.!?]+[.!?]+["']?/g)||[text];const cap=$("#cap");cap.innerHTML=sents.map(s=>`<span>${esc(s.trim())} </span>`).join("");
 curSpans=$$("#cap span");curChars=sents.map(s=>s.length);curTotal=curChars.reduce((a,b)=>a+b,0);
 const a=new Audio(src);AU=a;a.preload="auto";a.playbackRate=S.rate||1;const btn=$("#play"),pi=$("#pi");
 btn.onclick=()=>{if(a.paused){a.play().catch(()=>{});btn.textContent="❚❚"}else{a.pause();btn.textContent="▶"}};
 a.ontimeupdate=()=>{if(AU!==a)return;const f=a.currentTime/(a.duration||1);pi.style.width=(f*100)+"%";let acc=0,i=0;for(;i<curChars.length;i++){acc+=curChars[i];if(acc/curTotal>f)break}curSpans.forEach((s,j)=>s.classList.toggle("on",j<=i))};
 a.onended=()=>{if(AU!==a)return;btn.textContent="↻";curSpans.forEach(s=>s.classList.add("on"));S.heard=S.heard||{};S.heard[CUR.id]=1;save();gate()};
 a.onerror=()=>{if(AU!==a)return;curSpans.forEach(s=>s.classList.add("on"));btn.textContent="▶";toast("Narration could not be loaded on this connection. Read the caption, then continue.");S.heard=S.heard||{};S.heard[CUR.id]=1;gate()};
 a.play().then(()=>{btn.textContent="❚❚"}).catch(()=>{btn.textContent="▶"})}
function setRate(){S.rate=S.rate===1.25?1:1.25;save();if(AU)AU.playbackRate=S.rate;$("#rate").textContent=(S.rate||1)+"×"}

/* ---------- scene ---------- */
let CUR=null;
function openScene(id){const _s=SCENES.find(s=>s.id===id);if(_s&&!chUnlocked(_s.ch)){toast("Finish the chapter before this one first");renderHome();return}CUR=_s;const i=SCENES.indexOf(CUR);const img=CUR.img||("s_"+CUR.id);const inter=INTER[CUR.id]||{type:"none"};
 const vid=(COURSE.openers||{})[CUR.id];const media=vid?`<video src="assets/${vid}.mp4" poster="assets/${img}.jpg" preload="metadata" autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover;display:block"></video>`:`<img src="assets/${img}.jpg" alt="">`;
 $("#v-scene").innerHTML=`<div class="scene"><div class="hero"><span class="chip">Chapter ${CUR.ch} · ${esc(CUR.chTitle)}</span><span class="ref">${esc(CUR.ref)}</span>${media}<div class="title"><small>Scene ${i+1} of ${SCENES.length}</small><h1>${esc(CUR.title)}</h1></div></div>
 ${progBar()}<p class="cap" id="cap"></p><div class="bar"><button class="play" id="play" aria-label="Play or pause">▶</button><div class="prog"><i id="pi"></i></div><button class="speed" id="rate" onclick="setRate()">${(S.rate||1)}×</button></div>
 ${dialogHTML()}<div id="inter"></div>
 <div class="nav"><button class="btn ghost" onclick="prevScene()" ${i===0?"disabled":""}>Back</button><button class="btn ghost sm" onclick="renderHome()">Chapters</button><span class="sp"></span><span class="hint" id="gateTxt"></span><button class="btn" id="next" onclick="nextScene()" disabled>${i===SCENES.length-1?"Quick Reference":"Continue"}</button></div></div>`;
 show("scene");renderInter(inter);setupAudio("assets/n_"+CUR.id+".mp3",CUR.narr);gate()}
function gate(){const inter=INTER[CUR.id]||{type:"none"};const heard=(S.heard||{})[CUR.id];const done=inter.type==="none"||S.answers[CUR.id];
 const b=$("#next"),t=$("#gateTxt");if(!b)return;if(!heard){b.disabled=true;t.textContent="Listen to the scene to continue";return}if(!done){b.disabled=true;t.textContent="Complete the activity to continue";return}b.disabled=false;t.textContent=""}
function markDone(id){S.answers[id]=1;save();gate()}
function nextScene(){S.seen[CUR.id]=1;save();const i=SCENES.indexOf(CUR);const ch=CUR.ch;const last=scenesOf(ch).slice(-1)[0];
 if(last.id===CUR.id&&!S.badges[ch]&&ch!==CH.length){S.badges[ch]=1;save();showBadge(ch,()=>{i===SCENES.length-1?renderQuickRef():openScene(SCENES[i+1].id)});return}
 i===SCENES.length-1?renderQuickRef():openScene(SCENES[i+1].id)}
function prevScene(){const i=SCENES.indexOf(CUR);if(i>0)openScene(SCENES[i-1].id)}
function showBadge(ch,cb){const name=CH[ch-1][0];const d=document.createElement("div");d.className="badge-pop";d.innerHTML=`<div class="bx"><div class="ic">${BADGE_ICON[ch]}</div><div class="small">Badge earned</div><h3>${esc(name)}</h3><p>Chapter ${ch} complete. ${Object.keys(S.badges).length} of ${CH.length}.</p><button class="btn">Keep going</button></div>`;document.body.appendChild(d);d.querySelector("button").onclick=()=>{d.remove();cb()}}

/* ---------- interactions ---------- */
function renderInter(it){const el=$("#inter");const done=S.answers[CUR.id];
 if(it.type==="none"){el.innerHTML="";return}
 let h=`<div class="panel"><div class="k">${esc(it.k||"Your turn")}</div>`;
 if(it.type==="choice")h+=choiceHTML(it,"c");
 else if(it.type==="multi")h+=multiHTML(it);
 else if(it.type==="sort")h+=sortHTML(it);
 else if(it.type==="flip")h+=`<div class="cards">${it.cards.map(c=>`<div class="card3" tabindex="0"><div class="in"><div class="f">${esc(c[0])}</div><div class="b">${esc(c[1])}</div></div></div>`).join("")}</div><p class="hint" style="color:var(--muted)">Tap each card to turn it over, then answer below.</p>`+choiceHTML({q:it.then.q,a:it.then.a.map((a,j)=>[a,j===it.then.k?1:0,j===it.then.k?it.then.fb:"Not quite. Turn the cards again."])},"c");
 else if(it.type==="stages")h+=stagesHTML(it);
 else if(it.type==="wordbank")h+=wordbankHTML(it);
 else if(it.type==="calendar")h+=calHTML(it);
 else if(it.type==="wheel")h+=wheelHTML(it);
 else if(it.type==="respite")h+=respiteHTML(it);
 h+=`</div>`;el.innerHTML=h;wire(it,el);if(done){el.querySelectorAll("button,input,select").forEach(x=>x.disabled=true);const f=el.querySelector(".fb-final");if(f)f.classList.remove("hidden");const ro=el.querySelector('.opt[data-ok="1"]');if(ro){ro.classList.add("right");const cf=el.querySelector("#cfb");if(cf){cf.classList.remove("hidden");const src=it.type==="flip"?it.then.fb:(it.a?it.a[+ro.dataset.j][2]:"");cf.textContent=src}}replayDone(it,el);const note=document.createElement("p");note.className="hint";note.style.color="var(--muted)";note.textContent="You completed this activity earlier.";el.querySelector(".panel").appendChild(note)}}
function replayDone(it,el){try{
 if(it.type==="sort"){el.querySelectorAll(".chips button").forEach(c=>{const bn=el.querySelector(`.bin[data-bin="${c.dataset.bin}"]`);const s=document.createElement("span");s.className="c ok";s.textContent=c.textContent+" ✓";bn.appendChild(s);c.remove()})}
 if(it.type==="multi"){el.querySelectorAll(".checks label").forEach(l=>{const i=l.querySelector("input");const want=it.items[+i.dataset.j][1]===1;i.checked=want;if(want)l.classList.add("ok")})}
 if(it.type==="stages"){el.querySelectorAll(".stage-row").forEach(r=>{r.querySelector("select").value=String(it.items[+r.dataset.j][1]);r.classList.add("ok")})}
 if(it.type==="wheel"){el.querySelectorAll(".wheel").forEach(r=>{r.querySelectorAll("button").forEach(b=>{if(+b.dataset.k===it.items[+r.dataset.j][1])b.classList.add("ok")})})}
 const f=el.querySelector(".fb-final");if(f)f.classList.remove("hidden")}catch(x){}}
function choiceHTML(it,cls){return `<h2>${esc(it.q)}</h2>${it.a.map((a,j)=>`<button class="opt" data-j="${j}" data-ok="${a[1]}">${esc(a[0])}</button>`).join("")}<div class="fb hidden" id="cfb"></div>`}
function multiHTML(it){return `<h2>${esc(it.q)}</h2><div class="checks">${it.items.map((x,j)=>`<label><input type="checkbox" data-j="${j}"> <span>${esc(x[0])}</span></label>`).join("")}</div><p><button class="btn sm" id="chk">Check my answers</button></p><div class="fb hidden fb-final">${esc(it.fb)}</div>${it.then?`<div id="then" class="hidden" style="margin-top:14px">`+choiceHTML({q:it.then.q,a:it.then.a.map((a,j)=>[a,j===it.then.k?1:0,j===it.then.k?it.then.fb:"Not quite. Look at the policy again."])},"c")+`</div>`:""}`}
function sortHTML(it){return `<h2>${esc(it.q)}</h2><div class="chips">${it.items.map((x,j)=>`<button data-j="${j}" data-bin="${x[1]}">${esc(x[0])}</button>`).join("")}</div><div class="bins">${it.bins.map(b=>`<div class="bin" data-bin="${b[0]}" tabindex="0"><h4>${esc(b[1])}</h4></div>`).join("")}</div><div class="fb hidden fb-final">${esc(it.fb)}</div>`}
function stagesHTML(it){return `<h2>${esc(it.q)}</h2>${it.items.map((x,j)=>`<div class="stage-row" data-j="${j}"><div>${esc(x[0])}</div><select data-j="${j}"><option value="">Choose a stage</option>${it.stages.map((s,k)=>`<option value="${k}">${esc(s)}</option>`).join("")}</select></div>`).join("")}<p><button class="btn sm" id="chk">Check</button></p><div class="fb hidden fb-final">${esc(it.fb)}</div>`}
function wordbankHTML(it){return `<h2>${esc(it.q)}</h2><div class="wordbank">${it.groups.map((g,gi)=>`<div class="wb" data-g="${gi}"><h4>${esc(g[0])}</h4>${g.slice(1).map(w=>`<button>${esc(w)}</button>`).join("")}</div>`).join("")}</div><p class="hint" style="color:var(--muted)">Pick at least one in each box.</p><p><button class="btn sm" id="chk">Save Jada's guide</button></p><div class="fb hidden fb-final">${esc(it.fb)}</div>`}
function calHTML(it){return `<h2>${esc(it.q)}</h2><div class="cal">${it.months.map((m,j)=>`<div data-j="${j}" tabindex="0" role="button">${m}</div>`).join("")}</div><p><button class="btn sm" id="chk">Check</button></p><div class="fb hidden fb-final">${esc(it.fb)}</div>`}
function wheelHTML(it){return `<h2>${esc(it.q)}</h2>${it.items.map((x,j)=>`<div style="margin:12px 0"><b>${esc(x[0])}</b><div class="wheel" data-j="${j}">${it.who.map((w,k)=>`<button data-k="${k}">${esc(w)}</button>`).join("")}</div></div>`).join("")}<div class="fb hidden fb-final">${esc(it.fb)}</div>`}
function respiteHTML(it){return `<h2>${esc(it.q)}</h2><div id="rsteps">${it.steps.map((s,si)=>`<div class="rstep ${si?"hidden":""}" data-si="${si}"><p><b>Step ${si+1}.</b> ${esc(s.q)}</p>${s.a.map((a,j)=>`<button class="opt" data-ok="${j===s.k?1:0}">${esc(a)}</button>`).join("")}<div class="fb hidden"></div></div>`).join("")}</div><div class="payline hidden" id="pay"></div><div class="fb hidden fb-final">${esc(it.fb)}</div>`}
function wire(it,el){

/* ---------- init ---------- */
window.addEventListener("online",async()=>{try{const q=JSON.parse(localStorage.getItem(KEY+"_queue")||"[]");if(!q.length)return;localStorage.removeItem(KEY+"_queue");const u=S.user;for(const it of q){S.user=it.u;await logToForms(it.r)}S.user=u}catch(e){}});
window.addEventListener("resize",()=>{if($("#v-ack")&&!$("#v-ack").classList.contains("hidden")&&!sigDrawn)initSig()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&document.activeElement&&["uName","uEmail","uHome"].includes(document.activeElement.id))signIn()});
$("#homeBtn").onclick=renderHome;renderHome();cloudBoot();
</script>
</body></html>
