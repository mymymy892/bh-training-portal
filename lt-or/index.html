<style>:root{--brown:#7B4B2A;--brown-dk:#5E3920;--green:#2E7D4F;--green-dk:#226040;--cream:#FBF7F2;--sand:#F1E8DD;--ink:#2B2320;--muted:#6B5F58;--line:#E3D7C9;--gold:#C9A227;--night:#141010;--night2:#1f1816;--red:#B23A3A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:#f5efe8;font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(20,16,16,.82);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08)}

/* home / map */

.hero-home img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.03);animation:kb 30s ease-in-out infinite alternate}
.hero-home:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,16,.1) 0%,rgba(20,16,16,.35) 45%,rgba(20,16,16,.92) 100%)}

.badges span.got{background:rgba(201,162,39,.2);border-color:var(--gold)}
label{display:block;font-weight:700;margin:12px 0 4px;color:var(--brown-dk)}
input[type=text],input[type=email],input[type=date],select{width:100%;padding:.7rem .8rem;border:2px solid var(--line);border-radius:10px;font-size:1rem;font-family:inherit;background:#fff;color:var(--ink)}

<script>const SCENES=[{"id": "p1_1", "ch": 1, "chTitle": "Your Role", "ref": "T3C System Blueprint, Mental & Behavioral Health Support Services", "title": "Welcome", "narr": "Welcome to Benevolent House. This is the Licensed Therapist Orientation. Benevolent House holds a Texas Child-Centered Care, or T3C, Full Credential that includes the Mental and Behavioral Health Support Services Package. For that package, the state requires a Licensed Therapist who oversees treatment and service planning for every child served in it. That is the role you are taking on. Over the next two hours you will follow one child through his first nine months in the package. Malik is eleven. He lives with Karen and Tom Whitfield outside Cedar Hill, and his Benevolent House case manager is Ms. Ortiz. Along the way you will learn the treatment model Benevolent House uses, what you will receive before each ninety-day review, what Benevolent House needs from you, and what falls outside your role. The names are fictional. The policies and the model are real. Let's begin."}, {"id": "p1_2", "ch": 1, "chTitle": "Your Role", "ref": "Staffing Functions Packet, item 13; T3C-S4; Training Curriculum and Plan", "title": "Two Different Jobs", "narr": "Malik has two therapists in his life, and it helps to keep their jobs separate. His treating therapist sees him every week. That therapy is authorized and paid through STAR Health, the Medicaid health plan for children in Texas foster care, and the treating therapist is not Benevolent House staff. Your job is different. As the Licensed Therapist, you oversee treatment and service planning for the children in the package. You give input on the type and frequency of therapy, review each child's plan before the ninety-day review, take part in a review when invited, and consult on a child's safety and crisis plan when the Treatment Director asks. Most of it happens on paper, by phone, or by video. The Benevolent House Treatment Director oversees your agreement and is your main contact. Two things are not part of this role. The directors, not you, sign each child's continued stay confirmation, and this agreement does not cover direct care of the children. If you also treat a child or complete a CANS on referral, that is a separate service, billed through STAR Health when you are credentialed and contracted with STAR Health, and not part of this agreement."}, {"id": "p1_3", "ch": 1, "chTitle": "Your Role", "ref": "Blueprint, Mental & Behavioral Health package; T3C-5(D); T3C-6", "title": "The Package", "narr": "The Mental and Behavioral Health package serves children who have, or may have, a DSM-5 diagnosis of an emotional, conduct, or behavioral disorder and who need routine clinical intervention to manage day-to-day life. They carry a higher risk of crisis, serious incidents, hospitalization, and placement disruption. The Blueprint asks for several things, and you touch most of them. The child receives regular and frequent individual, family, and group therapy as eligible, authorized through STAR Health. The Service Planning team and the Licensed Therapist decide the frequency, fitted to the child. The Service Plan includes a written justification of the assessed need, including how often therapy happens. Therapy comes from a licensed therapist experienced with emotional, behavioral, and conduct disorders, unless the team decides a different kind of therapist fits the child better. The Service Plan is reviewed at least every ninety days, and Benevolent House makes sure a certified assessor completes a CANS three point oh assessment on the same schedule. Arranging it is not part of your role. At each review, the Program Director and the Treatment Director confirm in writing that the child still meets the criteria for this package and is benefitting from the treatment model, and that Basic would not meet the child's needs. When policy requires, the Executive Director signs in the Program Director's place. A copy goes to the caseworker within fifteen business days. The Blueprint's general guideline is one Licensed Therapist for every fourteen children in the package. And because each Benevolent House home that serves this package also holds the Basic credential, a child who no longer needs this level of support can step down without moving."}, {"id": "p2_1", "ch": 2, "chTitle": "The Model", "ref": "TST-FC Module 1; T3C-2", "title": "The Trauma System", "narr": "Benevolent House uses Trauma Systems Therapy for Foster Care, called TST-FC, as its treatment model for every child it serves. It was adapted from Trauma Systems Therapy, developed by Dr. Glenn Saxe and colleagues, now based at the NYU Child Study Center, and published for foster care by the Annie E. Casey Foundation. The model says a trauma system has two halves. One is a child who experiences survival-in-the-moment states in specific, definable moments. The other is a social environment or system of care, meaning the home, the school, and everyone around the child, that is unable to help the child regulate those states. Both halves have to change. Work from the inside out, building the child's own skills, and from the outside in, changing the environment so reminders come less often and support arrives faster. Much of this will be familiar clinical ground for you. What matters here is that Benevolent House uses it as a shared language. Caregivers, case managers, and directors all train in it, and every Service Plan is written in its terms. When your input uses the same words, the plan reads the same to everyone who carries it out.", "dialog": [["Karen", "He's fine for days, really sweet. And then out of nowhere he explodes."], ["Ms. Ortiz", "Out of nowhere is where we start looking. It's almost never nowhere."], ["Karen", "Then I want to know where it is."]]}, {"id": "p2_2", "ch": 2, "chTitle": "The Model", "ref": "TST-FC Module 1", "title": "Survival in the Moment", "narr": "Malik came into care at eight, after neglect and violence in his first home. Two placements ended after he broke things and ran. In TST-FC terms, those were survival-in-the-moment states. When coping fails, four things shift at once: awareness of self and surroundings, feelings that come fast and hard or shut down entirely, the body's physical alarm, and the ability to use the coping skills the child has on a good day. Survival takes one of three shapes. Fight looks like hitting, throwing, swearing. Flight looks like running, hiding, leaving. Freeze looks like shutting down, going silent, not hearing. To an adult in the room, fight often looks like defiance, and freeze often looks like ignoring. The model asks everyone around the child to recognize the state first, because the skills a child has on a good day are simply not available in it, and because consequences delivered during revving or re-experiencing escalate the situation. Delivered when the child is calm, they work."}, {"id": "p2_3", "ch": 2, "chTitle": "The Model", "ref": "TST-FC Module 2", "title": "The Four R's and the Three A's", "narr": "TST-FC describes four stages of behavior, called the four R's. Regulating: calm and engaged; the adult's priority is to minimize triggers. Revving: triggered and trying to manage it; the adult helps the child regulate, and calms rather than teaches. Re-experiencing: fight, flight, or freeze, with coping overwhelmed; the adult keeps everyone safe without re-traumatizing the child. Reconstituting: calming down and beginning to re-engage; the adult supports the return and does not rush it. To tell which stage a child is in, caregivers watch the three A's. Affect, what the face and body show. Awareness, what the child is focused on. Action, what the child is doing. When all three shift inside one episode, the team is looking at traumatic stress rather than ordinary misbehavior. Benevolent House writes each child's regulation strategies stage by stage, and each child in this package has a safety and crisis plan tied to the same four stages."}, {"id": "p3_1", "ch": 3, "chTitle": "Finding the Pattern", "ref": "TST-FC Module 2; T3C-2(C)", "title": "Two Episodes, Three Windows", "narr": "Six weeks in, Ms. Ortiz brings two episodes to the case file. Sunday evening, six forty: Malik is relaxed in the living room, deep in a video game, when Tom tells him game time is over, now. Malik throws the controller, punches the wall, and runs to the backyard. Twenty-five minutes later he comes in quietly and asks whether he still lives there. Thursday at school: the teacher calls time on a timed test. Malik tears his paper, walks out, and is found in the bathroom fifteen minutes later. That afternoon he asks Karen whether he is in trouble. TST-FC calls this tool the moment-by-moment assessment. One episode, three windows: just before, during, and after. Just before: how the child looked, what he was doing, what seemed to trigger it, who started it, and where. During: what he appeared to feel and what he did, described as behavior rather than a label. After: how long it took to return to baseline, what helped, and if you could name one thing bothering this child, what it would be. Two rules make it work. At least two separate episodes, because one is an anecdote and two is the start of a pattern. And more than one observer: caregivers, teacher, case manager, and the child when old enough.", "dialog": [["Ms. Ortiz", "Two different places, two different adults. Same moment, though. Somebody said time's up."], ["Tom", "And both times, afterward, he asked something. Sunday it was whether he still lives here. The school said he asked if he was in trouble."], ["Ms. Ortiz", "That question matters. Write it down exactly the way he said it."]]}, {"id": "p3_2", "ch": 3, "chTitle": "Finding the Pattern", "ref": "TST-FC Module 2; T3C-2(B)", "title": "One Sentence the Team Can Act On", "narr": "Two assessments give a pattern. The pattern gives the priority problem, one sentence the whole support team can act on: when this reminder happens, in this setting, the child responds by this behavior, and what helps is this. For Malik, the team drafts: When Malik is told without warning that time is up, at home or at school, he responds by throwing or tearing things and leaving the room, and what helps is a five-minute warning, a named stopping point, and an adult who tells him calmly that he is not in trouble for being upset. A good priority problem is one problem, not a list. It is built from at least two assessments, written in observable behavior, includes what already helps, is agreed by the team, and is revisited when it stops being the priority. Each Service Plan names the child's priority problem, known triggers, signals of safety, regulation strategies for each of the four stages, and goals for both the child and the caregiving environment. Your clinical input helps the team test whether the sentence is the right one, and whether the treatment target in therapy lines up with it."}, {"id": "p3_3", "ch": 3, "chTitle": "Finding the Pattern", "ref": "TST-FC Modules 2 and 3; T3C-2(E)", "title": "What Caregivers Are Coached to Do", "narr": "Benevolent House caregivers are trained in the same model, and case managers coach them at every monthly visit. They use predictability: visual schedules, the same order of steps every morning, and naming what comes next before it happens. They use consistency, especially in their own calm, which is often the single most useful thing an adult can offer a dysregulated child. They pre-teach, practicing a plan while the child is calm. They stay neutral when it counts, they calm rather than teach during revving, and they use time-in and restorative discipline. Punishment that shames, isolates, or repeats a child's experience of harm is not used, and the teaching happens later, when the child is regulated. When you recommend a strategy, word it so a caregiver can carry it out at six forty on a Sunday evening with dinner on the stove. A recommendation the home cannot carry out does not help the child.", "dialog": [["Tom", "So when he's revving, I don't tell him what he did wrong?"], ["Ms. Ortiz", "Not then. Right then your only job is to help him get calm. The conversation comes later, when he can hear it."]]}, {"id": "p4_1", "ch": 4, "chTitle": "The Plans", "ref": "TST-FC Module 3; T3C-2(B), (D)", "title": "The Managing Emotions Guide", "narr": "The Managing Emotions Guide is the most useful document in the model, and the child helps build it. Step one is understanding my emotions. Across all four stages, the child answers four questions. What flips my switch? What am I thinking about? What do I feel, and what do my face and body show? What am I doing, or wanting to do? Step two is managing my emotions: for each stage, two lists, things I can do, and things an adult or a friend can help me with. That second list is where the team learns what the child actually wants from the adults. The guide uses the child's own words, and drawing counts. With permission it is shared with the people who can help. It is a living document, updated as the child changes. Malik's says: my chest gets hot. I need to go to my spot by the fence. Tell me I'm not leaving. The case manager shares each child's priority problem and Managing Emotions Guide with the treating therapist, so therapy and home reinforce the same strategies, and each Service Plan review records any change to the guide.", "dialog": [["Malik", "My chest gets hot. Like, really hot."], ["Karen", "Okay. What helps when it's hot?"], ["Malik", "My spot by the fence. And you saying I'm not leaving."]]}, {"id": "p4_2", "ch": 4, "chTitle": "The Plans", "ref": "T3C-5(F); T3C-2(E); Staffing Functions Packet, T3C-S5", "title": "The Safety and Crisis Plan", "narr": "Week seven. Malik's mother misses a scheduled phone call. That night he climbs out his window, and Tom finds him an hour later on a neighbor's porch. It is a serious incident, and it is reported as Minimum Standards require. Every child in this package has a written safety and crisis plan tied to the four stages of behavior. It is shared with the caregiver, the therapist, and on-call staff, and it is reviewed at each ninety-day review and after any serious incident. Benevolent House staff at case manager level or above respond to a crisis twenty-four hours a day, seven days a week, by phone, by video, or in person. You are not part of the on-call rotation. After a serious incident or an emergency behavior intervention, the case manager completes a moment-by-moment review with the caregiver and updates the Managing Emotions Guide when the review shows a new trigger or a strategy that did not work. When the Treatment Director asks for your consultation, help make the plan specific by stage: the early warning signs, what each adult does in revving, re-experiencing, and reconstituting, and the point at which the caregiver calls for help."}, {"id": "p4_3", "ch": 4, "chTitle": "The Plans", "ref": "TST-FC Module 3; T3C-2(F)", "title": "Hotspots and Family Time", "narr": "TST-FC names emotional hotspots, times of day or situations that reliably set a child off: bedtime, mornings, transitions, homework, meals, bath time, public places, and holidays. Malik's hotspots are transitions and Sunday evenings, and the missed call shows another: family contact that does not happen as planned. Karen asks whether calls with his mother should stop, since they seem to set him off. The model treats a hard evening around family contact as grief surfacing, not as proof that contact is harmful. Decisions about family contact belong to the child's caseworker and the court, not to the foster home or Benevolent House. What the team can plan is support: prepare Malik before calls, keep a predictable routine afterward, decide in advance what to say if a call is missed, and tell the caseworker what the team is seeing. Your input can recommend those supports, and what you see clinically goes to the Treatment Director and case manager, so the caseworker has it when contact decisions are made."}, {"id": "p4_4", "ch": 4, "chTitle": "The Plans", "ref": "T3C-5(F); TST-FC Module 3", "title": "Practice: Update the Plan", "narr": "Now it is your turn. The Treatment Director has asked for your consultation on Malik's safety and crisis plan after the night he left through the window. Open the practice case. It holds Malik's two moment-by-moment assessments, the incident summary, his Managing Emotions Guide, and the plan written at placement. Notice how thin that first plan is. Using what you have learned, draft the revving and re-experiencing sections: the warning signs in Malik's words, what each adult does at each stage, and the point at which Karen or Tom calls for help. There is no single right answer. What matters is that every line is specific, tied to a stage, and something a caregiver can do at nine thirty at night."}, {"id": "p5_1", "ch": 5, "chTitle": "The 90-Day Review", "ref": "T3C-6(B); T3C-5; Licensed Therapist Agreement", "title": "The Review Packet", "narr": "Malik's first ninety-day review is coming up, and Ms. Ortiz sends you the packet. For Malik, it includes the most recent CANS assessment, the current Service Plan with progress recorded on each goal, the moment-by-moment assessments since placement, the Managing Emotions Guide and the safety and crisis plan with any changes, the serious incident report, and what is known about his therapy, including its frequency and attendance. Your agreement asks for your input within five business days of receiving the packet. You can give it in writing, by phone, or by video, and Benevolent House records it in the child's Service Plan. Timing matters here. The directors cannot sign the continued stay confirmation until the review is done, and a copy goes to the caseworker within fifteen business days of the review and confirmation. Children are identified to you only as much as the work needs, and the record stays with Benevolent House."}, {"id": "p5_2", "ch": 5, "chTitle": "The 90-Day Review", "ref": "Blueprint, Mental & Behavioral Health package; T3C-5(D)", "title": "Your Input", "narr": "Useful input answers a few questions. What type and frequency of therapy does the assessed need call for, and why? That justification is written into the Service Plan. Does the treatment target in therapy line up with the priority problem? Should the caregivers take part in therapy, and how often? Is there a risk the safety and crisis plan does not cover? Is anything getting in the way of the child receiving the service? For Malik, your input reads: Continue weekly individual therapy with a trauma focus. Add family sessions with Karen and Tom twice a month, focused on predictable transitions and on what to say after a missed call. Justification: two episodes and one serious incident in seven weeks tied to abrupt endings and uncertain family contact, with actionable CANS ratings on Anger Control and Adjustment to Trauma. Revisit at the next review. In this package, caregivers take part in therapy as needed and must be able to attend multiple meetings and respond immediately to the child's needs. If a service is hard to obtain or a referral is denied, the case manager documents it and notifies the SSCC or DFPS caseworker within three business days."}, {"id": "p5_3", "ch": 5, "chTitle": "The 90-Day Review", "ref": "T3C-6(A), (B); T3C-5(D)(4)", "title": "Step Down or Stay", "narr": "Fast forward to Malik's third review. He has had one short episode in three months. He uses his spot by the fence, and he asks for a five-minute warning himself. A child stays in a package when six things remain true. First, services are reviewed and adjusted based on the latest CANS and Service Plan. Second, the needs that brought the child in, or new needs that fit the package, still call for services. Third, services still support safety, well-being, and permanency. Fourth, a less restrictive placement is not appropriate. Fifth, the child still needs more support than Basic gives. Sixth, Benevolent House and the home still hold the credential. Your input tells the directors what you see clinically: whether the gains look stable, what support should continue, and what to watch for. The Program Director and the Treatment Director decide what they can confirm in writing, and the SSCC or DFPS, working with Benevolent House, decides on a change of package. Because the Whitfields also hold the Basic credential, Malik can step down without changing homes."}, {"id": "p5_4", "ch": 5, "chTitle": "The 90-Day Review", "ref": "Blueprint, Mental & Behavioral Health package; T3C-5(D); T3C-6", "title": "Practice: Write Your Input", "narr": "One more practice before the last chapter. Go back to the practice case and read it as the review packet for Malik's first ninety-day review. Then write your input as you would send it to Ms. Ortiz and the Treatment Director: the type and frequency of therapy and the reason for it, whether the treatment target lines up with the priority problem, whether Karen and Tom should take part in therapy and how often, any risk the safety and crisis plan does not yet cover, and anything that could get in the way of Malik receiving services. Keep it to what the directors can act on. Benevolent House reads your practice answers and follows up if anything needs a conversation."}, {"id": "p6_1", "ch": 6, "chTitle": "Working With Us", "ref": "Licensed Therapist Agreement; Texas Family Code Ch. 261", "title": "Boundaries", "narr": "A few boundaries keep this role clean. Everything you learn about a child, family, or caregiver stays confidential and is used only for this work. The child's record stays with Benevolent House. If you suspect abuse or neglect, you report it to the Texas Abuse Hotline as the law requires, then tell Benevolent House right away. You also tell Benevolent House right away of any safety concern about a child. Under this agreement you consult; you do not provide direct care or supervision of children in Benevolent House homes, and you do not have unsupervised access to them. If that ever changes, a background check comes first. You do not bill STAR Health, DFPS, an SSCC, or any family for the oversight work. You keep your license current, give Benevolent House a copy at each renewal, and tell Benevolent House in writing within two business days of any complaint finding, restriction, suspension, or other action on it. Each quarter the Treatment Director confirms you have the capacity for the children referred, and before Benevolent House refers more than fourteen children at one time, you and Benevolent House confirm your capacity in writing."}, {"id": "p6_2", "ch": 6, "chTitle": "Working With Us", "ref": "Training Curriculum and Plan; T3C-2", "title": "Staying Current", "narr": "Malik is still with the Whitfields. On a Sunday evening Tom says, five minutes, buddy, and Malik says, okay, saving my game. Nobody in the house calls that a breakthrough, but it is one. To stay current in the model, you complete two of the Benevolent House quarterly TST-FC sessions each year: Session 2, Find the Pattern, and Session 3, In the Moment, which cover the moment-by-moment assessment, the priority problem, and the four stages as they are used in service planning. The Treatment Director is your main contact, and the Benevolent House office is two one four, seven seven four, four eight seven one. Next, read the short packet of Benevolent House policies and TST-FC pages that go with this orientation. Then print your Quick Reference and take the Knowledge Check: ten questions, eight to pass, and you can try again. After that comes your acknowledgment and your certificate. Thank you for joining the team."}];

and when is it reviewed?", "a": ["Only the caregiver; reviewed yearly", "The caregiver, the therapist, and on-call staff; reviewed at each 90-day review and after any serious incident", "Only the Treatment Director; reviewed when the child leaves"], "k": 1, "ref": "T3C-5(F)"}, {"q": "Under your agreement, how soon do you give input after receiving a review packet?", "a": ["Within five business days", "Within 30 days", "At the next quarterly meeting"], "k": 0, "ref": "Licensed Therapist Agreement, Section 3"}, {"q": "To stay current in the model, the Licensed Therapist completes each year:", "a": ["The full 8-hour TST-FC pre-service training again", "Nothing further after this orientation", "Sessions 2 and 3 of the Benevolent House TST-FC Ongoing Training"], "k": 2, "ref": "T3C Training Curriculum and Plan"}];
const ACK="I completed the Benevolent House Licensed Therapist Orientation, which serves as both the two-hour TST-FC orientation for contracted Licensed Therapists and the function orientation on the therapist's role in service planning, the Managing Emotions Guide, and safety and crisis plans (Licensed Therapist Agreement, Section 6(d)). I understand my role as the Licensed Therapist who oversees treatment and service planning for children in the T3C Mental & Behavioral Health Support Services Package, the Trauma Systems Therapy for Foster Care (TST-FC) treatment model, the Managing Emotions Guide, safety and crisis plans, the 90-day review process, and the terms of my Licensed Therapist Agreement, including confidentiality and reporting, and I will provide oversight consistent with Benevolent House policy and the T3C System Blueprint.";
const COURSE={"title": "Licensed Therapist Orientation", "code": "LT-OR", "hours": 2, "trainer": "Christopher R. Orr, LCPAA", "basis": "Two-hour TST-FC orientation and function orientation for the contracted Licensed Therapist (Licensed Therapist Agreement, Section 6(d)); T3C System Blueprint (Mental & Behavioral Health Support Services); Benevolent House T3C Service Delivery Addendum (T3C-2, T3C-5, T3C-6); Staffing Functions Packet; T3C Training Curriculum and Plan", "subtitle": "Licensed Therapist Orientation", "hero": "Nine Months With Malik", "blurb": "Follow one child through his first months in the Mental & Behavioral Health package and learn the TST-FC treatment model, the Managing Emotions Guide, safety and crisis plans, and what Benevolent House needs from you at each 90-day review. About two hours with the activities, reading, and knowledge check. Narrated, with captions and character voices. Stop any time; your place is saved.", "heroImg": "s_p1_1", "qrefImg": "s_p6_2", "seal": "BENEVOLENT<br>HOUSE<br>LICENSED<br>THERAPIST", "passMark": 8, "covers": ["The Licensed Therapist role and its limits", "Mental & Behavioral Health package requirements", "TST-FC: the trauma system and survival states", "The four R's and three A's", "Moment-by-moment assessment and the priority problem", "The Managing Emotions Guide", "Safety and crisis plans; emotional hotspots", "The 90-day review and continued stay", "Confidentiality, reporting, and agreement terms"], "chapters": [["Your Role", "1"], ["The Model", "2"], ["Finding the Pattern", "3"], ["The Plans", "4"], ["The 90-Day Review", "5"], ["Working With Us", "6"], ["Your Certificate", "7"]], "icons": {"1": "\ud83e\udded", "2": "\ud83e\udde0", "3": "\ud83d\udd0d", "4": "\ud83d\udccb", "5": "\ud83d\udcc5", "6": "\ud83e\udd1d", "7": "\ud83c\udfc5"}, "roles": ["Contracted Provider", "Staff"], "qrefHtml": "<h3>Your role</h3><p>Oversee treatment and service planning for children in the Mental &amp; Behavioral Health package: input on the type and frequency of therapy, review of each plan before the 90-day review (input within 5 business days of receiving the materials), joining reviews when invited, and consultation on safety and crisis plans. The Treatment Director oversees your agreement. The Program Director and Treatment Director sign the continued stay confirmation.</p><h3>The package</h3><p>Regular, frequent therapy through STAR Health, frequency set by the Service Planning team and the Licensed Therapist, with written justification in the Service Plan. Service Plan review and CANS 3.0 at least every 90 days. Directors confirm the child still meets the criteria, is benefitting from the model, and that Basic would not meet the child's needs. Confirmation to the caseworker within 15 business days. Guideline: 1 Licensed Therapist per 14 children. Homes also hold Basic, so a child can step down without moving.</p><h3>TST-FC</h3><p>Trauma system: a child with survival-in-the-moment states plus an environment that cannot yet help the child regulate. Change both: inside out and outside in. Survival: fight, flight, freeze.</p><p>Four R's: Regulating (minimize triggers), Revving (calm, do not teach), Re-experiencing (keep everyone safe without re-traumatizing), Reconstituting (support the return, do not rush). Three A's: affect, awareness, action.</p><p>Moment-by-moment assessment: just before, during, after; at least two episodes; more than one observer.</p><p>Priority problem: \"When [reminder], in [setting], [child] responds by [behavior], and what helps is [this].\" One problem, observable, agreed by the team.</p><h3>The plans</h3><p>Managing Emotions Guide: built with the child in the child's words. Step 1, understanding my emotions across the four stages. Step 2, for each stage, things I can do and things an adult or friend can help with. Shared with the treating therapist.</p><p>Safety and crisis plan: tied to the four stages; shared with the caregiver, therapist, and on-call staff; reviewed at each 90-day review and after any serious incident. On-call staff respond 24/7.</p><h3>Good input includes</h3><ul><li>Type and frequency of therapy, with the reason</li><li>Whether the treatment target matches the priority problem</li><li>Caregiver participation in therapy</li><li>Risks the safety plan does not cover</li><li>Barriers to services</li></ul><h3>Boundaries</h3><p>Keep information confidential; the record stays with Benevolent House. Report suspected abuse or neglect to the Texas Abuse Hotline, 1-800-252-5400 or txabusehotline.org, then tell Benevolent House. No direct care or unsupervised access under this agreement. Oversight is not billed to STAR Health. Tell Benevolent House right away of any safety concern about a child, and in writing within 2 business days of any action on your license.</p><h3>Staying current</h3><p>Each year: TST-FC Ongoing Training Sessions 2 (Find the Pattern) and 3 (In the Moment). Benevolent House office: (214) 774-4871.</p>"};

 if(it.type==="wheel"){const rows=el.querySelectorAll(".wheel");rows.forEach(r=>{const j=+r.dataset.j;r.querySelectorAll("button").forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===it.items[j][1];r.querySelectorAll("button").forEach(x=>{x.disabled=true;if(+x.dataset.k===it.items[j][1])x.classList.add("ok")});if(!ok)b.classList.add("bad");r.dataset.done=1;if(Array.from(rows).every(x=>x.dataset.done)){el.querySelector(".fb-final").classList.remove("hidden");markDone(CUR.id)}})})}

function renderQuickRef(){
 $("#v-qref").innerHTML=`<div class="scene"><div class="hero"><span class="chip">${COURSE.qrefChip?esc(COURSE.qrefChip):`Chapter ${CH.length} · ${esc(CH[CH.length-1][0])}`}</span><span class="ref">Quick Reference</span><img src="assets/${COURSE.qrefImg||"s_9_1"}.jpg" alt=""><div class="title"><small>Your Quick Reference</small><h1>Keep this in your binder</h1></div></div>
 <div class="qref" id="qrefBody">${COURSE.qrefHtml||`<h3>What we ask of you</h3><ul><li>Use TST-FC every day: routines, pre-teaching, staying neutral, time-in, and signals of safety.</li><li>Build the Managing Emotions Guide with the child and keep it up to date.</li><li>Take the child to every appointment and keep a record of each service.</li><li>Tell your case manager right away if a service is denied, delayed, or cannot be found.</li><li>Support Normalcy and approved contact with parents, siblings, and relatives.</li><li>Tell your case manager when a child names a relative or another person who matters to them.</li><li>Come to Service Plan meetings and share what you see at home.</li><li>Keep your training current. It keeps your home credentialed.</li></ul>

 <div class="nav noprint"><button class="btn ghost" onclick="window.print()">Print this page</button><span class="sp"></span><button class="btn gold" onclick="renderQuiz()">Start the Knowledge Check</button></div></div>`;show("qref");fillAfterHours()}
/* after-hours numbers are kept in the database, so they show only to signed-in Benevolent House families and staff and never in the public page */
function fillAfterHours(){try{const c=window.BHC&&BHC.client&&BHC.client();if(!c)return;c.from("portal_settings").select("value").eq("key","after_hours").maybeSingle().then(r=>{if(r&&r.data&&r.data.value)document.querySelectorAll(".afterhours").forEach(e=>e.textContent=" "+r.data.value)})}catch(e){}}
let attempt=0;
function renderQuiz(){attempt++;let h=`<div class="panel"><div class="k">Knowledge Check</div><h2>${QUIZ.length===10?"Ten":QUIZ.length===11?"Eleven":QUIZ.length} questions. ${({7:"Seven",8:"Eight",9:"Nine"})[COURSE.passMark||8]||(COURSE.passMark||8)} to pass. Attempt ${attempt}.</h2><p class="lead">Take your time. If you score below the passing mark, you will see which items to review and can try again.</p>`;
 QUIZ.forEach((x,i)=>{h+=`<div style="margin:14px 0;padding-top:10px;border-top:1px solid var(--line)"><b>${i+1}. ${esc(x.q)}</b>${x.a.map((a,j)=>`<label style="font-weight:400;display:flex;gap:8px;align-items:flex-start;margin:6px 0;color:var(--ink)"><input type="radio" name="q${i}" value="${j}" style="margin-top:4px"> <span>${COURSE.letters?"ABCDE"[j]+". ":""}${esc(a)}</span></label>`).join("")}</div>`});
 h+=`<p><button class="btn" onclick="gradeQuiz()">Submit answers</button></p></div>`;$("#v-quiz").innerHTML=h;show("quiz")}
let RESULT=null;
function gradeQuiz(){let ans=[],score=0,missed=[];for(let i=0;i<QUIZ.length;i++){const r=document.querySelector(`input[name=q${i}]:checked`);if(!r){toast("Please answer question "+(i+1));return}const v=+r.value;ans.push("abcde"[v]);if(v===QUIZ[i].k)score++;else missed.push(i)}
 const pass=score>=(COURSE.passMark||8);const detail=QUIZ.map((q,i)=>`Q${i+1} ${q.q} | Answered: ${q.a["abcde".indexOf(ans[i])]} | ${ans[i]==="abcde"[q.k]?"Correct":"Incorrect; correct answer: "+q.a[q.k]}`).join("\n");RESULT={score,answers:ans.join(""),detail,pass,attempt,picks:ans.slice()};
 let h=`<div class="panel" style="text-align:center"><div class="k">Knowledge Check</div><p class="score ${pass?"":"fail"}">${score} / ${QUIZ.length}</p><p>${pass?"<b>You passed.</b> One more step: the Acknowledgment.":"<b>Not yet.</b> Review the items below and take the check again. A retake is expected and is never held against you."}</p></div>`;
 if(missed.length){h+=`<div class="panel"><div class="k">Items to review</div>${missed.map(i=>`<p><b>${i+1}. ${esc(QUIZ[i].q)}</b><br>Correct answer: ${COURSE.letters?"ABCDE"[QUIZ[i].k]+". ":""}${esc(QUIZ[i].a[QUIZ[i].k])}${COURSE.letters&&/\b(A|B|C)\b and|above/.test(QUIZ[i].a[QUIZ[i].k])?` <span class="small">(${QUIZ[i].a.map((o,j)=>"ABCDE"[j]+". "+esc(o)).slice(0,QUIZ[i].k).join("; ")})</span>`:""} <span style="background:var(--sand);border-radius:6px;padding:.1rem .4rem;font-size:.8rem">${esc(QUIZ[i].ref)}</span></p>`).join("")}</div>`}
 h+=`<div class="nav">${pass?`<button class="btn gold" onclick="renderAck()">Continue to Acknowledgment</button>`:`<button class="btn" onclick="renderQuiz()">Retake the Knowledge Check</button> <button class="btn ghost" onclick="renderHome()">Review the chapters</button>`}</div>`;
 $("#v-quiz").innerHTML=h;show("quiz")}
function renderAck(){$("#v-ack").innerHTML=`<div class="panel"><div class="k">Acknowledgment</div><p style="font-size:1.08rem">${esc(ACK)}</p><div class="row"><div><label>Type your full name</label><input type="text" id="aName" value="${esc(S.user.name)}"></div><div><label>Date</label><input type="text" id="aDate" value="${fmtDate(new Date())}" readonly></div></div><label>Sign with your finger or mouse</label><canvas class="sig" id="sigPad" aria-label="Signature pad"></canvas><p><button class="btn ghost sm" style="color:var(--brown);border-color:var(--brown);background:#fff" onclick="clearSig()">Clear signature</button> <button class="btn ghost sm" style="color:var(--brown);border-color:var(--brown);background:#fff" onclick="typedSig()">I cannot draw: use my typed name</button></p><label style="font-weight:400"><input type="checkbox" id="aAgree"> I agree to the statement above and confirm that I completed this training myself.</label><p><button class="btn gold" id="ackSubmit" onclick="finish()">Submit and get my certificate</button></p></div>`;show("ack");initSig()}
let sigCtx,sigDrawn=false;
function initSig(){const c=$("#sigPad");c.width=c.offsetWidth*2;c.height=320;sigCtx=c.getContext("2d");sigCtx.scale(2,2);sigCtx.lineWidth=2.2;sigCtx.lineCap="round";sigCtx.strokeStyle="#1b2a4a";let d=false;const pos=e=>{const r=c.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return[p.clientX-r.left,p.clientY-r.top]};
 const st=e=>{d=true;const[x,y]=pos(e);sigCtx.beginPath();sigCtx.moveTo(x,y);e.preventDefault()},mv=e=>{if(!d)return;const[x,y]=pos(e);sigCtx.lineTo(x,y);sigCtx.stroke();sigDrawn=true;e.preventDefault()},en=()=>{d=false};
 c.addEventListener("mousedown",st);c.addEventListener("mousemove",mv);window.addEventListener("mouseup",en);c.addEventListener("touchstart",st,{passive:false});c.addEventListener("touchmove",mv,{passive:false});c.addEventListener("touchend",en)}
function typedSig(){const n=$("#aName").value.trim();if(!n){toast("Type your name first");return}clearSig();sigCtx.font="italic 34px Georgia, serif";sigCtx.fillStyle="#1b2a4a";sigCtx.fillText(n,16,90);sigDrawn=true;toast("Typed signature applied")}

let finishing=false;
async function finish(){if(finishing)return;const n=$("#aName").value.trim();if(!n){toast("Please type your name");return}if(!sigDrawn){toast("Please sign in the box");return}if(!$("#aAgree").checked){toast("Please check the agreement box");return}
 finishing=true;const b=$("#ackSubmit");b.disabled=true;b.textContent="Submitting...";const now=new Date();const sig=$("#sigPad").toDataURL("image/png");
 const rec={title:COURSE.title,code:COURSE.code,score:RESULT.score,pass:"Pass",date:fmtDate(now),time:fmtTime(now),hours:COURSE.hours,answers:"Attempt "+RESULT.attempt+" ("+RESULT.score+" of "+QUIZ.length+")\n"+(RESULT.detail||RESULT.answers)+reflectText(),ack:ACK+" Signed by "+n,sig:sig,trainer:COURSE.trainer};
 const ok=await logToForms(rec);try{if(S.user&&S.user.cloud)await BHC.addCompletion({code:COURSE.code,title:COURSE.title,hours:COURSE.hours,score:RESULT.score,total:QUIZ.length,attempt:RESULT.attempt||1,answers:{reflect:S.reflect||null,picks:RESULT.picks||null,items:(RESULT.picks||[]).map((x,i)=>{const q=QUIZ[i];return{q:q.q,a:q.a["abcde".indexOf(x)]||"",ok:x==="abcde"[q.k],right:q.a[q.k]}})},ack:ACK+" Signed by "+n,completed_at:now.toISOString()});BHC.log("course_done",COURSE.code)}catch(e){}S.done={date:fmtDate(now),score:RESULT.score,name:n,sig:sig,iso:now.toISOString(),picks:RESULT.picks||null,attempt:RESULT.attempt||1};S.badges[CH.length]=1;save();finishing=false;renderCert(n,now,sig,ok)}

function overallPct(){const n=SCENES.length+2;let d=SCENES.filter(s=>S.seen[s.id]&&S.answers[s.id]!==undefined||S.seen[s.id]&&!(INTER[s.id]||{}).type||S.seen[s.id]&&(INTER[s.id]||{}).type==="none").length;d=Math.max(d,Object.keys(S.answers||{}).length);if(S.done)d=n;else if(S.ackReady)d=n-1;return Math.min(100,Math.round(d/n*100))}
