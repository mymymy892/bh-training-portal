<style>:root{--brown:#7B4B2A;--brown-dk:#5E3920;--green:#2E7D4F;--green-dk:#226040;--cream:#FBF7F2;--sand:#F1E8DD;--ink:#2B2320;--muted:#6B5F58;--line:#E3D7C9;--gold:#C9A227;--night:#141010;--night2:#1f1816;--red:#B23A3A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:#f5efe8;font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:1rem;cursor:pointer}
a{color:#f3d98b}
.hidden{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(20,16,16,.82);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08)}
.top .wrap{display:flex;align-items:center;gap:12px;padding:8px 16px}
.top img{height:38px}
.top .brand{font-weight:700;color:#fff;font-size:.95rem;line-height:1.1}.top .brand small{display:block;font-weight:400;color:#bdb0a6;font-size:.72rem}
.top .sp{flex:1}
.top .user{font-size:.8rem;color:#e8dccf;background:rgba(255,255,255,.08);border-radius:999px;padding:.3rem .8rem;max-width:50vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:.5rem;border:0;border-radius:12px;padding:.85rem 1.3rem;font-weight:700;background:var(--green);color:#fff;transition:transform .12s,background .15s,box-shadow .15s;box-shadow:0 8px 24px rgba(46,125,79,.35)}
.btn:hover{background:var(--green-dk);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.18)}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn.gold{background:var(--gold);color:#2b1d00;box-shadow:0 8px 24px rgba(201,162,39,.3)}
.btn.sm{padding:.5rem .9rem;font-size:.88rem;border-radius:9px}
/* home / map */
.hero-home{position:relative;border-radius:22px;overflow:hidden;margin:18px 0;min-height:360px;display:flex;align-items:flex-end}
.hero-home img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.03);animation:kb 30s ease-in-out infinite alternate}
.hero-home:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,16,.1) 0%,rgba(20,16,16,.35) 45%,rgba(20,16,16,.92) 100%)}
.hero-home .t{position:relative;z-index:2;padding:30px 30px 28px;max-width:720px}
.hero-home small{display:block;color:#f3d98b;letter-spacing:.16em;text-transform:uppercase;font-size:.72rem;margin-bottom:8px}
.hero-home h1{margin:0 0 10px;font-size:clamp(1.8rem,4.5vw,3rem);line-height:1.05;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.hero-home p{margin:0 0 16px;color:#e8dccf;font-size:1.05rem;max-width:560px}
@keyframes kb{from{transform:scale(1.03) translate(0,0)}to{transform:scale(1.1) translate(-1.5%,-1%)}}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:10px 0 40px}
.ch{position:relative;border-radius:16px;overflow:hidden;background:var(--night2);border:1px solid rgba(255,255,255,.08);min-height:170px;cursor:pointer;transition:transform .15s,border-color .15s}
.ch:hover{transform:translateY(-3px);border-color:rgba(243,217,139,.5)}
.ch img{width:100%;height:110px;object-fit:cover;display:block;filter:saturate(.9)}
.ch .b{padding:10px 12px 12px}
.ch .n{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#f3d98b}
.ch h3{margin:2px 0 4px;font-size:1rem;color:#fff}
.ch .m{font-size:.78rem;color:#bdb0a6}
.ch .ring{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--gold) var(--p,0%),rgba(255,255,255,.18) 0);display:flex;align-items:center;justify-content:center}
.ch .ring i{width:28px;height:28px;border-radius:50%;background:var(--night2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.68rem;color:#fff}
.ch.done .ring{background:var(--green)}.ch.done .ring i{background:var(--green);color:#fff}
.ch.locked{opacity:.55}
.sec{margin:26px 0 8px;display:flex;align-items:baseline;gap:10px}
.sec h2{margin:0;font-size:1.25rem;color:#fff}.sec span{color:#bdb0a6;font-size:.85rem}
/* scene */
.scene{margin:12px 0 40px}
.hero{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:18px;background:#000}

.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3) 0%,rgba(0,0,0,0) 40%,rgba(20,16,16,.85) 100%)}
.chip{position:absolute;top:14px;left:14px;z-index:2;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:.35rem .85rem;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase}
.ref{position:absolute;top:14px;right:14px;z-index:2;background:var(--gold);color:#2b1d00;border-radius:8px;padding:.3rem .65rem;font-weight:700;font-size:.76rem}
.title{position:absolute;left:22px;bottom:18px;z-index:2;max-width:85%}
.hero .chip{max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{display:block;color:#f3d98b;letter-spacing:.14em;text-transform:uppercase;font-size:.7rem;margin-bottom:4px}
.title h1{margin:0;font-size:clamp(1.3rem,3.6vw,2.3rem);line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.55)}
.cap{margin:0;padding:18px 6px 6px;font-size:1.12rem;line-height:1.6;color:#f5efe8;min-height:60px}
.cap span{opacity:.32;transition:opacity .25s}.cap span.on{opacity:1}
.bar{display:flex;align-items:center;gap:12px;padding:8px 6px 14px}
.play{width:54px;height:54px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:1.2rem;flex:none;box-shadow:0 6px 20px rgba(46,125,79,.5)}
.prog{flex:1;height:6px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--gold)}
.speed{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:.3rem .55rem;font-size:.78rem}
/* interaction panel */
.panel{background:#fff;color:var(--ink);border-radius:18px;padding:22px 22px 20px;margin:6px 0 16px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.panel h2{margin:0 0 6px;color:var(--brown);font-size:1.25rem}
.panel .lead{margin:0 0 12px;color:var(--muted)}
.panel .k{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--green-dk);font-weight:700;margin-bottom:4px}
.opt{display:block;width:100%;text-align:left;background:var(--cream);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--ink);transition:border-color .12s,transform .12s}
.opt:hover{border-color:var(--brown);transform:translateX(2px)}
.opt.right{border-color:var(--green);background:#E3F3E9}
.opt.wrong{border-color:var(--red);background:#FCECEC}
.opt:disabled{cursor:default;transform:none}
.fb{margin-top:10px;padding:12px 14px;border-radius:10px;background:#F3FAF5;border-left:5px solid var(--green);font-size:.98rem}
.fb.bad{background:#FCF1F1;border-color:var(--red)}
.fb.neutral{background:var(--sand);border-color:var(--brown)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:.45rem .9rem;color:var(--ink)}
.chips button.sel{border-color:var(--brown);background:var(--sand)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.bin{border:2px dashed var(--line);border-radius:12px;padding:10px;min-height:84px;cursor:pointer;background:#fff}
.bin:hover{border-color:var(--brown)}
.bin h4{margin:0 0 6px;font-size:.85rem;color:var(--brown)}
.bin .c{display:inline-block;background:var(--sand);border-radius:999px;padding:.2rem .6rem;margin:3px;font-size:.82rem}
.bin .c.ok{background:#E3F3E9}.bin .c.bad{background:#FCECEC}
.checks label{display:flex;gap:10px;align-items:flex-start;background:var(--cream);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer;font-weight:400}
.checks label.ok{border-color:var(--green);background:#E3F3E9}.checks label.miss{border-color:var(--gold);background:#FFF7DD}.checks label.bad{border-color:var(--red);background:#FCECEC}
.checks input{margin-top:5px}
table.t{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
table.t th,table.t td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--sand);color:var(--brown-dk)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:10px 0}
.card3{perspective:900px;min-height:160px;cursor:pointer}
.card3 .in{position:relative;width:100%;height:100%;min-height:160px;transition:transform .5s;transform-style:preserve-3d}
.card3.on .in{transform:rotateY(180deg)}
.card3 .f,.card3 .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:center;text-align:center}
.card3 .f{background:var(--brown);color:#fff;font-weight:700}
.card3 .b{background:#fff;border:2px solid var(--green);transform:rotateY(180deg);font-size:.86rem;line-height:1.35;overflow:auto}
.stage-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--cream);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.stage-row select{padding:.45rem;border-radius:8px;border:2px solid var(--line);font-family:inherit}
.stage-row.ok{border-color:var(--green)}.stage-row.bad{border-color:var(--red)}
.wordbank{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.wb{background:var(--cream);border:2px solid var(--line);border-radius:12px;padding:10px}
.wb h4{margin:0 0 6px;color:var(--brown);font-size:.9rem}
.wb button{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:.4rem .6rem;margin:4px 0;font-size:.86rem;color:var(--ink)}
.wb button.sel{border-color:var(--green);background:#E3F3E9}
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:8px 0}
.cal div{aspect-ratio:1;border:1.5px solid var(--line);border-radius:7px;font-size:.68rem;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;color:var(--muted)}
.cal div.sel{background:var(--green);color:#fff;border-color:var(--green)}
.cal div.exp{box-shadow:inset 0 0 0 2px var(--gold)}
.wheel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
.wheel button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-size:.88rem;color:var(--ink)}
.wheel button.sel{border-color:var(--brown);background:var(--sand)}
.wheel button.ok{border-color:var(--green);background:#E3F3E9}.wheel button.bad{border-color:var(--red);background:#FCECEC}
.payline{background:var(--sand);border-radius:12px;padding:12px 14px;margin:10px 0;font-family:ui-monospace,Menlo,monospace;font-size:.9rem}
.nav{display:flex;align-items:center;gap:10px;margin:6px 0 30px}.nav .sp{flex:1}
.hint{color:#bdb0a6;font-size:.85rem}

.badge-pop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px}
.badge-pop .bx{background:#fff;color:var(--ink);border-radius:22px;padding:30px 28px;text-align:center;max-width:380px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.badge-pop .ic{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d98b,var(--gold) 60%,#8a6a10);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;box-shadow:0 10px 30px rgba(201,162,39,.5)}

.badges{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.badges span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:.35rem .8rem;font-size:.82rem}
.badges span.got{background:rgba(201,162,39,.2);border-color:var(--gold)}
label{display:block;font-weight:700;margin:12px 0 4px;color:var(--brown-dk)}
input[type=text],input[type=email],input[type=date],select{width:100%;padding:.7rem .8rem;border:2px solid var(--line);border-radius:10px;font-size:1rem;font-family:inherit;background:#fff;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sig{border:2px solid var(--line);border-radius:10px;background:#fff;touch-action:none;width:100%;height:160px;display:block}
.score{font-size:2.6rem;font-weight:700;color:var(--green);margin:0}.score.fail{color:var(--red)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);padding:.7rem 1.1rem;border-radius:10px;z-index:70;font-size:.95rem;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1}
#cert{background:#fff;color:var(--ink);border:10px double var(--brown);padding:34px 40px 130px;max-width:820px;margin:16px auto;text-align:center;position:relative}
#cert img.logo{height:76px}
#cert h1{font-size:2rem;color:var(--brown);margin:12px 0 4px}
#cert .name{font-size:1.7rem;font-weight:700;color:var(--green-dk);margin:14px 0 4px;border-bottom:2px solid var(--line);display:inline-block;padding:0 30px 4px}
#cert .seal{position:absolute;right:28px;bottom:22px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d98b,var(--gold) 60%,#8a6a10);display:flex;align-items:center;justify-content:center;color:#2b1d00;font-size:.6rem;font-weight:700;text-align:center;line-height:1.1;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#cert .sigs{display:flex;justify-content:space-around;margin-top:30px;gap:20px;flex-wrap:wrap}
#cert .sigs div{min-width:200px;font-size:.9rem}
#cert .sigs img{height:50px;display:block;margin:0 auto 2px}
#cert .sigs div b{display:block;border-top:1px solid var(--ink);padding-top:6px}
.small{font-size:.85rem;color:var(--muted)}
.qref{background:#fff;color:var(--ink);border-radius:14px;padding:20px 22px}
.qref h3{color:var(--green-dk);margin:12px 0 4px;font-size:1rem}.qref ul{margin:4px 0;padding-left:1.2rem}
@media print{.top,.nav,.bar,.hero,.noprint,.cap{display:none!important}html,body{background:#fff;color:#000}.panel,.qref,#cert{box-shadow:none}#cert{margin:0;max-width:none}}
@media(max-width:640px){.nav{flex-wrap:wrap}.nav .hint{flex-basis:100%;order:-1;text-align:center}.nav .btn{padding:.7rem .9rem}.hero .chip{max-width:62%;font-size:.72rem;padding:.3rem .6rem}.ref{font-size:.72rem;padding:.25rem .5rem}.title small,.ch .n{font-size:.75rem}.ch .ring i{font-size:.72rem}.stage-row{grid-template-columns:1fr}.top .user{max-width:44vw}.top .brand small{display:none}.top img{height:32px}.top .user{max-width:34vw}.row{grid-template-columns:1fr}.panel{padding:16px}.cal{grid-template-columns:repeat(6,1fr)}.title{left:14px;bottom:12px}.cap{font-size:1.02rem}.hero-home .t{padding:20px 18px}}

.course-prog{position:relative;height:10px;background:var(--sand);border-radius:6px;margin:4px 0 14px;overflow:visible}.course-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:6px;transition:width .4s}.course-prog span{position:absolute;right:0;top:12px;font-size:.72rem;color:var(--muted)}
.scene .course-prog{margin:10px 0 2px}

/* dialogue clips */
.dialog{margin:14px 0;padding:14px 16px;background:var(--sand);border-radius:12px;color:var(--ink)}

<script>const SCENES=[{"id": "p1_1", "ch": 1, "chTitle": "Six Weeks", "ref": "26 TAC 749.955, 749.1303, 749.1417", "title": "The Bennett Family", "narr": "Welcome to Benevolent House. This is Supporting Children Through Purposeful Care. For the next two hours you will spend six weeks with the Bennett family. Megan and Ryan Bennett live outside Waxahachie with their son Owen, who is twelve, and three children in their care: Ellie, who is five; Marcus, who is nine; and Harper, who is fifteen and arrived two weeks ago. Nothing about these six weeks is dramatic. A visitor in the house. A teenager who wants to stay home alone. A nine-year-old who will not pick up his toys. A phone call to a sister. In each moment the Bennetts will do what every caregiver does: watch, guide, understand, and protect. Those are the four parts of purposeful care, and they are also four parts of the Texas Minimum Standards. Supervision. Discipline. Child development. Children's rights. The names are fictional. The rules are real. Let's begin."}, {"id": "p1_2", "ch": 1, "chTitle": "Six Weeks", "ref": "Form 2410; 26 TAC 749.955", "title": "Four Parts of One Job", "narr": "Purposeful care means that nothing in the home happens by accident. Supervision is purposeful when you know where every child is and what each one is doing, and you have decided how closely to watch based on that child, not on habit. Discipline is purposeful when it teaches, and when the child could tell you what they did, why there is a consequence, and how it ends. Understanding development is purposeful when you ask how old a child is on the inside before you react to how old they are on paper. And protecting rights is purposeful when a child's right to call a sibling, practice a faith, or have a private space is something you plan for, rather than something you allow when it is convenient. These four parts are not separate trainings. In the Bennett house, as in yours, they happen in the same hour, often in the same room."}, {"id": "p2_1", "ch": 2, "chTitle": "Week One: Eyes and Ears", "ref": "26 TAC 749.955(b)", "title": "What Supervision Is", "narr": "It is Saturday morning in week one. Megan is making pancakes. Ellie is at the table, Marcus and Owen are in the backyard, and Harper is still asleep upstairs. Megan knows all of that without looking, because she checked two minutes ago and she will check again in two more. The Minimum Standards, section 749.955, describe a caregiver's supervision duties in plain terms. Know which children you are responsible for. Supervise each child at the level that protects the child's health, safety, and well-being, which means being aware of what each child is doing, by sight, by hearing, or both. Be available and able to step in whenever a child's safety needs it. And understand any special supervision needs that come from the child's developmental age, maturity, and service plan. Pancakes are fine. A forty-minute phone call in the garage is not. Supervision is not being in the house. It is being aware, available, and ready.", "dialog": [["Megan", "Marcus, Owen, I can see you from the window. Stay where I can see you, please."], ["Marcus", "We're just getting the ball from behind the shed!"], ["Megan", "Then I'm coming to the door until you're back. Thirty seconds."]]}, {"id": "p2_2", "ch": 2, "chTitle": "Week One: Eyes and Ears", "ref": "26 TAC 749.955", "title": "How Close Is Close Enough", "narr": "Ellie is five, so she is within sight or sound every minute. Marcus is nine and can play in the fenced yard with Megan checking from the window. Harper is fifteen and can be in her room with the door open. None of those decisions came from a chart. They came from the child. Section 749.955 asks Benevolent House to make sure supervision fits each child's specific needs and the setting, and asks you to know each child's developmental age, maturity, and any restrictions in the service plan. The same house changes the answer. The Bennetts have a creek at the back of the property, bedrooms on two floors, and a front door that opens onto a road. A good supervision plan looks at the space, not just the child. And it changes when something changes: a new placement, a visitor, a bad week, a behavior you have not seen before."}, {"id": "p2_3", "ch": 2, "chTitle": "Week One: Eyes and Ears", "ref": "26 TAC 749.955", "title": "The Back Bedroom", "narr": "Sunday afternoon. Ryan's friend Cody stops by to help with the truck. Cody is kind, he is good with kids, and Ellie adores him. While Ryan is under the hood, Cody and Ellie end up in the back bedroom playing a video game with the door closed. Megan is at the grocery store. Ryan is twenty feet away, but he cannot see or hear Ellie. Cody has never had a background check through Benevolent House. Nothing bad happens. That is not the point. The point is that for forty minutes, a five-year-old in care was alone, behind a closed door, with an adult the agency has not cleared, and no caregiver could see or hear her. Sending twelve-year-old Owen in to watch her would not have fixed it either; a twelve-year-old is not a caregiver. The fix was simple: the game moves to the living room, the door stays open, and Ryan checks in every few minutes.", "dialog": [["Ryan", "Hey Cody, bring that game out to the living room, would you? House rule. I like to be able to see her."], ["Cody", "Sure, man. No problem."], ["Ellie", "Can Cody play the next level with me?"], ["Ryan", "Out here where I can see you both, yes."]]}, {"id": "p3_1", "ch": 3, "chTitle": "Week Two: The Plan", "ref": "26 TAC 749.955(a)", "title": "Harper's Plan", "narr": "Harper's service plan arrived with her. It says she left a previous placement twice without permission, both times after an argument, and both times she was found at a friend's house within a day. Section 749.955 puts a duty on Benevolent House too: supervision must account for each child's specific needs, including any history of high-risk behavior that calls for more supervision, and for the setting where it happens. Running away, harming others, fire-setting, and suicide attempts are the kinds of history that shape a plan. For Harper, the plan is practical. Megan and Ryan know where she is after school. Her phone stays charged and on. Arguments do not end with a slammed door and silence; they end with an adult checking in within ten minutes. And the plan is not permanent. As Harper settles, it loosens. Your job is to know the plan, follow it, and ask when anything is unclear or anything changes."}, {"id": "p3_2", "ch": 3, "chTitle": "Week Two: The Plan", "ref": "26 TAC 749.955", "title": "Home Alone", "narr": "Friday of week two. Ryan's mother has a fall and the Bennetts need to drive to Tyler overnight. Harper asks to stay home alone. She is fifteen, she is responsible, she promises to keep her phone on, and she says she does not want to sit in a hospital waiting room. Every one of those things may be true. Now go back to what supervision is built on: the child, the setting, and the plan. Her age is fifteen. Her history is two unauthorized absences after conflict. The home has a road out front and no adult in it. Her service plan calls for increased supervision. This is not a judgment of Harper's character. It is a plan the whole team agreed to, and overnight alone is outside it. The Bennetts call their case manager, who arranges respite with another Benevolent House family for the night. Harper is annoyed. Megan tells her the truth: this is about the plan, and the plan will change as the weeks go by.", "dialog": [["Harper", "I'm fifteen. I'm not going to burn the house down."], ["Megan", "I know you're not. This isn't about trusting you. Your plan says no overnights alone yet, and I'm not going to be the one who breaks it. The Delgados have a room tonight, and we'll be back tomorrow."], ["Harper", "Fine. But I'm bringing my own pillow."]]}, {"id": "p3_3", "ch": 3, "chTitle": "Week Two: The Plan", "ref": "26 TAC 749.955(c); Benevolent House policy", "title": "Soccer Practice", "narr": "Marcus made the fall soccer team. Practice is Tuesdays and Thursdays at the park, and no parent stays. That is an unsupervised childhood activity, and section 749.955 says what a caregiver must know: where the child is scheduled to be and who he will be with, and how and when he will get back home. Benevolent House asks for a little more, because it keeps children safe. Arrange or confirm the ride, give the child a way to reach you, and be available if he calls. Megan writes practice on the kitchen calendar, drives him, picks him up at 6:15, and sends him with the family's spare phone. One more thing. Because Marcus receives treatment services, Benevolent House asks Megan to keep progress notes as often as his service planning team set, sign and date each one, and keep them ready for her case manager. Near misses go in those notes too. The afternoon Ryan did not see Ellie in the back bedroom went in Ellie's notes, with what he changed."}, {"id": "p4_1", "ch": 4, "chTitle": "Week Three: Teaching, Not Punishing", "ref": "26 TAC 749.1417, 749.1303(4); Form 2410", "title": "What Discipline Is", "narr": "Week three. Discipline is the part of caregiving people argue about, so let's start with what it is. Under the Minimum Standards and the DFPS discipline policy that every foster and adoptive parent signs on Form 2410, discipline teaches and guides. It is not punishment. Only a caregiver who knows the child well and knows the child's needs may discipline the child, section 749.1417. It is matched to the child's age, developmental level, the specific behavior, how the child has responded to discipline before, and the child's past experiences. It is fair, reasonable, consistent, and tied to what the child did. And the child should be able to say what they did, why there is a consequence, how long it lasts, and what the right behavior looks like. Section 749.1303 adds two rights: discipline that fits the child's age, maturity, and developmental level, and having restrictions explained at admission and whenever one is imposed. The DFPS policy lists ordinary tools: routines and reasonable limits, modeling, offering choices, explaining, repeating the instruction, logical and natural consequences, and praise for the behavior you want. Benevolent House adds a few: a redo, time to settle, a calm low voice, and catching behavior while it is still small. Time-out is allowed, supervised, for about one minute per year of the child's age, and Benevolent House asks you to use it sparingly. For Ellie that is five minutes. For a baby, the answer is comfort and redirection."}, {"id": "p4_2", "ch": 4, "chTitle": "Week Three: Teaching, Not Punishing", "ref": "26 TAC 749.1303(4)(A); Form 2410", "title": "The Line", "narr": "Now the line. Section 749.1303 gives every child in care the right to be free from harsh, cruel, unusual, unnecessary, demeaning, or humiliating treatment or punishment, and it names what that includes. Shaking. Corporal punishment, including spanking or hitting, or threatening it. Leaving a child outside for long periods in extreme heat or cold. Pointless work meant only to demean, like moving rocks from one pile to another. Denying food, sleep, the bathroom, mail, or family visits as punishment. Remarks that belittle or ridicule the child or the child's family. Threatening the loss of placement or shelter as punishment. Demeaning behavior meant to embarrass, control, harm, intimidate, or isolate the child, including physical force, rumors, threats, or inappropriate comments. And emergency behavior intervention used as punishment, aversive conditioning, or rebirthing, hug, or holding therapy. The DFPS discipline policy you acknowledge on Form 2410 adds more. No physical discipline of any kind, and nothing that causes an injury. No name-calling or labeling. Nothing that embarrasses or degrades a child. No withholding of food, shelter, visits, supervision, school, medical care, other necessities, mail, or special items like a birthday or Christmas gift. And no holding intervention, even if a therapist or doctor recommends it. Restraint is allowed only as an emergency behavior intervention after de-escalation fails, only as your EBI training allows, and never as discipline. A rule of thumb that covers nearly all of it: if it is meant to make the child feel small, it is out."}, {"id": "p4_3", "ch": 4, "chTitle": "Week Three: Teaching, Not Punishing", "ref": "26 TAC 749.1303(3)(E), (4)(B), (4)(C); 749.1601(c)", "title": "Grounded Until When", "narr": "Harper comes home two hours late on a Wednesday without calling. Ryan's first instinct is to take her phone for a month. Here is where the rules matter. Harper heard the house rules and how discipline works on the day she arrived, and she hears the reason again any time a restriction starts. Any restriction has to fit Harper's age, maturity, and developmental level, and it has to be explained to her when it is imposed. Limits on her calls, mail, or visits can only come from her service plan or a court order, not from a bad night. And seclusion, a child alone in a room she cannot leave, is never allowed. What Ryan does instead works better. The phone goes on the kitchen counter for the evening. That is a limit on a privilege, not on her contacts. Harper can still call her family as her plan allows, her caseworker, her attorney, or the Abuse Hotline whenever she asks. The consequence is tied to the behavior: for the next week, Harper checks in by text when she leaves school and when she arrives wherever she is going. He tells her exactly how long it lasts and how it ends. One more rule of thumb: if you ever do not know where a child is and cannot reach her, call your case manager right away. Do not wait for her to come home. Ryan also writes a note for the case manager, because a late return from a child with Harper's history is a supervision event, not just a discipline moment.", "dialog": [["Ryan", "Two hours, no call. I was worried, not angry. Here's what happens. Phone stays on the counter tonight. For one week, you text me when you leave school and when you get where you're going. Next Wednesday it's over."], ["Harper", "That's it?"], ["Ryan", "That's it. And if you'd called, none of it would be happening. That's the part I want you to remember."]]}, {"id": "p5_1", "ch": 5, "chTitle": "The Held Door", "ref": "Form 2410; TST-FC", "title": "Marcus and the Toy Cars", "narr": "Thursday evening. Marcus has been asked three times to pick up his toy cars. He is not doing it. Megan is tired, dinner is late, and the sentence that rises in her is: no dinner until it's done. Stop there. Withholding food is prohibited, and it would teach Marcus nothing about toy cars. Behavior is usually a message. Marcus's file says that in his last home, cleaning up meant his things were being packed. He is not defying Megan. He is checking whether she is safe and consistent. So Megan does what the policy calls offering choices, here two acceptable options: you can pick them up now, or after dinner, and if it is after dinner we will do it together. He picks after dinner. They do it together in four minutes. She praises the effort, not the perfection. That is discipline that teaches, and it is the same skill you learned in TST-FC: respond to the feeling behind the behavior, stay neutral, and keep the child connected.", "dialog": [["Megan", "Marcus, you can pick the cars up now, or after dinner. If it's after dinner, we do it together."], ["Marcus", "After dinner. Together."], ["Megan", "Deal. Thank you for choosing."]]}, {"id": "p5_2", "ch": 5, "chTitle": "The Held Door", "ref": "26 TAC 749.1601(c); Form 2410", "title": "The Held Door", "narr": "Same week. Harper and Owen get into it over the bathroom, and Harper shouts something that makes Ellie cry. Ryan asks Harper to go to her room and walks with her, closes the door, and holds the handle so she will cool off. Thirty seconds, and he lets go, because he remembers the rule. Closing the door was not the problem. A caregiver may close a door or stand in the doorway to enforce a time-out, as long as the door is not locked, blocked, or held. Holding the handle is what turned a time-out into seclusion. A child alone in a room she cannot leave because it is locked, blocked, or held is seclusion. It is prohibited, full stop. And for a teenager who has been confined before, it does not calm anything; it brings the old fear back. The safer version looks like this. Ryan steps back from the door and says, I'm going to sit on the stairs; come out when you're ready and we'll talk. He gives Owen the same instruction in the other direction. Ten minutes later Harper comes out. He asks what happened before the shouting, not just what she shouted. Then he writes it down, because a shouting match that ends in tears is the kind of thing the case manager needs to know about at the next visit, and because he wants to be able to say exactly what he did.", "dialog": [["Ryan", "Harper, I'm not holding the door. I'm going to sit on the stairs. Come out when you're ready and we'll figure it out."], ["Harper", "Owen started it."], ["Ryan", "Maybe. Come tell me what happened before the yelling, and I'll listen."]]}, {"id": "p5_3", "ch": 5, "chTitle": "The Held Door", "ref": "Form 2410", "title": "Natural and Logical", "narr": "The DFPS policy allows two kinds of consequences, and the difference matters. A natural consequence happens on its own, without an adult doing anything. Marcus throws a toy car and it breaks; the broken car is the consequence. A logical consequence is planned by the adult and is directly connected to the behavior. Harper comes home late without calling, so for a week she checks in by text. Owen leaves his bike in the driveway, so he puts it away before he rides again. Both kinds teach. What does not teach is a consequence that has nothing to do with the behavior, that lasts so long the child forgets why it started, or that exists to make the child feel the adult's anger. If you cannot explain the connection to the child in one sentence, it is not a logical consequence. Choose the consequence that teaches, and keep it short enough that the lesson is still attached to it."}, {"id": "p6_1", "ch": 6, "chTitle": "Week Four: Meeting Them Where They Are", "ref": "Child development", "title": "Three Ages on the Inside", "narr": "Week four. Behavior makes more sense when you know what is normal for the age. From birth to two, children are building trust and exploring with their senses; a tantrum is expected. From three to five, they are testing limits and wanting to do things themselves; Ellie's loud no is on schedule. From six to twelve, children build skills, friendships, and self-esteem; Marcus wants a best friend and wants to be good at something. From thirteen to eighteen, teenagers are forming an identity, pushing for independence, and riding emotions that come fast; Harper's door closing is partly just fifteen. Every stage has its strengths and its hard parts. The question for a caregiver is never only how old is this child. It is what is this child working on right now, and is this behavior the stage, or something more."}, {"id": "p6_2", "ch": 6, "chTitle": "Week Four: Meeting Them Where They Are", "ref": "Child development; TST-FC", "title": "The Age on the Inside", "narr": "Trauma can freeze part of a child at the age when the harm happened. Emotional, social, and learning growth can lag behind the birthday. The behavior you see can look immature, defiant, or attention-seeking, and often it is a survival strategy that once worked. In week four the Bennetts see it twice. Ellie, who was fully potty trained, starts wetting the bed after a visit with her mother. That regression is common in trauma recovery; the answer is calm, a waterproof sheet, and no shame. Harper struggles with basic hygiene and with simple routines like putting laundry in the hamper. She is fifteen on paper. On these tasks she is younger, because nobody taught her, and because pressure makes her shut down. Megan builds small supported steps: one routine at a time, a checklist on the mirror, praise for effort. Look at the developmental age, not just the chronological age. Create small steps toward independence. Build skills with patience, not pressure."}, {"id": "p6_3", "ch": 6, "chTitle": "Week Four: Meeting Them Where They Are", "ref": "Child development; service plan", "title": "When to Ask for Help", "narr": "Some things are not the stage and not the trauma alone. Watch for persistent withdrawal or sadness. Aggressive outbursts that do not improve with consistent care. No age-appropriate friendships or play. Major delays in speech, movement, or thinking. Big reactions to small problems that do not settle as the weeks go by. Trouble following directions that other children the same age can follow. These are flags, and the rule is early: do not wait for the next quarterly visit. Tell your case manager, who helps coordinate the referral. For a child under three, Early Childhood Intervention, called ECI. For a school-age child, a school evaluation, special education services, or a 504 plan. For any child, therapy: trauma therapy, play therapy, skill building. Marcus's hitting on the soccer field when he gets overwhelmed is exactly this kind of flag. Megan does not decide what it is. She describes what she sees, with dates, and asks."}, {"id": "p7_1", "ch": 7, "chTitle": "Week Five: Their Rights", "ref": "26 TAC 749.1303", "title": "What Every Child in Care Is Owed", "narr": "Week five. Section 749.1303 lists the core rights of every child in care, and the Bennetts have a copy on the refrigerator. Children have the right to care that meets their needs in the most family-like setting possible, to be protected from abuse, neglect, and exploitation, and to fair treatment. To regular contact with parents, siblings, and extended family unless the service plan or a court order limits it for their safety or well-being. To communicate in the way they prefer. To an education that fits their age and development. To have religious needs met. To take part in age-appropriate activities, at home and outside it. To privacy in mail, phone calls, journaling, and visitors, unless limited the same way. To hygiene supplies and help learning to use them, to clothing and shoes like their peers and for the weather, with some choice for teenagers, and to personal belongings and personal space in their bedroom. To be told the search policy and be free from unreasonable searches. To seek a job, keep their own money, and have a bank account as age allows. To make decisions about pregnancy, adoption, or parenting without pressure. To give written consent before taking part in any publicity or fund-raising, including use of their photo, and to take that consent back, and to decline to say thank you in public. To a service plan they help build, and sign at fourteen. To medical, dental, vision, mental health, and developmental care, freedom from unnecessary medication, and confidential records. And to make calls and complaints, anonymously if they choose, including to the Abuse Hotline and the Foster Care Ombudsman, without interference, punishment, or retaliation."}, {"id": "p7_2", "ch": 7, "chTitle": "Week Five: Their Rights", "ref": "26 TAC 749.1303(2), (3)(C)", "title": "Marcus's Sister, Harper's Church", "narr": "Two moments in one week. Marcus asks to call his sister, who is placed with another family across town. Megan is tired, the number is in a file somewhere, and the words it's too complicated are right there. But sibling contact is a protected right unless his service plan or a court order limits it, and nothing in Marcus's plan does. So Megan finds the number, calls the other foster mother, and sets a standing Sunday call. Then Harper, who was raised in a church very different from the Bennetts', asks to go to a youth service across town on Wednesday nights. The Bennetts are not comfortable with that church. It does not matter. A child's right to have religious needs met is hers, not theirs. Ryan drives her, waits in the parking lot, and asks the case manager whether another family or a volunteer can share the driving. When a right collides with the household's convenience or beliefs, the caregiver supports the right and brings the problem to the agency to solve, rather than closing the door.", "dialog": [["Marcus", "Can I call Jasmine? She said she'd be home after church."], ["Megan", "Yes. Let me find her foster mom's number. From now on, Sundays at four, okay? It's on the calendar."], ["Marcus", "Every Sunday?"], ["Megan", "Every Sunday."]]}, {"id": "p7_3", "ch": 7, "chTitle": "Week Five: Their Rights", "ref": "26 TAC 749.1303(5)(B), (3)(E), (3)(K); 749.1305, 749.1307", "title": "A Voice in the Plan", "narr": "Children also have the right to a say. Harper's service plan review is next week. She has the right to take part in building it, to get a copy or a summary, and because she is over fourteen, to review it and sign it. The Bennetts tell her when the meeting is, help her write down what she wants to say about school and about visits, and make sure she is in the room. Being heard does not mean every wish is granted; it means the wish is said out loud, considered, and answered. Privacy works the same way. Harper's mail is hers. Her phone calls with her caseworker and attorney are private. Megan knocks before entering her room. Owen does not go through her things. Harper already knows the search policy. A search of Harper or her belongings could happen only with reasonable suspicion that she had a dangerous or prohibited item, had threatened to hurt herself or someone else, or was involved in a theft. If a search ever meant removing clothing beyond outer items like a coat, hat, gloves, shoes, or socks, only a caregiver of Harper's sex could do it, with an adult witness of her sex and no other children watching. There is never a body cavity search, except looking in the mouth. If anything is taken, tell your case manager the same day. Rights are not a reward for good behavior and they are not taken away for bad behavior. They are the floor."}, {"id": "p8_1", "ch": 8, "chTitle": "Week Six: Speaking Up", "ref": "26 TAC 749.1303, 749.1213; Form 2410", "title": "The Caregiver as Advocate", "narr": "Week six. The Bennetts have learned that purposeful care has one more part: speaking up. A caregiver advocates when she asks for the ECI evaluation, when she tells the case manager that a sibling call keeps getting cancelled from the other side, when she notices that Harper's school has not started the 504 process, and when she says, plainly, that she is tired and needs respite before she makes a mistake. Benevolent House has duties on its side of this. The agency must follow the rights of every child it serves, which is why your case manager gives each child a chance to talk privately at monthly visits, watches daily life for red flags, raises concerns with you respectfully and directly, and documents what was discussed. That is not an inspection of you. It is the same purposeful care, one level up. The caregivers who do best with Benevolent House are the ones who bring problems early and in writing."}, {"id": "p8_2", "ch": 8, "chTitle": "Week Six: Speaking Up", "ref": "Benevolent House policy; 26 TAC 749.955", "title": "What Megan Writes Down", "narr": "Last scene. Sunday night of week six, Megan sits down with the progress notes. She writes that Cody visited on the first Sunday, that Ellie was briefly out of sight in the back bedroom, and that the family moved games to the living room from then on. She writes the respite night and why. She writes Harper's late Wednesday, the one-week check-in consequence, and the date it ended. She writes the bathroom shouting match, that she and Ryan did not hold the door, and the conversation afterward. She writes Ellie's bedwetting with dates, Marcus's two outbursts at soccer, and the calls she made to the case manager about both. She writes the Sunday sibling calls and the Wednesday church rides. Each note is specific: who, what, when, where, what the adults did, and who was told. Each is signed and dated. Nothing in those notes is dramatic. All of it is purposeful. That is the training. Next, your Quick Reference, then the Knowledge Check."}];
const QUIZ=[{"q": "Which statement best describes a caregiver's supervision duties under the Minimum Standards?", "a": ["Being in the house while the children are home", "Knowing which children you are responsible for, being aware of what each is doing by sight or hearing at the level that keeps them safe, and being available and able to step in", "Checking on the children once an hour"], "k": 1, "ref": "26 TAC 749.955(b)"}, {"q": "A child who is 'usually good' needs less supervision than other children.", "a": ["True", "False; supervision fits the child's developmental age, maturity, needs and history, the service plan, and the setting, not the child's reputation", "True, once the child has been in the home for thirty days"], "k": 1, "ref": "26 TAC 749.955"}, {"q": "A family friend without a background check is in a closed back bedroom with a five-year-old in care while you work in the driveway. This is:", "a": ["Fine, because the friend is trusted and you are nearby", "A supervision gap: move the activity where you can see and hear the child, keep the door open, check in, and document it", "Fine if your twelve-year-old son joins them"], "k": 1, "ref": "26 TAC 749.955"}, {"q": "A child in your care takes part in an activity with no caregiver present. Which is NOT something you must know or do?", "a": ["Know where the child will be and who the child will be with", "Know how and when the child will get back home", "Stay at the activity for its entire length"], "k": 2, "ref": "26 TAC 749.955(c)"}, {"q": "Which is an allowed discipline method?", "a": ["Offering two acceptable choices and praising the behavior you want", "Withholding dinner until the task is done", "Taking a phone for a month without explaining why or how it ends"], "k": 0, "ref": "Form 2410; 26 TAC 749.1303(4)"}, {"q": "Corporal punishment of a child in care is:", "a": ["Allowed if the biological parent gives permission", "Allowed for children over twelve", "Prohibited in every case, along with shaking and threatening corporal punishment"], "k": 2, "ref": "26 TAC 749.1303(4)(A)"}, {"q": "Holding or locking a bedroom door so a child cannot leave during a cool-off is:", "a": ["Seclusion, which is never allowed", "A reasonable time-out for a teenager", "Allowed for up to one hour"], "k": 0, "ref": "26 TAC 749.1601(c); Form 2410"}, {"q": "When you restrict a child's activities as a consequence, the Minimum Standards require that:", "a": ["The restriction fits the child's age, maturity, and development, and is explained to the child when you impose it", "You choose any length, since it is your home", "You take away calls and visits too, so the consequence is clear"], "k": 0, "ref": "26 TAC 749.1303(4)(B), (4)(C)"}, {"q": "A five-year-old who was fully potty trained starts wetting the bed after a family visit. The best response is:", "a": ["A consequence, so she learns it is not acceptable", "Calm, practical steps and no shame, and tell the case manager, because regression under stress is common in trauma recovery", "Ignore it; it is not your concern"], "k": 1, "ref": "Child development; TST-FC"}, {"q": "A child asks to call a sibling in another placement, and nothing in the service plan or a court order restricts contact. The caregiver:", "a": ["May say no if it is inconvenient", "Supports the call, because regular contact with siblings is a protected right unless the service plan or a court order limits it", "May allow it only as a reward for good behavior"], "k": 1, "ref": "26 TAC 749.1303(2)"}];
const ACK="I completed the Supporting Children Through Purposeful Care training. I understand the supervision duties in 26 TAC 749.955, the discipline requirements and prohibited practices in 26 TAC 749.1303 and 749.1417 and DFPS Form 2410, the developmental stages and warning signs covered in this training, and the rights of children in care under 26 TAC 749.1303, and I agree to care for the children placed with me in accordance with Benevolent House policy and Texas Minimum Standards.";
const COURSE={"title": "Supporting Children Through Purposeful Care", "code": "SCPC", "hours": 2, "trainer": "Christopher R. Orr, LCPAA", "basis": "26 TAC 749.955 (supervision), 749.1303, 749.1417 and 749.1601(c) (discipline and seclusion), 749.1303 and 749.1305 (children's rights and searches), and DFPS Form 2410", "subtitle": "Supporting Children Through Purposeful Care", "hero": "Six Weeks at the Bennetts'", "blurb": "Spend six weeks with a Benevolent House foster family and practice the four parts of purposeful care: supervision, discipline, child development, and children's rights. About two hours with the activities and knowledge check. Narrated, with captions and character voices. Stop any time; your place is saved.", "heroImg": "s_p1_1", "qrefImg": "s_p8_2", "seal": "BENEVOLENT<br>HOUSE<br>PURPOSEFUL<br>CARE", "passMark": 7, "covers": ["Caregiver supervision duties (749.955)", "Supervision by child, history, plan and setting (749.955)", "Unsupervised activities (749.955(c)) and progress notes (Benevolent House policy)", "Allowed discipline and prohibited punishments (749.1303, 749.1417, Form 2410)", "Restrictions fit the child and are explained; seclusion is prohibited (749.1303, 749.1601(c))", "Trauma-informed discipline and logical consequences", "Developmental stages, regression, and when to refer", "Rights of children in care (749.1303)", "Advocacy and documentation"], "chapters": [["Six Weeks", "1"], ["Week One: Eyes and Ears", "2"], ["Week Two: The Plan", "3"], ["Week Three: Teaching", "4"], ["The Locked Door", "5"], ["Week Four: Development", "6"], ["Week Five: Their Rights", "7"], ["Week Six: Speaking Up", "8"], ["Your Certificate", "9"]], "icons": {"1": "\ud83c\udfe1", "2": "\ud83d\udc40", "3": "\ud83d\uddd3\ufe0f", "4": "\ud83e\udded", "5": "\ud83d\udeaa", "6": "\ud83c\udf31", "7": "\ud83d\udcdc", "8": "\ud83d\udde3\ufe0f", "9": "\ud83c\udfc5"}, "roles": ["Foster Caregiver", "Kinship Caregiver", "Adoptive Parent", "Foster and Adoptive Caregiver", "Staff", "Contracted Provider"], "openers": {"p1_1": "v_p1", "p2_1": "v_p2", "p3_1": "v_p3", "p4_1": "v_p4", "p5_1": "v_p5", "p6_1": "v_p6", "p7_1": "v_p7", "p8_1": "v_p8"}, "qrefHtml": "<h3>Supervision (26 TAC 749.955)</h3><p>Know which children you are responsible for. Supervise each child at the level that protects the child's health, safety, and well-being, aware of what each child is doing by sight, hearing, or both. Be available and able to step in. Understand any special supervision needs from the child's developmental age, maturity, and service plan.</p><p><b>How close is close enough</b> depends on the child (developmental age, maturity, needs, and history), the service plan, and the setting (749.955(a)(2)). Look at the layout of the home, indoors and out, and the hazards around the child. Re-decide after a new placement, a visitor, a behavior change, or a bad week.</p><p><b>History counts.</b> Benevolent House builds supervision around each child's specific needs, including any history of high-risk behavior that calls for more supervision, and around the setting (749.955(a)). Running away, harming others, fire-setting, and suicide attempts are examples. Know the plan, follow it, ask when anything changes.</p><p><b>Activities with no caregiver present (749.955(c)):</b> know where the child will be and who the child will be with, and how and when the child will get home. Benevolent House also asks you to arrange or confirm the ride, give the child a way to reach you, and be available if the child calls. <b>Never</b> leave a child in care alone with an adult the agency has not cleared. Keep visitors and children where you can see or hear them. A child is not a caregiver. If you do not know where a child is and cannot reach the child, call your case manager right away.</p>\n\n<h3>Discipline (26 TAC 749.1303 and 749.1417; DFPS Form 2410)</h3><p>Discipline teaches and guides. Only a caregiver who knows the child well may discipline the child (749.1417). It fits the child's age, maturity, and developmental level, and restrictions are explained to the child at admission and whenever one is imposed (749.1303(4)(B), (4)(C)). It is fair, consistent, and tied to the behavior. The child can say what they did, why there is a consequence, how long it lasts, and what the right behavior is.</p>\n<table class=\"t\"><tr><th>Allowed</th><th>Prohibited</th></tr><tr><td><b>DFPS policy:</b> routines and reasonable limits; modeling; offering choices; giving explanations; repeating instructions; logical and natural consequences; reinforcing the behavior you want; time-out, supervised, about one minute per year of age. <b>Benevolent House adds:</b> a redo, time to settle, a calm low voice, catching behavior while it is small, and using time-out sparingly. Infants need comfort and redirection.</td><td><b>Never allowed (749.1303(4)(A)):</b> shaking; corporal punishment, spanking, hitting, or threatening it; long periods outside in extreme heat or cold; pointless work meant only to demean; denying food, sleep, the bathroom, mail, or family visits as punishment; belittling or ridiculing the child or family; threatening loss of placement or shelter; demeaning behavior meant to embarrass, control, intimidate, or isolate; emergency behavior intervention as punishment, or holding therapy. <b>Also out under the DFPS discipline policy (Form 2410):</b> physical discipline of any kind or anything that causes an injury; name-calling or labeling; embarrassing or degrading a child; withholding food, shelter, visits, supervision, school, medical care, other necessities, mail, or special items such as birthday gifts; holding interventions, even if a therapist recommends them; mechanical or chemical restraints. Seclusion of any kind is prohibited (749.1601(c)).</td></tr></table><p><b>Restrictions.</b> Limits on a child's calls, mail, or visits can come only from the service plan or a court order (749.1303(2), (3)(E)); denying mail or family visits as punishment is prohibited (749.1303(4)(A)(v)). You may close the door or stand in the doorway to enforce a supervised time-out. You may not lock, block, or hold it; a child alone in a room they cannot leave is seclusion and is never allowed. Restraint is allowed only as an emergency behavior intervention after de-escalation fails, only as your EBI training allows, and never as discipline.</p><p><b>The test:</b> if it is meant to make the child feel small, afraid, or alone, it is out. If you cannot explain the connection to the behavior in one sentence, it is not a logical consequence.</p>\n<h3>Child development</h3><table class=\"t\"><tr><th>Stage</th><th>Working on</th><th>Expected</th></tr><tr><td>Birth to 2</td><td>Trust; exploring through the senses</td><td>Tantrums; walking, talking, \"no\"</td></tr><tr><td>3 to 5</td><td>Independence; testing limits</td><td>Imaginative play; basic self-care; big feelings</td></tr><tr><td>6 to 12</td><td>Skills, friendships, self-esteem</td><td>Logical thinking; best friends; wanting to be good at something</td></tr><tr><td>13 to 18</td><td>Identity; independence; managing emotions</td><td>Closed doors; abstract thinking; fast emotional swings</td></tr></table><p>Trauma can freeze growth at the age the harm happened. Regression under stress (bedwetting, clinginess) is common in recovery. Look at the developmental age, not just the birthday; build small supported steps; praise effort; no shame.</p><p><b>Ask early, do not wait:</b> persistent withdrawal or sadness; aggression that does not improve; no age-appropriate friendships or play; major delays in speech, movement, or thinking; big reactions to small problems that do not settle; trouble following directions peers can follow. Tell your case manager, who helps arrange: ECI (under 3); school evaluation, special education, or a 504 plan (school age); therapy (any age). Describe what you see, with dates.</p>\n<h3>Children's rights (26 TAC 749.1303)</h3><ul><li>Care that meets their needs in the most family-like setting possible; protection from abuse, neglect, and exploitation; fair treatment.</li><li>Regular contact with parents, siblings, and extended family, unless the service plan or a court order limits it.</li><li>Communication in the way they prefer; an education that fits them; religious needs met; age-appropriate activities.</li><li>Privacy in mail, phone calls, journaling, and visitors (unless limited the same way); personal belongings and storage space; notice of search policies and freedom from unreasonable searches (749.1303(3)(K)).</li><li>Hygiene supplies; clothing and shoes like their peers and for the weather, with some choice for teenagers; a job, their own money, and a bank account as age allows.</li><li>Written consent before any publicity or fund-raising, including photos; freedom to decline public thanks; freedom from pressure about pregnancy, adoption, or parenting.</li><li>Discipline that fits their age, maturity, and development; freedom from harsh, cruel, or humiliating treatment; restrictions explained at admission and when imposed.</li><li>A service plan they help build and receive, and review and sign at age 14 or older.</li><li>Medical, dental, vision, mental health, and developmental care; no unnecessary medication; confidential records.</li><li>Calls and complaints without interference or retaliation: Texas Abuse Hotline 1-800-252-5400; HHSC Foster Care Ombudsman 1-844-286-0769; DFPS Office of Consumer Affairs; Disability Rights Texas.</li><li><b>Searches</b> only on reasonable suspicion of a dangerous item, threatened harm, or theft; clothing removal only by a same-sex caregiver with a same-sex adult witness; no body cavity searches; report any removed items to your case manager (749.1305, 749.1307).</li></ul><p>Rights are not rewards and are not taken away for behavior. When a right collides with the household's convenience or beliefs, support the right and bring the problem to Benevolent House to solve.</p>\n<h3>Speaking up and writing it down</h3><p>Advocate: ask for evaluations, report missed sibling contact, flag school delays, ask for respite before you need it. Benevolent House asks you to keep progress notes as often as your case manager or the service plan sets, signed and dated, ready for your case manager: who, what, when, where, what the adults did, who was told. Near misses count. Facts, not labels or guesses about motive.</p><p class=\"small\">Benevolent House office: (214) 774-4871. <span class=\"afterhours\"></span> Form 2410, Foster Care and Adoption Discipline Acknowledgement, is in your foster home binder and at dfps.texas.gov.</p>"};
</script>
<script>/* Supporting Children Through Purposeful Care: interactions keyed by scene id. */
const INTER = {
"p1_1":{type:"none"},
"p1_2":{type:"sort",k:"Which part of the job?",q:"Tap a moment from the Bennett house, then tap the part of purposeful care it belongs to.",
 bins:[["sup","Supervision"],["dis","Discipline"],["dev","Development"],["rts","Rights"]],
 items:[["Checking the backyard from the window every two minutes","sup"],["Offering Marcus two choices about when to pick up his cars","dis"],["Noticing that Ellie's bedwetting started after a visit","dev"],["Setting a standing Sunday call with Marcus's sister","rts"],["Deciding Ellie stays within sight because she is five","sup"],["Knocking before entering Harper's room","rts"],["Explaining to Harper how long a consequence lasts and how it ends","dis"],["Building Harper's hygiene routine one step at a time","dev"]],
 fb:"All four happen in the same house in the same week. Supervision is knowing and watching. Discipline is teaching. Development is asking what the child is working on inside. Rights are the floor every child stands on."},

"p2_1":{type:"multi",k:"Saturday morning",q:"Check everything the Standards (749.955) require of Megan while she makes pancakes.",
 items:[["Know which children she is responsible for",1],["Supervise each child at the level that keeps the child safe, aware of what each is doing by sight or hearing",1],["Be available and able to step in when a child needs her",1],["Understand any special supervision needs from each child's age, maturity, and service plan",1],["Keep every child in the same room with her at all times",0],["Let Harper sleep in without ever checking on her",0]],
 fb:"Supervision is awareness and readiness, not the same room. Megan can cook while two boys play in the fenced yard, as long as she knows where they are, checks by sight, and can get there. A long task that pulls her away, or never checking on a sleeping teenager, is where supervision stops."},

"p2_2":{type:"stages",k:"Fit it to the child",q:"Section 749.955 asks you to fit supervision to the child, the plan, and the setting. Match each detail to what it tells you.",
 stages:["The child: developmental age and maturity","The child: needs and history","The service plan","The setting"],
 items:[["Ellie is five, so she stays within sight or sound",0],["There is a creek at the back of the property",3],["Bedrooms are on two floors",3],["Harper left two placements after arguments",1],["Harper's plan calls for increased supervision",2],["Marcus can follow a rule like 'stay inside the fence' on his own",0],["The front door opens onto a road",3]],
 fb:"The same house gives different answers for Ellie, Marcus, and Harper. When the child, the plan, or the setting changes, the supervision changes with it."},

"p2_3":{type:"choice",k:"The back bedroom",q:"Cody, who has no background check through Benevolent House, is in the back bedroom with Ellie, door closed, while Ryan works on the truck. Which is true?",
 a:[["This is fine. Cody is a trusted friend and Ryan is right outside",0,"Trust is not the standard. Ryan cannot see or hear Ellie, and Cody has not been cleared by the agency. A five-year-old in care was out of a caregiver's sight and hearing for forty minutes."],["This is a supervision gap. Ryan moves the game to the living room, keeps the door open, checks in, and documents it in Ellie's notes",1,"Yes. Nothing bad happened, and it is still a gap. The fix is visibility and a note, and the household rule changes going forward."],["This is fine as long as Owen goes in to play with them",0,"A twelve-year-old is not a caregiver. The gap is the same with Owen in the room."]]},

"p3_1":{type:"multi",k:"Harper's plan",q:"Harper left two prior placements after arguments. Check what Benevolent House and the Bennetts do under 749.955.",
 items:[["The agency's supervision for Harper accounts for her history of leaving without permission",1],["Her service plan spells out the increased supervision she needs",1],["The Bennetts know the plan and follow it, and ask when anything is unclear",1],["The plan is permanent and never loosens",0],["Arguments end with an adult checking in within ten minutes rather than a slammed door and silence",1],["The Bennetts decide on their own to lock her bedroom door at night",0]],
 fb:"The agency builds supervision around the child's needs and history, and the service plan says what that means day to day. Caregivers follow it and ask questions. Plans loosen as the child settles. Locking a child in a room is never part of a plan."},

"p3_2":{type:"choice",k:"Home alone",q:"The Bennetts must drive to Tyler overnight. Harper, fifteen, asks to stay home alone and promises to keep her phone on. What is the right call?",
 a:[["Let her. Fifteen is old enough and she has been responsible for two weeks",0,"Age is only part of it. Her history, the home with no adult in it, and her plan for increased supervision all point the other way."],["Take her to the hospital waiting room against her wishes and do not tell the case manager",0,"Closer, but the case manager needs to know about an overnight change, and there is a better option on the table."],["Call the case manager, who arranges respite with another Benevolent House family, and tell Harper plainly that this is about the plan, which will loosen over time",1,"Yes. Overnight alone is outside her plan. Respite keeps her supervised, the agency knows, and Harper hears the truth instead of a verdict on her character."]]},

"p3_3":{type:"multi",k:"Soccer practice",q:"Marcus has practice at the park with no parent staying. Check what Megan must know under 749.955, plus what Benevolent House asks.",
 items:[["Know where he is scheduled to be and who he will be with",1],["Know how and when he will get back home",1],["Arrange or confirm the ride there and back",1],["Give him a way to reach her in an emergency",1],["Stay at every practice, because a child in care can never be at an activity without a caregiver",0]],
 fb:"Unsupervised childhood activities are allowed. The Standards require you to know where the child will be, who with, and how and when the child gets home. Benevolent House also asks you to confirm the ride and give the child a way to reach you. Megan also keeps Marcus's progress notes as often as his team set, signed and dated."},

"p4_1":{type:"sort",k:"The toolbox",q:"Tap each approach, then tap whether it is an allowed discipline method or not.",
 bins:[["ok","Allowed"],["no","Not allowed"]],
 items:[["Offering two acceptable choices","ok"],["A supervised five-minute time-out for five-year-old Ellie","ok"],["A thirty-minute time-out for Ellie","no"],["Praising the behavior you want to see","ok"],["Having Marcus redo the behavior the right way with an adult","ok"],["Discipline by a weekend visitor the child barely knows","no"],["A calm, low voice and time to settle","ok"],["Taking Harper's phone for a month without explaining why or how it ends","no"]],
 fb:"The allowed tools are ordinary and the limits are specific. Time-out is sparing, supervised, and about one minute per year of age. Only a caregiver who knows the child well may discipline (749.1417), and any restriction is explained when it is imposed (749.1303)."},

"p4_2":{type:"sort",k:"The line",q:"Tap each action, then tap whether the Standards allow it.",
 bins:[["ok","Allowed"],["no","Prohibited"]],
 items:[["Spanking a child in care","no"],["Leaving a child outside in the cold as punishment","no"],["A logical consequence tied to the behavior","ok"],["Withholding a family visit as punishment","no"],["Telling a child he might lose his placement if he keeps it up","no"],["Sarcasm meant to embarrass a child in front of others","no"],["Explaining what the child did, why there is a consequence, and how it ends","ok"],["Calling a child names in front of others","no"],["Having Harper discipline Marcus","no"],["Skipping dessert while the child still gets a full meal","ok"]],
 fb:"The prohibited list in 749.1303 and the DFPS discipline policy has one idea behind it: nothing meant to make the child feel small, afraid, or alone. Dessert is not nutrition, so skipping it is not withholding food; withholding a meal is. And only a caregiver who knows the child well may discipline (749.1417), so one child never disciplines another."},

"p4_3":{type:"choice",k:"Grounded until when",q:"Harper came home two hours late without calling. Ryan wants to take her phone for a month. What is the better call?",
 a:[["A month is fine. Caregivers set consequences in their own home",0,"Discipline has to fit Harper's age, maturity, and development, and be explained when it is imposed. A month-long consequence for one late night is not connected to the behavior and teaches very little."],["Keep it short and tied to the behavior, such as a week of check-in texts, tell her how it ends, and note the late return for the case manager",1,"Yes. Short, connected, explained, and documented. A late return from a child with Harper's history is also a supervision event the case manager should hear about."],["Confine her to her room for the weekend",0,"A weekend in her room is not connected to calling home, and a room she cannot leave would be seclusion, which is never allowed. Neither teaches her to call."]]},

"p5_1":{type:"choice",k:"The toy cars",q:"Marcus will not pick up his cars after three requests. Megan's first thought is no dinner until it is done. What does she do instead?",
 a:[["Follow through: no dinner until the cars are up",0,"Withholding food is prohibited. It would also teach Marcus that cleaning up is dangerous, which is exactly what his history already tells him."],["Offer two acceptable choices, now or after dinner together, then praise the effort",1,"Yes. Choice gives back a little control, together makes it safe, and praise attaches the lesson to the good behavior."],["Pick them up herself and say nothing",0,"No harm done, but no teaching either, and tomorrow it happens again."]]},

"p5_2":{type:"choice",k:"The held door",q:"Ryan holds Harper's bedroom door shut for a cool-off. Why does he let go after thirty seconds?",
 a:[["Because a child alone in a room she cannot leave is seclusion, which is never allowed, and for a child who has been confined before it brings the fear back",1,"Yes. He steps back, tells her he is on the stairs, and waits. Then he asks what happened before the shouting, and writes it down."],["Because she might damage the door",0,"The door is not the issue. The rule is about the child, not the furniture."],["He should not have let go; a locked door for ten minutes is a reasonable time-out for a teenager",0,"Time-out is short, supervised, and never behind a door the child cannot open. Holding or locking a door is seclusion."]]},

"p5_3":{type:"sort",k:"Natural or logical?",q:"Tap each consequence, then tap the kind it is.",
 bins:[["nat","Natural: happens on its own"],["log","Logical: planned and connected"],["no","Neither: not connected, or meant to punish"]],
 items:[["Marcus throws a toy car and it breaks","nat"],["Harper comes home late, so for a week she texts when she leaves school and arrives","log"],["Owen leaves his bike in the driveway, so he puts it away before riding again","log"],["Ellie forgets her jacket and is cold at recess","nat"],["Marcus talks back, so he loses screen time for the rest of the month","no"],["Harper rolls her eyes, so she cannot call her mother this week","no"]],
 fb:"Natural consequences happen without you. Logical consequences are connected and short enough that the lesson stays attached. Losing family contact is never a consequence; it is a right. A month-long loss for one remark is not connected to anything."},

"p6_1":{type:"stages",k:"Which stage?",q:"Match each behavior to the stage where it is expected.",
 stages:["Birth to 2","3 to 5","6 to 12","13 to 18"],
 items:[["A loud 'No!' and insisting on doing it herself",1],["A tantrum when a toy is taken away",0],["Wanting a best friend and to be good at something",2],["Closing the bedroom door and pushing for independence",3],["Imaginative play and learning basic self-care",1],["Logical thinking and stronger friendships",2]],
 fb:"Each stage has its own work. Knowing the stage tells you whether a behavior is on schedule or a flag, and trauma can shift the schedule."},

"p6_2":{type:"choice",k:"The age on the inside",q:"Ellie, fully trained, starts wetting the bed after a visit with her mother. Harper, fifteen, cannot keep a simple hygiene routine. What do both have in common?",
 a:[["Both are misbehavior that needs a firmer consequence",0,"Neither is misbehavior. A consequence for bedwetting or for a skill nobody taught adds shame and nothing else."],["Both are developmental age showing through chronological age, and both call for calm, small supported steps, and no shame",1,"Yes. Regression under stress is common in trauma recovery, and a teenager can be younger on specific skills. Meet the child where she is and build from there."],["Both mean the placement is failing",0,"Both are ordinary in trauma recovery. They are information for the service plan, not a verdict on the home."]]},

"p6_3":{type:"wheel",k:"Who helps?",q:"For each flag, tap the first referral the case manager would help arrange.",
 who:["ECI (Early Childhood Intervention)","School evaluation, special education, or a 504 plan","Therapy (trauma, play, or skill building)"],
 items:[["A two-year-old in care is not using any words",0],["Harper is failing two classes and the school has not evaluated her",1],["Marcus becomes overwhelmed and hits when excited or upset",2],["A four-year-old has frequent nightmares and cannot be soothed",2]],
 fb:"ECI is for children under three. School supports are for school-age children. Therapy is for any child. You do not decide the diagnosis; you describe what you see, with dates, and ask early."},

"p7_1":{type:"multi",k:"The rights list",q:"Check each item that is a right of a child in care under 749.1303.",
 items:[["Regular contact with parents, siblings, and extended family unless the service plan or a court order limits it",1],["Having religious needs met",1],["Privacy in mail, phone calls, journaling, and visitors, unless restricted the same way",1],["Being told about search policies and being free from unreasonable searches",1],["Choosing which foster home to live in",0],["Reviewing and signing their own service plan at age fourteen or older",1],["Making calls or complaints to the Abuse Hotline or the Foster Care Ombudsman without interference or retaliation",1],["Keeping any money earned at a job, as age and maturity allow",1],["Unlimited screen time",0]],
 fb:"The list is long and specific, and the Bennetts keep it on the refrigerator. Placement decisions and screen time are not on it. Everything else checked is."},

"p7_2":{type:"wheel",k:"Right, or not?",q:"For each moment, tap the answer.",
 who:["This is a protected right; the caregiver supports it","The caregiver may refuse this"],
 items:[["Marcus asks to call his sister in another placement; nothing in his plan restricts contact",0],["Harper asks to attend a youth service at a church the Bennetts disagree with",0],["Harper asks to use the family car alone at fifteen",1],["Marcus asks to see a letter his mother mailed him; no restriction is in place",0]],
 fb:"Sibling contact, religious practice, and mail are protected unless the service plan or a court order limits them. The caregiver supports the right and brings any logistics problem to the agency. Driving at fifteen is not a right."},

"p7_3":{type:"sort",k:"Voice and privacy",q:"Tap each action, then tap whether it respects Harper's rights.",
 bins:[["ok","Respects her rights"],["no","Violates her rights"]],
 items:[["Telling Harper when her service plan review is and helping her write what she wants to say","ok"],["Holding the review without her because she is 'just a kid'","no"],["Knocking before entering her room","ok"],["Reading her mail before giving it to her","no"],["Keeping her calls with her attorney private","ok"],["Taking away her Sunday call with her mother because of a bad grade","no"],["Explaining the household search policy ahead of time","ok"]],
 fb:"Being heard means the wish is said, considered, and answered. Privacy and family contact are rights, not rewards. Rights are not taken away for bad behavior; they are the floor."},

"p8_1":{type:"multi",k:"Speaking up",q:"Check everything that counts as advocacy by a caregiver.",
 items:[["Asking the case manager for an ECI evaluation",1],["Reporting that sibling calls keep getting cancelled from the other side",1],["Telling the case manager the school has not started the 504 process",1],["Saying plainly that you need respite before you make a mistake",1],["Keeping concerns to yourself so the home looks like it is going well",0],["Bringing problems early and in writing",1]],
 fb:"Advocacy is part of caregiving, not separate from it. The agency must follow every child's rights, which is why your case manager gives each child a chance to talk privately at monthly visits (749.1213) and documents what was discussed. Problems raised early are problems the team can solve."},

"p8_2":{type:"choice",k:"What Megan writes",q:"Which note from week six is written the way Benevolent House expects?",
 a:[["'Harper had a bad week. Dealt with it.'",0,"No who, what, when, or what the adults did. It cannot be reviewed by Licensing or used by the team."],["'Wed 10/15, 6:40 p.m. Harper returned 2 hrs after agreed time, no call. Ryan: phone on counter for the evening; 1 week of check-in texts after school and on arrival, ended 10/22. Case manager told by email 10/15.'",1,"Yes. Who, what, when, what the adults did, and who was told. Signed and dated, and specific enough that anyone can read it a year from now and know what happened."],["'Harper is becoming defiant and manipulative, probably because of her mother.'",0,"Labels and guesses about motive are not documentation. Write what you saw and what you did."]]}
};
</script>
<script>/* ===== Benevolent House course engine ===== */
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));

 if(Date.now()<due.getTime()-90*864e5)return x;const hist=(x.history||[]).filter(h=>h.iso!==x.done.iso).concat([{date:x.done.date,iso:x.done.iso,score:x.done.score}]);return{seen:{},badges:{},answers:{},rate:x.rate,history:hist,renewDue:due.toISOString(),_ts:Date.now()}}

 const sents=text.match(/[^.!?]+[.!?]+["']?/g)||[text];const cap=$("#cap");cap.innerHTML=sents.map(s=>`<span>${esc(s.trim())} </span>`).join("");
