 const st=e=>{d=true;const[x,y]=pos(e);sigCtx.beginPath();sigCtx.moveTo(x,y);e.preventDefault()},mv=e=>{if(!d)return;const[x,y]=pos(e);sigCtx.lineTo(x,y);sigCtx.stroke();sigDrawn=true;e.preventDefault()},en=()=>{d=false};
 c.addEventListener("mousedown",st);c.addEventListener("mousemove",mv);window.addEventListener("mouseup",en);c.addEventListener("touchstart",st,{passive:false});c.addEventListener("touchmove",mv,{passive:false});c.addEventListener("touchend",en)}
function typedSig(){const n=$("#aName").value.trim();if(!n){toast("Type your name first");return}clearSig();sigCtx.font="italic 34px Georgia, serif";sigCtx.fillStyle="#1b2a4a";sigCtx.fillText(n,16,90);sigDrawn=true;toast("Typed signature applied")}
function clearSig(){const c=$("#sigPad");sigCtx.clearRect(0,0,c.width,c.height);sigDrawn=false}
let finishing=false;
async function finish(){if(finishing)return;const n=$("#aName").value.trim();if(!n){toast("Please type your name");return}if(!sigDrawn){toast("Please sign in the box");return}if(!$("#aAgree").checked){toast("Please check the agreement box");return}
 finishing=true;const b=$("#ackSubmit");b.disabled=true;b.textContent="Submitting...";const now=new Date();const sig=$("#sigPad").toDataURL("image/png");
 const rec={title:COURSE.title,code:COURSE.code,score:RESULT.score,pass:"Pass",date:fmtDate(now),time:fmtTime(now),hours:COURSE.hours,answers:"Attempt "+RESULT.attempt+" ("+RESULT.score+" of "+QUIZ.length+")\n"+(RESULT.detail||RESULT.answers)+reflectText(),ack:ACK+" Signed by "+n,sig:sig,trainer:COURSE.trainer};
 const ok=await logToForms(rec);try{if(S.user&&S.user.cloud)await BHC.addCompletion({code:COURSE.code,title:COURSE.title,hours:COURSE.hours,score:RESULT.score,total:QUIZ.length,attempt:RESULT.attempt||1,answers:{reflect:S.reflect||null,picks:RESULT.picks||null,items:(RESULT.picks||[]).map((x,i)=>{const q=QUIZ[i];return{q:q.q,a:q.a["abcde".indexOf(x)]||"",ok:x==="abcde"[q.k],right:q.a[q.k]}})},ack:ACK+" Signed by "+n,completed_at:now.toISOString()});BHC.log("course_done",COURSE.code)}catch(e){}S.done={date:fmtDate(now),score:RESULT.score,name:n,sig:sig,iso:now.toISOString(),picks:RESULT.picks||null,attempt:RESULT.attempt||1};S.badges[CH.length]=1;save();finishing=false;renderCert(n,now,sig,ok)}
async function logToForms(r){const fd=new FormData();fd.append("formID",JOTFORM_ID);fd.append("q3_q3_textbox1",S.user.name);fd.append("q4_q4_email2",S.user.email);fd.append("q5_q5_textbox3",S.user.home||"");fd.append("q6_q6_dropdown4",S.user.role);fd.append("q8_q8_textbox6",r.title);fd.append("q9_q9_textbox7",r.code);fd.append("q11_q11_number9",r.score);fd.append("q12_q12_dropdown10",r.pass);fd.append("q13_q13_textbox11",r.date);fd.append("q14_q14_textbox12",r.time);fd.append("q15_q15_number13",r.hours);fd.append("q16_q16_textarea14",r.answers);fd.append("q17_q17_textarea15",r.ack);fd.append("q18_q18_textarea16",r.sig);fd.append("q20_q20_textbox18",r.trainer);fd.append("q21_q21_textbox19",PORTAL_VERSION);
 try{await fetch(JOTFORM_SUBMIT_URL,{method:"POST",body:fd,mode:"no-cors"});return true}catch(e){try{const q=JSON.parse(localStorage.getItem(KEY+"_queue")||"[]");q.push({r,u:S.user});localStorage.setItem(KEY+"_queue",JSON.stringify(q))}catch(x){}return false}}
function renderCert(name,now,sig,ok){$("#v-cert").innerHTML=`<p class="noprint hint" style="margin:14px 0">${ok?"Your completion record has been sent to Benevolent House.":"Your record is saved on this device and will be sent when you are back online. Please also tell your case manager you finished."} Print or save this certificate for your records.</p>
 <div id="cert"><img class="logo" src="bh-logo.png" alt=""><div style="font-weight:700;color:var(--brown);font-size:1.2rem">Benevolent House</div><div class="small">Foster Care and Adoption</div><h1>Certificate of Completion</h1><p>This certifies that</p><div class="name">${esc(name)}</div><p>${esc(S.user.role)}</p><p>has completed</p><p style="font-size:1.25rem;font-weight:700;color:var(--brown)">${esc(COURSE.title)}</p><p>Training code ${esc(COURSE.code)} · ${COURSE.hours} training ${COURSE.hours===1?"hour":"hours"} · Knowledge Check ${RESULT.score} of ${QUIZ.length}<br>${fmtDate(now)}</p>
 <div class="covers"><b>This training covered</b><p>${esc((COURSE.covers||CH.filter(c=>+c[1]<CH.length).map(c=>c[0])).join(" · "))}</p>${COURSE.basis?`<p class="small">Built on ${esc(COURSE.basis)}</p>`:""}</div><div class="sigs"><div>${/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(sig||"")?`<img src="${sig}" alt="">`:""}<b>${esc(name)}</b>Participant</div><div style="padding-top:56px"><b>${esc(COURSE.trainer)}</b>Trainer of Record (electronic record on file)</div></div><div class="seal">${COURSE.seal||"BENEVOLENT<br>HOUSE<br>TRAINING<br>COMPLETE"}</div>
 <p class="small" style="margin-top:26px">Knowledge Check and signed Acknowledgment on file with Benevolent House.</p></div>
 <div class="nav noprint" style="justify-content:center"><button class="btn" onclick="window.print()">Print or save as PDF</button> <button class="btn ghost" onclick="renderQuizRecord()">Print my Knowledge Check</button> <button class="btn ghost" onclick="renderHome()">Back to chapters</button></div>`;show("cert")}
function renderQuizRecord(){const picks=(RESULT&&RESULT.picks)||(S.done&&S.done.picks);if(!picks){toast("No Knowledge Check record is saved on this device");return}const n=S.done?S.done.name:(S.user&&S.user.name)||"";const d=S.done?S.done.date:fmtDate(new Date());let h=`<div id="cert" style="text-align:left"><img class="logo" src="bh-logo.png" alt="" style="float:right;width:56px"><div style="font-weight:700;color:var(--brown);font-size:1.1rem">Benevolent House</div><h1 style="font-size:1.4rem;margin:.3rem 0">Knowledge Check Record</h1><p>${esc(COURSE.title)} · Training code ${esc(COURSE.code)}<br><b>${esc(n)}</b> · ${esc(d)} · Attempt ${(S.done&&S.done.attempt)||(RESULT&&RESULT.attempt)||1} · Score <b>${(S.done?S.done.score:RESULT.score)} of ${QUIZ.length}</b> (${(COURSE.passMark||8)} to pass)</p><ol style="padding-left:1.2rem">`;QUIZ.forEach((q,i)=>{const p="abcde".indexOf(picks[i]);const ok=p===q.k;h+=`<li style="margin:.5rem 0"><div>${esc(q.q)}</div><div style="color:${ok?"var(--green-dk)":"var(--red)"}">${ok?"✓":"✗"} Answered: ${COURSE.letters&&p>=0?"ABCDE"[p]+". ":""}${esc(q.a[p]||"")}</div>${ok?"":`<div class="small">Correct answer: ${COURSE.letters?"ABCDE"[q.k]+". ":""}${esc(q.a[q.k])}</div>`}</li>`});h+=`</ol><p class="small">Graded automatically by the Benevolent House Training Portal. Record on file with Benevolent House.</p></div><div class="nav noprint" style="justify-content:center"><button class="btn" onclick="window.print()">Print or save as PDF</button> <button class="btn ghost" onclick="showSavedCert()">Back to certificate</button></div>`;$("#v-cert").innerHTML=h;show("cert")}

function showSavedCert(){if(!S.done){renderQuickRef();return}RESULT=RESULT||{score:S.done.score};renderCert(S.done.name,new Date(S.done.iso),S.done.sig,true)}
function overallPct(){const n=SCENES.length+2;let d=SCENES.filter(s=>S.seen[s.id]&&S.answers[s.id]!==undefined||S.seen[s.id]&&!(INTER[s.id]||{}).type||S.seen[s.id]&&(INTER[s.id]||{}).type==="none").length;d=Math.max(d,Object.keys(S.answers||{}).length);if(S.done)d=n;else if(S.ackReady)d=n-1;return Math.min(100,Math.round(d/n*100))}
function progBar(){const p=overallPct();return `<div class="course-prog" aria-label="Course progress ${p} percent"><i style="width:${p}%"></i><span>${p}% complete</span></div>`}
/* ---------- init ---------- */
window.addEventListener("online",async()=>{try{const q=JSON.parse(localStorage.getItem(KEY+"_queue")||"[]");if(!q.length)return;localStorage.removeItem(KEY+"_queue");const u=S.user;for(const it of q){S.user=it.u;await logToForms(it.r)}S.user=u}catch(e){}});
window.addEventListener("resize",()=>{if($("#v-ack")&&!$("#v-ack").classList.contains("hidden")&&!sigDrawn)initSig()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&document.activeElement&&["uName","uEmail","uHome"].includes(document.activeElement.id))signIn()});
$("#homeBtn").onclick=renderHome;renderHome();cloudBoot();
</script>
