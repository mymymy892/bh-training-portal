<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T3C Staff Session</title><meta name="robots" content="noindex">
<style>:root{--brown:#7B4B2A;--brown-dk:#5E3920;--green:#2E7D4F;--green-dk:#226040;--cream:#FBF7F2;--sand:#F1E8DD;--ink:#2B2320;--muted:#6B5F58;--line:#E3D7C9;--gold:#C9A227;--night:#141010;--night2:#1f1816;--red:#B23A3A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:#f5efe8;font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:1rem;cursor:pointer}
a{color:#f3d98b}
.hidden{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(20,16,16,.82);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08)}
.top .wrap{display:flex;align-items:center;gap:12px;padding:8px 16px}
.top img{height:38px}
.top .brand{font-weight:700;color:#fff;font-size:.95rem;line-height:1.1}.top .brand small{display:block;font-weight:400;color:#bdb0a6;font-size:.72rem}
.top .sp{flex:1}
.top .user{font-size:.8rem;color:#e8dccf;background:rgba(255,255,255,.08);border-radius:999px;padding:.3rem .8rem;max-width:50vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:.5rem;border:0;border-radius:12px;padding:.85rem 1.3rem;font-weight:700;background:var(--green);color:#fff;transition:transform .12s,background .15s,box-shadow .15s;box-shadow:0 8px 24px rgba(46,125,79,.35)}
.btn:hover{background:var(--green-dk);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.18)}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn.gold{background:var(--gold);color:#2b1d00;box-shadow:0 8px 24px rgba(201,162,39,.3)}
.btn.sm{padding:.5rem .9rem;font-size:.88rem;border-radius:9px}
/* home / map */
.hero-home{position:relative;border-radius:22px;overflow:hidden;margin:18px 0;min-height:360px;display:flex;align-items:flex-end}
.hero-home img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.03);animation:kb 30s ease-in-out infinite alternate}
.hero-home:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,16,.1) 0%,rgba(20,16,16,.35) 45%,rgba(20,16,16,.92) 100%)}
.hero-home .t{position:relative;z-index:2;padding:30px 30px 28px;max-width:720px}
.hero-home small{display:block;color:#f3d98b;letter-spacing:.16em;text-transform:uppercase;font-size:.72rem;margin-bottom:8px}
.hero-home h1{margin:0 0 10px;font-size:clamp(1.8rem,4.5vw,3rem);line-height:1.05;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.hero-home p{margin:0 0 16px;color:#e8dccf;font-size:1.05rem;max-width:560px}
@keyframes kb{from{transform:scale(1.03) translate(0,0)}to{transform:scale(1.1) translate(-1.5%,-1%)}}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:10px 0 40px}
.ch{position:relative;border-radius:16px;overflow:hidden;background:var(--night2);border:1px solid rgba(255,255,255,.08);min-height:170px;cursor:pointer;transition:transform .15s,border-color .15s}
.ch:hover{transform:translateY(-3px);border-color:rgba(243,217,139,.5)}
.ch img{width:100%;height:110px;object-fit:cover;display:block;filter:saturate(.9)}
.ch .b{padding:10px 12px 12px}
.ch .n{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#f3d98b}
.ch h3{margin:2px 0 4px;font-size:1rem;color:#fff}
.ch .m{font-size:.78rem;color:#bdb0a6}
.ch .ring{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--gold) var(--p,0%),rgba(255,255,255,.18) 0);display:flex;align-items:center;justify-content:center}
.ch .ring i{width:28px;height:28px;border-radius:50%;background:var(--night2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.68rem;color:#fff}
.ch.done .ring{background:var(--green)}.ch.done .ring i{background:var(--green);color:#fff}
.ch.locked{opacity:.55}
.sec{margin:26px 0 8px;display:flex;align-items:baseline;gap:10px}
.sec h2{margin:0;font-size:1.25rem;color:#fff}.sec span{color:#bdb0a6;font-size:.85rem}
/* scene */
.scene{margin:12px 0 40px}
.hero{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:18px;background:#000}
.hero img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04);animation:kb 28s ease-in-out infinite alternate}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3) 0%,rgba(0,0,0,0) 40%,rgba(20,16,16,.85) 100%)}
.chip{position:absolute;top:14px;left:14px;z-index:2;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:.35rem .85rem;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase}
.ref{position:absolute;top:14px;right:14px;z-index:2;background:var(--gold);color:#2b1d00;border-radius:8px;padding:.3rem .65rem;font-weight:700;font-size:.76rem}
.title{position:absolute;left:22px;bottom:18px;z-index:2;max-width:85%}
.hero .chip{max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{display:block;color:#f3d98b;letter-spacing:.14em;text-transform:uppercase;font-size:.7rem;margin-bottom:4px}
.title h1{margin:0;font-size:clamp(1.3rem,3.6vw,2.3rem);line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.55)}
.cap{margin:0;padding:18px 6px 6px;font-size:1.12rem;line-height:1.6;color:#f5efe8;min-height:60px}
.cap span{opacity:.32;transition:opacity .25s}.cap span.on{opacity:1}
.bar{display:flex;align-items:center;gap:12px;padding:8px 6px 14px}
.play{width:54px;height:54px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:1.2rem;flex:none;box-shadow:0 6px 20px rgba(46,125,79,.5)}
.prog{flex:1;height:6px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--gold)}
.speed{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:.3rem .55rem;font-size:.78rem}
/* interaction panel */
.panel{background:#fff;color:var(--ink);border-radius:18px;padding:22px 22px 20px;margin:6px 0 16px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.panel h2{margin:0 0 6px;color:var(--brown);font-size:1.25rem}
.panel .lead{margin:0 0 12px;color:var(--muted)}
.panel .k{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--green-dk);font-weight:700;margin-bottom:4px}
.opt{display:block;width:100%;text-align:left;background:var(--cream);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--ink);transition:border-color .12s,transform .12s}
.opt:hover{border-color:var(--brown);transform:translateX(2px)}
.opt.right{border-color:var(--green);background:#E3F3E9}
.opt.wrong{border-color:var(--red);background:#FCECEC}
.opt:disabled{cursor:default;transform:none}
.fb{margin-top:10px;padding:12px 14px;border-radius:10px;background:#F3FAF5;border-left:5px solid var(--green);font-size:.98rem}
.fb.bad{background:#FCF1F1;border-color:var(--red)}
.fb.neutral{background:var(--sand);border-color:var(--brown)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:.45rem .9rem;color:var(--ink)}
.chips button.sel{border-color:var(--brown);background:var(--sand)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.bin{border:2px dashed var(--line);border-radius:12px;padding:10px;min-height:84px;cursor:pointer;background:#fff}
.bin:hover{border-color:var(--brown)}
.bin h4{margin:0 0 6px;font-size:.85rem;color:var(--brown)}
.bin .c{display:inline-block;background:var(--sand);border-radius:999px;padding:.2rem .6rem;margin:3px;font-size:.82rem}
.bin .c.ok{background:#E3F3E9}.bin .c.bad{background:#FCECEC}
.checks label{display:flex;gap:10px;align-items:flex-start;background:var(--cream);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer;font-weight:400}
.checks label.ok{border-color:var(--green);background:#E3F3E9}.checks label.miss{border-color:var(--gold);background:#FFF7DD}.checks label.bad{border-color:var(--red);background:#FCECEC}
.checks input{margin-top:5px}
table.t{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
table.t th,table.t td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--sand);color:var(--brown-dk)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:10px 0}
.card3{perspective:900px;min-height:160px;cursor:pointer}
.card3 .in{position:relative;width:100%;height:100%;min-height:160px;transition:transform .5s;transform-style:preserve-3d}
.card3.on .in{transform:rotateY(180deg)}
.card3 .f,.card3 .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:center;text-align:center}
.card3 .f{background:var(--brown);color:#fff;font-weight:700}
.card3 .b{background:#fff;border:2px solid var(--green);transform:rotateY(180deg);font-size:.86rem;line-height:1.35;overflow:auto}
.stage-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--cream);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.stage-row select{padding:.45rem;border-radius:8px;border:2px solid var(--line);font-family:inherit}
.stage-row.ok{border-color:var(--green)}.stage-row.bad{border-color:var(--red)}
.wordbank{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.wb{background:var(--cream);border:2px solid var(--line);border-radius:12px;padding:10px}
.wb h4{margin:0 0 6px;color:var(--brown);font-size:.9rem}
.wb button{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:.4rem .6rem;margin:4px 0;font-size:.86rem;color:var(--ink)}
.wb button.sel{border-color:var(--green);background:#E3F3E9}
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:8px 0}
.cal div{aspect-ratio:1;border:1.5px solid var(--line);border-radius:7px;font-size:.68rem;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;color:var(--muted)}
.cal div.sel{background:var(--green);color:#fff;border-color:var(--green)}
.cal div.exp{box-shadow:inset 0 0 0 2px var(--gold)}
.wheel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
.wheel button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-size:.88rem;color:var(--ink)}
.wheel button.sel{border-color:var(--brown);background:var(--sand)}
.wheel button.ok{border-color:var(--green);background:#E3F3E9}.wheel button.bad{border-color:var(--red);background:#FCECEC}
.payline{background:var(--sand);border-radius:12px;padding:12px 14px;margin:10px 0;font-family:ui-monospace,Menlo,monospace;font-size:.9rem}
.nav{display:flex;align-items:center;gap:10px;margin:6px 0 30px}.nav .sp{flex:1}
.hint{color:#bdb0a6;font-size:.85rem}
/* badges / cert */
.badge-pop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px}
.badge-pop .bx{background:#fff;color:var(--ink);border-radius:22px;padding:30px 28px;text-align:center;max-width:380px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.badge-pop .ic{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d98b,var(--gold) 60%,#8a6a10);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;box-shadow:0 10px 30px rgba(201,162,39,.5)}
.badge-pop h3{margin:4px 0;color:var(--brown)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.badges span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:.35rem .8rem;font-size:.82rem}
.badges span.got{background:rgba(201,162,39,.2);border-color:var(--gold)}
label{display:block;font-weight:700;margin:12px 0 4px;color:var(--brown-dk)}
input[type=text],input[type=email],input[type=date],select{width:100%;padding:.7rem .8rem;border:2px solid var(--line);border-radius:10px;font-size:1rem;font-family:inherit;background:#fff;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sig{border:2px solid var(--line);border-radius:10px;background:#fff;touch-action:none;width:100%;height:160px;display:block}
.score{font-size:2.6rem;font-weight:700;color:var(--green);margin:0}.score.fail{color:var(--red)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);padding:.7rem 1.1rem;border-radius:10px;z-index:70;font-size:.95rem;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1}
#cert{background:#fff;color:var(--ink);border:10px double var(--brown);padding:34px 40px 130px;max-width:820px;margin:16px auto;text-align:center;position:relative}
#cert img.logo{height:76px}
#cert h1{font-size:2rem;color:var(--brown);margin:12px 0 4px}
#cert .name{font-size:1.7rem;font-weight:700;color:var(--green-dk);margin:14px 0 4px;border-bottom:2px solid var(--line);display:inline-block;padding:0 30px 4px}
#cert .seal{position:absolute;right:28px;bottom:22px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d98b,var(--gold) 60%,#8a6a10);display:flex;align-items:center;justify-content:center;color:#2b1d00;font-size:.6rem;font-weight:700;text-align:center;line-height:1.1;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#cert .sigs{display:flex;justify-content:space-around;margin-top:30px;gap:20px;flex-wrap:wrap}
#cert .sigs div{min-width:200px;font-size:.9rem}
#cert .sigs img{height:50px;display:block;margin:0 auto 2px}
#cert .sigs div b{display:block;border-top:1px solid var(--ink);padding-top:6px}
.small{font-size:.85rem;color:var(--muted)}
.qref{background:#fff;color:var(--ink);border-radius:14px;padding:20px 22px}
.qref h3{color:var(--green-dk);margin:12px 0 4px;font-size:1rem}.qref ul{margin:4px 0;padding-left:1.2rem}
@media print{.top,.nav,.bar,.hero,.noprint,.cap{display:none!important}html,body{background:#fff;color:#000}.panel,.qref,#cert{box-shadow:none}#cert{margin:0;max-width:none}}
@media(max-width:640px){.nav{flex-wrap:wrap}.nav .hint{flex-basis:100%;order:-1;text-align:center}.nav .btn{padding:.7rem .9rem}.hero .chip{max-width:62%;font-size:.72rem;padding:.3rem .6rem}.ref{font-size:.72rem;padding:.25rem .5rem}.title small,.ch .n{font-size:.75rem}.ch .ring i{font-size:.72rem}.stage-row{grid-template-columns:1fr}.top .user{max-width:44vw}.top .brand small{display:none}.top img{height:32px}.top .user{max-width:34vw}.row{grid-template-columns:1fr}.panel{padding:16px}.cal{grid-template-columns:repeat(6,1fr)}.title{left:14px;bottom:12px}.cap{font-size:1.02rem}.hero-home .t{padding:20px 18px}}

.course-prog{position:relative;height:10px;background:var(--sand);border-radius:6px;margin:4px 0 14px;overflow:visible}.course-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:6px;transition:width .4s}.course-prog span{position:absolute;right:0;top:12px;font-size:.72rem;color:var(--muted)}
.scene .course-prog{margin:10px 0 2px}
#cert .covers{margin:14px 0 6px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;text-align:left;font-size:.86rem}#cert .covers p{margin:4px 0 0}#cert .covers .small{color:var(--muted);font-size:.78rem}

/* dialogue clips */
.dialog{margin:14px 0;padding:14px 16px;background:var(--sand);border-radius:12px;color:var(--ink)}
.dialog a{color:var(--green-dk);font-weight:600}
.dialog .hint{color:var(--muted)!important}
.dialog .k{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brown);font-weight:700;margin-bottom:8px}
.dialog .line{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid rgba(0,0,0,.06)}
.dialog .line:first-of-type{border-top:0}
.dialog .line button.play{width:34px;height:34px;flex:0 0 34px;font-size:.8rem}
.dialog .line b{display:block;font-size:.8rem;color:var(--brown)}
.dialog .line span{display:block;font-size:1rem;line-height:1.45}
@media print{.dialog button{display:none}}
</style></head><body>
<style>@media(max-width:560px){header.top .user,header.top .brand small{display:none}header.top .wrap{flex-wrap:wrap;row-gap:6px}}</style><header class="top"><div class="wrap"><img src="bh-logo.png" alt="" onerror="this.style.display='none'"><div class="brand">Benevolent House<small>T3C Staff Session</small></div><span class="sp"></span><span class="user" id="user"></span><a class="btn ghost sm" href="../" style="text-decoration:none">My trainings</a> <button class="btn ghost sm" id="homeBtn">Chapters</button></div></header>
<main class="wrap"><section id="v-home"></section><section id="v-scene" class="hidden"></section><section id="v-qref" class="hidden"></section><section id="v-quiz" class="hidden"></section><section id="v-ack" class="hidden"></section><section id="v-cert" class="hidden"></section></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../vendor/supabase-2.117.3.js"></script>
<script src="../bh-cloud.js"></script>
<script>const SCENES=[{"id": "s1_1", "ch": 1, "chTitle": "The Referral", "ref": "T3C-4", "title": "Ms. Reyes's week", "narr": "Welcome back. This is the Staff Session, one hour for directors and case managers. You already know the Carters. Now you are Ms. Reyes, and this is her week: a referral at night, a review with a deadline, a denial letter, a relative nobody knew about, an aftercare call that did not connect, a home up for re-credentialing, and a respite request. Each one has a procedure. Let's work them."}, {"id": "s1_2", "ch": 1, "chTitle": "The Referral", "ref": "T3C-4 C", "title": "Tuesday, 9:40 p.m.", "narr": "The referral for Jada arrives at 9:40 on a Tuesday night. Ms. Reyes is on call. Before she matches a home, before she calls anyone, there is a first step that happens the day the referral arrives, whether or not the child is ever placed. What is it, and what goes in it?"}, {"id": "s1_3", "ch": 1, "chTitle": "The Referral", "ref": "T3C-4 C", "title": "The one we could not take", "narr": "Thursday, a second referral: a sibling group of three, and Benevolent House has no credentialed home with three open beds. Ms. Reyes has to decline. A declined referral is not a closed door; it is a record with a reason. Work through what she does."}, {"id": "s2_1", "ch": 2, "chTitle": "Reviews and Notices", "ref": "T3C-5, T3C-6", "title": "The ninety-day clock", "narr": "Jada was placed in January. Her first ninety-day review is due in April. The Case Manager Supervisor tracks every due date: the CANS, the Service Plan review, and the written confirmation. For a child in the Mental and Behavioral Health package, the confirmation is signed by two directors and a copy goes to the caseworker within fifteen business days. Build the review packet."}, {"id": "s2_2", "ch": 2, "chTitle": "Reviews and Notices", "ref": "T3C-5 E", "title": "The denial letter, from your side", "narr": "Denise called about the STAR Health denial. Now it is on your desk. There are five things the record has to show, and one clock that is already running: the caseworker is notified within three business days of the denial. Document it, then decide what happens next."}, {"id": "s3_1", "ch": 3, "chTitle": "Engagement and Aftercare", "ref": "T3C-8", "title": "Aunt Pruitt, on paper", "narr": "Denise reported that Jada named an aunt. Policy says the case manager records the person, shares the name with the caseworker promptly and no later than the next monthly visit, records the date shared, and documents whether contact is approved. Three records are involved for a child in placement; a fourth, the aftercare contact log, applies only during aftercare. Put each piece of information where it belongs."}, {"id": "s3_2", "ch": 3, "chTitle": "Engagement and Aftercare", "ref": "T3C-9 C", "title": "The call that did not connect", "narr": "Micah's aftercare is in its second month, and Ms. Reyes is serving as the Aftercare Kinship Support staff member for Gloria. She calls on Tuesday; no answer. She tries again Thursday and reaches her. At the end of the month, a copy of the month's documentation goes to the caseworker. What goes in the aftercare record this month?"}, {"id": "s4_1", "ch": 4, "chTitle": "Homes and Respite", "ref": "T3C-10 B, C", "title": "The Carters' credential month", "narr": "The Carters were credentialed twelve months ago, and this is their credential month. Ms. Reyes repeats the review: the foster home record against the requirements, a visit, a conversation, the last four quarterly evaluations, the annual training record including the four quarterly TST-FC sessions, and outcomes for the children served. Then a new Credential Record, reviewed by the supervisor, approved by the Program Director, filed, and the renewal date entered in the compliance tracker. Put the steps in order."}, {"id": "s4_2", "ch": 4, "chTitle": "Homes and Respite", "ref": "T3C-12", "title": "Approving the respite weekend", "narr": "Denise asked for Thursday evening through Monday evening with the Nguyens. From the staff side: approve the request, notify the caseworker, confirm the receiving home qualifies, send the Managing Emotions Guide, the safety and crisis plan, medication and medical information, and the schedule, and record each approved day by child, by home, and by date so both families are paid on the regular date. Check the record you would enter."}, {"id": "s5_1", "ch": 5, "chTitle": "Quality", "ref": "CQI", "title": "What you report each quarter", "narr": "The Continuous Quality Improvement review asks for specific measures, and each one comes from a record you already keep. Match each measure to where it comes from, and you are done with Ms. Reyes's week."}];
const QUIZ=[{"q": "Under T3C, the Treatment Model Benevolent House uses for every child is:", "a": ["A level system with points", "Trauma Systems Therapy for Foster Care", "Chosen by each foster home"], "k": 1, "ref": "T3C-2"}, {"q": "A child in the Mental & Behavioral Health Support Services Package has a Service Plan review at least every:", "a": ["90 days", "Six months", "12 months"], "k": 0, "ref": "T3C-5"}, {"q": "A child over age 3 in the Basic package receives a CANS 3.0 Assessment at least every:", "a": ["90 days", "Six months", "12 months"], "k": 2, "ref": "T3C-5"}, {"q": "The Managing Emotions Guide is built:", "a": ["By the case manager alone", "By the caregiver and the child together", "Only after a serious incident"], "k": 1, "ref": "T3C-3"}, {"q": "When a service in the Service Plan is denied or cannot be found, the case manager notifies the SSCC or DFPS caseworker within:", "a": ["3 business days", "15 business days", "The next Service Plan review"], "k": 0, "ref": "T3C-5 E"}, {"q": "A child in the Mental & Behavioral Health package who no longer needs that level of service:", "a": ["Must move to a new home", "Can move to the Basic package and stay in the same home", "Is discharged from Benevolent House"], "k": 1, "ref": "T3C-6"}, {"q": "A foster family home is re-credentialed for T3C:", "a": ["Every 12 months", "Every five years", "Only when a problem comes up"], "k": 0, "ref": "T3C-10"}, {"q": "When a caregiver uses approved paid Intermittent Alternate Care:", "a": ["Only the caregiver providing the care is paid", "The two families settle payment between themselves", "Both caregivers are paid by Benevolent House for the same days"], "k": 2, "ref": "T3C-12"}, {"q": "After a child leaves the Mental & Behavioral Health package, aftercare follow-up continues for:", "a": ["30 days", "Six months", "There is no follow-up"], "k": 1, "ref": "T3C-9"}, {"q": "A child names an aunt the child would like to see. The case manager shares the name with the caseworker:", "a": ["At the next 90-day review", "Promptly, and no later than the next monthly visit", "Only if the caregiver asks"], "k": 1, "ref": "T3C-8 A"}];
const ACK="I attended the T3C Policy and Procedure Training, Staff Session. I received the T3C Service Delivery Addendum and the Staff Quick Reference, I had the opportunity to ask questions, and I agree to follow these policies and procedures.";
const COURSE={"title": "T3C Policy and Procedure Training (Staff Session)", "code": "T3C-PP-S", "renewMonths": 12, "hours": 1, "trainer": "Tanya Orr, LCPAA", "basis": "the T3C Service Delivery Addendum, Attachments B and D, and Benevolent House staff procedures", "subtitle": "T3C Staff Session", "hero": "Ms. Reyes's Week", "blurb": "One hour for directors and case managers. Work the procedures behind the Carter family's story: referrals, reviews, denials, engagement records, aftercare, credentialing, respite, and what you report each quarter.", "heroImg": "s_s1_1", "qrefImg": "s_s5_1", "chapters": [["The Referral", "1"], ["Reviews and Notices", "2"], ["Engagement and Aftercare", "3"], ["Homes and Respite", "4"], ["Quality", "5"], ["Certified", "6"]], "icons": {"1": "\ud83d\udcde", "2": "\ud83d\uddd3\ufe0f", "3": "\ud83d\uddc2\ufe0f", "4": "\ud83c\udfe0", "5": "\ud83d\udcca", "6": "\ud83c\udfc5"}, "roles": ["Staff", "Contracted Provider", "Foster Caregiver", "Kinship Caregiver", "Adoptive Parent", "Foster and Adoptive Caregiver"], "qrefHtml": "<h3>Referrals and admissions</h3><ul><li>Record every referral in the T3C Referral, Admission, and Discharge Tracker the day it arrives: source and Service Package requested.</li><li>Give an answer on every referral. When a child is not admitted, state the reason in the response and record it in the tracker.</li><li>Program Director approves each admission; Treatment Director consulted for Mental &amp; Behavioral Health; Executive Director approves for the Program Director's own caseload.</li></ul>\n<h3>Clocks</h3><table class=\"t\"><tr><th>What</th><th>When</th></tr><tr><td>Service denied, delayed, or unavailable: notify the caseworker</td><td>Within 3 business days</td></tr><tr><td>Copy of the Continued Stay Written Confirmation to the caseworker</td><td>Within 15 business days of the review</td></tr><tr><td>Share a newly identified relative or supportive person with the caseworker</td><td>Promptly, no later than the next monthly visit</td></tr><tr><td>Mental &amp; Behavioral Health: CANS and Service Plan review</td><td>At least every 90 days</td></tr><tr><td>Basic: Service Plan review / CANS</td><td>Every 6 months / every 12 months</td></tr><tr><td>Home re-credentialing</td><td>Every 12 months, in the credential month</td></tr><tr><td>Aftercare monthly copy to the caseworker</td><td>End of each month of aftercare</td></tr></table>\n<h3>Written confirmation (Attachment B)</h3><ul><li>Basic: with each 6-month review, Program Director signs.</li><li>Mental &amp; Behavioral Health: with each 90-day review, Program Director and Treatment Director sign.</li><li>Filed in the case record; copy to the caseworker within 15 business days with the date sent on the form.</li></ul>\n<h3>Service denials: document five things</h3><ul><li>Date of the request, application, or referral; type of service; status of the request; reason for any denial; status of any appeal. Seek community resources; if still unavailable, bring it to the Program Director.</li></ul>\n<h3>Engagement records (T3C-8 C)</h3><ul><li>Service Plan, Family and Support Network section: each person, relationship, date shared with the caseworker, approval status.</li><li>Service Plan review, participants section: who was invited, how, who took part and how, input of anyone who did not attend.</li><li>Monthly visit notes: outreach and contacts since the last visit; the caregiver's support of those contacts.</li><li>Aftercare contact log: family and supportive persons involved during aftercare.</li></ul>\n<h3>Aftercare</h3><ul><li>Mental &amp; Behavioral Health: twice a month for 6 months. Kinship: weekly the first month, then twice a month, for 6 months, plus a support group.</li><li>Log every contact, attempted contact, and referral; try again after a missed contact; monthly copy to the caseworker.</li></ul>\n<h3>Credentialing a home</h3><ul><li>Review the record against Section A, visit, talk with the caregivers; complete Attachment D with a recommendation; Case Manager Supervisor reviews; Program Director approves; file and enter the renewal date in the compliance tracker.</li><li>Re-credential every 12 months using the last four quarterly evaluations, the annual training record with the four quarterly TST-FC sessions, and outcomes.</li></ul>\n<h3>Paid Intermittent Alternate Care</h3><ul><li>Request to the case manager 10 days ahead when possible; approve; notify the caseworker; qualifying home (verified, TST-FC trained; treatment-verified for Mental &amp; Behavioral Health); send the Managing Emotions Guide, safety and crisis plan, medication and medical information, schedule.</li><li>More than 72 consecutive hours; up to 7 days per child per fiscal year (September through August); record each day by child, by home, and by date; both caregivers paid on the regular payment date.</li></ul>\n<p class=\"small\">Benevolent House office: (214) 774-4871. The full T3C Service Delivery Addendum: <a href=\"addendum.pdf\" target=\"_blank\" style=\"color:var(--green-dk)\">open or download it here</a>.</p>"};
</script>

<script>/* ===== Benevolent House course engine ===== */
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const PORTAL_VERSION="2.0 (Nov 2026)";const JOTFORM_ID="263097317610052";const JOTFORM_SUBMIT_URL="https://submit.jotform.com/submit/"+JOTFORM_ID;
const KEY="bh_course_"+(typeof COURSE!=="undefined"?COURSE.code.replace(/[^A-Za-z0-9]/g,"_"):"t3c")+"_v2";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(){try{S._ts=Date.now();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}try{if(S.user&&S.user.cloud&&window.BHC)BHC.putProgress(COURSE.code,S)}catch(e){}}
let S=load();S.seen=S.seen||{};S.badges=S.badges||{};S.answers=S.answers||{};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
function show(id){$$("main>section").forEach(s=>s.classList.add("hidden"));$("#v-"+id).classList.remove("hidden");window.scrollTo({top:0});stopAudio();if(typeof stopLine==="function")stopLine()}
function fmtDate(d){return d.toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"})}
function fmtTime(d){return d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}
const CH=(typeof COURSE!=="undefined"&&COURSE.chapters)||[["The Call","1"],["The First Night","2"],["The Plan","3"],["Credentialed","4"],["Weekend Off","5"],["Kinship","6"],["Safety","7"],["Going Home","8"],["Certified","9"]];
const BADGE_ICON=(typeof COURSE!=="undefined"&&COURSE.icons)||{1:"📞",2:"🌙",3:"🗂️",4:"🏠",5:"☕",6:"🧓",7:"🛡️",8:"🎈",9:"🏅"};
function scenesOf(ch){return SCENES.filter(s=>s.ch===ch)}
function chProgress(ch){const sc=scenesOf(ch);let d=sc.filter(s=>S.seen[s.id]).length,n=sc.length;if(ch===CH.length){n+=1;d+=S.done?1:0}return[d,n]}
function chUnlocked(ch){if(ch===1)return true;const[d,n]=chProgress(ch-1);return n?d>=n:true}

/* ---------- user ---------- */
function userLabel(){return S.user?S.user.name+(S.user.home?" · "+S.user.home:""):"Not signed in"}
function renderHome(){
 if(S.user&&S.user.cloud&&!window.__bhChecked){$("#user").textContent="";$("#v-home").innerHTML=`<div class="panel"><p>Loading your training…</p></div>`;show("home");return}
 $("#user").textContent=userLabel();
 let h=`<div class="hero-home"><img src="assets/${COURSE.heroImg||"s1_a"}.jpg" alt=""><div class="t"><small>Benevolent House · ${esc(COURSE.subtitle||"T3C Policy and Procedure Training")}</small><h1>${esc(COURSE.hero||"The Carter Family")}</h1><p>${esc(COURSE.blurb||"Follow one family through a placement and learn what Texas Child-Centered Care asks of you at each step. About two hours. Narrated, with captions. Stop any time; your place is saved.")}</p>${S.user&&S.user.cloud?(S.done?`<button class="btn gold" onclick="showSavedCert()">View my certificate</button> <button class="btn ghost" onclick="openChapter(1)">Review the course</button>`:`<button class="btn gold" onclick="resume()">${Object.keys(S.seen).length?"Continue where I left off":"Begin Chapter 1"}</button>`):""}</div></div>`;
 const cloudOK=window.BHC&&BHC.available();if(cloudOK&&(!S.user||!S.user.cloud)){h+=`<div class="panel" id="bhsHost"></div>`}
 else if(!S.user||!S.user.cloud){h+=`<div class="panel"><div class="k">Sign in needed</div><h2>The training could not load</h2><p>Please check your internet connection and refresh this page. If it still will not load, call Benevolent House at (214) 774-4871.</p></div>`}else if(false){h+=`<div class="panel"><h2>Tell us who you are</h2><div class="row"><div><label>Full name</label><input type="text" id="uName" placeholder="First and last name"></div><div><label>Email</label><input type="email" id="uEmail" placeholder="you@example.com"></div></div><div class="row"><div><label>Foster home or staff role</label><input type="text" id="uHome" placeholder="e.g., Johnson Home, or Case Manager"></div><div><label>I am a</label><select id="uRole">${(COURSE.roles||["Foster Caregiver","Kinship Caregiver","Adoptive Parent","Foster and Adoptive Caregiver","Staff","Contracted Provider"]).map(r=>`<option>${r}</option>`).join("")}</select></div></div><p><button class="btn" onclick="signIn()">Continue</button></p><p class="small">Your name and completion record are kept by Benevolent House for licensing and training records. No child information is ever entered here. All names in this course are fictional.</p></div>`}
 else{
  const got=Object.keys(S.badges).length;
  if(S.renewDue&&!S.done)h+=`<div class="panel"><div class="k">Time to renew</div><p>This training is due again by <b>${esc(fmtDate(new Date(S.renewDue)))}</b>. Your progress has started over for this year. Your earlier certificate stays on your training log.</p></div>`;
  h+=progBar();h+=`<div class="sec"><h2>Your chapters</h2><span>${got} of ${CH.length} badges earned</span></div><div class="badges">${CH.map(([n,c])=>`<span class="${S.badges[c]?"got":""}">${BADGE_ICON[c]} ${n}</span>`).join("")}</div><div class="chapters">`;
  CH.forEach(([name,c])=>{const ch=+c;let[d,n]=chProgress(ch);const first=scenesOf(ch)[0];const un=chUnlocked(ch);const final=ch===CH.length;const pct=Math.round(d/n*100);const img=first?(first.img||('s_'+first.id)):(COURSE.qrefImg||"s_9_1");const go=S.done&&final?`showSavedCert()`:first?`openChapter(${ch})`:`renderQuickRef()`;
   h+=`<div class="ch ${d>=n?"done":""} ${un?"":"locked"}" tabindex="0" role="button" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" onclick="${un?go:`toast('Finish the chapter before this one first')`}"><img src="assets/${img}.jpg" alt=""><div class="ring" style="--p:${pct}%"><i>${d>=n?"✓":d+"/"+n}</i></div><div class="b"><div class="n">Chapter ${ch}</div><h3>${name}</h3><div class="m">${first?n+" scene"+(n>1?"s":""):""}${final?(first?" · ":"")+"Quick Reference, Knowledge Check, certificate":""}</div></div></div>`});
  h+=`</div><p class="hint">Signed in as ${esc(S.user.name)}. <a href="#" onclick="signOut();return false">Not you?</a></p>`}
 $("#v-home").innerHTML=h;show("home");if($("#bhsHost"))BHSignIn($("#bhsHost"),adoptUser,{roles:COURSE.roles,profile:window.__bhNeedProfile||null,prefill:S.user&&!S.user.cloud?S.user:null,message:S.user&&!S.user.cloud?"Your place is saved on this device. Sign in once with your email so it is kept for good, on any phone or computer.":""})}
function signIn(){const n=$("#uName").value.trim(),e=$("#uEmail").value.trim(),hm=$("#uHome").value.trim(),r=$("#uRole").value;
 if(!n||!e||!hm){toast("Please fill in your name, email, and home or role");return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){toast("Please enter a valid email address");return}

 <div class="qref" id="qrefBody">${COURSE.qrefHtml||`<h3>What we ask of you</h3><ul><li>Use TST-FC every day: routines, pre-teaching, staying neutral, time-in, and signals of safety.</li><li>Build the Managing Emotions Guide with the child and keep it up to date.</li><li>Take the child to every appointment and keep a record of each service.</li><li>Tell your case manager right away if a service is denied, delayed, or cannot be found.</li><li>Support Normalcy and approved contact with parents, siblings, and relatives.</li><li>Tell your case manager when a child names a relative or another person who matters to them.</li><li>Come to Service Plan meetings and share what you see at home.</li><li>Keep your training current. It keeps your home credentialed.</li></ul>

 <h3>What you can count on from Benevolent House</h3><ul><li>A case manager who visits every month and coaches you in the model.</li><li>On-call staff 24 hours a day, 7 days a week.</li><li>Up to 7 days of paid Intermittent Alternate Care per child each fiscal year. Ask at least 10 days ahead when you can.</li><li>For kinship caregivers: help with verification and benefits, and meetings on evenings and weekends.</li></ul>
 <h3>Call your case manager or the on-call line right away when</h3><ul><li>A child is in crisis, is hurt, or is missing. For a life-threatening emergency or a missing child, call 911 first, then on-call.</li><li>There is a serious incident or you use an emergency behavior intervention.</li><li>You have any concern that a child is being recruited or trafficked. Texas Abuse Hotline 1-800-252-5400.</li><li>Something changes in your household.</li></ul><h3>Kinship and re-credentialing</h3><ul><li>Kinship aftercare: weekly the first month, then twice a month, for six months, plus a support group.</li><li>Your home is re-credentialed every 12 months, in the month of the original credential.</li></ul><p class="small">Benevolent House office: (214) 774-4871. The full T3C Service Delivery Addendum: <a href="addendum.pdf" target="_blank" style="color:var(--green-dk)">open or download it here</a>. It is also in your foster home binder and available from your case manager at any time.</p>`}</div>
 <div class="nav noprint"><button class="btn ghost" onclick="window.print()">Print this page</button><span class="sp"></span><button class="btn gold" onclick="renderQuiz()">Start the Knowledge Check</button></div></div>`;show("qref")}
let attempt=0;
function renderQuiz(){attempt++;let h=`<div class="panel"><div class="k">Knowledge Check</div><h2>Ten questions. ${(COURSE.passMark||8)===8?"Eight":(COURSE.passMark||8)===7?"Seven":(COURSE.passMark||8)} to pass. Attempt ${attempt}.</h2><p class="lead">Take your time. If you score below the passing mark, you will see which items to review and can try again.</p>`;
 QUIZ.forEach((x,i)=>{h+=`<div style="margin:14px 0;padding-top:10px;border-top:1px solid var(--line)"><b>${i+1}. ${esc(x.q)}</b>${x.a.map((a,j)=>`<label style="font-weight:400;display:flex;gap:8px;align-items:flex-start;margin:6px 0;color:var(--ink)"><input type="radio" name="q${i}" value="${j}" style="margin-top:4px"> <span>${esc(a)}</span></label>`).join("")}</div>`});
 h+=`<p><button class="btn" onclick="gradeQuiz()">Submit answers</button></p></div>`;$("#v-quiz").innerHTML=h;show("quiz")}
let RESULT=null;
function gradeQuiz(){let ans=[],score=0,missed=[];for(let i=0;i<QUIZ.length;i++){const r=document.querySelector(`input[name=q${i}]:checked`);if(!r){toast("Please answer question "+(i+1));return}const v=+r.value;ans.push("abc"[v]);if(v===QUIZ[i].k)score++;else missed.push(i)}
 const pass=score>=(COURSE.passMark||8);const detail=QUIZ.map((q,i)=>`Q${i+1} ${q.q} | Answered: ${q.a["abc".indexOf(ans[i])]} | ${ans[i]==="abc"[q.k]?"Correct":"Incorrect; correct answer: "+q.a[q.k]}`).join("\n");RESULT={score,answers:ans.join(""),detail,pass,attempt,picks:ans.slice()};
 let h=`<div class="panel" style="text-align:center"><div class="k">Knowledge Check</div><p class="score ${pass?"":"fail"}">${score} / ${QUIZ.length}</p><p>${pass?"<b>You passed.</b> One more step: the Acknowledgment.":"<b>Not yet.</b> Review the items below and take the check again. A retake is expected and is never held against you."}</p></div>`;
 if(missed.length){h+=`<div class="panel"><div class="k">Items to review</div>${missed.map(i=>`<p><b>${i+1}. ${esc(QUIZ[i].q)}</b><br>Correct answer: ${esc(QUIZ[i].a[QUIZ[i].k])} <span style="background:var(--sand);border-radius:6px;padding:.1rem .4rem;font-size:.8rem">${esc(QUIZ[i].ref)}</span></p>`).join("")}</div>`}
 h+=`<div class="nav">${pass?`<button class="btn gold" onclick="renderAck()">Continue to Acknowledgment</button>`:`<button class="btn" onclick="renderQuiz()">Retake the Knowledge Check</button> <button class="btn ghost" onclick="renderHome()">Review the chapters</button>`}</div>`;
 $("#v-quiz").innerHTML=h;show("quiz")}
function renderAck(){$("#v-ack").innerHTML=`<div class="panel"><div class="k">Acknowledgment</div><p style="font-size:1.08rem">${esc(ACK)}</p><div class="row"><div><label>Type your full name</label><input type="text" id="aName" value="${esc(S.user.name)}"></div><div><label>Date</label><input type="text" id="aDate" value="${fmtDate(new Date())}" readonly></div></div><label>Sign with your finger or mouse</label><canvas class="sig" id="sigPad" aria-label="Signature pad"></canvas><p><button class="btn ghost sm" style="color:var(--brown);border-color:var(--brown);background:#fff" onclick="clearSig()">Clear signature</button> <button class="btn ghost sm" style="color:var(--brown);border-color:var(--brown);background:#fff" onclick="typedSig()">I cannot draw: use my typed name</button></p><label style="font-weight:400"><input type="checkbox" id="aAgree"> I agree to the statement above and confirm that I completed this training myself.</label><p><button class="btn gold" id="ackSubmit" onclick="finish()">Submit and get my certificate</button></p></div>`;show("ack");initSig()}
let sigCtx,sigDrawn=false;
function initSig(){const c=$("#sigPad");c.width=c.offsetWidth*2;c.height=320;sigCtx=c.getContext("2d");sigCtx.scale(2,2);sigCtx.lineWidth=2.2;sigCtx.lineCap="round";sigCtx.strokeStyle="#1b2a4a";let d=false;const pos=e=>{const r=c.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return[p.clientX-r.left,p.clientY-r.top]};
 const st=e=>{d=true;const[x,y]=pos(e);sigCtx.beginPath();sigCtx.moveTo(x,y);e.preventDefault()},mv=e=>{if(!d)return;const[x,y]=pos(e);sigCtx.lineTo(x,y);sigCtx.stroke();sigDrawn=true;e.preventDefault()},en=()=>{d=false};
 c.addEventListener("mousedown",st);c.addEventListener("mousemove",mv);window.addEventListener("mouseup",en);c.addEventListener("touchstart",st,{passive:false});c.addEventListener("touchmove",mv,{passive:false});c.addEventListener("touchend",en)}
function typedSig(){const n=$("#aName").value.trim();if(!n){toast("Type your name first");return}clearSig();sigCtx.font="italic 34px Georgia, serif";sigCtx.fillStyle="#1b2a4a";sigCtx.fillText(n,16,90);sigDrawn=true;toast("Typed signature applied")}
function clearSig(){const c=$("#sigPad");sigCtx.clearRect(0,0,c.width,c.height);sigDrawn=false}
let finishing=false;
async function finish(){if(finishing)return;const n=$("#aName").value.trim();if(!n){toast("Please type your name");return}if(!sigDrawn){toast("Please sign in the box");return}if(!$("#aAgree").checked){toast("Please check the agreement box");return}
 finishing=true;const b=$("#ackSubmit");b.disabled=true;b.textContent="Submitting...";const now=new Date();const sig=$("#sigPad").toDataURL("image/png");
 const rec={title:COURSE.title,code:COURSE.code,score:RESULT.score,pass:"Pass",date:fmtDate(now),time:fmtTime(now),hours:COURSE.hours,answers:"Attempt "+RESULT.attempt+" ("+RESULT.score+" of "+QUIZ.length+")\n"+(RESULT.detail||RESULT.answers),ack:ACK+" Signed by "+n,sig:sig,trainer:COURSE.trainer};
 const ok=await logToForms(rec);try{if(S.user&&S.user.cloud)await BHC.addCompletion({code:COURSE.code,title:COURSE.title,hours:COURSE.hours,score:RESULT.score,total:QUIZ.length,attempt:RESULT.attempt||1,answers:{picks:RESULT.picks||null,items:(RESULT.picks||[]).map((x,i)=>{const q=QUIZ[i];return{q:q.q,a:q.a["abc".indexOf(x)]||"",ok:x==="abc"[q.k],right:q.a[q.k]}})},ack:ACK+" Signed by "+n,completed_at:now.toISOString()});BHC.log("course_done",COURSE.code)}catch(e){}S.done={date:fmtDate(now),score:RESULT.score,name:n,sig:sig,iso:now.toISOString(),picks:RESULT.picks||null,attempt:RESULT.attempt||1};S.badges[CH.length]=1;save();finishing=false;renderCert(n,now,sig,ok)}
async function logToForms(r){const fd=new FormData();fd.append("formID",JOTFORM_ID);fd.append("q3_q3_textbox1",S.user.name);fd.append("q4_q4_email2",S.user.email);fd.append("q5_q5_textbox3",S.user.home||"");fd.append("q6_q6_dropdown4",S.user.role);fd.append("q8_q8_textbox6",r.title);fd.append("q9_q9_textbox7",r.code);fd.append("q11_q11_number9",r.score);fd.append("q12_q12_dropdown10",r.pass);fd.append("q13_q13_textbox11",r.date);fd.append("q14_q14_textbox12",r.time);fd.append("q15_q15_number13",r.hours);fd.append("q16_q16_textarea14",r.answers);fd.append("q17_q17_textarea15",r.ack);fd.append("q18_q18_textarea16",r.sig);fd.append("q20_q20_textbox18",r.trainer);fd.append("q21_q21_textbox19",PORTAL_VERSION);
 try{await fetch(JOTFORM_SUBMIT_URL,{method:"POST",body:fd,mode:"no-cors"});return true}catch(e){try{const q=JSON.parse(localStorage.getItem(KEY+"_queue")||"[]");q.push({r,u:S.user});localStorage.setItem(KEY+"_queue",JSON.stringify(q))}catch(x){}return false}}
function renderCert(name,now,sig,ok){$("#v-cert").innerHTML=`<p class="noprint hint" style="margin:14px 0">${ok?"Your completion record has been sent to Benevolent House.":"Your record is saved on this device and will be sent when you are back online. Please also tell your case manager you finished."} Print or save this certificate for your records.</p>
 <div id="cert"><img class="logo" src="bh-logo.png" alt=""><div style="font-weight:700;color:var(--brown);font-size:1.2rem">Benevolent House</div><div class="small">Foster Care and Adoption</div><h1>Certificate of Completion</h1><p>This certifies that</p><div class="name">${esc(name)}</div><p>${esc(S.user.role)}${S.user.home?" · "+esc(S.user.home):""}</p><p>has completed</p><p style="font-size:1.25rem;font-weight:700;color:var(--brown)">${esc(COURSE.title)}</p><p>Training code ${esc(COURSE.code)} · ${COURSE.hours} training ${COURSE.hours===1?"hour":"hours"} · Knowledge Check ${RESULT.score} of ${QUIZ.length}<br>${fmtDate(now)}</p>
 <div class="covers"><b>This training covered</b><p>${esc((COURSE.covers||CH.filter(c=>+c[1]<CH.length).map(c=>c[0])).join(" · "))}</p>${COURSE.basis?`<p class="small">Built on ${esc(COURSE.basis)}</p>`:""}</div><div class="sigs"><div>${/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(sig||"")?`<img src="${sig}" alt="">`:""}<b>${esc(name)}</b>Participant</div><div style="padding-top:56px"><b>${esc(COURSE.trainer)}</b>Trainer of Record (electronic record on file)</div></div><div class="seal">${COURSE.seal||"BENEVOLENT<br>HOUSE<br>T3C<br>CERTIFIED"}</div>
 <p class="small" style="margin-top:26px">Knowledge Check and signed Acknowledgment on file with Benevolent House.</p></div>
 <div class="nav noprint" style="justify-content:center"><button class="btn" onclick="window.print()">Print or save as PDF</button> <button class="btn ghost" onclick="renderQuizRecord()">Print my Knowledge Check</button> <button class="btn ghost" onclick="renderHome()">Back to chapters</button></div>`;show("cert")}
function renderQuizRecord(){const picks=(RESULT&&RESULT.picks)||(S.done&&S.done.picks);if(!picks){toast("No Knowledge Check record is saved on this device");return}const n=S.done?S.done.name:(S.user&&S.user.name)||"";const d=S.done?S.done.date:fmtDate(new Date());let h=`<div id="cert" style="text-align:left"><img class="logo" src="bh-logo.png" alt="" style="float:right;width:56px"><div style="font-weight:700;color:var(--brown);font-size:1.1rem">Benevolent House</div><h1 style="font-size:1.4rem;margin:.3rem 0">Knowledge Check Record</h1><p>${esc(COURSE.title)} · Training code ${esc(COURSE.code)}<br><b>${esc(n)}</b>${S.user&&S.user.home?" · "+esc(S.user.home):""} · ${esc(d)} · Attempt ${(S.done&&S.done.attempt)||(RESULT&&RESULT.attempt)||1} · Score <b>${(S.done?S.done.score:RESULT.score)} of ${QUIZ.length}</b> (${(COURSE.passMark||8)} to pass)</p><ol style="padding-left:1.2rem">`;QUIZ.forEach((q,i)=>{const p="abc".indexOf(picks[i]);const ok=p===q.k;h+=`<li style="margin:.5rem 0"><div>${esc(q.q)}</div><div style="color:${ok?"var(--green-dk)":"var(--red)"}">${ok?"✓":"✗"} Answered: ${esc(q.a[p]||"")}</div>${ok?"":`<div class="small">Correct answer: ${esc(q.a[q.k])}</div>`}</li>`});h+=`</ol><p class="small">Graded automatically by the Benevolent House Training Portal. Record on file with Benevolent House.</p></div><div class="nav noprint" style="justify-content:center"><button class="btn" onclick="window.print()">Print or save as PDF</button> <button class="btn ghost" onclick="showSavedCert()">Back to certificate</button></div>`;$("#v-cert").innerHTML=h;show("cert")}

function showSavedCert(){if(!S.done){renderQuickRef();return}RESULT=RESULT||{score:S.done.score};renderCert(S.done.name,new Date(S.done.iso),S.done.sig,true)}
function overallPct(){const n=SCENES.length+2;let d=SCENES.filter(s=>S.seen[s.id]&&S.answers[s.id]!==undefined||S.seen[s.id]&&!(INTER[s.id]||{}).type||S.seen[s.id]&&(INTER[s.id]||{}).type==="none").length;d=Math.max(d,Object.keys(S.answers||{}).length);if(S.done)d=n;else if(S.ackReady)d=n-1;return Math.min(100,Math.round(d/n*100))}
function progBar(){const p=overallPct();return `<div class="course-prog" aria-label="Course progress ${p} percent"><i style="width:${p}%"></i><span>${p}% complete</span></div>`}

window.addEventListener("online",async()=>{try{const q=JSON.parse(localStorage.getItem(KEY+"_queue")||"[]");if(!q.length)return;localStorage.removeItem(KEY+"_queue");const u=S.user;for(const it of q){S.user=it.u;await logToForms(it.r)}S.user=u}catch(e){}});
window.addEventListener("resize",()=>{if($("#v-ack")&&!$("#v-ack").classList.contains("hidden")&&!sigDrawn)initSig()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&document.activeElement&&["uName","uEmail","uHome"].includes(document.activeElement.id))signIn()});
$("#homeBtn").onclick=renderHome;renderHome();cloudBoot();
